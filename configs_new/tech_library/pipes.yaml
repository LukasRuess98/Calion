# =============================================================================
# PIPE TECHNOLOGY LIBRARY
# =============================================================================
# District heating pipes with hydraulic and thermal models
# =============================================================================

pipes:
  # ===========================================================================
  # PRE-INSULATED STEEL PIPES (Standard)
  # ===========================================================================
  standard_insulated:
    description: "Pre-insulated steel pipe for district heating (standard insulation)"

    # Pipe material
    material:
      pipe: steel_st37              # Structural steel
      insulation: polyurethane_foam  # PU foam insulation
      casing: HDPE                   # High-density polyethylene

    # Thermal properties (heat loss)
    thermal:
      # Heat loss model: Q_loss = U * π * D * L * (T_fluid - T_ground)
      # U values depend on diameter and insulation thickness
      heat_transfer_coefficients:  # [W/(m·K)]
        DN100: 0.25
        DN150: 0.22
        DN200: 0.20
        DN250: 0.19
        DN300: 0.18
        DN400: 0.16
        DN500: 0.15
        DN600: 0.14

      # Insulation properties
      lambda_insulation_w_per_m_k: 0.025  # Thermal conductivity
      insulation_thickness_mm:
        DN100: 60
        DN150: 70
        DN200: 80
        DN250: 90
        DN300: 100
        DN400: 120
        DN500: 140
        DN600: 160

    # Hydraulic properties (pressure loss)
    hydraulic:
      # Darcy-Weisbach friction factor
      roughness_mm: 0.05             # Absolute roughness (smooth steel)
      friction_model: darcy_weisbach  # or: hazen_williams, manning

      # Pressure loss: ΔP = λ * (L/D) * (ρ*v²/2)
      # λ calculated from Colebrook-White equation

    # Mechanical properties
    mechanical:
      max_pressure_bar: 16           # Maximum operating pressure
      max_temperature_c: 130         # Maximum operating temperature
      design_lifetime_yr: 40         # Design lifetime

    # Installation/costs
    costs:
      # Supply + return pipe costs (EUR/m of trench)
      capex_eur_per_m_trench:
        DN100: 400
        DN150: 500
        DN200: 600
        DN250: 700
        DN300: 850
        DN400: 1100
        DN500: 1400
        DN600: 1800

      # Installation complexity factors
      urban_factor: 1.5              # 50% more expensive in urban areas
      crossing_factor: 2.0           # Road/river crossings
      depth_cost_eur_per_m_per_m: 50 # Extra cost per meter depth

      # Operational
      opex_eur_per_m_yr: 5           # Inspection, minor repairs
      replacement_cost_fraction: 0.8 # 80% of capex for replacement

  # ===========================================================================
  # HIGH-PERFORMANCE INSULATED PIPES
  # ===========================================================================
  high_performance_insulated:
    description: "High-performance pre-insulated pipes (superior insulation)"

    material:
      pipe: steel_st37
      insulation: aerogel_enhanced   # Superior insulation
      casing: HDPE

    thermal:
      heat_transfer_coefficients:  # Lower losses
        DN100: 0.18
        DN150: 0.16
        DN200: 0.14
        DN250: 0.13
        DN300: 0.12
        DN400: 0.11
        DN500: 0.10
        DN600: 0.09

      lambda_insulation_w_per_m_k: 0.015
      insulation_thickness_mm:
        DN100: 80
        DN150: 90
        DN200: 100
        DN250: 110
        DN300: 120
        DN400: 140
        DN500: 160
        DN600: 180

    hydraulic:
      roughness_mm: 0.03             # Very smooth (coated interior)
      friction_model: darcy_weisbach

    mechanical:
      max_pressure_bar: 25           # Higher pressure rating
      max_temperature_c: 150
      design_lifetime_yr: 50

    costs:
      capex_eur_per_m_trench:
        DN100: 550
        DN150: 650
        DN200: 800
        DN250: 950
        DN300: 1150
        DN400: 1500
        DN500: 1900
        DN600: 2400

      urban_factor: 1.5
      crossing_factor: 2.0
      depth_cost_eur_per_m_per_m: 50
      opex_eur_per_m_yr: 4           # Lower maintenance
      replacement_cost_fraction: 0.85

  # ===========================================================================
  # FLEXIBLE PRE-INSULATED PIPES (for branches)
  # ===========================================================================
  flexible_insulated:
    description: "Flexible pre-insulated pipes for building connections"

    material:
      pipe: PEX_crosslinked           # Cross-linked polyethylene
      insulation: polyurethane_foam
      casing: corrugated_HDPE

    thermal:
      heat_transfer_coefficients:
        DN25: 0.35
        DN32: 0.32
        DN40: 0.30
        DN50: 0.28
        DN65: 0.26

      lambda_insulation_w_per_m_k: 0.028
      insulation_thickness_mm:
        DN25: 30
        DN32: 35
        DN40: 40
        DN50: 45
        DN65: 50

    hydraulic:
      roughness_mm: 0.007            # Very smooth (plastic)
      friction_model: darcy_weisbach

    mechanical:
      max_pressure_bar: 10
      max_temperature_c: 95
      design_lifetime_yr: 30

    costs:
      capex_eur_per_m_trench:
        DN25: 150
        DN32: 180
        DN40: 200
        DN50: 230
        DN65: 270

      urban_factor: 1.3              # Easier to install
      crossing_factor: 1.5
      depth_cost_eur_per_m_per_m: 30
      opex_eur_per_m_yr: 3
      replacement_cost_fraction: 0.7

  # ===========================================================================
  # TWIN PIPES (Supply + Return in one casing)
  # ===========================================================================
  twin_pipe:
    description: "Twin pipe system (supply and return in single casing)"

    material:
      pipe: steel_st37
      insulation: polyurethane_foam
      casing: HDPE_single             # Single outer casing

    thermal:
      # Slightly higher losses due to proximity
      heat_transfer_coefficients:
        DN100: 0.28
        DN150: 0.25
        DN200: 0.23
        DN250: 0.22
        DN300: 0.21

      # Additional heat transfer between supply and return
      inter_pipe_heat_transfer_w_per_m_k: 0.05

      lambda_insulation_w_per_m_k: 0.025
      insulation_thickness_mm:
        DN100: 60
        DN150: 70
        DN200: 80
        DN250: 90
        DN300: 100

    hydraulic:
      roughness_mm: 0.05
      friction_model: darcy_weisbach

    mechanical:
      max_pressure_bar: 16
      max_temperature_c: 130
      design_lifetime_yr: 40

    costs:
      # Cheaper per meter (shared excavation)
      capex_eur_per_m_trench:
        DN100: 350                   # 12.5% cheaper than 2x standard
        DN150: 430
        DN200: 520
        DN250: 610
        DN300: 750

      urban_factor: 1.4              # Narrower trench
      crossing_factor: 1.8
      depth_cost_eur_per_m_per_m: 45
      opex_eur_per_m_yr: 6
      replacement_cost_fraction: 0.8
