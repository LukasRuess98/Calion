# Pre-commit hooks for EnerGIS
# Installation: pip install pre-commit && pre-commit install
# Manual run: pre-commit run --all-files

repos:
  # Strip outputs from Jupyter notebooks
  - repo: https://github.com/kynan/nbstripout
    rev: 0.6.1
    hooks:
      - id: nbstripout
        name: Strip notebook outputs
        description: Remove outputs from Jupyter notebooks before committing

  # General file cleanup
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
        args: ['--safe']
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-json
        name: Check JSON syntax
      - id: check-toml
        name: Check TOML syntax
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: ['--fix=lf']

  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        name: Format Python code (Black)
        language_version: python3.11
        args: ['--line-length=120']

  # Import sorting with isort
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort Python imports (isort)
        args: ['--profile=black', '--line-length=120']

  # Python linting with flake8
  - repo: https://github.com/pfc/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        name: Lint Python code (flake8)
        args: [
          '--max-line-length=120',
          '--extend-ignore=E203,W503',  # Compatible with Black
          '--exclude=.git,__pycache__,.venv,build,dist'
        ]

# Configuration for specific tools
default_language_version:
  python: python3.11

# Files to exclude from all hooks
exclude: |
  (?x)^(
      \.venv/.*|
      \.git/.*|
      __pycache__/.*|
      \.pytest_cache/.*|
      artifacts/.*|
      exports/.*|
      \.ipynb_checkpoints/.*|
      tests/data/.*\.json|
      Import_Data\.xlsx
  )$
