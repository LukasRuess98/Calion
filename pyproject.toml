[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "calion"
version = "1.0.0-alpha"
description = "MILP framework for investment and operation optimization of electrified industrial heating systems"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Lukas Ruess", email = "lukas.ruess@eep.uni-stuttgart.de" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyomo>=6.0",
    "pyyaml>=6.0",
    "openpyxl>=3.0",
    "typing-extensions>=4.0",
    "pydantic>=2.0",
    "pandas>=1.5",
    "numpy>=1.23",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
notebooks = [
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
]
all = [
    "calion[plot,notebooks,dev,docs]",
]

[project.scripts]
calion = "calion.run.__main__:main"

[project.urls]
Repository = "https://github.com/LukasRuess98/Planing-Framework-for-Heat"
"Bug Tracker" = "https://github.com/LukasRuess98/Planing-Framework-for-Heat/issues"
Changelog = "https://github.com/LukasRuess98/Planing-Framework-for-Heat/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["calion*"]
exclude = ["tests*", "docs*", "examples*", "notebooks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=calion --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
source = ["calion"]
omit = [
    # Visualization / dashboard — optional UI, not core logic
    "calion/io/dashboard/*",
    "calion/io/plotter.py",
    "calion/io/plot_utils.py",
    "calion/io/publication_plotter.py",
    "calion/io/publication_exporter.py",
    "calion/io/report_generator.py",
    "calion/io/workflow_browser.py",
    "calion/io/model_inspector.py",
    # Export adapters — thin wrappers, tested via integration
    "calion/io/exporter.py",
    "calion/io/unified_exporter.py",
    "calion/io/thermal_network_exporter.py",
    "calion/io/network_loader.py",
    # Optional subsystems not yet in core test scope
    "calion/economics/*",
    "calion/comparison/*",
    "calion/forecasting/*",
    "calion/analysis/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "B008", "UP007"]  # E501=line-length, B008=func-calls in defaults, UP007=X|Y union syntax

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
