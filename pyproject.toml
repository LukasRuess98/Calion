[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "energis"
version = "2.0.0-alpha"
description = "Modular MILP Framework for Industrial Heat Network Planning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "EnerGIS Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "openpyxl>=3.0",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
solver = ["pyomo>=6.0"]
plot = ["matplotlib>=3.5"]
notebooks = [
    "pandas>=1.5",
    "numpy>=1.23",
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
]
all = [
    "energis[solver,plot,notebooks,dev,docs]",
]

[project.scripts]
energis = "energis.run.__main__:main"

[project.urls]
Repository = "https://github.com/LukasRuess98/Planing-Framework-for-Heat"

[tool.setuptools.packages.find]
include = ["energis*"]
exclude = ["tests*", "docs*", "examples*", "notebooks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=energis --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
source = ["energis"]
omit = [
    # Visualization / dashboard — optional UI, not core logic
    "energis/io/dashboard/*",
    "energis/io/plotter.py",
    "energis/io/plot_utils.py",
    "energis/io/publication_plotter.py",
    "energis/io/publication_exporter.py",
    "energis/io/report_generator.py",
    "energis/io/workflow_browser.py",
    "energis/io/model_inspector.py",
    # Export adapters — thin wrappers, tested via integration
    "energis/io/exporter.py",
    "energis/io/unified_exporter.py",
    "energis/io/thermal_network_exporter.py",
    "energis/io/network_loader.py",
    # Optional subsystems not yet in core test scope
    "energis/economics/*",
    "energis/comparison/*",
    "energis/forecasting/*",
    "energis/analysis/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
