# =============================================================================
# PAPER STUDY - Level 2: Controlled Zone Aggregation (7 zones)
# =============================================================================
# CONTROLLED MATCHING vs. L3:
#   - Total ∑UL preserved (sum of all pipe U*L products identical)
#   - Asset locations preserved (HP at East-zone, not moved to j_1)
#   - Demand = sum of individual V_x profiles per zone (not fractioned)
#   - Topology: Simplified tree (not star!)
#
# Zone mapping:
#   Zone A (j_1):  Producer + V_1                    [from L3: j_1]
#   Zone B (j_2):  V_2, V_3                         [from L3: j_2, j_3]
#   Zone C (j_4):  V_4–V_9                          [from L3: j_4, j_5]
#   Zone D (j_6):  V_10–V_14                        [from L3: j_6, j_7, j_8]
#   Zone E (j_9):  V_15–V_18                        [from L3: j_9, j_10, j_11]
#   Zone F (j_12): V_19–V_24 + HP + EBoiler         [from L3: j_12, j_13]
#   Zone G (j_14): V_25–V_27                        [from L3: j_14, j_15]
#
# Topology: A → B → [C → D] + [E → F → G]  (tree, 6 pipes)
# =============================================================================

site:
  input_xlsx: "data/Import_Data_Memmingen_epronet.xlsx"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  name: "Memmingen L2 - Controlled 7-Zone Aggregation (Dispatch-Only)"
  description: "7-zone tree network, ∑UL matched to L3, assets at original locations"
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: "2025-01-01 00:00"
    end: "2025-12-31 23:00"

network:
  milp_linearize: true
  physics:
    heat_loss: true
    pressure_drop: false
    transport_delay: false

  supply_temp_c: 86.0
  return_temp_c: 56.9
  ground_temp_c: 10

  temperature_frame:
    default_return_band_c: 4.0
    seasons:
      winter:
        months: [1, 2, 12]
        supply_c: 88.6
        return_c: 52.3
        return_band_c: 3.0
      spring:
        months: [3, 4, 5]
        supply_c: 87.6
        return_c: 53.2
        return_band_c: 3.0
      summer:
        months: [6, 7, 8]
        supply_c: 83.4
        return_c: 68.6
        return_band_c: 2.5
      autumn:
        months: [9, 10, 11]
        supply_c: 84.2
        return_c: 53.6
        return_band_c: 3.0

  linearization:
    method: "pwl"
    temperature_profile:
      load_fractions: [0.0, 0.3, 0.6, 1.0]
      T_supply_c: [70.0, 80.0, 90.0, 100.0]
      T_return_c: [55.0, 50.0, 45.0, 40.0]

  max_velocity_m_s: 2.5
  pump_efficiency: 0.75
  pipe_roughness_mm: 0.5
  max_pressure_drop_bar: 2.0
  delta_p_min_consumer_bar: 0.7

  nodes:
    # Zone A: Producer (= L3 j_1) — all assets here, matching L3 where j_12 assets are commented out
    zone_A:
      assets: [chp_main, tes_main, biomass_main, gasboiler_main, hp_main, eboiler_main]
      consumers:
        - column: "V_1_demand_MWth"

    # Zone B: Trunk (= L3 j_2 + j_3 merged)
    zone_B:
      consumers:
        - column: "V_2_demand_MWth"
        - column: "V_3_demand_MWth"

    # Zone C: South near (= L3 j_4 + j_5 merged)
    zone_C:
      consumers:
        - column: "V_4_demand_MWth"
        - column: "V_5_demand_MWth"
        - column: "V_6_demand_MWth"
        - column: "V_7_demand_MWth"
        - column: "V_8_demand_MWth"
        - column: "V_9_demand_MWth"

    # Zone D: South far (= L3 j_6 + j_7 + j_8 merged)
    zone_D:
      consumers:
        - column: "V_10_demand_MWth"
        - column: "V_11_demand_MWth"
        - column: "V_12_demand_MWth"
        - column: "V_13_demand_MWth"
        - column: "V_14_demand_MWth"

    # Zone E: East near (= L3 j_9 + j_10 + j_11 merged)
    zone_E:
      consumers:
        - column: "V_15_demand_MWth"
        - column: "V_16_demand_MWth"
        - column: "V_17_demand_MWth"
        - column: "V_18_demand_MWth"

    # Zone F: East mid (= L3 j_12 + j_13 merged) — no local assets, matching L3 j_12 (assets commented out)
    zone_F:
      consumers:
        - column: "V_19_demand_MWth"
        - column: "V_20_demand_MWth"
        - column: "V_21_demand_MWth"
        - column: "V_22_demand_MWth"
        - column: "V_23_demand_MWth"
        - column: "V_24_demand_MWth"

    # Zone G: East far (= L3 j_14 + j_15 merged)
    zone_G:
      consumers:
        - column: "V_25_demand_MWth"
        - column: "V_26_demand_MWth"
        - column: "V_27_demand_MWth"

  # Pipes: Tree topology preserving ∑UL per aggregated segment
  # UL matching: sum of U*L for all L3 pipes within each zone-pair
  pipes:
    # Zone A → Zone B (= L3: j1→j2 + j2→j3)
    # ∑UL_sup = 0.32*350 + 0.32*300 = 208 W/K → L=650m, U=0.32
    zA_to_zB:
      from: zone_A
      to: zone_B
      length_m: 650      # 350 + 300
      diameter_mm: 450   # trunk diameter
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # Zone B → Zone C (= L3: j3→j4 + j4→j5)
    # ∑UL_sup = 0.32*260 + 0.32*240 = 160 W/K → L=500m, U=0.32
    zB_to_zC:
      from: zone_B
      to: zone_C
      length_m: 500      # 260 + 240
      diameter_mm: 300   # south arm trunk
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # Zone C → Zone D (= L3: j5→j6 + j5→j7 + j7→j8)
    # ∑UL_sup = 0.28*150 + 0.28*220 + 0.28*80 = 126 W/K → L=450m, U=0.28
    zC_to_zD:
      from: zone_C
      to: zone_D
      length_m: 450      # 150 + 220 + 80
      diameter_mm: 150   # smaller branches
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30

    # Zone B → Zone E (= L3: j3→j9 + j9→j10 + j10→j11)
    # ∑UL_sup = 0.32*450 + 0.32*200 + 0.32*230 = 281.6 W/K → L=880m, U=0.32
    zB_to_zE:
      from: zone_B
      to: zone_E
      length_m: 880      # 450 + 200 + 230
      diameter_mm: 350   # east arm trunk
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # Zone E → Zone F (= L3: j11→j12 + j12→j13)
    # ∑UL_sup = 0.32*250 + 0.32*220 = 150.4 W/K → L=470m, U=0.32
    zE_to_zF:
      from: zone_E
      to: zone_F
      length_m: 470      # 250 + 220
      diameter_mm: 300   # east arm mid
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # Zone F → Zone G (= L3: j13→j14 + j13→j15)
    # ∑UL_sup = 0.28*180 + 0.28*125 = 85.4 W/K → L=305m, U=0.28
    zF_to_zG:
      from: zone_F
      to: zone_G
      length_m: 305      # 180 + 125
      diameter_mm: 125   # east arm far
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30

# [Rest: assets, heat_pumps, grid, fuels, costs, run, output
# --- Assets: IDENTICAL to L3 (copy-paste) ---
assets:
  chp_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 0.20
    thermal_efficiency: 0.80
    el_eff: 0.40
    min_load: 0.3

  gasboiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 13.0
    thermal_efficiency: 0.90
    min_load: 0.1

  biomass_main:
    type: thermal_generator
    fuel: biomass
    capacity_mw: 3.3
    thermal_efficiency: 0.85
    min_load: 0.1

  eboiler_main:
    type: p2h
    capacity_mw: 5.0
    efficiency: 0.95
    min_load: 0.1

  hp_main:
    type: heat_pump
    capacity_mw: 5.0
    min_load: 0.2
    wrg_sources: [WRG1]
    cop_default: 3.0

  tes_main:
    type: storage
    energy_mwh: 500.0
    power_mw: 30.0
    eff_charge: 0.98
    eff_discharge: 0.98
    loss_hour: 0.9999
    soc0_mwh: 250.0
    min_energy_mwh: 25.0
    cycling_cost_eur_per_mwh: 2.0
    terminal:
      state: cyclic
      policy: equal

# --- Heat Pump COP Model: IDENTICAL to L3 ---
heat_pumps:
  cop:
    sink_defaults:
      Tsink_out_K: 373.15
      Tsink_in_K: 313.15
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 3.0
  types:
    standard:
      eta: 0.6
      FQ: 0.10

# --- Grid: IDENTICAL to L3 ---
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  gridcost_eur_mwh: 10.0

# --- Fuels: IDENTICAL to L3 ---
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0
  biomass:
    price_eur_mwh: 40.0
    ef_kg_per_mwh_fuel: 20.0

# --- Costs: IDENTICAL to L3 ---
costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 1000.0

run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    NonConvex: 2
    MIPGap: 0.005          # lockerer (war 0.005)
    TimeLimit: 86400      # 4h statt 24h
    MIPFocus: 1           # Fokus auf feasible solution
    Heuristics: 0.8       # war 0.2 — viel zu niedrig!
    NumericFocus: 2       # von 3 auf 2 (3 ist zu konservativ)
    OutputFlag: 1
    LogToConsole: 1
    LogFile: "gurobi_L2_7z.log"

output:
  log_dir: "output/logs"
  export_dir: "output/results"
  export_thermal_network: true
  export_solver_solution: false
