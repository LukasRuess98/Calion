# =============================================================================
# SYNTHETIC example run: the reference configuration (base.yaml) on the synthetic data set
# data/synthetic/ (generated by `python -m scripts.dhn_study.central_tes.synthetic_data`).
# The synthetic data are NOT measured; results have no meaning for the network of the paper.
# =============================================================================
extends: base.yaml

paths:
  data_dir: data/synthetic                       # same schema as the (non-public) data set data/dhn_a
  prices_dir: data/synthetic/prices
  partner_a_csv: data/synthetic/partner_a_2023.csv
  grid_co2_csv: data/synthetic/grid_co2_2025.csv
  results: results/synthetic

solver:
  time_limit_s: 300
