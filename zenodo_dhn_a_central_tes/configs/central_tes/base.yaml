# =============================================================================
# Central TES + two industrial heat sources at site S of network DHN-A
# Reference configuration (anonymised). Every value that is not measured data
# or a documented plan value is marked `assumption: true` with a one-line reason.
# Real names, partner data paths and the name mapping live ONLY in
# configs/local/central_tes_local.yaml (gitignored).
# =============================================================================

meta:
  network: DHN-A
  year: 2025
  timezone: Europe/Berlin            # naive local time, index of measurements_2025_hourly.parquet
  dt_h: 1.0

paths:
  measurements: data/dhn_a/measurements_2025_hourly.parquet
  plants: data/dhn_a/plants.yaml
  prices_dir: data/prices            # DE-LU day-ahead, energy-charts.info API (source: BNetzA | SMARD.de, CC BY 4.0)
  local_config: configs/local/central_tes_local.yaml   # partner A file, grid CO2 file (local only)
  results: results/central_tes

solver:
  name: highs                        # HiGHS via highspy (Gurobi not available on this machine)
  mip_rel_gap: 0.001
  time_limit_s: 1800
  threads: 2
  random_seed: 1234
  presolve: "on"

# ----------------------------------------------------------------------------- inputs
inputs:
  demand:
    source: measured_feed_in        # Σ feed-in into the interconnected network (KWK, MVA, GT, Bio-KWK, HW1), incl. losses
    max_interp_gap_h: 6
    loss_model: embedded            # see docs: losses are exogenous because T_VL/T_RL are exogenous
  temperatures:
    supply: measured                # measured | heating_curve
    heating_curve: {T_amb_C: [-15.0, 30.0], T_supply_C: [122.0, 70.0]}   # existing energy configuration
    return: measured
  prices:
    year: 2025                      # B2 uses 2023 / 2024 with 2025 demand
    aggregate_15min: mean           # SDAC 15-min MTU from 2025-10-01 -> hourly mean
  expansion:
    share: 0.0                      # additional annual demand of new customers in the south (0.1/0.2/0.3)
    region: south
  partner_a:
    year_of_data: 2023
    calendar_shift_days: 728        # 104 weeks: keeps the weekday (2025-01-01 Wed <- 2023-01-04 Wed)
    streams: [water_1, water_2, water_3, water_4]   # all four water-based waste-heat streams, merged into one
    source_temperature: warm        # flow-weighted outlet (warm) temperature of the merged stream
    note: "decision 2026-10-08: all water-based streams merged; daily stream spread evenly over the day"
    scale: 1.0                      # B1 sweeps 0.5 / 0.75 / 1.0 / 1.25
    assumption: true
    reason: "2023 profile mapped to the 2025 calendar (weekday-preserving); holidays not aligned."

# ----------------------------------------------------------------------------- existing plants (plants.yaml first)
plants:
  # capacity [MW_th]; cost: fuel price, efficiencies from the existing energy configuration (copied, anonymised)
  KWK:     {cap_MW: 127.0, fuel: gas,     eta_th: 0.743, eta_el: 0.177, node: KWK}   # CHP: energy tax relief (§ 53a EnergieStG) assumed
  MVA:     {cap_MW: 45.0,  fuel: waste,   eta_th: 1.0,   eta_el: 0.0,   node: MVA, availability: monthly_p95_measured}
  GT:      {cap_MW: 35.0,  fuel: gas,     eta_th: 0.466, eta_el: 0.36,  node: GT}
  BIO:     {cap_MW: 14.5,  fuel: biomass, eta_th: 0.485, eta_el: 0.177, node: BIO, must_run: true}
  HW1:     {cap_MW: 40.0,  fuel: gas,     eta_th: 0.936, eta_el: 0.0,   node: HW1, energy_tax_eur_MWh: 5.5}
  capacity_source: "plants.yaml (plan A); MVA/GT/Bio 'transition' values, KWK n-1 design, HW1 design"
  existing_eb_at_kwk:                # 9.9 MW electric boiler of the existing energy configuration, not in plants.yaml
    enabled: false
    cap_MW: 9.9
    eta: 0.99
    c_el_var_eur_MWh: 61.6          # operator grid fee of the existing configuration
    assumption: true
    reason: "Not listed in plan A; question to the authors (G0)."
  availability_note:
    assumption: true
    reason: "MVA heat availability = monthly P95 of measured 2025 output (captures revisions/waste throughput);
      Bio-KWK must-run (flat 14.4-14.5 MW in every month of 2025)."
  # Mass-flow capacities [kg/s] = max(plan A value, measured 2025 maximum); heat capacity per hour = m_max·Δh(T_VL,T_RL)
  m_max_kg_s: {KWK: 653.0, MVA: 312.0, GT: 253.0, BIO: 126.0, HW1: 158.0}
  east_parallel_max_kg_s: 455.0     # plan A: 1 550 t/h (431 kg/s) east plants in parallel; 2025 max 455 kg/s
  mass_flow_note:
    assumption: true
    reason: "Plan-A mass-flow limits enforced in the energy layer (else F000 is hydraulically infeasible, G2);
      raised to the 2025 envelope where measured operation exceeded the plan value."
  unit_commitment: false
  assumption_uc: "Aggregated multi-unit plants; minimum loads not modelled (LP dispatch)."

fuels:            # EUR/MWh_fuel and kg CO2 / MWh_fuel
  # gas 2025: commodity ≈ 40 EUR/MWh (EEX THE futures means 44.7 for Oct-24..Mar-25 and 35.5 for Apr..Sep-25)
  # + ≈ 8 EUR/MWh network, storage levy, metering (assumption); old value 58.6 of the existing configuration -> sensitivity
  gas:     {price: 48.0, ef: 201.0}
  biomass: {price: 20.0, ef: 20.0}
  waste:   {price: 10.0, ef: 0.0}     # MVA heat take-over price per MWh_th
co2_price_eur_t: 72.0              # EUA 2025: EEX futures means 71.6 / 73.4 EUR/t (old value 100 -> sensitivity)
chp_power_credit: day_ahead           # CHP electricity valued at the hourly day-ahead price

# ----------------------------------------------------------------------------- partner A heat pump (one unit)
heat_pump:
  Q_max_MW: 5.0
  assumption: true
  reason: "Decision 2026-10-07: one HP, 5 MW thermal."
  eta_carnot: 0.50                  # Carnot fraction, large DH heat pumps (literature, see docs)
  dT_app_K: 5.0
  cop_max: 7.0
  lift_limit_single_stage_K: 70.0   # flag hours above this lift (multi-stage implied)
  c_el_var_eur_MWh: 38.0            # grid fee + levies for the HP, HV/reduced-fee case; literature 37-76 EUR/MWh (PR: 55 / 76)
  pi_source_eur_MWh: 5.0            # waste-heat fee to partner A per MWh source heat (negotiable; sensitivity 0/10/20)
  capex_eur_per_MW: 950000.0        # large electric HP for DH, per MW_th: DEA technology data (2025 EUR) waste-heat HP 10 MW 0.91-0.95; Agora/IEG 2023 0.7-1.6
  lifetime_a: 20
  modes: [grid, tes, casc_grid, casc_tes]
  cascade:
    enabled: true
    T_mid_C: 80.0                   # A6 sweeps 70/80/90/100
  part_load_min: 0.0
  assumption_modes: "One condenser temperature per hour (binary mode exclusivity)."

# ----------------------------------------------------------------------------- partner B electrode boiler
electrode_boiler:
  P_max_MW: 10.0
  P_avail: constant
  assumption: true
  reason: "Spare capacity offered by partner B; no availability profile provided."
  eta: 0.99
  premium_eur_MWh: 10.0             # pi (A4 sweeps 0..60)
  c_el_var_case: high               # low | high (A5)
  c_el_var_eur_MWh: {low: 12.0, high: 60.0}   # low: non-waivable levy floor ≈ 11.4 EUR/MWh (KWKG, offshore, §19 B', tax after §9b, concession)
  demand_charge: none               # none | full (A5)
  demand_charge_eur_per_MW_a: 127240.0

# ----------------------------------------------------------------------------- TES at site S
tes:
  enabled: true
  volume_m3: 5000.0
  assumption: true
  reason: "One pressurised steel vessel of the size class of the largest built DH pressure tanks (2 x 5,500 m3, AEE INTEC)."
  model: classes                    # classes (temperature classes, reference) | single (spec 4.4 with strategies, A3)
  classes_C: [90.0, 95.0, 100.0, 105.0, 110.0, 115.0, 120.0]
  node: S                           # S (co-located with HP/EB) | station:V06 (node of station V06 = south end, exploratory)
  T_set_strategy: fixed             # fixed | monthly | daily (A3, model single)
  T_fixed_C: 120.0
  temperature_masks: true           # single model only: false = energy-only storage without temperature limits (A3e bound)
  T_low_C: 67.5                     # P95 of measured return temperature 2025
  Q_ch_max_MW: 40.0
  Q_dis_max_MW: 40.0
  loss_per_h: 0.0001                # 0.24 %/day standing loss (existing energy configuration)
  dT_tol_K: 0.0
  cyclic: true
  E0_fraction: 0.5
  exclusivity_binary: true
  design_pressure_note: "pressurised vessel, design pressure above saturation at 120 C (~1 bar g) + margin; not in the MILP"

# ----------------------------------------------------------------------------- connection pipe S
link:
  DN: 400                           # trunk DN at S from the operator valve table (sections valves at S: DN 400)
  v_max_m_s: 2.5
  assumption: true
  reason: "Velocity design limit for DN 300-500 transport pipes; A2 sweeps the DN."
  DN_inner_m: {300: 0.3127, 350: 0.3444, 400: 0.3938, 450: 0.4446, 500: 0.4954, 600: 0.5958}

# ----------------------------------------------------------------------------- hydraulics
hydraulics:
  calibration_variants: [A, C, B]
  reference_variant: A
  control:
    pressure_holder: KWK            # also in summer (measured: KWK holds ~1.8 bar at ~zero net flow)
    setpoints: {V06: 1.2, Mitte: 1.0}
    mitte_stations: [V03, V10, V12, V23, V24]
  ps1_control: true                 # PS1 may raise its head up to its pump curve to hold V06 (operator lever; else measured gain)
  redispatch_mode_h: proportional_to_milp_split
  k_max: 10
  anticipate_tes_ext_bar: null    # hosting study, TES away from S: cuts also for hours within this margin of a limit
  mode_h_method: cuts               # cuts (all feed-ins, deviation D3) | central_bisection (spec 6.2)
  cut_margin_bar: 0.02
  bisection_iter: 14
  plant_dp_anchor: measured_plus_model_change   # east/HW1 plant dp = measured 2025 + model(S) - model(measured dispatch)
  pump_curve:
    shutoff_ratio: 1.20             # H(0)/H(nominal), generic centrifugal pump (literature range 1.1-1.3)
    assumption: true
    reason: "No manufacturer curves; anchored at the nominal points of plants.yaml."
  soft_limits_bar: {KWK: 4.0, MVA: 7.5, GT: 7.5, BIO: 7.5}
  pump_efficiency: 0.75
  kwk_min_flow_kg_s: -10.0          # circulation pumps cannot reverse

# ----------------------------------------------------------------------------- economics (post-processing only)
economics:
  discount_rate: 0.05
  lifetime_tes_a: 30
  lifetime_link_a: 40
  tes_capex_eur_per_m3: {low: 1000.0, ref: 1500.0, high: 2500.0}   # pressurised tanks: projects ≈ 1 170 (2014) and ≈ 1 800 EUR/m3 (2013), escalated; DEA atmospheric 177-220 EUR/m3
  tes_capex_fixed_eur: 100000.0
  link_capex_eur_per_m: 3000.0      # DN 400 pipe pair, city: DEA energy transport 2 862 EUR/m (2020 EUR) ≈ 3 300 (2024)
  link_length_m: 200.0              # connection stub at S (assumption)

# ----------------------------------------------------------------------------- network expansion (south)
new_boiler:
  enabled: false                    # switched on in the expansion study
  node: station:V06                 # new peak boiler at the node of station V06 (south end, pressure support)
  fuel: gas
  eta_th: 0.95
  energy_tax_eur_MWh: 5.5
  capex_eur_per_MW: 100000.0        # gas peak boiler incl. connection; assumption in the DEA range 0.043-0.27 M EUR/MW (central 0.064), see literature_check
  om_fix_eur_per_MW_a: 2000.0
  lifetime_a: 25
  cap_max_MW: 200.0
  mode: boiler                      # boiler (capacity decision) | unserved (hosting study: unserved heat of the new customers)
  unserved_penalty_eur_MWh: 1000.0
