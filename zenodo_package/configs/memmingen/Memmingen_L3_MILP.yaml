# =============================================================================
# PAPER STUDY - Level 3: Independent Zone Demands (Dispatch-Only)
# =============================================================================
# RESEARCH FOCUS: Impact of Independent Zone Demand Profiles vs. Fractioned Demand
#
# Level 3 with per-zone independent demands instead of demand fractions.
# Each zone has its own complete 8760-hour timeseries with unique temporal patterns,
# enabling heterogeneous demand profiles across the network.
#
# DIFFERENCES FROM L3_detailed_dispatch.yaml:
# - REMOVED: demand_fraction from all consumer nodes
# - UPDATED: Each zone reads unique demand column (zone_XX_demand_MWth)
# - DATA:    Uses Import_Data_yearly_zones.csv (generated by scripts/generate_zone_demands.py)
# - RESULT:  Per-zone demands are independent (not just scaled copies of total)
#
# TOPOLOGY:
#   Star-of-stars: plant -> 14 junction-to-junction pipes
#   Total nodes: 15 (1 plant-junction, 14 distribution junctions)
#   Total pipes: 14 connections (junction-to-junction only)
#   Total pipe length: ~3,255 m
#   Demand distribution: V_1-V_27 demand columns merged into junctions
#
# SYSTEM SUMMARY (Fixed Assets):
#   Peak demand:     ~76 MW (may shift due to independent profiles)
#   Annual demand:   ~517 GWh (approx.)
#   CHP:             0.2 MW_th / 0.1 MW_el
#   Gas boiler:      13 MW_th, eta = 0.90
#   Biomass boiler:  3.3 MW_th, eta = 0.85
#   Heat pump:       5 MW_th, COP ~3.0
#   E-Boiler (P2H):  5 MW_th, eta = 0.95
#   Storage:         500 MWh / 30 MW
#   Heat losses:     ~26 GWh/year
#
# SETUP:
# 1. Generate zone demands: python scripts/generate_zone_demands.py
# 2. Run this config:        python scripts/paper/run_all_levels.py
# 3. Compare vs. L3_detailed_dispatch for dispatch pattern differences
# =============================================================================

site:
  input_xlsx: "data/synthetic_site/Import_Data_yearly_zones.csv"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  name: "Memmingen L3 - Independent Zone Demands (Dispatch-Only)"
  description: "15-node junction network, all consumers merged into junctions"
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: "2025-01-01 00:00"
    end: "2025-12-31 23:00"

# --- Network (15-node junction network) ---
network:
  milp_linearize: true
  physics:
    heat_loss: true
    pressure_drop: false
    transport_delay: false
  # configs/memmingen/Memmingen_L3_MILP.yaml â€” relevanter Abschnitt

  # Wird vom Validation-Runner per Override auf gemessenen Wert gesetzt:
  supply_temp_c: 86.0
  return_temp_c: 63.6
  ground_temp_c: 10
  temperature_frame:
    default_return_band_c: 4.0
    seasons:
      winter:
        months: [1, 2, 12]
        supply_c: 88.6
        return_c: 61.0
        return_band_c: 3.0
      spring:
        months: [3, 4, 5]
        supply_c: 87.6
        return_c: 64.1
        return_band_c: 3.0
      summer:
        months: [6, 7, 8]
        supply_c: 83.4
        return_c: 68.6
        return_band_c: 2.5
      autumn:
        months: [9, 10, 11]
        supply_c: 84.2
        return_c: 61.1
        return_band_c: 3.0
  # Variable delivery temperature via outdoor-temperature Heizkurve.
  # NetworkManager uses this when outdoor_temp_C is available in the data.
  heating_curve:
    enabled: true
    T_supply_max_c: 100.0   # supply temp at coldest design day (ca. -15Â°C)
    T_supply_min_c: 50.0    # supply temp at heating cutoff (ca. +15Â°C)
    T_outdoor_low_c: -15.0
    T_outdoor_high_c: 30.0

  linearization:
    method: "pwl"
    temperature_profile:
      load_fractions: [0.0, 0.3, 0.6, 1.0]
      T_supply_c: [70.0, 80.0, 90.0, 100.0]
      T_return_c: [55.0, 50.0, 45.0, 40.0]

  max_velocity_m_s: 2.5
  pump_efficiency: 0.75
  pipe_roughness_mm: 0.5
  max_pressure_drop_bar: 2.0
  delta_p_min_consumer_bar: 0.7

  # --- NODES: 15 Junctions, alle 27 Verbraucher direkt eingebettet ---
  nodes:
    # Root: producer-junction (Heizwerk E1 + V_1)
    j_1:
      assets: [chp_main, tes_main, biomass_main, gasboiler_main, hp_main, eboiler_main]
      consumers:
        - column: "V_1_demand_MWth"

    # Trunk junction j_2: serves V_2
    j_2:
      consumers:
        - column: "V_2_demand_MWth"

    # Trunk junction j_3: splits to j_4 and j_9, serves V_3
    j_3:
      consumers:
        - column: "V_3_demand_MWth"

    # Branch j_4: serves V_4-V_7
    j_4:
      consumers:
        - column: "V_4_demand_MWth"
        - column: "V_5_demand_MWth"
        - column: "V_6_demand_MWth"
        - column: "V_7_demand_MWth"

    # Branch j_5: serves V_8-V_9, splits to j_6 and j_7
    j_5:
      consumers:
        - column: "V_8_demand_MWth"
        - column: "V_9_demand_MWth"

    # Terminal branch j_6: serves V_10-V_12
    j_6:
      consumers:
        - column: "V_10_demand_MWth"
        - column: "V_11_demand_MWth"
        - column: "V_12_demand_MWth"

    # Branch j_7: serves V_13
    j_7:
      consumers:
        - column: "V_13_demand_MWth"

    # Terminal branch j_8: serves V_14
    j_8:
      consumers:
        - column: "V_14_demand_MWth"

    # Branch j_9: serves V_15-V_16
    j_9:
      consumers:
        - column: "V_15_demand_MWth"
        - column: "V_16_demand_MWth"

    # Branch j_10: serves V_17
    j_10:
      consumers:
        - column: "V_17_demand_MWth"

    # Junction j_11: serves V_18
    j_11:
      consumers:
        - column: "V_18_demand_MWth"

    # Junction j_12: serves V_19-V_21, has HP + E-Boiler
    j_12:
      #assets: [hp_main, eboiler_main]
      consumers:
        - column: "V_19_demand_MWth"
        - column: "V_20_demand_MWth"
        - column: "V_21_demand_MWth"

    # Junction j_13: serves V_22-V_24
    j_13:
      consumers:
        - column: "V_22_demand_MWth"
        - column: "V_23_demand_MWth"
        - column: "V_24_demand_MWth"

    # Terminal branch j_14: serves V_25-V_26
    j_14:
      consumers:
        - column: "V_25_demand_MWth"
        - column: "V_26_demand_MWth"

    # Terminal branch j_15: serves V_27
    j_15:
      consumers:
        - column: "V_27_demand_MWth"

  # --- PIPES: 14 Junction-to-Junction ---
  pipes:
    # Hauptstrang (J1 -> J2 -> J3)
    # 26 Verbraucher downstream, ~72 MW -> DN450
    j1_to_j2:
      from: j_1
      to: j_2
      length_m: 350
      diameter_mm: 450
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # 25 Verbraucher downstream, ~70 MW -> DN450
    j2_to_j3:
      from: j_2
      to: j_3
      length_m: 300
      diameter_mm: 450
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # J3 verzweigt: Sued -> J4, Ost -> J9
    # Sued-Ast: 11 Verbraucher, ~31 MW -> DN300
    j3_to_j4:
      from: j_3
      to: j_4
      length_m: 260
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # Ost-Ast: 13 Verbraucher, ~37 MW -> DN350
    j3_to_j9:
      from: j_3
      to: j_9
      length_m: 450
      diameter_mm: 350
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # Sued-Ast (J4 -> J5 -> J6/J7 -> J8)
    # 7 Verbraucher downstream, ~20 MW -> DN250
    j4_to_j5:
      from: j_4
      to: j_5
      length_m: 240
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # 3 Verbraucher downstream, ~8 MW -> DN150
    j5_to_j6:
      from: j_5
      to: j_6
      length_m: 150
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.3

    # 2 Verbraucher downstream, ~6 MW -> DN125
    j5_to_j7:
      from: j_5
      to: j_7
      length_m: 220
      diameter_mm: 125
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.3

    # 1 Verbraucher, ~3 MW -> DN100
    j7_to_j8:
      from: j_7
      to: j_8
      length_m: 80
      diameter_mm: 100
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.3

    # Ost-Ast (J9 -> J10 -> J11 -> J12 -> J13 -> J14/J15)
    # 11 Verbraucher downstream, ~31 MW -> DN300
    j9_to_j10:
      from: j_9
      to: j_10
      length_m: 200
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # 10 Verbraucher downstream, ~28 MW -> DN300
    j10_to_j11:
      from: j_10
      to: j_11
      length_m: 230
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # 9 Verbraucher downstream, ~25 MW -> DN300
    j11_to_j12:
      from: j_11
      to: j_12
      length_m: 250
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # 6 Verbraucher downstream, ~17 MW -> DN250
    j12_to_j13:
      from: j_12
      to: j_13
      length_m: 220
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # 2 Verbraucher downstream, ~6 MW -> DN125
    j13_to_j14:
      from: j_13
      to: j_14
      length_m: 180
      diameter_mm: 125
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.3

    # 1 Verbraucher, ~3 MW -> DN100
    # u-values calibrated from V_27 measurements (validation: 4.68x nominal)
    j13_to_j15:
      from: j_13
      to: j_15
      length_m: 125
      diameter_mm: 100
      u_value_supply_w_per_m_k: 1.31
      u_value_return_w_per_m_k: 1.4

# --- Assets (Dispatch-Only, Fixed Capacities) ---
# --- Assets: IDENTICAL to L3 (copy-paste) ---
assets:
  chp_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 0.20
    thermal_efficiency: 0.80
    el_eff: 0.40
    min_load: 0.3

  gasboiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 13.0
    thermal_efficiency: 0.90
    min_load: 0.1

  biomass_main:
    type: thermal_generator
    fuel: biomass
    capacity_mw: 3.3
    thermal_efficiency: 0.85
    min_load: 0.1

  eboiler_main:
    type: p2h
    capacity_mw: 5.0
    efficiency: 0.95
    min_load: 0.1

  hp_main:
    type: heat_pump
    capacity_mw: 5.0
    min_load: 0.2
    wrg_source_column: "WRG_1 Â°C"
    wrg_capacity_column: "WRG1Q MW"
    cop_default: 3.0

  tes_main:
    type: storage
    energy_mwh: 500.0
    power_mw: 30.0
    eff_charge: 0.98
    eff_discharge: 0.98
    loss_hour: 0.9999
    soc0_mwh: 250.0           # 50% start â€” realistic mid-year level (was 500 = always full)
    min_energy_mwh: 25.0      # 5% SOC floor â€” prevents full depletion
    cycling_cost_eur_per_mwh: 2.0  # wear deterrent; HP arbitrage needs spread > 4 â‚¬/MWh_th round-trip
    terminal:
      state: cyclic
      policy: equal

# --- Heat Pump COP Model: IDENTICAL to L3 ---
heat_pumps:
  cop:
    sink_defaults:
      Tsink_out_K: 353.15
      Tsink_in_K: 323.15
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 3.0
  types:
    standard:
      eta: 0.6
      FQ: 0.10

# --- Grid: IDENTICAL to L3 ---
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  gridcost_eur_mwh: 10.0

# --- Fuels: IDENTICAL to L3 ---
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0
  biomass:
    price_eur_mwh: 40.0
    ef_kg_per_mwh_fuel: 20.0

# --- Costs: IDENTICAL to L3 ---
costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 1000.0
  
# --- Run Settings ---
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    NonConvex: 2
    MIPGap: 0.005          # lockerer (war 0.005)
    TimeLimit: 86400      # 4h statt 24h
    MIPFocus: 1           # Fokus auf feasible solution
    Heuristics: 0.8       # war 0.2 â€” viel zu niedrig!
    NumericFocus: 2       # von 3 auf 2 (3 ist zu konservativ)
    OutputFlag: 1
    LogToConsole: 1
    LogFile: "gurobi_L3_MILP.log"

# --- Output ---
output:
  log_dir: "output/logs"
  export_dir: "output/results"
  export_thermal_network: true
  export_solver_solution: true
