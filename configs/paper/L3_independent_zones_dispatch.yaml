# =============================================================================
# PAPER STUDY — Level 3: Independent Zone Demands (Dispatch-Only)
# =============================================================================
# RESEARCH FOCUS: Impact of Independent Zone Demand Profiles vs. Fractioned Demand
#
# Level 3 with per-zone independent demands instead of demand fractions.
# Each zone has its own complete 8760-hour timeseries with unique temporal patterns,
# enabling heterogeneous demand profiles across the network.
#
# DIFFERENCES FROM L3_detailed_dispatch.yaml:
# - REMOVED: demand_fraction from all consumer nodes
# - UPDATED: Each zone reads unique demand column (zone_XX_demand_MWth)
# - DATA:    Uses Import_Data_yearly_zones.csv (generated by scripts/generate_zone_demands.py)
# - RESULT:  Per-zone demands are independent (not just scaled copies of total)
#
# TOPOLOGY:
#   Star-of-stars: plant → central junctions → 4 branches → 23 zones
#   Total nodes: 30 (1 plant, 4 junctions, 23 consumer zones)
#   Total pipes: 22 connections
#   Total pipe length: ~14,250 m
#   Demand distribution: zones 01-23 with independent timeseries
#
# PHYSICS:
# - Heat loss: Physics-based PWL model (identical to L3_detailed_dispatch)
# - COP method: Analytical LMTD
#
# SYSTEM SUMMARY (Fixed Assets — identical to L3):
#   Peak demand:   76 MW (may shift due to independent profiles)
#   Annual demand: 517 GWh (approx., depends on generated profiles)
#   Boiler:        200 MW gas, η = 0.90
#   CHP:           20 MW (elec)
#   Heat pump:     100 MW thermal
#   Storage:       500 MWh / 50 MW
#   Heat losses:   ~26 GWh/year
#
# SETUP:
# 1. Generate zone demands: python scripts/generate_zone_demands.py
# 2. Run this config:        python scripts/paper/run_all_levels.py
# 3. Compare vs. L3_detailed_dispatch for dispatch pattern differences
# =============================================================================

site:
  input_xlsx: "data/Import_Data_yearly_zones.csv"
  columns:
    datetime:  "Datum"
    price:     "strompreis_EUR_MWh"
    co2_grid:  "grid_co2_kg_MWh"
    wrg1_temp: "T_WRG1_C"
    wrg2_temp: "T_WRG2_C"

scenario:
  name: "L3_independent_zones_dispatch"
  run_mode: PF_ONLY
  description: "30-node network with independent per-zone demand profiles (no fractions)"

# ── Network (30-node with physics-based losses, independent zone demands) ──
network:
  physics:
    heat_loss: true
    pressure_drop: true
    transport_delay: false

  supply_temp_c: 90.0
  return_temp_c: 55.0
  ground_temp_c: 10.0

  nodes:
    # ── Production (plant with all assets) ────────────────────────────────
    plant_main:
      type: producer
      assets: [boiler_main, chp_main, hp_main, tes_main]

    # ── Central junctions (routing, no demand) ────────────────────────────
    j_central:
      type: junction
    j_north:
      type: junction
    j_south:
      type: junction
    j_east:
      type: junction
    j_west:
      type: junction

    # ── North branch: 5 consumer zones (23% of total)
    # Each zone reads its own independent demand column
    zone_01:
      type: consumer
      demand:
        column: "zone_01_demand_MWth"
    zone_02:
      type: consumer
      demand:
        column: "zone_02_demand_MWth"
    zone_03:
      type: consumer
      demand:
        column: "zone_03_demand_MWth"
    zone_04:
      type: consumer
      demand:
        column: "zone_04_demand_MWth"
    zone_05:
      type: consumer
      demand:
        column: "zone_05_demand_MWth"

    # ── South branch: 6 consumer zones (26% of total)
    zone_06:
      type: consumer
      demand:
        column: "zone_06_demand_MWth"
    zone_07:
      type: consumer
      demand:
        column: "zone_07_demand_MWth"
    zone_08:
      type: consumer
      demand:
        column: "zone_08_demand_MWth"
    zone_09:
      type: consumer
      demand:
        column: "zone_09_demand_MWth"
    zone_10:
      type: consumer
      demand:
        column: "zone_10_demand_MWth"
    zone_11:
      type: consumer
      demand:
        column: "zone_11_demand_MWth"

    # ── East branch: 6 consumer zones (25% of total)
    zone_12:
      type: consumer
      demand:
        column: "zone_12_demand_MWth"
    zone_13:
      type: consumer
      demand:
        column: "zone_13_demand_MWth"
    zone_14:
      type: consumer
      demand:
        column: "zone_14_demand_MWth"
    zone_15:
      type: consumer
      demand:
        column: "zone_15_demand_MWth"
    zone_16:
      type: consumer
      demand:
        column: "zone_16_demand_MWth"
    zone_17:
      type: consumer
      demand:
        column: "zone_17_demand_MWth"

    # ── West branch: 6 consumer zones (26% of total)
    zone_18:
      type: consumer
      demand:
        column: "zone_18_demand_MWth"
    zone_19:
      type: consumer
      demand:
        column: "zone_19_demand_MWth"
    zone_20:
      type: consumer
      demand:
        column: "zone_20_demand_MWth"
    zone_21:
      type: consumer
      demand:
        column: "zone_21_demand_MWth"
    zone_22:
      type: consumer
      demand:
        column: "zone_22_demand_MWth"
    zone_23:
      type: consumer
      demand:
        column: "zone_23_demand_MWth"

  # ── Pipe Network (IDENTICAL TO L3_detailed_dispatch) ────────────────────
  pipes:
    # Main trunk: plant → central junction (3,200 m @ Ø500mm)
    plant_to_central:
      from: plant_main
      to: j_central
      length_m: 3200
      diameter_mm: 500

    # Branch spreaders: central → branch junctions (800–900 m each @ Ø350mm)
    central_to_north:
      from: j_central
      to: j_north
      length_m: 850
      diameter_mm: 350
    central_to_south:
      from: j_central
      to: j_south
      length_m: 820
      diameter_mm: 350
    central_to_east:
      from: j_central
      to: j_east
      length_m: 880
      diameter_mm: 350
    central_to_west:
      from: j_central
      to: j_west
      length_m: 790
      diameter_mm: 350

    # ── North branch (zones 01–05)
    j_north_to_z1:
      from: j_north
      to: zone_01
      length_m: 320
      diameter_mm: 300
    j_north_to_z2:
      from: j_north
      to: zone_02
      length_m: 280
      diameter_mm: 250
    j_north_to_z3:
      from: j_north
      to: zone_03
      length_m: 200
      diameter_mm: 200
    j_north_to_z4:
      from: zone_01
      to: zone_04
      length_m: 150
      diameter_mm: 150
    j_north_to_z5:
      from: zone_02
      to: zone_05
      length_m: 120
      diameter_mm: 125

    # ── South branch (zones 06–11)
    j_south_to_z6:
      from: j_south
      to: zone_06
      length_m: 350
      diameter_mm: 300
    j_south_to_z7:
      from: j_south
      to: zone_07
      length_m: 300
      diameter_mm: 250
    j_south_to_z8:
      from: j_south
      to: zone_08
      length_m: 220
      diameter_mm: 200
    j_south_to_z9:
      from: zone_06
      to: zone_09
      length_m: 180
      diameter_mm: 150
    j_south_to_z10:
      from: zone_07
      to: zone_10
      length_m: 160
      diameter_mm: 125
    j_south_to_z11:
      from: zone_08
      to: zone_11
      length_m: 100
      diameter_mm: 100

    # ── East branch (zones 12–17)
    j_east_to_z12:
      from: j_east
      to: zone_12
      length_m: 380
      diameter_mm: 300
    j_east_to_z13:
      from: j_east
      to: zone_13
      length_m: 320
      diameter_mm: 250
    j_east_to_z14:
      from: j_east
      to: zone_14
      length_m: 240
      diameter_mm: 200
    j_east_to_z15:
      from: zone_12
      to: zone_15
      length_m: 200
      diameter_mm: 150
    j_east_to_z16:
      from: zone_13
      to: zone_16
      length_m: 170
      diameter_mm: 125
    j_east_to_z17:
      from: zone_14
      to: zone_17
      length_m: 120
      diameter_mm: 100

    # ── West branch (zones 18–23)
    j_west_to_z18:
      from: j_west
      to: zone_18
      length_m: 360
      diameter_mm: 300
    j_west_to_z19:
      from: j_west
      to: zone_19
      length_m: 290
      diameter_mm: 250
    j_west_to_z20:
      from: j_west
      to: zone_20
      length_m: 210
      diameter_mm: 200
    j_west_to_z21:
      from: zone_18
