# =============================================================================
# PAPER STUDY — Level 1: Copperplate (1-node)
# =============================================================================
# Single virtual node. No pipes, no heat losses, no pressure drop.
# All assets and demand aggregated at one bus.
#
# This is the BASELINE case for the spatial resolution comparison.
# Identical assets and economic parameters to L2 and L3.
# Only the network representation differs across the three levels.
#
# System summary:
#   Peak demand:   ~76 MW (from Import_Data.csv)
#   Boiler:        200 MW gas, η = 0.90
#   Heat pump:     100 MW, COP = 3.5 (WRG sources 1+2)
#   Storage:       500 MWh / 50 MW
#   Pipes:         none (copperplate)
#   Heat losses:   0 % (no network model)
# =============================================================================

site:
  input_xlsx: "data/Import_Data_january.csv"
  columns:
    datetime:  "Datum"
    price:     "strompreis_EUR_MWh"
    co2_grid:  "grid_co2_kg_MWh"

scenario:
  run_mode: PF_ONLY

# ── Network (single aggregated node) ─────────────────────────────────────────
network:
  nodes:
    system:
      type: producer
      assets: [boiler_main, hp_main, tes_main]
      demand:
        column: "waermebedarf_MWth"
  # No pipes → copperplate model

# ── Assets ───────────────────────────────────────────────────────────────────
assets:
  boiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 200.0
    thermal_efficiency: 0.90

  hp_main:
    type: heat_pump
    capacity_mw: 100.0
    min_load: 0.2
    cop_default: 3.5
    wrg_sources: [WRG1, WRG2]

  tes_main:
    type: storage
    energy_mwh: 500.0
    power_mw: 50.0

# ── Grid ─────────────────────────────────────────────────────────────────────
grid:
  gridcost_eur_mwh: 20.0

# ── Fuels ────────────────────────────────────────────────────────────────────
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0

# ── Costs ────────────────────────────────────────────────────────────────────
costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 10.0

# ── Run settings ─────────────────────────────────────────────────────────────
run:
  dt_h: 1.0
  solver: appsi_highs
