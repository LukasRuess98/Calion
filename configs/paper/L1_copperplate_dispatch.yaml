# =============================================================================
# PAPER STUDY — Level 1: Copperplate (Dispatch-Only)
# =============================================================================
# RESEARCH FOCUS: Network Topology Abstraction Impact on Operational Dispatch
#
# Level 1 represents the copperplate model — single aggregated node with
# all assets and demand combined. No network representation, zero losses.
# Provides theoretical lower bound on operational cost.
#
# OPTIMIZATION MODE: Dispatch-only (no capacity decisions)
# - All asset capacities FIXED at existing values
# - Objective: Minimize annual operational cost
# - Time horizon: 8,760 hours (full year 2023)
#
# PHYSICS:
# - COP method: Analytical LMTD (identical to L2 & L3)
#   COP[t] = η_rel × (T_sink / (T_sink - T_source[t]))
#   where η_rel = 0.6 (configurable: 0.5–0.75)
# - Network losses: ZERO (copperplate assumption)
# - Pressure drop: NOT modeled
#
# SYSTEM SUMMARY (Fixed Assets):
#   Peak demand:   76 MW
#   Annual demand: 517 GWh
#   Boiler:        200 MW gas, η = 0.90, FIXED
#   CHP:           20 MW (elec), FIXED
#   Heat pump:     100 MW thermal, COP = f(T_source), FIXED
#   Storage:       500 MWh energy / 50 MW power, FIXED
#   Pipes:         NONE
#   Heat losses:   0% (copperplate idealization)
#
# COMPARISON BASIS:
#   Same fixed assets and COP method as L2 & L3
#   Differs only in network representation (none here)
# =============================================================================

site:
  input_xlsx: "data/stadtbach_synthetic_2023_1week_zonal.csv"
  columns:
    datetime:  "Datum"
    price:     "strompreis_EUR_MWh"
    co2_grid:  "grid_co2_kg_MWh"
    wrg1_temp: "T_WRG1_C"    # Waste heat source 1 (°C)
    wrg2_temp: "T_WRG2_C"    # Waste heat source 2 (°C)

scenario:
  name: "L1_copperplate_dispatch"
  run_mode: PF_ONLY  # Perfect foresight (dispatch optimization)
  description: "Copperplate model: dispatch-only baseline (no network losses)"

# ── Network (single aggregated node, no losses) ────────────────────────────
network:
  # Copperplate: no physics model needed, no pipe network
  nodes:
    system:
      type: producer
      assets: [boiler_main, chp_main, hp_main, tes_main]
      demand:
        column: "waermebedarf_MWth"

  # No pipes defined for L1 (copperplate)

# ── FIXED ASSETS (Dispatch-Only) ──────────────────────────────────────────
assets:
  # ── Boiler (natural gas, 200 MW, existing) ──────────────────────────────
  boiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 200.0      # FIXED (no sizing)
    min_load: 0.1           # Allow part-load operation
    thermal_efficiency: 0.90

  # ── CHP (20 MW electric, existing) ───────────────────────────────────
  chp_main:
    type: chp
    fuel: gas
    capacity_mw: 20.0       # FIXED electrical power
    thermal_output_mw: 20.0 # Assume 1:1 heat/power ratio
    min_load: 0.3
    electrical_efficiency: 0.40
    thermal_efficiency_total: 0.80

  # ── Heat Pump (100 MW thermal, existing) ────────────────────────────────
  # COP method: Analytical LMTD
  # ─────────────────────────────────────────────────────────────────────────
  hp_main:
    type: heat_pump
    capacity_mw: 100.0      # FIXED thermal capacity
    min_load: 0.2           # Minimum part-load ratio
    # COP configuration: Analytical LMTD method
    cop_method: analytical_lmtd
    sink_temp_c: 90.0       # Supply temperature (fixed)
    source_columns: ["wrg1_temp", "wrg2_temp"]  # Read from data
    carnot_efficiency: 0.6  # Relative Carnot efficiency (configurable)
    # Fallback if source temp not available:
    cop_default: 3.0

  # ── Thermal Storage (500 MWh / 50 MW, existing) ─────────────────────────
  tes_main:
    type: storage
    energy_mwh: 500.0       # FIXED energy capacity
    power_mw: 50.0          # FIXED power rating
    min_soc: 0.05           # Minimum state of charge (5%)
    max_soc: 0.95           # Maximum state of charge (95%)
    # PWL loss model (piecewise linear, identical to L2 & L3)
    loss_type: pwl
    loss_segments: 10
    storage_loss_mwh_per_hour: 0.5  # Typical for large tank

# ── Electricity Grid ────────────────────────────────────────────────────────
grid:
  max_import_mw: 200.0          # Max grid import capacity
  max_export_mw: 200.0          # Max grid export capacity (CHP)
  gridcost_eur_mwh: 35.0        # Annual demand charge (€/MW/year)

# ── Fuels ───────────────────────────────────────────────────────────────────
fuels:
  gas:
    price_eur_mwh: 45.0         # Natural gas (€/MWh fuel)
    ef_kg_per_mwh_fuel: 200.0   # CO2 emission factor (kg/MWh)

# ── Costs ───────────────────────────────────────────────────────────────────
costs:
  co2_price_eur_per_t: 100.0    # CO2 price (€/ton)
  dump_cost_eur_per_mwh_th: 10.0  # Penalty for unused heat

# ── Run Settings ────────────────────────────────────────────────────────────
run:
  dt_h: 1.0                 # 1-hour timesteps (8,760 for full year)
  solver: appsi_highs       # HiGHS MILP solver
  mip_gap: 0.0001           # 0.01% MIP gap tolerance (paper runs)
  time_limit_s: 3600        # 1-hour max solve time

# ── Notes ───────────────────────────────────────────────────────────────────
# 1. DISPATCH-ONLY: All asset capacities are fixed. Optimization decides only
#    on hourly dispatch (on/off decisions, load levels, storage charge/discharge).
#
# 2. IDENTICAL COP: Same analytical LMTD method as L2 & L3, ensuring COP
#    time series is identical across all three topology levels. Topology
#    becomes the sole experimental variable.
#
# 3. ZERO LOSSES: Copperplate assumes perfect efficiency (no network losses).
#    L1 result = lower bound on cost. Difference from L2/L3 = cost of losses.
#
# 4. OPTIMIZATION HORIZON: Full year (8,760 hours) for annual cost assessment.
#    Dispatch decisions optimize fuel consumption, electricity trading, and
#    storage cycling across seasonal demand variation.
