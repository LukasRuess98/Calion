    # ── West branch ───────────────────────────────────────────────────────────
    west_to_z18:
      from: j_west
      to: zone_18
      length_m: 300
      diameter_mm: 200
    west_to_z19:
      from: j_west
      to: zone_19
      length_m: 400
      diameter_mm: 200
    west_to_z20:
      from: j_west
      to: zone_20
      length_m: 350
      diameter_mm: 150
    west_to_z21:
      from: j_west
      to: zone_21
      length_m: 500
      diameter_mm: 150
    west_to_z22:
      from: j_west
      to: zone_22
      length_m: 550
      diameter_mm: 150
    west_to_z23:
      from: j_west
      to: zone_23
      length_m: 600
      diameter_mm: 150

# ── Assets ────────────────────────────────────────────────────────────────────
assets:
  boiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 200.0
    thermal_efficiency: 0.90

  hp_main:
    type: heat_pump
    capacity_mw: 100.0
    min_load: 0.2
    cop_default: 3.5
    wrg_sources: [WRG1, WRG2]

  tes_main:
    type: storage
    energy_mwh: 500.0
    power_mw: 50.0

# ── Grid ──────────────────────────────────────────────────────────────────────
grid:
  gridcost_eur_mwh: 20.0

# ── Fuels ─────────────────────────────────────────────────────────────────────
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0

# ── Costs ─────────────────────────────────────────────────────────────────────
costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 10.0

# ── Run settings ──────────────────────────────────────────────────────────────
run:
  dt_h: 1.0
  solver: appsi_highs
