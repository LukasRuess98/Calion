# =============================================================================
# PAPER STUDY — Level 3: 30-node network
# =============================================================================
# Star-of-stars topology: one main plant → central junction → 4 branch junctions
# → 23 consumer zones (total 30 nodes, 22 pipes).
#
# Demand split (fractions sum to 1.0):
#   North branch  (zones 01–05):  23 %   South branch (zones 06–11): 26 %
#   East branch   (zones 12–17):  25 %   West branch  (zones 18–23): 26 %
#
# Identical assets and economic parameters to L1 and L2.
# Only the network representation differs across the three levels.
#
# System summary:
#   Peak demand:   ~76 MW (from Import_Data.csv)
#   Boiler:        200 MW gas, η = 0.90
#   Heat pump:     100 MW, COP = 3.5 (WRG sources 1+2) — located at plant
#   Storage:       500 MWh / 50 MW — located at plant
#   Pipes:         22 pipes, total length ~14 250 m
#   Heat losses:   modelled (U = 0.15 W/(m·K), Ts = 90 °C, Tr = 55 °C, Tg = 10 °C)
# =============================================================================

site:
  input_xlsx: "data/Import_Data_yearly.csv"
  columns:
    datetime:  "Datum"
    price:     "strompreis_EUR_MWh"
    co2_grid:  "grid_co2_kg_MWh"

scenario:
  run_mode: PF_ONLY

# ── Network ───────────────────────────────────────────────────────────────────
network:
  physics:
    heat_loss: true
    pressure_drop: true
    transport_delay: false
  supply_temp_c: 90
  return_temp_c: 55
  ground_temp_c: 10

  nodes:
    # ── Production ────────────────────────────────────────────────────────────
    plant_main:
      type: producer
      assets: [boiler_main, hp_main, tes_main]

    # ── Junctions ─────────────────────────────────────────────────────────────
    j_central:
      type: junction
    j_north:
      type: junction
    j_south:
      type: junction
    j_east:
      type: junction
    j_west:
      type: junction

    # ── North branch consumers — 23 % of total demand ─────────────────────────
    zone_01:
      type: consumer
      demand_fraction: 0.06
      demand:
        column: "waermebedarf_MWth"
    zone_02:
      type: consumer
      demand_fraction: 0.05
      demand:
        column: "waermebedarf_MWth"
    zone_03:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_04:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_05:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"

    # ── South branch consumers — 26 % of total demand ─────────────────────────
    zone_06:
      type: consumer
      demand_fraction: 0.06
      demand:
        column: "waermebedarf_MWth"
    zone_07:
      type: consumer
      demand_fraction: 0.05
      demand:
        column: "waermebedarf_MWth"
    zone_08:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_09:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_10:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_11:
      type: consumer
      demand_fraction: 0.03
      demand:
        column: "waermebedarf_MWth"

    # ── East branch consumers — 25 % of total demand ──────────────────────────
    zone_12:
      type: consumer
      demand_fraction: 0.06
      demand:
        column: "waermebedarf_MWth"
    zone_13:
      type: consumer
      demand_fraction: 0.05
      demand:
        column: "waermebedarf_MWth"
    zone_14:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_15:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_16:
      type: consumer
      demand_fraction: 0.03
      demand:
        column: "waermebedarf_MWth"
    zone_17:
      type: consumer
      demand_fraction: 0.03
      demand:
        column: "waermebedarf_MWth"

    # ── West branch consumers — 26 % of total demand ──────────────────────────
    zone_18:
      type: consumer
      demand_fraction: 0.06
      demand:
        column: "waermebedarf_MWth"
    zone_19:
      type: consumer
      demand_fraction: 0.05
      demand:
        column: "waermebedarf_MWth"
    zone_20:
      type: consumer
      demand_fraction: 0.05
      demand:
        column: "waermebedarf_MWth"
    zone_21:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_22:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_23:
      type: consumer
      demand_fraction: 0.02
      demand:
        column: "waermebedarf_MWth"

  pipes:
    # ── Trunk lines ───────────────────────────────────────────────────────────
    # plant_to_central: carries 100 % of peak ≈ 76 MW  → Ø600 (cap ~92 MW)
    plant_to_central:
      from: plant_main
      to: j_central
      length_m: 500
      diameter_mm: 600

    # central_to_north: 23 % of peak ≈ 17.5 MW  → Ø400 (cap ~41 MW, ×2.3 margin)
    central_to_north:
      from: j_central
      to: j_north
      length_m: 800
      diameter_mm: 400

    # central_to_south: 26 % of peak ≈ 19.8 MW  → Ø400 (cap ~41 MW)
    central_to_south:
      from: j_central
      to: j_south
      length_m: 1000
      diameter_mm: 400

    # central_to_east: 25 % of peak ≈ 19.0 MW  → Ø350 (cap ~31 MW)
    central_to_east:
      from: j_central
      to: j_east
      length_m: 600
      diameter_mm: 350

    # central_to_west: 26 % of peak ≈ 19.8 MW  → Ø350 (cap ~31 MW)
    central_to_west:
      from: j_central
      to: j_west
      length_m: 700
      diameter_mm: 350

    # ── North branch ──────────────────────────────────────────────────────────
    north_to_z01:
      from: j_north
      to: zone_01
      length_m: 300
      diameter_mm: 200
    north_to_z02:
      from: j_north
      to: zone_02
      length_m: 450
      diameter_mm: 200
    north_to_z03:
      from: j_north
      to: zone_03
      length_m: 600
      diameter_mm: 150
    north_to_z04:
      from: j_north
      to: zone_04
      length_m: 500
      diameter_mm: 150
    north_to_z05:
      from: j_north
      to: zone_05
      length_m: 700
      diameter_mm: 150

    # ── South branch ──────────────────────────────────────────────────────────
    south_to_z06:
      from: j_south
      to: zone_06
      length_m: 400
      diameter_mm: 200
    south_to_z07:
      from: j_south
      to: zone_07
      length_m: 350
      diameter_mm: 200
    south_to_z08:
      from: j_south
      to: zone_08
      length_m: 500
      diameter_mm: 150
    south_to_z09:
      from: j_south
      to: zone_09
      length_m: 600
      diameter_mm: 150
    south_to_z10:
      from: j_south
      to: zone_10
      length_m: 450
      diameter_mm: 150
    south_to_z11:
      from: j_south
      to: zone_11
      length_m: 550
      diameter_mm: 150

    # ── East branch ───────────────────────────────────────────────────────────
    east_to_z12:
      from: j_east
      to: zone_12
      length_m: 250
      diameter_mm: 200
    east_to_z13:
      from: j_east
      to: zone_13
      length_m: 400
      diameter_mm: 200
    east_to_z14:
      from: j_east
      to: zone_14
      length_m: 350
      diameter_mm: 150
    east_to_z15:
      from: j_east
      to: zone_15
      length_m: 500
      diameter_mm: 150
    east_to_z16:
      from: j_east
      to: zone_16
      length_m: 600
