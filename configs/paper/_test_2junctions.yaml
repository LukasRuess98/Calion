site:
  input_xlsx: "data/stadtbach_synthetic_2023_1week_zonal.csv"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"
    wrg1_temp: "T_WRG1_C"
    wrg2_temp: "T_WRG2_C"

scenario:
  name: "test_2junctions"
  run_mode: PF_ONLY

network:
  physics:
    heat_loss: false
    pressure_drop: false
    transport_delay: false
  supply_temp_c: 90.0
  return_temp_c: 55.0
  ground_temp_c: 10.0

  nodes:
    plant:
      type: producer
      assets:
        - boiler_main
        - hp_main
        - tes_main
    j_central:
      type: junction
    j_north:
      type: junction
    zone_01:
      type: consumer
      demand:
        column: "zone_01_demand_MWth"

  pipes:
    plant_to_central:
      from: plant
      to: j_central
      length_m: 3200
      diameter_mm: 500
    central_to_north:
      from: j_central
      to: j_north
      length_m: 850
      diameter_mm: 350
    j_north_to_z1:
      from: j_north
      to: zone_01
      length_m: 200
      diameter_mm: 300

assets:
  boiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 200.0
    min_load: 0.1
    thermal_efficiency: 0.90
  hp_main:
    type: heat_pump
    capacity_mw: 100.0
    min_load: 0.2
    cop_method: analytical_lmtd
    sink_temp_c: 90.0
    source_columns:
      - wrg1_temp
      - wrg2_temp
    carnot_efficiency: 0.6
    cop_default: 3.0
  tes_main:
    type: storage
    energy_mwh: 500.0
    power_mw: 50.0
    min_soc: 0.05
    max_soc: 0.95
    loss_type: pwl
    loss_segments: 10
    storage_loss_mwh_per_hour: 0.5

grid:
  max_import_mw: 200.0
  max_export_mw: 200.0
  gridcost_eur_mwh: 35.0

fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0

costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 10.0

run:
  dt_h: 1.0
  solver: appsi_highs
