# =============================================================================
# PAPER STUDY — Level 2: 5-node network
# =============================================================================
# One producer node (plant) feeds three consumer zones through four pipes.
# Steady-state heat loss and pressure drop are modelled.
#
# Topology:
#   plant ──(1200 m, Ø500)──► j1 ──(2500 m, Ø350)──► north    (30 % demand)
#                                  └──(1800 m, Ø350)──► south    (40 % demand)
#   plant ──(800 m,  Ø350)──────────────────────────► industrial(30 % demand)
#
# Identical assets and economic parameters to L1 and L3.
# Only the network representation differs across the three levels.
#
# System summary:
#   Peak demand:   ~76 MW (from Import_Data.csv)
#   Boiler:        200 MW gas, η = 0.90
#   Heat pump:     100 MW, COP = 3.5 (WRG sources 1+2) — located at plant
#   Storage:       500 MWh / 50 MW — located at plant
#   Pipes:         4 pipes, total length 6 300 m
#   Heat losses:   modelled (U = 0.15 W/(m·K), Ts = 90 °C, Tr = 55 °C, Tg = 10 °C)
# =============================================================================

site:
  input_xlsx: "data/Import_Data_january.csv"
  columns:
    datetime:  "Datum"
    price:     "strompreis_EUR_MWh"
    co2_grid:  "grid_co2_kg_MWh"

scenario:
  run_mode: PF_ONLY

# ── Network ───────────────────────────────────────────────────────────────────
network:
  physics:
    heat_loss: true
    pressure_drop: true
    transport_delay: false
  supply_temp_c: 90
  return_temp_c: 55
  ground_temp_c: 10

  nodes:
    plant:
      type: producer
      assets: [boiler_main, hp_main, tes_main]

    junction_1:
      type: junction

    north:
      type: consumer
      demand_fraction: 0.30
      demand:
        column: "waermebedarf_MWth"

    south:
      type: consumer
      demand_fraction: 0.40
      demand:
        column: "waermebedarf_MWth"

    industrial:
      type: consumer
      demand_fraction: 0.30
      demand:
        column: "waermebedarf_MWth"

  pipes:
    # Trunk: plant → junction (sized for 100 % of peak demand + 20 % margin)
    plant_to_j1:
      from: plant
      to: junction_1
      length_m: 1200
      diameter_mm: 500      # capacity ~91 MW  ≥ 76 MW × 1.2

    # North branch: ~30 % of peak ≈ 22.8 MW
    j1_to_north:
      from: junction_1
      to: north
      length_m: 2500
      diameter_mm: 350      # capacity ~40 MW  ≥ 22.8 MW × 1.2

    # South branch: ~40 % of peak ≈ 30.4 MW
    j1_to_south:
      from: junction_1
      to: south
      length_m: 1800
      diameter_mm: 350      # capacity ~40 MW  ≥ 30.4 MW × 1.2

    # Industrial spur: ~30 % of peak ≈ 22.8 MW — direct from plant
    plant_to_industrial:
      from: plant
      to: industrial
      length_m: 800
      diameter_mm: 350      # capacity ~40 MW  ≥ 22.8 MW × 1.2

# ── Assets ────────────────────────────────────────────────────────────────────
assets:
  boiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 200.0
    thermal_efficiency: 0.90

  hp_main:
    type: heat_pump
    capacity_mw: 100.0
    min_load: 0.2
    cop_default: 3.5
    wrg_sources: [WRG1, WRG2]

  tes_main:
    type: storage
    energy_mwh: 500.0
    power_mw: 50.0

# ── Grid ──────────────────────────────────────────────────────────────────────
grid:
  gridcost_eur_mwh: 20.0

# ── Fuels ─────────────────────────────────────────────────────────────────────
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0

# ── Costs ─────────────────────────────────────────────────────────────────────
costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 10.0

# ── Run settings ──────────────────────────────────────────────────────────────
run:
  dt_h: 1.0
  solver: appsi_highs
