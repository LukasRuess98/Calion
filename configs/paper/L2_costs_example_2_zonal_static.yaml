# =============================================================================
# EXAMPLE 2: Global + Zone-Specific Static Costs (Recommended)
# =============================================================================
# Different zones pay different network fees (static, in YAML).
# Use this for realistic multi-zone scenarios with fixed tariffs.
#
# Structure:
#   costs_config:
#     global: {...}           ← Standard/fallback for all zones
#     zones: {...}            ← Zone-specific overrides
#
# Precedence: Zone (if defined) > Global (fallback)
# =============================================================================

site:
  input_xlsx: "data/Import_Data_yearly_zones.csv"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  name: "L2_zonal_costs_static"
  run_mode: PF_ONLY
  description: "Multi-zone with zone-specific static fees"

network:
  physics:
    heat_loss: true
  supply_temp_c: 90.0
  return_temp_c: 55.0
  ground_temp_c: 10.0

  nodes:
    # Plant (central production)
    plant_main:
      type: producer
      assets: [boiler_main, chp_main, hp_main, tes_main]

    # Central junction (cheap)
    j_central:
      type: junction

    # North junction (medium)
    j_north:
      type: junction

    # South junction (expensive - peripheral)
    j_south:
      type: junction

    # Consumer zones
    zone_01:
      type: consumer
      demand:
        column: "zone_01_demand_MWth"

    zone_02:
      type: consumer
      demand:
        column: "zone_02_demand_MWth"

    zone_03:
      type: consumer
      demand:
        column: "zone_03_demand_MWth"

assets:
  boiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 200.0
    min_load: 0.1
    thermal_efficiency: 0.90

  chp_main:
    type: chp
    fuel: gas
    capacity_mw: 20.0
    thermal_output_mw: 20.0
    min_load: 0.3

  hp_main:
    type: heat_pump
    capacity_mw: 100.0
    cop_default: 3.0

  tes_main:
    type: storage
    energy_mwh: 500.0
    power_mw: 50.0

# ════════════════════════════════════════════════════════════════════════════
# KOSTENKONFIGURATION — VARIANTE 2: GLOBAL + ZONE-SPEZIFISCH (STATISCH)
# ════════════════════════════════════════════════════════════════════════════

costs_config:
  # 1. GLOBALE STANDARDKOSTEN (Fallback für alle Zonen)
  # ─────────────────────────────────────────────────────────────────────────
  global:
    # Wenn eine Zone NICHT in 'zones' definiert ist, nutzt sie diese Werte
    demand_charge_eur_per_mw_y: 50000.0      # €50k/MW/Jahr Standard
    energy_fee_eur_per_mwh: 5.0              # €5/MWh Grid Fee
    electricity_markup_eur_per_mwh: 2.0      # +€2/MWh Aufschlag

  # 2. ZONE-SPEZIFISCHE OVERRIDES (optional)
  # ─────────────────────────────────────────────────────────────────────────
  zones:
    # Zone: PLANT (zentral, KEINE Netzgebühren)
    plant_main:
      type: "central_plant"
      demand_charge_eur_per_mw_y: 0.0        # ← Kein Netzentgelt für Zentrale!
      energy_fee_eur_per_mwh: 0.0            # ← Keine Gebühren für Producer
      electricity_markup_eur_per_mwh: 0.0

    # Zone: CENTRAL JUNCTION (mittlere Kosten)
    j_central:
      type: "central_junction"
      demand_charge_eur_per_mw_y: 30000.0    # ← Günstiger (zentral)
      # energy_fee nicht definiert → nutzt global (5.0)

    # Zone: NORTH JUNCTION (Standard)
    j_north:
      type: "standard"
      # Alle Kosten nicht definiert → nutzen alle global
      # demand_charge: 50000.0 (global)
      # energy_fee: 5.0 (global)

    # Zone: SOUTH JUNCTION (hohe Kosten, peripherie)
    j_south:
      type: "peripheral"
      demand_charge_eur_per_mw_y: 70000.0    # ← Teurer (weit weg)
      electricity_markup_eur_per_mwh: 3.5    # ← Extra Aufschlag

    # Zone: CONSUMER 01 (nutzt zentral = günstig)
    zone_01:
      type: "consumer_central"
      demand_charge_eur_per_mw_y: 30000.0    # ← Zentral angebunden

    # Zone: CONSUMER 02 (alles global)
    zone_02:
      type: "consumer_standard"
      # Fallback zu global alles

    # Zone: CONSUMER 03 (peripherie = teuer)
    zone_03:
      type: "consumer_peripheral"
      demand_charge_eur_per_mw_y: 70000.0

grid:
  max_import_mw: 200.0
  max_export_mw: 200.0
  demand_charge_eur_per_mw_y: 50000.0       # ← Wird überschrieben, wenn costs_config vorhanden

fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0

costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 10.0

run:
  dt_h: 1.0
  solver: appsi_highs
  mip_gap: 0.01
  time_limit_s: 3600

# ════════════════════════════════════════════════════════════════════════════
# ERKLÄRUNG VARIANTE 2
# ════════════════════════════════════════════════════════════════════════════
#
# WANN NUTZEN:
#  ✓ Multi-Zone Szenarien mit festen Tarifen
#  ✓ Unterschiedliche Netzgebühren zentral vs. peripherie
#  ✓ Realistische Tarifmodelle
#
# WAS PASSIERT:
#  1. CostResolver wird ERSTELLT
#  2. Für jede Zone wird checekt: Zone-Costs definiert?
#  3. Wenn ja → nutze Zone-Override
#  4. Wenn nein → nutze Global-Standard
#
# HIERARCHIE FÜR JEDE ZONE:
#
#   plant_main:
#     ├─ demand_charge: 0.0 (Zone-Override)       ← WIRD VERWENDET
#
#   j_central:
#     ├─ demand_charge: 30000.0 (Zone-Override)   ← WIRD VERWENDET
#     └─ energy_fee: 5.0 (Global)                 ← WIRD VERWENDET
#
#   j_north:
#     ├─ demand_charge: 50000.0 (Global)          ← WIRD VERWENDET
#     └─ energy_fee: 5.0 (Global)                 ← WIRD VERWENDET
#
#   z_south:
#     ├─ demand_charge: 70000.0 (Zone-Override)   ← WIRD VERWENDET
#     └─ electricity_markup: 3.5 (Zone-Override)  ← WIRD VERWENDET
#
# AUSGABE (beispiel):
#  {
#    "objective": {...},
#    "zones": {
#      "plant_main": {
#        "demand_charge_eur_per_mw_y": 0.0,
#        "energy_fee_eur_per_mwh": 0.0,
#        "peak_power_mw": 0.0,
#        "cost_demand_charge_eur": 0.0
#      },
#      "j_central": {
#        "demand_charge_eur_per_mw_y": 30000.0,
#        "energy_fee_eur_per_mwh": 5.0,
#        "peak_power_mw": 65.3,
#        "cost_demand_charge_eur": 1959000.0      ← 65.3 MW × 30k €/MW
#      },
#      "j_south": {
#        "demand_charge_eur_per_mw_y": 70000.0,
#        "peak_power_mw": 70.1,
#        "cost_demand_charge_eur": 4907000.0      ← 70.1 MW × 70k €/MW
#      }
#    }
#  }
#
# ════════════════════════════════════════════════════════════════════════════
