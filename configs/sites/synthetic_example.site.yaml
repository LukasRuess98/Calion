site:
  input_base_dir: data/synthetic_site
  input_xlsx: synthetic_load_profile.csv
  sheet_name: null
  tz: Europe/Berlin
  input_time_is_local: true
  ambiguous_policy: first
  duplicate_strategy: drop_first
  gap_strategy: ffill
  year_target: 2023
  columns:
    price_candidates:
      - "Day_Ahead_Price €/MWh"
      - "Day Ahead Price €/MWh"
      - "strompreis"
    heat_candidates:
      - "Wärmebedarf MW"
      - "Waermebedarf MW"
      - "waermebedarf"
    co2_candidates:
      - "CO2_consumption_based kgCO2/MWh"
      - "co2_intensity_kgco2_mwh"
      - "co2 kgco2/mwh"
    wrg1_q_candidates: ["WRG1Q MW", "WRG1 Q MW", "WRG1_Q MW", "WRG1_Q MW_th", "wrg1qmw"]
    wrg1_t_candidates: ["WRG1_T °C", "WRG1 T °C", "wrg1 temp c"]
