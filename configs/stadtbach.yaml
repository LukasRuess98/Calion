# =============================================================================
# ENERGIS - VOLLSTÄNDIGE KONFIGURATION
# =============================================================================
# Einzelne Konfigurationsdatei für Fernwärme-Optimierung
# Verwendung: python -m energis.run configs/stadtbach.yaml
# =============================================================================

# =============================================================================
# SZENARIO
# =============================================================================
scenario:
  title: "Stadtbach District Heating"
  tag: "stadtbach"
  workflow: [PF]
  fix_design: true
  horizon:
    type: "date_range"
    start: "2023-01-01 00:00"
    end: "2023-01-07 23:00"
    enforce: false

# =============================================================================
# DATENQUELLE
# =============================================================================
data_file: Import_Data.xlsx

site:
  input_file: Import_Data.xlsx
  year_target: 2023
  tz: Europe/Berlin
  columns:
    price_candidates: [Day_Ahead_Price, "Day_Ahead_Price €/MWh", strompreis]
    heat_candidates: [Waermebedarf_MW, "Wärmebedarf MW", waermebedarf]
    co2_candidates: [CO2_consumption_based, "CO2_consumption_based kgCO2/MWh", co2]
    wrg1_q_candidates: ["WRG1Q MW", "WRG1_Q MW"]
    wrg1_t_candidates: ["WRG1_T °C", "WRG1 T °C"]
    wrg2_q_candidates: ["WRG2Q MW", "WRG2_Q MW"]
    wrg2_t_candidates: ["WRG2_T °C", "WRG2 T °C"]
    wrg3_q_candidates: ["WRG3Q MW", "WRG3_Q MW"]
    wrg3_t_candidates: ["WRG3_T °C", "WRG3 T °C"]
    wrg4_q_candidates: ["WRG4Q MW", "WRG4_Q MW"]
    wrg4_t_candidates: ["WRG4_T °C", "WRG4 T °C"]

# =============================================================================
# SOLVER
# =============================================================================
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    Threads: 0
    MIPGap: 0.01
    TimeLimit: 3600

# =============================================================================
# NETZ & KOSTEN
# =============================================================================
grid:
  energy_fee_eur_mwh: 0.0
  demand_charge_eur_per_mw_y: 127240.0
  gridcost_eur_mwh: 61.6
  max_import_mw: 200.0
  max_export_mw: 100.0

costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 1.0

# =============================================================================
# BRENNSTOFFE
# =============================================================================
fuels:
  gas:
    price_eur_mwh: 58.6
    ef_kg_per_mwh_fuel: 201.6
  biomass:
    price_eur_mwh: 20.0
    ef_kg_per_mwh_fuel: 0.0
  waste:
    price_eur_mwh: 10.0
    ef_kg_per_mwh_fuel: 0.0

# =============================================================================
# GENERATOREN (Technische Parameter)
# =============================================================================
generators:
  hkw:
    th_eff: 0.743
    el_eff: 0.177
    fuel_bus: gas
  gtost:
    th_eff: 0.466
    el_eff: 0.36
    fuel_bus: gas
  bmhkw:
    th_eff: 0.485
    el_eff: 0.177
    fuel_bus: biomass
  hws:
    th_eff: 0.936
    fuel_bus: gas
  hww:
    th_eff: 0.924
    fuel_bus: gas
  ava:
    th_eff: 1.0
    fuel_bus: waste
  p2h:
    el_to_th_eff: 0.99

# =============================================================================
# WÄRMEPUMPEN (Technische Defaults)
# =============================================================================
heat_pumps:
  cop:
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 1.67
    sink_defaults:
      Tsink_out_K: 363.15
      Tsink_in_K: 343.15
  types:
    standard:
      eta: 0.75
      FQ: 0.10
      min_load: 0.30

# =============================================================================
# SYSTEM - ANLAGENKONFIGURATION
# =============================================================================
# Alle Kapazitäten und Investitionsparameter an EINER Stelle pro Anlage
# =============================================================================

system:
  # ---------------------------------------------------------------------------
  # WÄRMEPUMPEN
  # ---------------------------------------------------------------------------
  heat_pumps:
    - id: HP1
      enabled: true
      type: standard
      wrg_source_column: WRG1_T_K
      wrg_capacity_column: WRG1_Q_cap
      capacity_mw: 50.0
      investment:
        enabled: true
        min_mw: 5.0
        max_mw: 100.0
        capex_eur_per_mw: 400000
        activation_cost_eur: 250000
        lifetime_years: 15

    - id: HP2
      enabled: true
      type: standard
      wrg_source_column: WRG2_T_K
      wrg_capacity_column: WRG2_Q_cap
      capacity_mw: 50.0
      investment:
        enabled: true
        min_mw: 5.0
        max_mw: 100.0
        capex_eur_per_mw: 400000
        activation_cost_eur: 250000
        lifetime_years: 15

    - id: HP3
      enabled: true
      type: standard
      wrg_source_column: WRG3_T_K
      wrg_capacity_column: WRG3_Q_cap
      capacity_mw: 50.0
      investment:
        enabled: true
        min_mw: 5.0
        max_mw: 100.0
        capex_eur_per_mw: 400000
        activation_cost_eur: 250000
        lifetime_years: 15

    - id: HP4
      enabled: true
      type: standard
      wrg_source_column: WRG4_T_K
      wrg_capacity_column: WRG4_Q_cap
      capacity_mw: 50.0
      investment:
        enabled: true
        min_mw: 5.0
        max_mw: 100.0
        capex_eur_per_mw: 400000
        activation_cost_eur: 250000
        lifetime_years: 15

  # ---------------------------------------------------------------------------
  # SPEICHER
  # ---------------------------------------------------------------------------
  storage:
    enabled: true
    energy_mwh: 500.0
    power_mw: 50.0
    soc0_mwh: 500.0
    investment:
      enabled: true
      min_energy_mwh: 100.0
      max_energy_mwh: 5000.0
      min_power_mw: 10.0              # Minimum 10 MW wenn gebaut
      max_power_mw: 200.0
      energy_capex_eur_per_mwh: 5000  # CAPEX pro MWh Kapazität
      power_capex_eur_per_mw: 50000   # CAPEX pro MW Leistung
      activation_cost_eur: 50000      # Fixkosten bei Bau
      lifetime_years: 20

  # ---------------------------------------------------------------------------
  # GENERATOREN (Kapazitäten)
  # ---------------------------------------------------------------------------
  generators:
    hkw:
      enabled: true
      cap_th_mw: 75.0
    gtost:
      enabled: true
      cap_th_mw: 41.3
    p2h:
      enabled: true
      cap_th_mw: 10.0
    bmhkw:
      enabled: true
      cap_th_mw: 15.0
    hws:
      enabled: true
      cap_th_mw: 45.0
    hww:
      enabled: true
      cap_th_mw: 45.0
    ava:
      enabled: true
      cap_th_mw: 45.0

# =============================================================================
# THERMISCHES NETZWERK
# =============================================================================
thermal_network:
  enabled: true
  topology_file: configs/networks/brownfield.yaml
