# =============================================================================
# SYSTEM: FULL (All Technologies)
# =============================================================================
# Existing generators + heat pumps + thermal storage
# Maximum flexibility for optimization
# =============================================================================

system:
  # All 4 heat pumps with WRG sources
  heat_pumps:
    - id: HP1
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG1_T_K
      wrg_capacity_column: WRG1_Q_MW
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

    - id: HP2
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG2_T_K
      wrg_capacity_column: WRG2_Q_MW
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

    - id: HP3
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG3_T_K
      wrg_capacity_column: WRG3_Q_MW
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

    - id: HP4
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG4_T_K
      wrg_capacity_column: WRG4_Q_MW
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

  # Thermal storage with investment
  storage:
    enabled: true
    energy_mwh: 500.0
    power_mw: 50.0
    soc0_mwh: 500.0
    investment:
      enabled: true
      min_energy_mwh: 100.0
      max_energy_mwh: 5000.0
      min_power_mw: 10.0
      max_power_mw: 200.0
      initial_energy_capacity_mwh: 500.0
      energy_capex_eur_per_mwh: 5000.0
      power_capex_eur_per_mw: 50000.0
      activation_cost_eur: 50000.0
      lifetime_years: 20
