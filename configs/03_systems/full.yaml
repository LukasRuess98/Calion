# =============================================================================
# SYSTEM: FULL (All Technologies)
# =============================================================================
# Existing generators + heat pumps + thermal storage
# Maximum flexibility for optimization
#
# NOTE: This file defines WHAT is in the system and technical limits.
# The scenario config (04_scenarios) defines WHAT gets optimized.
# =============================================================================

system:
  # ═══════════════════════════════════════════════════════════════════════════
  # HEAT PUMPS - All 4 WRG sources
  # ═══════════════════════════════════════════════════════════════════════════
  heat_pumps:
    - id: HP1
      enabled: true
      wrg_source_column: "WRG1_ T °C"
      wrg_capacity_column: "WRG1Q MW"
      # Technical limits (physical/engineering constraints)
      technical_limits:
        capacity_min_mw: 5.0        # Minimum if built
        capacity_max_mw: 100.0      # Maximum possible
      # Default values (used when not optimizing)
      defaults:
        capacity_mw: 50.0
        build: true
      # Investment optimization
      investment:
        enabled: true
        capex_eur_per_mw: 400000.0
        activation_cost_eur: 250000.0
        lifetime_years: 15

    - id: HP2
      enabled: true
      wrg_source_column: "WRG2_T °C"
      wrg_capacity_column: "WRG2Q MW"
      technical_limits:
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
      defaults:
        capacity_mw: 50.0
        build: true
      investment:
        enabled: true
        capex_eur_per_mw: 400000.0
        activation_cost_eur: 250000.0
        lifetime_years: 15

    - id: HP3
      enabled: true
      wrg_source_column: "WRG3_T °C"
      wrg_capacity_column: "WRG3Q MW"
      technical_limits:
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
      defaults:
        capacity_mw: 50.0
        build: true
      investment:
        enabled: true
        capex_eur_per_mw: 400000.0
        activation_cost_eur: 250000.0
        lifetime_years: 15

    - id: HP4
      enabled: true
      wrg_source_column: "WRG4_T °C"
      wrg_capacity_column: "WRG4Q MW"
      technical_limits:
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
      defaults:
        capacity_mw: 50.0
        build: true
      investment:
        enabled: true
        capex_eur_per_mw: 400000.0
        activation_cost_eur: 250000.0
        lifetime_years: 15

  # ═══════════════════════════════════════════════════════════════════════════
  # THERMAL STORAGE
  # ═══════════════════════════════════════════════════════════════════════════
  storage:
    enabled: true
    # Initial state
    soc0_mwh: 500.0
    # Technical limits
    technical_limits:
      energy_min_mwh: 100.0
      energy_max_mwh: 10000.0
      power_min_mw: 10.0
      power_max_mw: 200.0
    # Default values
    defaults:
      energy_mwh: 500.0
      power_mw: 50.0
      build: true
    # Investment optimization
    investment:
      enabled: true
      energy_capex_eur_per_mwh: 5000.0
      power_capex_eur_per_mw: 500.0
      activation_cost_eur: 50000.0
      lifetime_years: 20

  # ═══════════════════════════════════════════════════════════════════════════
  # THERMAL NETWORK
  # ═══════════════════════════════════════════════════════════════════════════
  thermal_network:
    enabled: false  # Override in preset (rh_with_network.yaml) to enable
    brownfield_mode: true
    topology_file: configs/05_networks/brownfield.yaml

    # Technical limits (hydraulic constraints)
    technical_limits:
      max_velocity_m_s: 2.5
      max_pressure_bar: 25.0
      min_pressure_bar: 2.0

    # Default operating parameters
    defaults:
      supply_temp_c: 120
      return_temp_c: 55
      ground_temp_c: 10

    # Cost parameters (for greenfield/investment optimization)
    costs:
      pipe_capex_eur_per_m: 500.0           # Average pipe installation cost
      pump_capex_eur_per_kw: 1000.0         # Pump investment cost
      heat_loss_cost_eur_per_mwh: 50.0      # Penalty for network losses
      lifetime_years: 40
