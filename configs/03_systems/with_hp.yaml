# =============================================================================
# SYSTEM: WITH HEAT PUMPS
# =============================================================================
# Existing generators + 4 heat pumps using WRG sources
# =============================================================================

system:
  # Heat pumps with WRG (Waste Heat Recovery) sources
  heat_pumps:
    - id: HP1
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG1_T_K             # Temperature data
      wrg_capacity_column: WRG1_Q_MW          # Capacity data (✅ corrected)
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

    - id: HP2
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG2_T_K
      wrg_capacity_column: WRG2_Q_MW
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

    - id: HP3
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG3_T_K
      wrg_capacity_column: WRG3_Q_MW
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

    - id: HP4
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG4_T_K
      wrg_capacity_column: WRG4_Q_MW
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

  # No storage in this system configuration
  storage:
    enabled: false
