# =============================================================================
# SYSTEM: WITH_HP
# =============================================================================
# Hybrid-System: Bestands-Generatoren + Wärmepumpen (ohne Speicher)
#
# HIER DEFINIERT (System-spezifisch):
#   - Welche Komponenten aktiv sind (enabled)
#   - Konkrete Kapazitäten (capacity_mw)
#   - WRG-Spaltenzuordnungen
#
# NICHT HIER:
#   - COP-Tabellen, Effizienzen → 01_tech/heat_pumps.yaml
#   - Bestands-Generatoren → 02_site/stadtbach/assets.yaml
#   - Zeitraum → 04_scenarios/
# =============================================================================

system:
  # ═══════════════════════════════════════════════════════════════════════════
  # WÄRMEPUMPEN
  # ═══════════════════════════════════════════════════════════════════════════
  # 4 Wärmepumpen mit je 50 MW (gesamt: 200 MW thermisch)
  # Diese können zusammen mit den Bestands-Generatoren betrieben werden
  # ───────────────────────────────────────────────────────────────────────────
  heat_pumps:
    - id: HP1
      enabled: true
      type: standard
      wrg_source_column: "WRG1_T_K"
      wrg_capacity_column: "WRG1_Q_cap"
      capacity_mw: 50.0
      build: true

    - id: HP2
      enabled: true
      type: standard
      wrg_source_column: "WRG2_T_K"
      wrg_capacity_column: "WRG2_Q_cap"
      capacity_mw: 50.0
      build: true

    - id: HP3
      enabled: true
      type: standard
      wrg_source_column: "WRG3_T_K"
      wrg_capacity_column: "WRG3_Q_cap"
      capacity_mw: 50.0
      build: true

    - id: HP4
      enabled: true
      type: standard
      wrg_source_column: "WRG4_T_K"
      wrg_capacity_column: "WRG4_Q_cap"
      capacity_mw: 50.0
      build: true

  # ═══════════════════════════════════════════════════════════════════════════
  # SPEICHER (deaktiviert in diesem System)
  # ═══════════════════════════════════════════════════════════════════════════
  storage:
    enabled: false

  # ═══════════════════════════════════════════════════════════════════════════
  # THERMISCHES NETZWERK (deaktiviert)
  # ═══════════════════════════════════════════════════════════════════════════
  thermal_network:
    enabled: false
