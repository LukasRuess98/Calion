# =============================================================================
# SYSTEM: BASELINE (Existing Assets Only)
# =============================================================================
# Only existing generators - no heat pumps, no storage
# Use for baseline scenarios and quick testing
#
# NOTE: This file defines WHAT is in the system.
# The scenario config (04_scenarios) defines WHAT gets optimized.
# =============================================================================

system:
  # No heat pumps in baseline
  heat_pumps: []

  # No storage in baseline
  storage:
    enabled: false

  # No thermal network in baseline
  thermal_network:
    enabled: false
