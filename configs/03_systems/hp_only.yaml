# =============================================================================
# SYSTEM: HP_ONLY
# =============================================================================
# Rein elektrisches Wärmesystem: Nur Wärmepumpen + Speicher
#
# HIER DEFINIERT (System-spezifisch):
#   - Welche Komponenten aktiv sind (enabled)
#   - Konkrete Kapazitäten (max_th_mw, max_energy_mwh)
#   - WRG-Spaltenzuordnungen
#   - Anfangszustand Speicher (soc0_mwh)
#
# NICHT HIER:
#   - COP-Tabellen, Effizienzen → 01_tech/heat_pumps.yaml
#   - CAPEX-Raten (außer Override) → 01_tech/
#   - Zeitraum, Terminal-Policy → 04_scenarios/
# =============================================================================

system:
  # ═══════════════════════════════════════════════════════════════════════════
  # WÄRMEPUMPEN
  # ═══════════════════════════════════════════════════════════════════════════
  # 4 Wärmepumpen mit je 200 MW (gesamt: 800 MW thermisch)
  # WRG = Wärmerückgewinnung aus Abwärmequellen
  #
  # wrg_source_column: Interne Spalte für Quelltemperatur (vom Loader erstellt)
  # wrg_capacity_column: Interne Spalte für verfügbare Abwärme
  # ───────────────────────────────────────────────────────────────────────────
  heat_pumps:
    - id: HP1
      enabled: true
      type: standard                        # Typ aus 01_tech/heat_pumps.yaml
      wrg_source_column: "WRG1_T_K"         # Quelltemperatur [Kelvin]
      wrg_capacity_column: "WRG1_Q_cap"     # Verfügbare Abwärme [MW]
      max_th_mw: 200.0                      # Installierte Kapazität [MW_th]
      build: true                           # Bereits installiert (keine CAPEX)

    - id: HP2
      enabled: true
      type: standard
      wrg_source_column: "WRG2_T_K"
      wrg_capacity_column: "WRG2_Q_cap"
      max_th_mw: 200.0
      build: true

    - id: HP3
      enabled: true
      type: standard
      wrg_source_column: "WRG3_T_K"
      wrg_capacity_column: "WRG3_Q_cap"
      max_th_mw: 200.0
      build: true

    - id: HP4
      enabled: true
      type: standard
      wrg_source_column: "WRG4_T_K"
      wrg_capacity_column: "WRG4_Q_cap"
      max_th_mw: 200.0
      build: true

  # ═══════════════════════════════════════════════════════════════════════════
  # THERMISCHER SPEICHER
  # ═══════════════════════════════════════════════════════════════════════════
  # Druckloser Heißwasserspeicher
  # Effizienz und Verlustrate kommen aus 01_tech/storage.yaml
  # ───────────────────────────────────────────────────────────────────────────
  storage:
    enabled: true
    max_energy_mwh: 1000.0                  # Speicherkapazität [MWh]
    max_power_mw: 200.0                     # Max. Lade-/Entladeleistung [MW]
    soc0_mwh: 500.0                         # Anfangszustand: 50% gefüllt
    build: true                             # Bereits installiert (keine CAPEX)

  # ═══════════════════════════════════════════════════════════════════════════
  # DEAKTIVIERTE KOMPONENTEN
  # ═══════════════════════════════════════════════════════════════════════════
  thermal_network:
    enabled: false

  # Alle konventionellen Generatoren werden über das Preset deaktiviert
  # (siehe presets/HP_only.yaml → extends 02_site/stadtbach/HP_only.yaml)
