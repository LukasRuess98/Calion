# =============================================================================
# SYSTEM: WITH STORAGE
# =============================================================================
# Existing generators + thermal storage (investment optimization)
# =============================================================================

system:
  # No heat pumps (storage only scenario)
  heat_pumps: []

  # Thermal storage with investment optimization
  storage:
    enabled: true
    energy_mwh: 500.0                         # Initial capacity
    power_mw: 50.0                            # Initial power
    soc0_mwh: 500.0                           # Initial state of charge

    investment:
      enabled: true
      min_energy_mwh: 100.0                   # Min 100 MWh if built
      max_energy_mwh: 5000.0                  # Max 5 GWh
      min_power_mw: 10.0                      # Min 10 MW power
      max_power_mw: 200.0                     # Max 200 MW power
      initial_energy_capacity_mwh: 500.0      # Starting point
      energy_capex_eur_per_mwh: 5000.0
      power_capex_eur_per_mw: 50000.0
      activation_cost_eur: 50000.0            # Fixed cost
      lifetime_years: 20
