# =============================================================================
# STADTBACH SITE - INSTALLED ASSETS (BROWNFIELD)
# =============================================================================
# Existing thermal generation assets with fixed capacities
# These are already built and cannot be modified by investment optimization
# =============================================================================

system:
  generators:
    # =========================================================================
    # Combined Heat and Power (CHP)
    # =========================================================================
    hkw:
      enabled: false
      cap_th_mw: 75.0
      description: "Heizkraftwerk - Gas CHP"

    gtost:
      enabled: false
      cap_th_mw: 41.3
      description: "Gasturbine Ost - Gas CHP"

    bmhkw:
      enabled: false
      cap_th_mw: 15.0
      description: "Biomasse-Heizkraftwerk - Biomass CHP"

    # =========================================================================
    # Heat-only Boilers
    # =========================================================================
    hws:
      enabled: false
      cap_th_mw: 45.0
      description: "Heizwerk Süd - Gas Boiler"

    hww:
      enabled: false
      cap_th_mw: 45.0
      description: "Heizwerk West - Gas Boiler"

    # =========================================================================
    # Other Heat Sources
    # =========================================================================
    p2h:
      enabled: true
      cap_th_mw: 10.0
      description: "Elektrodenkessel - Power-to-Heat"

    ava:
      enabled: false
      cap_th_mw: 45.0
      description: "Abwärmenutzung AVA - Waste Heat Recovery"
