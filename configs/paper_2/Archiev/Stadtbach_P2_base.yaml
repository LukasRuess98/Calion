# =============================================================================
# PAPER 2 — Stadtbach Investment Optimization (Base Config)
# =============================================================================
# DEPRECATED REDIRECT — scenarios.yaml now points directly to:
#   configs/stadtbach/Stadtbach_topo.yaml
#
# This file is kept for backwards compatibility. All new Paper 2 SB runs
# use Stadtbach_topo.yaml (32-node swa-corrected topology, real-scale producers).
#
# Original scale (15 MW / 11 MW placeholder) replaced by real network:
#   HKW 75 MW + GT-Ost 41.3 MW + BMHKW 15 MW + HWS 45 MW + HWW 45 MW
#   Measured consumers: KUKA 3 MW + MAN 2.8 MW + Klinikum 2.6 MW + ...
#   Total peak demand: ~36 MW (measured), real winter peak ~130+ MW
# =============================================================================

site:
  input_xlsx: "data/Stadtbach/stadtbach_acron_combined.xlsx"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  name: "Stadtbach P2 Investment Optimization"
  description: "Investment optimization for WP, EK, TES on Stadtbach 15-node network"
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: "2025-01-01 00:00"
    end: "2025-12-31 23:00"

# --------------------------------------------------------------------------
# Network (15-node Stadtbach — same topology as Stadtbach L3)
# --------------------------------------------------------------------------
network:
  milp_linearize: true
  physics:
    heat_loss: true
    pressure_drop: false
    transport_delay: false

  supply_temp_c: 99.0       # overridden per scenario via heating curve
  return_temp_c: 60.0
  ground_temp_c: 10.0

  heating_curve:
    enabled: true
    T_supply_max_c: 122.0   # overridden per scenario (T_VL_max from HK stage)
    T_supply_min_c: 70.0    # overridden per scenario (T_VL_min from HK stage)
    T_outdoor_low_c: -15.0
    T_outdoor_high_c: 30.0
    # k slope applied externally by scenario_runner.py via compute_heizkurve()

  nodes:
    j_1:
      assets: [gasboiler_sb, biomass_sb, tes_sb, hp_sb, eboiler_sb]
      consumers:
        - column: "V_1_demand_MWth"
    j_2:
      consumers:
        - column: "V_2_demand_MWth"
    j_3:
      consumers:
        - column: "V_3_demand_MWth"
    j_4:
      consumers:
        - column: "V_4_demand_MWth"
        - column: "V_5_demand_MWth"
        - column: "V_6_demand_MWth"
        - column: "V_7_demand_MWth"
    j_5:
      consumers:
        - column: "V_8_demand_MWth"
        - column: "V_9_demand_MWth"
    j_6:
      consumers:
        - column: "V_10_demand_MWth"
        - column: "V_11_demand_MWth"
        - column: "V_12_demand_MWth"
    j_7:
      consumers:
        - column: "V_13_demand_MWth"
    j_8:
      consumers:
        - column: "V_14_demand_MWth"
    j_9:
      consumers:
        - column: "V_15_demand_MWth"
        - column: "V_16_demand_MWth"
    j_10:
      consumers:
        - column: "V_17_demand_MWth"
    j_11:
      consumers:
        - column: "V_18_demand_MWth"
    j_12:
      consumers:
        - column: "V_19_demand_MWth"
        - column: "V_20_demand_MWth"
        - column: "V_21_demand_MWth"
    j_13:
      consumers:
        - column: "V_22_demand_MWth"
        - column: "V_23_demand_MWth"
        - column: "V_24_demand_MWth"
    j_14:
      consumers:
        - column: "V_25_demand_MWth"
        - column: "V_26_demand_MWth"
    j_15:
      consumers:
        - column: "V_27_demand_MWth"

  pipes:
    j1_to_j2:
      from: j_1
      to: j_2
      length_m: 350
      diameter_mm: 450
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j2_to_j3:
      from: j_2
      to: j_3
      length_m: 300
      diameter_mm: 450
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j3_to_j4:
      from: j_3
      to: j_4
      length_m: 260
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j3_to_j9:
      from: j_3
      to: j_9
      length_m: 450
      diameter_mm: 350
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j4_to_j5:
      from: j_4
      to: j_5
      length_m: 240
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j5_to_j6:
      from: j_5
      to: j_6
      length_m: 150
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j5_to_j7:
      from: j_5
      to: j_7
      length_m: 220
      diameter_mm: 125
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j7_to_j8:
      from: j_7
      to: j_8
      length_m: 80
      diameter_mm: 100
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j9_to_j10:
      from: j_9
      to: j_10
      length_m: 200
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j10_to_j11:
      from: j_10
      to: j_11
      length_m: 230
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j11_to_j12:
      from: j_11
      to: j_12
      length_m: 250
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j12_to_j13:
      from: j_12
      to: j_13
      length_m: 220
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j13_to_j14:
      from: j_13
      to: j_14
      length_m: 180
      diameter_mm: 125
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j13_to_j15:
      from: j_13
      to: j_15
      length_m: 125
      diameter_mm: 100
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30

# --------------------------------------------------------------------------
# Assets — fixed (boilers) + INVESTABLE (WP, EK, TES)
# --------------------------------------------------------------------------
assets:
  gasboiler_sb:
    type: thermal_generator
    fuel: gas
    capacity_mw: 15.0           # fixed backup boiler
    thermal_efficiency: 0.92
    min_load: 0.1

  biomass_sb:
    type: thermal_generator
    fuel: biomass
    capacity_mw: 5.0            # fixed baseload
    thermal_efficiency: 0.85
    min_load: 0.1

  ek_sb:
    type: p2h
    capacity_mw: 0.0
    efficiency: 0.98
    min_load: 0.1
    investment:
      enabled: true
      capex_eur_per_mw: 150000.0    # 150 €/kW (VDI 2067)
      activation_cost_eur: 20000.0
      lifetime_years: 25.0
      capacity_min_mw: 0.0
      capacity_max_mw: 20.0

  hp_sb:
    type: heat_pump
    capacity_mw: 0.0
    min_load: 0.2
    wrg_source_column: "WRG_1_Celsius"
    wrg_capacity_column: "WRG1Q_MW"
    cop_default: 3.0
    investment:
      enabled: true
      capex_eur_per_mw: 700000.0    # 700 €/kW (VDI 2067)
      activation_cost_eur: 50000.0
      lifetime_years: 20.0
      capacity_min_mw: 0.0
      capacity_max_mw: 20.0

  tes_sb:
    type: storage
    energy_mwh: 200.0
    power_mw: 20.0
    eff_charge: 0.98
    eff_discharge: 0.98
    loss_hour: 0.9999
    soc0_mwh: 100.0
    min_energy_mwh: 10.0
    cycling_cost_eur_per_mwh: 2.0
    investment:
      enabled: true
      energy_capex_eur_per_mwh: 16500.0   # 800 €/m³ at ΔT=22K
      power_capex_eur_per_mw: 5000.0
      activation_cost_eur: 30000.0
      lifetime_years: 30.0
      energy_capacity_min_mwh: 0.0
      energy_capacity_max_mwh: 3000.0
      power_capacity_min_mw: 0.0
      power_capacity_max_mw: 100.0
    terminal:
      state: cyclic
      policy: equal

# --------------------------------------------------------------------------
# Waste Heat Configuration
# --------------------------------------------------------------------------
waste_heat:
  Q_AW_max_column: "WRG1Q_MW"
  T_AW_column: "WRG_1_Celsius"
  T_amb_column: "outdoor_temp_C"

# --------------------------------------------------------------------------
# Heat Pump COP Model
# --------------------------------------------------------------------------
heat_pumps:
  cop:
    sink_defaults:
      Tsink_out_K: 372.15     # 99°C (Stadtbach mean supply)
      Tsink_in_K: 333.15      # 60°C (Stadtbach mean return)
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 3.0
  types:
    standard:
      eta: 0.6
      FQ: 0.10

# --------------------------------------------------------------------------
# Investment Economics
# --------------------------------------------------------------------------
investment:
  discount_rate: 0.05       # i = 5% (VDI 2067 / WACC)

# --------------------------------------------------------------------------
# Grid, Fuels, Costs
# --------------------------------------------------------------------------
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  gridcost_eur_mwh: 10.0

fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0
  biomass:
    price_eur_mwh: 40.0
    ef_kg_per_mwh_fuel: 20.0

costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 1000.0

emissions:
  ef_el_kg_per_mwh: 400.0
  ef_gas_kg_per_mwh: 200.0
  ef_biomass_kg_per_mwh: 20.0

# --------------------------------------------------------------------------
# Run Settings
# --------------------------------------------------------------------------
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    MIPGap: 0.005
    TimeLimit: 86400
    MIPFocus: 1
    Heuristics: 0.5
    NumericFocus: 2
    OutputFlag: 1
    LogToConsole: 1

# --------------------------------------------------------------------------
# Output
# --------------------------------------------------------------------------
output:
  log_dir: "output/logs"
  export_dir: "output/paper2_runs"
  export_thermal_network: true
  export_solver_solution: true
