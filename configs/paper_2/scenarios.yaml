    config: "configs/paper_2/Memmingen_P2_base.yaml"
    heat_curve_stage: "HK0"
    tes_node: null
    hp_node: "J12"
    baseline: false
    description: "Memmingen: HP/EK at j_12, no TES, real heat curve"
    overrides: *tes_off_mm

  - id: "MM-S0-HK0-PIN0"
    network: "memmingen"
    config: "configs/paper_2/Memmingen_P2_base.yaml"
    heat_curve_stage: "HK0"
    tes_node: null
    hp_node: "J12"
    baseline: false
    description: >
      O1 (docs SS4bk, author instruction 2026-09-28): mirrors SB-S0-HK0-PIN0 (K2) for
      Memmingen under the FINAL configuration (Notkühler node-categorization + N1/N2
      baseline-derived per-node closure caps, already unconditional in
      constraint_builder.py -- no separate flag needed). Identical topology to
      MM-S0-HK0 (hp_main/eboiler_main placed at j_12) but ALL investment/capacity hard-
      fixed to 0 for hp_main/eboiler_main (same pattern as BC-MM-HK0) and TES stays off
      (tes_off_mm). Label "mm_s0_pin0". Incumbent-pool / dominance-superset isolation
      run, analogous to SB's K2 but on the final closure config.
    overrides:
      assets:
        hp_main:
          investment:
            enabled: false
            capacity_max_mw: 0.0
        eboiler_main:
          # Z (2026-10-02, docs SS4ce, self-caught via V1's own assertion firing as
          # designed): base config's eboiler_main.capacity_mw=5.0 ("INITIAL --
          # overridden by investment optimizer") was never zeroed here, unlike
          # hp_main's base capacity_mw=0.0 (already 0, no override needed). With
          # investment.enabled=False, that 5.0 MW fallback becomes a fixed, uncosted
          # capacity -- exactly the bug class V1's assertion exists to catch.
          capacity_mw: 0.0
          investment:
            enabled: false
            capacity_max_mw: 0.0
        tes_main:
          V_min_m3: 0.0
          V_max_m3: 0.0

  - id: "MM-S0-HK1"
    network: "memmingen"
    config: "configs/paper_2/Memmingen_P2_base.yaml"
    heat_curve_stage: "HK1"
    tes_node: null
    hp_node: "J12"
    baseline: false
    description: "Memmingen: HP/EK at j_12, no TES, heat curve stage 1"
