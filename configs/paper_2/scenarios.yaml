# =============================================================================
# PAPER 2 — Scenario Matrix (Rev B, 2026-07-03)
# =============================================================================
# Implements the edited spec table (§5.1): 18 scenario rows ≈ 46 MILP runs.
#   2 BC + 2 S0-TVLFIX + 6 S0-HK + 21 SB (S1..S7 ×3) + 15 MM (S1..S5 ×3)
#
# Scenario naming: {network}-{row}-{heat curve}
#   BC        = baseline (no investment, TVL fix)
#   S0        = HP/EK investment WITHOUT TES (isolates TES value)
#   TVLFIX    = constant supply temperature year-round (Paper-1 setpoint)
#   HK0/1/2   = heat curve stages (real / k=0.8 / k=0.6)
#
# Feature gates (runner skips until the model feature is implemented):
#   hot_charging      — HP charges TES at min(T_VL,max, 95°C atmospheric ceiling),
#                       i.e. BOTH nets clip to 95°C (SB from 122°C, MM from 100°C);
#                       TES ΔT = min(T_VL,max,95°C) − T_return; 2nd COP series (F2)
#   endogenous_siting — MILP chooses TES (and HP) node freely, Σ build ≤ 1 (F3)
#
# NODE MAPPING — Stadtbach (32-node swa topo), PROPOSED, pending confirmation:
#   J1 = j_hkw  (Zentrale — HKW busbar)                     [S1]
#   J4 = j_man  (MAN industrial waste heat; HP/EK site)     [S2, S3, HP all rows]
#   J6 = j_pss  (Pumpstation Süd)                           [S4]
#   J8 = j_psw  (Pumpstation West)                          [S5]
# Memmingen: J1 = j_1, J12 = j_12 (HP/EK already at j_12 in base config).
# =============================================================================

# Heat curve stages — network-keyed (Stadtbach runs at higher temperatures than Memmingen)
# Memmingen: T_VL 55-100°C  |  Stadtbach: T_VL 70-122°C (from PPS measurements)
heat_curve_stages:
  memmingen:
    # T_return = 63.6°C. HK stages are NETWORK TRANSFORMATION SCENARIOS:
    # HK0 = current real network, no substation changes.
    # HK1/HK2 = assume progressive consumer substation retrofit enabling lower T_VL_min.
    # The runner enforces T_VL_min ≥ T_return + 10 K as a safety floor and logs
    # violations (hours where non-retrofitted substations would be undersupplied).
    HK0:
      k: 1.0
      T_VL_min_c: 74.0   # current real floor (T_return + 10.4 K); no retrofit needed
      T_VL_max_c: 100.0
      description: "Memmingen: current real heat curve, no substation changes"
    HK1:
      k: 0.8
      T_VL_min_c: 70.0   # partial retrofit (50% of substations)
      T_VL_max_c: 100.0
      T_RL_c: 55.0       # retrofit lowers return too (better HX); ΔT_min=15K keeps flows in-pipe
      description: "Memmingen: reduced slope k=0.8, partial substation retrofit"
    HK2:
      k: 0.6
      T_VL_min_c: 66.0   # full retrofit (all substations)
      T_VL_max_c: 100.0
      T_RL_c: 51.0       # full retrofit lowers return further; ΔT_min=15K keeps flows in-pipe
      description: "Memmingen: reduced slope k=0.6, full substation retrofit"
  stadtbach:
    # T_return = 60°C. Same transformation scenario framing as Memmingen.
    HK0:
      k: 1.0
      T_VL_min_c: 70.0   # current real floor (T_return + 10 K); PPS-calibrated
      T_VL_max_c: 122.0
      description: "Stadtbach: current real heat curve (PPS-calibrated), no retrofit"
    HK1:
      k: 0.8
      T_VL_min_c: 65.0   # partial retrofit
      T_VL_max_c: 122.0
      T_RL_c: 50.0       # retrofit lowers return too (better HX); ΔT_min=15K keeps flows in-pipe
      description: "Stadtbach: reduced slope k=0.8, partial substation retrofit"
    HK2:
      k: 0.6
      T_VL_min_c: 60.0   # full retrofit
      T_VL_max_c: 122.0
      T_RL_c: 45.0       # full retrofit lowers return further; ΔT_min=15K keeps flows in-pipe
      description: "Stadtbach: reduced slope k=0.6, full substation retrofit"

# TES candidate nodes (spec row → real node)
tes_nodes:
  memmingen:
    S1: "j_9"     # spec J1 — Zentrale (existing TES + central generators). Moved
                  # j_1 -> j_9 (2026-08-06): j_9 is the real Energiezentrale, and
                  # the whole portfolio + primary_producer moved there in
                  # Memmingen_P2_base.yaml. S1 = "TES at the central plant" must
                  # follow the plant. (Analogous to Stadtbach S1 = j_hkw below.)
    S2: "j_12"    # spec J12 — waste-heat node (HP/EK site)
    S3: "j_12"    # spec J12 — same node, hot charging (feature-gated)
  stadtbach:
    S1: "j_hkw"   # spec J1 — Zentrale (all central generators + existing TES)
    S2: "j_man"   # spec J4 — MAN waste-heat node (PROPOSED mapping)
    S3: "j_man"   # spec J4 — same node, hot charging (feature-gated)
    S4: "j_pss"   # spec J6 — Pumpstation Süd (PROPOSED mapping)
    S5: "j_psw"   # spec J8 — Pumpstation West (PROPOSED mapping)

# HP/EK location (spec §3.3: fixed at the waste-heat node for ALL investment runs)
hp_nodes:
  stadtbach:
    J4: "j_man"   # PROPOSED — confirm; every SB investment scenario uses this
  memmingen:
    J12: "j_12"   # already the base-config location
hp_assets:
  stadtbach: [hp_sb, ek_sb]
  memmingen: [hp_main, eboiler_main]

# Candidate nodes for endogenous siting (S6/S7 SB, S4/S5 MM).
# Spec says "alle können genommen werden"; this shortlist keeps the MILP
# tractable (producers + junctions + waste-heat nodes) — extend if needed.
endogenous_candidates:
  stadtbach: [j_hkw, j_man, j_ost, j_pss, j_psw]
  memmingen: [j_1, j_3, j_5, j_9, j_12, j_13]

# DSM consumers (spec §4.4.1: implement but keep at 0 until user provides data)
dsm_consumers:
  memmingen: []
  stadtbach: []

# Reusable override anchors
_tes_off_sb: &tes_off_sb
  assets:
    tes_sb:
      V_min_m3: 0.0    # no investable TES (geometric_storage: build=0, V=0)
      V_max_m3: 0.0
_tes_off_mm: &tes_off_mm
  assets:
    tes_main:
      V_min_m3: 0.0
      V_max_m3: 0.0

scenarios:

  # ═══════════════════════════════════════════════════════════════════════════
  # Baselines — no investment, constant T_VL (Ist-Zustand reference)
  # ═══════════════════════════════════════════════════════════════════════════
  - id: "BC-SB"
    network: "stadtbach"
    config: "configs/paper_2/Stadtbach_topo.yaml"
    heat_curve_stage: "TVLFIX"
    tvl_fix: true
    tes_node: null
    baseline: true
    description: "Stadtbach baseline — Bestand only (incl. 9.9 MW existing P2H; NO existing TES — tes_existing removed 2026-07-08, unsourced), constant T_VL"
    overrides:
      assets:
        hp_sb:
          investment:
            enabled: false
            capacity_max_mw: 0.0
        ek_sb:
          investment:
            enabled: false
            capacity_max_mw: 0.0
        tes_sb:
          V_min_m3: 0.0
          V_max_m3: 0.0

  - id: "BC-MM"
    network: "memmingen"
    config: "configs/paper_2/Memmingen_P2_base.yaml"
    heat_curve_stage: "TVLFIX"
    tvl_fix: true
    tes_node: null
    baseline: true
    description: "Memmingen baseline — Bestand only, no HP/EK/TES, constant T_VL"
    overrides:
      assets:
        hp_main:
          capacity_mw: 0.0        # baseline: no HP exists (spec §4.5)
          investment:
            enabled: false
            capacity_max_mw: 0.0
        eboiler_main:
          capacity_mw: 0.0        # baseline: no EK exists — base config's 5 MW must not dispatch
          investment:
            enabled: false
            capacity_max_mw: 0.0
        tes_main:
          V_min_m3: 0.0
          V_max_m3: 0.0

  # ═══════════════════════════════════════════════════════════════════════════
  # S0 — HP/EK investment WITHOUT TES (isolates the TES contribution)
  # ═══════════════════════════════════════════════════════════════════════════
  - id: "SB-S0-TVLFIX"
    network: "stadtbach"
    config: "configs/paper_2/Stadtbach_topo.yaml"
    heat_curve_stage: "TVLFIX"
    tvl_fix: true
    tes_node: null
    hp_node: "J4"
    baseline: false
    description: "Stadtbach: HP/EK investment at J4, no TES, constant T_VL"
    overrides: *tes_off_sb

  - id: "MM-S0-TVLFIX"
    network: "memmingen"
    config: "configs/paper_2/Memmingen_P2_base.yaml"
    heat_curve_stage: "TVLFIX"
    tvl_fix: true
    tes_node: null
    hp_node: "J12"
    baseline: false
    description: "Memmingen: HP/EK investment at j_12, no TES, constant T_VL"
    overrides: *tes_off_mm

  - id: "SB-S0-HK0"
    network: "stadtbach"
    config: "configs/paper_2/Stadtbach_topo.yaml"
    heat_curve_stage: "HK0"
    tes_node: null
    hp_node: "J4"
    baseline: false
    description: "Stadtbach: HP/EK at J4, no TES, real heat curve"
    overrides: *tes_off_sb

  - id: "SB-S0-HK0-PIN0"
    network: "stadtbach"
    config: "configs/paper_2/Stadtbach_topo.yaml"
    heat_curve_stage: "HK0"
    tes_node: null
    hp_node: "J4"
    baseline: false
    description: >
      K2 (docs SS4be, author decision 2026-09-26): identical topology to SB-S0-HK0
      (hp_sb/ek_sb physically placed at J4/j_man via hp_node, so j_man's role is still
      'mixed' with a data-closure dump Var) but ALL investment/capacity hard-fixed to 0
      for hp_sb/ek_sb (same investment:{enabled:false,capacity_max_mw:0.0} pattern as
      BC-SB-HK0) and TES stays off (tes_off_sb). Label "s0_pin0". Isolates whether the
      mixed-node balance equation change at j_man ALONE (with zero investment freedom)
      reproduces BC-SB-HK0's objective -- the direct dominance-superset test.
    overrides:
      assets:
        hp_sb:
          investment:
            enabled: false
            capacity_max_mw: 0.0
        ek_sb:
          investment:
            enabled: false
            capacity_max_mw: 0.0
        tes_sb:
          V_min_m3: 0.0
          V_max_m3: 0.0

  - id: "SB-S0-HK0-PIN0-MONTHLY"
    network: "stadtbach"
    config: "configs/paper_2/Stadtbach_topo.yaml"
    heat_curve_stage: "HK0"
    tes_node: null
    hp_node: "J4"
    baseline: false
    description: >
      Y3 (docs SS4cb, author instruction 2026-10-01): identical to SB-S0-HK0-PIN0 (HP/EK
      hard-fixed to 0, TES off) but billed on MONATSLEISTUNGSPREIS (12 monthly peaks) instead
      of the Jahresleistungspreis (single annual peak) -- rate converted 1:1 from the annual
      127,240 EUR/MW/a to 10,603.3333 EUR/MW/month (127240/12), per the explicit "Rate
      umgerechnet" instruction (NOT a different real monthly tariff). Run FIRST (before any
      CAPEX/CO2 corner case) since this is a MODEL change -- prior corner-case runs under the
      old annual billing would be invalid once this lands.
    overrides:
      assets:
        hp_sb:
          investment:
            enabled: false
            capacity_max_mw: 0.0
        ek_sb:
          investment:
            enabled: false
            capacity_max_mw: 0.0
        tes_sb:
          V_min_m3: 0.0
          V_max_m3: 0.0
      grid:
        demand_charge_mode: "monthly"
        demand_charge_eur_per_mw_month: 10603.3333

  - id: "SB-S0-HK0-MONTHLY"
    network: "stadtbach"
    config: "configs/paper_2/Stadtbach_topo.yaml"
    heat_curve_stage: "HK0"
    tes_node: null
    hp_node: "J4"
    baseline: false
    description: >
      Y3 (docs SS4cb, author instruction 2026-10-01): identical to SB-S0-HK0 (free HP/EK
      investment, no TES) but billed on Monatsleistungspreis instead of Jahresleistungspreis --
      see SB-S0-HK0-PIN0-MONTHLY's description for the full rationale and rate conversion.
    overrides:
      assets:
        tes_sb:
          V_min_m3: 0.0
          V_max_m3: 0.0
      grid:
        demand_charge_mode: "monthly"
        demand_charge_eur_per_mw_month: 10603.3333

  - id: "SB-S0-HK0-PIN0-MONTHLY-CORNER"
    network: "stadtbach"
    config: "configs/paper_2/Stadtbach_topo.yaml"
    heat_curve_stage: "HK0"
    tes_node: null
    hp_node: "J4"
    baseline: false
    description: >
      Y4 (docs SS4cc, author instruction 2026-10-01): the ONE explicitly-authorized corner
      case -- CAPEX=1.5 Mio. EUR/MW x CO2=65 EUR/t, under the now-valid Monatsleistungspreis
      (see SB-S0-HK0-PIN0-MONTHLY). PIN0 side (HP/EK hard-fixed to 0, TES off). Tight-gap
      target (0.15%) run via CALION_MIPGAP/CALION_MIPFOCUS env overrides, not a config change
      here (keeps this scenario def identical in shape to its siblings).
    overrides:
      assets:
        hp_sb:
          investment:
            enabled: false
            capacity_max_mw: 0.0
            capex_eur_per_mw: 1500000.0
        ek_sb:
          investment:
            enabled: false
            capacity_max_mw: 0.0
        tes_sb:
          V_min_m3: 0.0
          V_max_m3: 0.0
      costs:
        co2_price_eur_per_t: 65.0
      grid:
        demand_charge_mode: "monthly"
        demand_charge_eur_per_mw_month: 10603.3333

  - id: "SB-S0-HK0-MONTHLY-CORNER"
    network: "stadtbach"
    config: "configs/paper_2/Stadtbach_topo.yaml"
    heat_curve_stage: "HK0"
    tes_node: null
    hp_node: "J4"
    baseline: false
    description: >
      Y4 (docs SS4cc, author instruction 2026-10-01): same corner case as
      SB-S0-HK0-PIN0-MONTHLY-CORNER, free HP/EK investment side (CAPEX=1.5M EUR/MW,
      CO2=65 EUR/t, monthly billing). Expectation: optimal HP size shrinks to 0 or well
      below the 1.9-2.1 MW found at the base-case parameters.
    overrides:
      assets:
        hp_sb:
          investment:
            capex_eur_per_mw: 1500000.0
        tes_sb:
          V_min_m3: 0.0
          V_max_m3: 0.0
      costs:
        co2_price_eur_per_t: 65.0
      grid:
        demand_charge_mode: "monthly"
        demand_charge_eur_per_mw_month: 10603.3333

  - id: "SB-S1-HK0-PIN0"
    network: "stadtbach"
    config: "configs/paper_2/Stadtbach_topo.yaml"
    heat_curve_stage: "HK0"
    tes_node: "S1"
    hp_node: "J4"
    baseline: false
    description: >
      AB1 (docs SS4ci, author instruction 2026-10-04): identity check for SB-S0-HK0-PIN0 (tes_node=
      null) vs a genuine S1-sited PIN0 (tes_node="S1" PRESERVED, only capacity zeroed). Unlike S0-PIN0,
      this keeps the TES CANDIDATE placement at j_hkw active (node-role inference may differ from the
      null-site case, per J2's precedent that candidate placement changes node balance FORM, not just
      whether something gets built) -- built ONLY if the model-diff in AB1 finds the two are NOT
      structurally identical.
    overrides:
      assets:
        hp_sb:
          investment:
            enabled: false
            capacity_max_mw: 0.0
        ek_sb:
          investment:
            enabled: false
            capacity_max_mw: 0.0
        tes_sb:
          V_min_m3: 0.0
          V_max_m3: 0.0

  - id: "SB-S0-HK0-HPFIX533"
    network: "stadtbach"
    config: "configs/paper_2/Stadtbach_topo.yaml"
    heat_curve_stage: "HK0"
    tes_node: null
    hp_node: "J4"
    baseline: false
    description: >
      Q2 (docs SS4bl/SS4bm, author instruction 2026-09-29): constructed HP run, replaces the
      withdrawn N3 SB-S0-HK0 regret analysis. Identical topology to SB-S0-HK0 (hp_sb/ek_sb at
      J4/j_man) but hp_sb's capacity is HARD-FIXED at 5.325821519771965 MW (the exact size N3's
      SB-S0-HK0 incumbent built, so the cost decomposition stays comparable to the withdrawn
      figures) via investment.enabled=false + capacity_mw set directly (heat_pump.py fixes
      build=1/cap=capacity_init_mw when investable=False and capacity_init_mw>0 -- verified in
      heat_pump.py:132-134, NOT the same code path as PIN0's capacity_mw=0 case). ek_sb stays
      fully investable (untouched, inherits the base config's investment.enabled=true) and TES
      stays off (tes_off_sb) -- everything except hp_sb's capacity is free. A restricted model
      (one fewer investment decision than real S0-HK0), therefore easier to solve to a tight gap.
      V1 UPDATE (2026-09-30, docs SS4bq): the original run of this scenario silently charged
      ZERO CAPEX/Activation (component_assembler.py's old single-flag CAPEX gate treated
      investment.enabled=false as "pre-existing, no CAPEX" -- correct for Bestand assets, wrong
      here) -- caught and corrected post-hoc in SS4bp. `investment.capex_charged: true` added
      below so a re-run of this exact scenario now charges CAPEX correctly without the
      post-hoc correction step; the new V1 assertion in component_assembler.py would otherwise
      refuse to build this model at all (fixed nonzero capacity + no capex_charged + no
      bestand marker = hard error, by design).
    overrides:
      assets:
        hp_sb:
          capacity_mw: 5.325821519771965
          investment:
            enabled: false
            capex_charged: true
        tes_sb:
          V_min_m3: 0.0
          V_max_m3: 0.0

  - id: "SB-S0-HK1"
    network: "stadtbach"
    config: "configs/paper_2/Stadtbach_topo.yaml"
    heat_curve_stage: "HK1"
    tes_node: null
