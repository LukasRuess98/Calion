# --------------------------------------------------------------------------
# Assets — INVESTABLE (Paper 2: capacity is optimized)
# --------------------------------------------------------------------------
assets:
  chp_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 0.20           # fixed (existing CHP, not optimized)
    thermal_efficiency: 0.80
    el_eff: 0.40
    min_load: 0.3

  gasboiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 13.0           # fixed backup
    thermal_efficiency: 0.90
    min_load: 0.1

  biomass_main:
    type: thermal_generator
    fuel: biomass
    capacity_mw: 3.3            # fixed
    thermal_efficiency: 0.85
    min_load: 0.1

  eboiler_main:
    type: p2h
    capacity_mw: 5.0            # INITIAL — overridden by investment optimizer
    # 2026-07-20: harmonized 0.95 -> 0.99 (was an undocumented value, differed
    # from Stadtbach's 0.98, itself also undocumented). Danish Energy Agency
    # Technology Catalogue (electric boiler chapter) cites ~99% efficiency for
    # this equipment class; both networks now match it.
    efficiency: 0.99
    min_load: 0.1
    investment:
      enabled: true
      capex_eur_per_mw: 150000.0   # 150 €/kW (VDI 2067)
      activation_cost_eur: 20000.0
      lifetime_years: 25.0
      capacity_min_mw: 0.0
      capacity_max_mw: 20.0

  hp_main:
    type: heat_pump
    capacity_mw: 0.0            # INITIAL — overridden by investment optimizer
    min_load: 0.2
    wrg_source_column: "WRG_1 °C"
    wrg_capacity_column: "WRG1Q MW"
    cop_default: 3.0
    investment:
      enabled: true
      capex_eur_per_mw: 700000.0   # 700 €/kW (VDI 2067)
      activation_cost_eur: 50000.0
      lifetime_years: 20.0
      capacity_min_mw: 0.0
      capacity_max_mw: 30.0

  tes_main:
    type: geometric_storage
    # Scenario ΔT = T_VL_min − T_return (worst-case corridor, not the mean);
    # overridden per HK stage by scenario_runner.py.
    delta_T_scenario_k: 10.4    # HK0 baseline: 74 − 63.6 = 10.4 K worst-case at runtime; static fallback only
    r_hd: 3.0                   # h/d aspect ratio (tall tank, good stratification)
    p_max_bar: 10.0             # max vessel operating pressure
    V_min_m3: 5.0               # minimum tank volume if built [m³]
    # 2026-07-20: PROPERLY FIXED (was flagged 2026-07-03, never acted on, then
    # left explicitly open in an earlier pass today): p_max_bar=10 here is a
    # genuine PED-class pressurized vessel (Memmingen's heating curve reaches
    # T_supply=100C at its coldest design point -- the atmospheric boiling
    # point), but V_max_m3/alpha below previously used ATMOSPHERIC-tank
    # assumptions. Same first-principles ASME thin-wall derivation as
    # Stadtbach_topo.yaml's tes_sb (t=P*D/(2*S*E), P=10 bar, S=130 MPa carbon
    # steel, E=0.85 weld efficiency, ~60mm practical shell thickness) ->
    # ~5,000 m3 realistic single-vessel cap, same physical constraint,
    # network-independent -- not a vendor quote, an engineering estimate
    # (same caveat class as the VDI 2067 assumptions, O-1).
    V_max_m3: 5000.0            # max tank volume [m³] -- was 50000 (atmospheric-tank scale)
    option_b: false             # Option A: V as single Var; h/d back-calculated post-solve
    # Discrete storage sizes as ENERGY [MWh] = hours of MEAN heat demand
    # (Memmingen mean ~1.4 MW): 0/1/2/4/6/8/12/16/24/36/48 h. Was 0/1/2/4/6/8/
    # 12/16/24/36/48/96/168 h (up to 235.2 MWh) -- only the 96/168h entries
    # (134.4/235.2 MWh) are DROPPED because they need >5,000 m3 at this
    # network's worst-case (minimum) supply-return dT of 15.0 K, the same
    # runtime floor `min_supply_delta_T_k` enforces elsewhere for non-hot-
    # charging scenarios (134.4 MWh needs ~7,706 m3; 235.2 MWh needs
    # ~13,485 m3). The 48h/67.2 MWh step DOES fit (~3,853 m3 < 5,000 m3) and
    # was wrongly dropped in an earlier pass that used this asset's static
    # 10.4 K `delta_T_scenario_k` label instead of the 15.0 K worst-case
    # floor the optimizer actually runs against (10.4 K understates energy
    # density, so it overstated the required volume to ~5,560 m3) --
    # corrected 2026-07-21. Truncated, not rescaled, since -- unlike
    # Stadtbach's ladder, which was explicitly built to exactly reach the old
    # 50,000 m3 ceiling -- Memmingen's ladder was never volume-ceiling-bound
    # in the first place (all entries already fit inside one old 25,000 m3
    # tank); dropping the now-infeasible top entries preserves the same
    # hours-of-mean-demand step pattern for everything that still fits.
    discrete_energies_mwh: [0, 1.4, 2.8, 5.6, 8.4, 11.2, 16.8, 22.4, 33.6, 50.4, 67.2]
    unit_tank_m3: 5000.0        # one realistic single pressurized tank -- was 25000
    # variable CAPEX [€/m³] -- was 400/500 (atmospheric-tank rate; SB/MM had
    # also just been harmonized to 400 in an earlier pass today). ~3x for a
    # pressure-vessel-class tank -- see Stadtbach_topo.yaml's tes_sb comment
    # for the full derivation (wall-thickness scaling + PED/ASME
    # certification premium). Same physical vessel type, same rate both
    # networks.
    alpha_tes_eur_per_m3: 1200.0
    beta_tes_eur: 100000.0      # fixed CAPEX per tank (engineering, connections) [€]
    lifetime_years: 30.0
    eff_charge: 0.98
    eff_discharge: 0.98
    loss_hour: 0.9999
    soc0_fraction: 0.5
    power_to_energy_ratio: 0.25 # P_max = 25% × E_max (full discharge in ~4 h)
    terminal_soc_fraction: 0.5
    # Dead-volume floor: stratified hot-water tanks can't fully discharge —
    # diffuser placement and pump NPSH require some minimum water level.
    # 5% is a generic literature range (typically 5-10%), not a measured
    # value for this specific tank; revisit if real commissioning data
    # becomes available.
    e_min_fraction: 0.05
    cycling_cost_eur_per_mwh: 2.0

# --------------------------------------------------------------------------
# Heat Pump COP Model (same as Paper 1 — extended by scenario_runner.py
# to use T_VL(t) from heating curve and T_source(t) from waste heat)
# --------------------------------------------------------------------------
heat_pumps:
  cop:
    sink_defaults:
      Tsink_out_K: 353.15    # 80°C default — overridden per scenario by T_VL(t)
      Tsink_in_K: 323.15
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 3.0
  types:
    standard:
      # 2026-07-20: harmonized 0.6 -> 0.75 to match Stadtbach_topo.yaml's eta
      # (same fix applied there on 2026-07-08, see comment there). Both
      # networks must use the same Lorenz-Gütegrad so the SB-vs-MM siting
      # comparison isn't confounded by a COP/economics difference.
      eta: 0.75
      FQ: 0.10

# --------------------------------------------------------------------------
# Investment Economics (Paper 2 ANF parameters)
# --------------------------------------------------------------------------
investment:
  discount_rate: 0.05          # i = 5% (VDI 2067 / WACC typical)
  # Lifetimes are specified per asset in investment sections above

# --------------------------------------------------------------------------
# Grid, Fuels, Costs (same as Paper 1 baseline)
# --------------------------------------------------------------------------
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  # Volumetric grid cost = MS Arbeitspreis (>=2500 h/a band ~0.5-2.0 ct/kWh) + 2026 levies:
  # KWKG 0.446 + Offshore 0.941 + BesAR/§19 0.05 (>1 GWh tranche) ct/kWh
  # + Konzessionsabgabe Sondervertrag 0.11 + Stromsteuer 0.05 (Prod. Gewerbe) => ~2.5 ct/kWh
  # 2026-07-29: harmonized to Stadtbach_topo.yaml's corrected 61.6 (was 25.0, an
  # undocumented SB-vs-MM asymmetry) -- derivation basis for the updated figure
  # not yet written back into this comment, see Stadtbach_topo.yaml's grid block.
  gridcost_eur_mwh: 61.6
  # Jahresleistungspreis on peak grid import (P_buy_peak), MS level >=2500 h/a band.
  # 2026 published sheets span 67-167 k€/MW·a; 127.24 k€/MW·a = real 2022/23 tariff
  # from the SB notebook — mid-range of 2026 values, kept for continuity.
  demand_charge_eur_per_mw_y: 127240.0

fuels:
  gas:
    # 2026-07-29: harmonized to Stadtbach_topo.yaml (was 45.0, an undocumented
    # SB-vs-MM asymmetry) -- same commodity market, no reason to diverge.
    price_eur_mwh: 58.6
    ef_kg_per_mwh_fuel: 200.0
  biomass:
    # 2026-07-29: harmonized to Stadtbach_topo.yaml (was 40.0, an undocumented
    # SB-vs-MM asymmetry) -- same commodity market, no reason to diverge.
    price_eur_mwh: 20.0
    ef_kg_per_mwh_fuel: 20.0

costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 1000.0

# Emission factors for CO2 KPI calculation
emissions:
  ef_el_kg_per_mwh: 400.0       # Grid electricity (DEA 2025 average)
  ef_gas_kg_per_mwh: 200.0
  ef_biomass_kg_per_mwh: 20.0

# --------------------------------------------------------------------------
# Run Settings
# --------------------------------------------------------------------------
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    MIPGap: 0.005
    TimeLimit: 86400
    # 2026-07-21: Cuts/MIPFocus/Heuristics were missing the documented weak-LP-
    # bound fix (Implementation Statement Part F.4) -- without it, scenarios sat
    # at a frozen gap for hours (MM-S0-HK0 stuck 4.36% for 30+ min is what
    # surfaced this). Cuts=2 (aggressive cutting planes) + MIPFocus=2
    # (prioritize tightening the bound over new incumbents) took a
    # stuck-at-12%-gap Stadtbach scenario to 1.07% in 80 min in the original
    # diagnosis. Heuristics lowered 0.5->0.1 to match (less time on
    # incumbent-finding heuristics, more on the bound, per the same section).
    Cuts: 2
    MIPFocus: 2
    Heuristics: 0.1
    NumericFocus: 2
    OutputFlag: 1
    LogToConsole: 1

# --------------------------------------------------------------------------
# Output
# --------------------------------------------------------------------------
output:
  log_dir: "output/logs"
  export_dir: "output/paper2_runs"
  export_thermal_network: true
  export_solver_solution: true

# --------------------------------------------------------------------------
# Dispatch Series Map
# Explicit routing of result_collector series keys to dispatch_hourly.csv columns.
# For Memmingen all keys are in the primary MAIN-convention lookups, so this map
# is informational only — the fallback loop in write_dispatch_hourly() never fires
# for Memmingen series. Future networks should add their own map.
# --------------------------------------------------------------------------
dispatch_series_map:
  CHP_MAIN_Q_th_MW:      Q_chp_MW
  BIOMASS_MAIN_Q_th_MW:  Q_biomass_MW
  GASBOILER_MAIN_Q_th_MW: Q_gasboiler_MW
  hp_main_Q_th_MW:       Q_hp_total_MW
  EBOILER_MAIN_Q_th_MW:  Q_ek_MW
  P2H_Q_th_MW:           Q_ek_MW
