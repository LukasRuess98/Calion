# =============================================================================
# PAPER 2 — Memmingen Investment Optimization (Base Config)
# =============================================================================
# Extends Memmingen_L3_MILP.yaml with:
#   - Investment variables for WP (hp_main), EK (eboiler_main), TES (tes_main)
#   - CAPEX annualization via ANF(i, n) in InvestmentCalculator
#   - Geometric TES sizing (V_TES, h_TES) via GeometricStorageBlock
#   - Heating curve parameters (k, T_VL_min) provided per scenario by scenario_runner.py
#   - Waste heat integration (T_source(t) precomputed before MILP)
#   - DSM flexible consumers (configured per scenario)
#
# TES location: PLACEHOLDER — set to node_s1 / node_s2 in scenarios.yaml
# Heat curve: PLACEHOLDER — k and T_VL_min provided by scenario_runner.py override
#
# Usage: scenario_runner.py loads this and applies per-scenario overrides.
# =============================================================================

site:
  input_xlsx: "data/Import_Data_Memmingen_epronet_cleaned.xlsx"  # 2026-07-07: quality-flag cleaned, see memory project_memmingen_dxf_crosscheck
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  name: "Memmingen P2 Investment Optimization"
  description: "Investment optimization for WP, EK, TES on Memmingen 15-node network"
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: "2025-01-01 00:00"
    end: "2025-12-31 23:00"

# --------------------------------------------------------------------------
# Network (15-node Memmingen — identical topology to Paper 1 L3)
# --------------------------------------------------------------------------
network:
  milp_linearize: true
  # 2026-08-06: primary producer MOVED j_1 -> j_9 to match the real network.
  # j_9 is the actual "Energiezentrale" (all 5 installed Wilo pumps + all central
  # generators sit there, per configs/pressure/Memmingen_componenets_spec and the
  # DXF pressure investigation). The main portfolio [chp_main, tes_main,
  # biomass_main, gasboiler_main] moved with it (see nodes below); j_1 is now a
  # plain consumer leaf. j_12 still hosts HP/EK (spec §3.3, waste-heat node) as a
  # secondary 'mixed' producer with its own pump-boosted floor. Only j_9 keeps the
  # fixed P_supply setpoint.
  primary_producer: "j_9"
  # 2026-07-08: McCormick L3+ temperature propagation DISABLED -- at 8760 h it
  # made the model ~6M rows (barrier root LP couldn't solve, no incumbent; see
  # report Part E.1). Spatial supply-temperature DROP is now applied instead as
  # a per-node T_supply_offset_c (cumulative heat loss from the plant),
  # precomputed in scenario_runner._apply_spatial_temperature_offsets -- keeps
  # T a Param (solvable L3 size) while still showing the node-to-node drop.
  temperature_propagation: false
  # 2026-07-08: reverted from 100.0 (capacity bypass) to a realistic value now
  # that demand data is quality-cleaned and pipe diameters are DXF-real -- also
  # makes transport_delay's flow-based bucket computation meaningful again
  # (see memory project_memmingen_dxf_crosscheck / plan greedy-wandering-alpaca).
  max_velocity_m_s: 3.0
  parameters:
    max_velocity_m_s: 3.0   # passed to pipe_pair enriched_config via self.parameters
  state_validation:
    flow_constraints:
      max_velocity_m_s: 3.0   # passed to state_constraints velocity Pyomo constraint
  # 2026-08-06: real pressure-stack params from the DXF pressure investigation
  # (configs/pressure/Memmingen_pressure_stations.yaml + pandapipes cross-check).
  # delta_p_min_consumer_bar 0.6 = real Uebergabestation spec (was silently
  # falling back to network_manager's 0.7 default). lateral_diameter_mm is the
  # network default service-lateral DN; per-node velocity-sized overrides live in
  # nodes: below (2 m/s on the real 2025 hourly-mean peak).
  delta_p_min_consumer_bar: 0.6
  lateral_diameter_mm: 32.0
  physics:
    heat_loss: true
    pressure_drop: true
    # 2026-08-06: opt-in pressure tie-break (Impl. Statement Part H.7) so pressure
    # away from a binding constraint is not solver-arbitrary. Enabled now that the
    # campaign carries the full lateral/station pressure stack; verified cost-
    # neutral on this network in the investigation config. Return-side anchoring
    # (network_manager.py, 2026-08-05) resolves P_return at every consumer node.
    pressure_regularization: true
    pressure_regularization_epsilon: 0.0001
    transport_delay: true
    tes_pressure_coupling: true   # F4: TES <-> node pressure coupling (mode below)
    # same_circuit_buffer (2026-07-13): TES is an in-line buffer sharing the network's
    # pressure (no HX, no elevated tower) -> no hydrostatic push term; only a vessel
    # rating cap remains. Replaces the legacy "hydrostatic_support" elevated-tower model
    # (kept for A/B comparability), which fed rho*g*h(V) into the node pressure floor via
    # a 5-breakpoint SOS2 PWL (~44k extra combinatorial-adjacent vars/network/year) for a
    # physical effect that doesn't apply to an in-line buffer tank.
    tes_pressure_mode: same_circuit_buffer   # same_circuit_buffer | hydrostatic_support

  supply_temp_c: 86.0        # overridden per scenario via heating curve
  return_temp_c: 63.6
  ground_temp_c: 10
  # 2026-07-20: was missing entirely -> silently fell back to pipe_pair.py's
  # code default of 0.70, an undocumented asymmetry vs. Stadtbach_topo.yaml's
  # explicit 0.75. Matched to Stadtbach's value; both sit within the typical
  # 0.60-0.75 large-network-pump efficiency range cited in DH literature.
  pump_efficiency: 0.75
  min_supply_delta_T_k: 15.0  # minimum T_supply − T_return for consumer substation operation (VDI 6002)
  consumer_min_temp_c: 73.6   # = T_return + 10 K; scenario_runner warns if T_VL drops below this

  heating_curve:
    enabled: true
    T_supply_max_c: 100.0
    T_supply_min_c: 50.0    # overridden per scenario (T_VL_min)
    T_outdoor_low_c: -15.0
    T_outdoor_high_c: 30.0
    # k slope is applied externally in scenario_runner.py via compute_heizkurve()

  nodes:
    # 2026-08-06: full pressure stack injected from the DXF pressure investigation
    # (configs/pressure/Memmingen_pressure_stations.yaml + pandapipes cross-check):
    #   n_transfer_stations = real DXF station counts per lumped node
    #   pressure.lateral_length_m = DXF-traced service-lateral length (m)
    #   lateral_diameter_mm = velocity-sized (<=2 m/s) on the REAL 2025 hourly-mean
    #     per-station peak; omitted = DN32 network default. j_12/j_15 sized one step
    #     past 2 m/s (long laterals) -- REVIEW their length vs DXF.
    #   min_required_bar 2.0 at consumers; setpoint_bar 6.38 at producers j_9/j_12.
    # Plant portfolio moved j_1 -> j_9 (real Energiezentrale).
    j_1:
      consumers:
        - column: "V_1_demand_MWth"
      n_transfer_stations: 31
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 1201
    j_2:
