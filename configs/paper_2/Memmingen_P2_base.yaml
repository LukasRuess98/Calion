        lateral_length_m: 117
    j_11:
      consumers:
        - column: "V_18_demand_MWth"
      n_transfer_stations: 1
      lateral_diameter_mm: 50   # velocity-sized: ~285 kW / 1 station -> 1.8 m/s
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 10
    j_12:
      # WP + EK at the waste-heat node per spec §3.3 / Paper 1 (J12). Secondary
      # 'mixed' producer -- own pump-boosted floor. setpoint_bar 6.38 matches the
      # pandapipes-validated real operating pressure (investigation Teil 1/2).
      assets: [hp_main, eboiler_main]
      consumers:
        - column: "V_19_demand_MWth"
        - column: "V_20_demand_MWth"
        - column: "V_21_demand_MWth"
      n_transfer_stations: 4
      lateral_diameter_mm: 65   # long lateral (442 m): sized 1 step past 2 m/s -> ~0.31 bar. REVIEW length vs DXF.
      pressure:
        setpoint_bar: 6.38
        lateral_length_m: 442
    j_13:
      consumers:
        - column: "V_22_demand_MWth"
        - column: "V_23_demand_MWth"
        - column: "V_24_demand_MWth"
      n_transfer_stations: 15
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 686
    j_14:
      consumers:
        - column: "V_25_demand_MWth"
        - column: "V_26_demand_MWth"
      n_transfer_stations: 5
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 42
    j_15:
      consumers:
        - column: "V_27_demand_MWth"
      n_transfer_stations: 1
      lateral_diameter_mm: 50   # long lateral (287 m): sized 1 step past 2 m/s -> ~0.40 bar. REVIEW length vs DXF.
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 287

  pipes:
    # 2026-08-06: pipe topology + dimensions adopted WHOLESALE from the DXF-correct
    # pressure investigation (configs/pressure/Memmingen_pressure_stations.yaml) --
    # the authoritative DXF trace (incl. the Doppelrohrleitung layer) that the
    # pandapipes cross-check actually validated. SUPERSEDES the earlier 2026-07-07
    # calibration that used to live here. Two branches re-attached vs. the old set:
    #   * j_4 subtree now hangs off j_12 (was j_3): j12_to_j4
    #   * j_13 subtree now hangs off j_11 (was j_12): j11_to_j13
    # and most trunk lengths/diameters were revised. Flow directions point OUTWARD
    # from the j_9 producer (j9_to_j3 -> j3_to_j2 -> j2_to_j1 toward the j_1 leaf).
    j2_to_j1:
      from: j_2
      to: j_1
      length_m: 1150
