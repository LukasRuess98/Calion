# =============================================================================
# PAPER 2 — Memmingen Investment Optimization (Base Config)
# =============================================================================
# Extends Memmingen_L3_MILP.yaml with:
#   - Investment variables for WP (hp_main), EK (eboiler_main), TES (tes_main)
#   - CAPEX annualization via ANF(i, n) in InvestmentCalculator
#   - Geometric TES sizing (V_TES, h_TES) via GeometricStorageBlock
#   - Heating curve parameters (k, T_VL_min) provided per scenario by scenario_runner.py
#   - Waste heat integration (T_source(t) precomputed before MILP)
#   - DSM flexible consumers (configured per scenario)
#
# TES location: PLACEHOLDER — set to node_s1 / node_s2 in scenarios.yaml
# Heat curve: PLACEHOLDER — k and T_VL_min provided by scenario_runner.py override
#
# Usage: scenario_runner.py loads this and applies per-scenario overrides.
# =============================================================================

site:
  input_xlsx: "data/Import_Data_Memmingen_epronet_cleaned.xlsx"  # 2026-07-07: quality-flag cleaned, see memory project_memmingen_dxf_crosscheck
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  name: "Memmingen P2 Investment Optimization"
  description: "Investment optimization for WP, EK, TES on Memmingen 15-node network"
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: "2025-01-01 00:00"
    end: "2025-12-31 23:00"

# --------------------------------------------------------------------------
# Network (15-node Memmingen — identical topology to Paper 1 L3)
# --------------------------------------------------------------------------
network:
  milp_linearize: true
  # j_12 hosts HP/EK (spec §3.3: WP/EK fest bei der Abwärme, Memmingen = j_12) and
  # becomes a 'mixed' node — only j_1 keeps the fixed P_supply setpoint, j_12 floats.
  primary_producer: "j_1"
  # 2026-07-08: McCormick L3+ temperature propagation DISABLED -- at 8760 h it
  # made the model ~6M rows (barrier root LP couldn't solve, no incumbent; see
  # report Part E.1). Spatial supply-temperature DROP is now applied instead as
  # a per-node T_supply_offset_c (cumulative heat loss from the plant),
  # precomputed in scenario_runner._apply_spatial_temperature_offsets -- keeps
  # T a Param (solvable L3 size) while still showing the node-to-node drop.
  temperature_propagation: false
  # 2026-07-08: reverted from 100.0 (capacity bypass) to a realistic value now
  # that demand data is quality-cleaned and pipe diameters are DXF-real -- also
  # makes transport_delay's flow-based bucket computation meaningful again
  # (see memory project_memmingen_dxf_crosscheck / plan greedy-wandering-alpaca).
  max_velocity_m_s: 2.5
  parameters:
    max_velocity_m_s: 2.5   # passed to pipe_pair enriched_config via self.parameters
  state_validation:
    flow_constraints:
      max_velocity_m_s: 2.5   # passed to state_constraints velocity Pyomo constraint
  physics:
    heat_loss: true
    pressure_drop: true
    transport_delay: true
    tes_pressure_coupling: true   # F4: TES hydrostatic head + charge/discharge Δp → node pressure

  supply_temp_c: 86.0        # overridden per scenario via heating curve
  return_temp_c: 63.6
  ground_temp_c: 10
  min_supply_delta_T_k: 10.0  # minimum T_supply − T_return for consumer substation operation (VDI 6002)
  consumer_min_temp_c: 73.6   # = T_return + 10 K; scenario_runner warns if T_VL drops below this

  heating_curve:
    enabled: true
    T_supply_max_c: 100.0
    T_supply_min_c: 50.0    # overridden per scenario (T_VL_min)
    T_outdoor_low_c: -15.0
    T_outdoor_high_c: 30.0
    # k slope is applied externally in scenario_runner.py via compute_heizkurve()

  nodes:
    j_1:
      assets: [chp_main, tes_main, biomass_main, gasboiler_main]
      consumers:
        - column: "V_1_demand_MWth"
    j_2:
      consumers:
        - column: "V_2_demand_MWth"
    j_3:
      consumers:
        - column: "V_3_demand_MWth"
    j_4:
      consumers:
        - column: "V_4_demand_MWth"
        - column: "V_5_demand_MWth"
        - column: "V_6_demand_MWth"
        - column: "V_7_demand_MWth"
    j_5:
      consumers:
        - column: "V_8_demand_MWth"
        - column: "V_9_demand_MWth"
    j_6:
      consumers:
        - column: "V_10_demand_MWth"
        - column: "V_11_demand_MWth"
        - column: "V_12_demand_MWth"
    j_7:
      consumers:
        - column: "V_13_demand_MWth"
    j_8:
      consumers:
        - column: "V_14_demand_MWth"
    j_9:
      consumers:
        - column: "V_15_demand_MWth"
        - column: "V_16_demand_MWth"
    j_10:
      consumers:
        - column: "V_17_demand_MWth"
    j_11:
      consumers:
        - column: "V_18_demand_MWth"
    j_12:
      # WP + EK at the waste-heat node per spec §3.3 / Paper 1 (J12)
      assets: [hp_main, eboiler_main]
      consumers:
        - column: "V_19_demand_MWth"
        - column: "V_20_demand_MWth"
        - column: "V_21_demand_MWth"
    j_13:
      consumers:
        - column: "V_22_demand_MWth"
        - column: "V_23_demand_MWth"
        - column: "V_24_demand_MWth"
    j_14:
      consumers:
        - column: "V_25_demand_MWth"
        - column: "V_26_demand_MWth"
    j_15:
      consumers:
        - column: "V_27_demand_MWth"

  pipes:
    # Längen/Durchmesser 2026-07-07 aus DXF-Bestandsplan (configs/memmingen/2026-07-06_MM-Nord_Bestand_FW.dxf)
    # rekalibriert, gleiche Werte wie configs/memmingen/Memmingen_L3_MILP.yaml (siehe memory
    # project_memmingen_dxf_crosscheck). Nur hoch/mittel-Konfidenz-Äste (j1_to_j2 ... j9_to_j10)
    # aktualisiert; j10_to_j11 abwärts unverändert (Matching dort nicht belastbar).
    j1_to_j2:
      from: j_1
      to: j_2
      length_m: 1180
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j2_to_j3:
      from: j_2
      to: j_3
      length_m: 513
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j3_to_j4:
      from: j_3
      to: j_4
      length_m: 116
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j3_to_j9:
      from: j_3
      to: j_9
      length_m: 83
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j4_to_j5:
      from: j_4
      to: j_5
      length_m: 728
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j5_to_j6:
      from: j_5
      to: j_6
      length_m: 159
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j5_to_j7:
      from: j_5
      to: j_7
      length_m: 50
      diameter_mm: 65
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j7_to_j8:
      from: j_7
      to: j_8
      length_m: 120
      diameter_mm: 65
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j9_to_j10:
      from: j_9
      to: j_10
      length_m: 464
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j10_to_j11:
      from: j_10
      to: j_11
      length_m: 230
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j11_to_j12:
      from: j_11
      to: j_12
      length_m: 250
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j12_to_j13:
      from: j_12
      to: j_13
      length_m: 220
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j13_to_j14:
      from: j_13
      to: j_14
      length_m: 180
      diameter_mm: 125
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j13_to_j15:
      from: j_13
      to: j_15
      length_m: 125
      diameter_mm: 100
      u_value_supply_w_per_m_k: 1.31
      u_value_return_w_per_m_k: 1.40

# --------------------------------------------------------------------------
# Assets — INVESTABLE (Paper 2: capacity is optimized)
# --------------------------------------------------------------------------
assets:
  chp_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 0.20           # fixed (existing CHP, not optimized)
    thermal_efficiency: 0.80
    el_eff: 0.40
    min_load: 0.3

  gasboiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 13.0           # fixed backup
    thermal_efficiency: 0.90
    min_load: 0.1

  biomass_main:
    type: thermal_generator
    fuel: biomass
    capacity_mw: 3.3            # fixed
    thermal_efficiency: 0.85
    min_load: 0.1

  eboiler_main:
    type: p2h
    capacity_mw: 5.0            # INITIAL — overridden by investment optimizer
    efficiency: 0.95
    min_load: 0.1
    investment:
      enabled: true
      capex_eur_per_mw: 150000.0   # 150 €/kW (VDI 2067)
      activation_cost_eur: 20000.0
      lifetime_years: 25.0
      capacity_min_mw: 0.0
      capacity_max_mw: 20.0

  hp_main:
    type: heat_pump
    capacity_mw: 0.0            # INITIAL — overridden by investment optimizer
    min_load: 0.2
    wrg_source_column: "WRG_1 °C"
    wrg_capacity_column: "WRG1Q MW"
    cop_default: 3.0
    investment:
      enabled: true
      capex_eur_per_mw: 700000.0   # 700 €/kW (VDI 2067)
      activation_cost_eur: 50000.0
      lifetime_years: 20.0
      capacity_min_mw: 0.0
      capacity_max_mw: 30.0

  tes_main:
    type: geometric_storage
    # Scenario ΔT = T_VL_min − T_return (worst-case corridor, not the mean);
    # overridden per HK stage by scenario_runner.py.
    delta_T_scenario_k: 10.4    # HK0 baseline: 74 − 63.6 = 10.4 K worst-case at runtime; static fallback only
    r_hd: 3.0                   # h/d aspect ratio (tall tank, good stratification)
    p_max_bar: 10.0             # max vessel operating pressure
    V_min_m3: 5.0               # minimum tank volume if built [m³]
    V_max_m3: 50000.0            # max tank volume [m³]
    option_b: false             # Option A: V as single Var; h/d back-calculated post-solve
    alpha_tes_eur_per_m3: 500.0 # variable CAPEX [€/m³]
    beta_tes_eur: 50000.0       # fixed CAPEX (engineering, connections) [€]
    lifetime_years: 30.0
    eff_charge: 0.98
    eff_discharge: 0.98
    loss_hour: 0.9999
    soc0_fraction: 0.5
    power_to_energy_ratio: 0.25 # P_max = 25% × E_max (full discharge in ~4 h)
    terminal_soc_fraction: 0.5
    # Dead-volume floor: stratified hot-water tanks can't fully discharge —
    # diffuser placement and pump NPSH require some minimum water level.
    # 5% is a generic literature range (typically 5-10%), not a measured
    # value for this specific tank; revisit if real commissioning data
    # becomes available.
    e_min_fraction: 0.05
    cycling_cost_eur_per_mwh: 2.0

# --------------------------------------------------------------------------
# Heat Pump COP Model (same as Paper 1 — extended by scenario_runner.py
# to use T_VL(t) from heating curve and T_source(t) from waste heat)
# --------------------------------------------------------------------------
heat_pumps:
  cop:
    sink_defaults:
      Tsink_out_K: 353.15    # 80°C default — overridden per scenario by T_VL(t)
      Tsink_in_K: 323.15
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 3.0
  types:
    standard:
      eta: 0.6
      FQ: 0.10

# --------------------------------------------------------------------------
# Investment Economics (Paper 2 ANF parameters)
# --------------------------------------------------------------------------
investment:
  discount_rate: 0.05          # i = 5% (VDI 2067 / WACC typical)
  # Lifetimes are specified per asset in investment sections above

# --------------------------------------------------------------------------
# Grid, Fuels, Costs (same as Paper 1 baseline)
# --------------------------------------------------------------------------
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  # Volumetric grid cost = MS Arbeitspreis (>=2500 h/a band ~0.5-2.0 ct/kWh) + 2026 levies:
  # KWKG 0.446 + Offshore 0.941 + BesAR/§19 0.05 (>1 GWh tranche) ct/kWh
  # + Konzessionsabgabe Sondervertrag 0.11 + Stromsteuer 0.05 (Prod. Gewerbe) => ~2.5 ct/kWh
  gridcost_eur_mwh: 25.0
  # Jahresleistungspreis on peak grid import (P_buy_peak), MS level >=2500 h/a band.
  # 2026 published sheets span 67-167 k€/MW·a; 127.24 k€/MW·a = real 2022/23 tariff
  # from the SB notebook — mid-range of 2026 values, kept for continuity.
  demand_charge_eur_per_mw_y: 127240.0

fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0
  biomass:
    price_eur_mwh: 40.0
    ef_kg_per_mwh_fuel: 20.0

costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 1000.0

# Emission factors for CO2 KPI calculation
emissions:
  ef_el_kg_per_mwh: 400.0       # Grid electricity (DEA 2025 average)
  ef_gas_kg_per_mwh: 200.0
  ef_biomass_kg_per_mwh: 20.0

# --------------------------------------------------------------------------
# Run Settings
# --------------------------------------------------------------------------
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    MIPGap: 0.005
    TimeLimit: 86400
    MIPFocus: 1
    Heuristics: 0.5
    NumericFocus: 2
    OutputFlag: 1
    LogToConsole: 1

# --------------------------------------------------------------------------
# Output
# --------------------------------------------------------------------------
output:
  log_dir: "output/logs"
  export_dir: "output/paper2_runs"
  export_thermal_network: true
  export_solver_solution: true

# --------------------------------------------------------------------------
# Dispatch Series Map
# Explicit routing of result_collector series keys to dispatch_hourly.csv columns.
# For Memmingen all keys are in the primary MAIN-convention lookups, so this map
# is informational only — the fallback loop in write_dispatch_hourly() never fires
# for Memmingen series. Future networks should add their own map.
# --------------------------------------------------------------------------
dispatch_series_map:
  CHP_MAIN_Q_th_MW:      Q_chp_MW
  BIOMASS_MAIN_Q_th_MW:  Q_biomass_MW
  GASBOILER_MAIN_Q_th_MW: Q_gasboiler_MW
  hp_main_Q_th_MW:       Q_hp_total_MW
  EBOILER_MAIN_Q_th_MW:  Q_ek_MW
  P2H_Q_th_MW:           Q_ek_MW
