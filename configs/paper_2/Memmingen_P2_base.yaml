        - column: "V_11_demand_MWth"
        - column: "V_12_demand_MWth"
      n_transfer_stations: 3
      lateral_diameter_mm: 40   # velocity-sized: ~168 kW / station -> 1.6 m/s
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 107
    j_7:
      consumers:
        - column: "V_13_demand_MWth"
      n_transfer_stations: 5
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 1075
    j_8:
      consumers:
        - column: "V_14_demand_MWth"
      n_transfer_stations: 3
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 60
    j_9:
      # Real "Energiezentrale" -- all 5 Wilo pumps + central generators. Primary
      # producer with the fixed P_supply setpoint. Portfolio moved here from j_1.
      assets: [chp_main, tes_main, biomass_main, gasboiler_main]
