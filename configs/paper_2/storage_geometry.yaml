# ─────────────────────────────────────────────────────────────────────────────
# Paper 2 v3 — atmospheric thermal-storage geometry & cost parameters
# ─────────────────────────────────────────────────────────────────────────────
# STORAGE-TECHNOLOGY DECISION (author, 2026-09-04): ONE technology, atmospheric
# steel hot-water TANK, is the single basis for BOTH networks and all 62 runs.
# Pit/PTES is removed entirely (MM ~120 m³ and SB ~50k m³ both lie outside the
# regime for which excavated pit stores are built). Pressurized is kept ONLY as a
# Study-G sensitivity (ceiling lifted, ASME cost curve, 5000 m³/vessel cap), not a
# factor. This REPLACES the earlier "HYBRID BY SCALE" fassung (MM pressurized /
# SB pit), which is stale.
#
# COST CURVE — degressive, one function for both nets, PER-TANK evaluation:
#   C = N · C_unit(V/N),  N = ceil(V/unit),  C_unit(v) = c0·(v/v0)^b
#   so the curve is only ever evaluated at the per-tank volume v = V/N ≤ unit,
#   never the whole farm — a multi-tank SB store pays the single-vessel price N×,
#   NOT a large-scale discount it would not physically get. (geometric_storage.py
#   applies this per ladder rung as a constant selected by the size binary → linear.)
#
#   Anchor (confirmed): 10,000 m³ → 250 €/m³  →  c0 = 2.5 M€ at v0 = 10,000 m³.
#     Source: IEA-DHC Annex XII (TTES 100–400 €/m³, size-degressive). Corroborated:
#     ASME 2025 "Cost Analysis for Large TES Systems" / SPF Institute — atmospheric
#     tanks 220–400 USD/m³, >7500 m³ below 200 USD/m³; IEA-ES Fact Sheet Sensible
#     Water (2024) ~210 €/m³. Vendor figures deliberately NOT used.
#   Exponent b = 0.70 — chosen from MATERIAL SCALING, not a 2-point fit: a tank's
#     cost is dominated by shell+insulation SURFACE ∝ V^(2/3) (→ 0.667); adding
#     volume-proportional BoP (foundation, water, controls) lifts it modestly to
#     0.70. Inside the literature band 0.65–0.75, BELOW the 0.776 two-point value,
#     so it does not overstate large-scale economy of scale. The ASME regression
#     (C ∝ V^1.10, R²=0.66) is too noisy/super-linear to use as an exponent; the
#     F2 CAPEX band is reconstructed post-hoc for b∈{0.65, 0.776} from the SAME
#     solves (CAPEX per rung is an additive constant — no extra runs).
#   Cost scope = TURNKEY / total-installed (incl. BoP): therefore beta_tes = 0
#     (no separate fixed per-tank cost; it is already inside €/m³). Documented in T2.
# ─────────────────────────────────────────────────────────────────────────────

storage_geometry:
  # ── TECHNOLOGY DEFAULT (author decision 2026-09-21, v3.2) ────────────────────
  # The atmospheric steel tank is the STANDARD for every scenario and both networks. It is set HERE
  # (config), not by an environment variable. A pressurized store is only available explicitly, per
  # scenario, with `tes_technology: pressurized` in scenarios.yaml (Study G). The env flag
  # CALION_ATMOSPHERIC_TES is only a LEGACY A/B switch (=0 -> pressurized, needs CALION_ALLOW_LEGACY_TES=1).
  tes_technology: atmospheric
  # ── Model selectors (BOTH networks) ─────────────────────────────────────────
  loss_model: "surface"      # surface standing loss (endorsed enhancement)
  cost_model: "degressive"   # per-tank degressive curve (see header); NOT linear

  # ── Geometry ────────────────────────────────────────────────────────────────
  r_hd: 2.0                   # h/d; tall stratified steel tank. k(2)/k(1)≈1.05 (small surface penalty)
  eta_strat: 0.85            # usable fraction of ρ·c_p·V·ΔT (thermocline/mixing); Danish TTES/PTES monitoring, DEA Tech Data
  u_value_w_m2k: 0.20        # effective standing-loss coefficient (walls+lid), 0.15–0.30 (IEA-DHC Annex XII); midpoint

  # ── Store temperature (atmospheric ceiling) — ACTIVE, technology property ────
  t_store_max_c: 95.0        # atmospheric ceiling (<100°C boiling). Clips hot-charge ΔT AND drives the discharge mask
                             # (T_VL(t)>95°C → no discharge that hour). HOT = min(T_VL,max, 95): MM 95 (vs 100), SB 95 (vs 122).
  t_amb_c: 10.0              # ground/ambient annual mean for standing-loss ΔT

  # ── Degressive CAPEX  C_unit(v) = c0·(v/v0)^b, evaluated PER TANK ────────────
  c0_eur: 2500000.0          # 250 €/m³ × 10,000 m³ (anchor); IEA-DHC Annex XII
  v0_m3: 10000.0
  exponent_b: 0.70           # material scaling (surface V^2/3 + BoP); band 0.65–0.75
  # V2c (2026-09-30, docs SS4bt) SUPERSEDES V2b's 1,778 (itself derived from a
  # pressure-vessel formula that does not apply to atmospheric EN14015/API650
  # tanks, see the per_asset block below for the full correction). Now an
  # explicit max_tank_m3 = 50,000 m³, justified by a real reference plant
  # (Wärmespeicher Reuter West, Berlin: 56,000 m³ single atmospheric tank, in
  # commercial operation since 2023), not a formula. This top-level default is
  # NOT actually read at runtime for either network (both network YAMLs set
  # their own unit_tank_m3 directly, which wins -- kept here only as a
  # consistent reference/default).
  unit_tank_m3: 50000.0      # realistic single atmospheric steel vessel (Reuter West precedent); larger V → N=ceil(V/unit) identical tanks
  v_min_realistic_m3: 50.0   # smallest realistic standalone insulated steel buffer; with beta=0 this floor blocks
                             # unphysical micro-stores (positive rungs below it are dropped). Only MM ever nears it.

  # ── Fixed O&M (V3, 2026-09-30, docs SS4bw) ──────────────────────────────────
  # Previously ABSENT (S1-Audit-Befund, docs SS4bo). Engineering estimate (0.5%/yr
  # of built CAPEX) -- unlike HP/EK's om_eur_per_mw_year (DEA-sourced, see
  # Stadtbach_topo.yaml/Memmingen_P2_base.yaml's hp_sb/ek_sb comments), no clean
  # large-TTES fixed-O&M figure was found in the DEA Technology Catalogue used for
  # those two. Passive steel vessel (inspection, corrosion protection, insulation
  # upkeep) -> lower than active machinery (HP/EK), consistent with typical TES
  # literature O&M ranges (0.3-1%/yr). Injected into both tes_main/tes_sb via the
  # same top-level-default mechanism as c0_eur/v0_m3/exponent_b (scenario_runner.py
  # setdefault loop) -- read directly (NOT via per_asset) in component_assembler.py.
  om_pct_of_capex_per_year: 0.005

  # ── Per-network ladders + non-binding envelopes ─────────────────────────────
  # SAME technology, SAME cost function; the ONLY per-network differences are the
  # size ladder (bracketing each net's knee with ≥2× reach) and the total-volume
  # cap (non-binding — cost + value saturation pick the size, not the cap).
  #
  # V2c (2026-09-30, docs SS4bt, author instruction) SUPERSEDES V2b's p_max_bar=3.0
  # bar / unit_tank_m3=1,778 "correction" above -- that correction was ITSELF
  # WRONG, not just the original 100-bar-numeric-disable value it replaced. The
  # error: V2b applied PRESSURE-VESSEL sizing logic (a max height derived from
  # "how tall a water column can this design pressure support") to an
  # ATMOSPHERIC, flat-bottomed, EN 14015 / API 650 class tank -- but that tank
  # TYPE has NO such volume ceiling from a strength/pressure formula at all; its
  # walls are engineered via hoop stress (thickness increasing with depth) to
  # carry WHATEVER hydrostatic load a given height produces, with no upper
  # "pressure rating" the way a sealed pressure vessel has. Real single
  # atmospheric tanks routinely reach tens of thousands of m³: Wärmespeicher
  # Reuter West, Berlin (Vattenfall, commercial operation since April 2023) is
  # ONE tank, 56,000 m³ (56 million litres), 45 m tall, 43 m diameter, 2.6 GWh,
  # hydrostatic base pressure ≈4.4 bar -- flatly refuting V2b's 1,778 m³
  # "maximum". V2b's own "storage was underpriced 1.4-1.7x" conclusion is
  # WITHDRAWN as a direct consequence (see SS4bt).
  #
  # Fix: the pressure-derived height/volume bound is REMOVED for the atmospheric
  # technology (p_max_bar set back to a large, explicitly-non-binding value --
  # NOT because "atmospheric = no pressure" as V2b's predecessor comment wrongly
  # implied, but because pressure-derived HEIGHT SIZING simply does not apply to
  # this tank type's engineering method at all). In its place: an explicit
  # max_tank_m3 parameter (mapped directly onto unit_tank_m3, the field this
  # code already reads), justified by siting/reference-plant precedent rather
  # than a physics formula -- 50,000 m³ per tank, sourced from Reuter West
  # (rounded down from its real 56,000 m³ for a small margin), with height/
  # diameter as a DOCUMENTED design assumption (H/D≈1, matching Reuter West's
  # 45m/43m≈1.05 -- NOTE this differs from this file's own r_hd=2.0 stratification
  # parameter used elsewhere in the model, a separate, unchanged choice; not
  # reconciled here, out of V2c's scope). Costs remain EXCLUSIVELY from the
  # existing empirical curve C=N·c0·((V/N)/v0)^b -- no wall-thickness-derived
  # costing, consistent with V2c's explicit instruction not to derive cost from
  # a strength formula either. HYDRAULIC DECOUPLING rationale (V2b, still valid):
  # the atmospheric buffer connects via a heat exchanger / own low-pressure
  # circuit, independent of the 16-bar network pressure; already included in the
  # turnkey c0/m³ anchor. Pressurized variant KEEPS its own pressure-vessel
  # logic (this file's old p_max_bar=100 numeric-disable value, or a genuine
  # high-pressure design), available ONLY as an explicit Study-G sensitivity.
  #
  # COST-CURVE PLAUSIBILITY CHECK (V2c(c)): the >2x deviation reported there was
  # traced (V2e, docs SS4bu) to a citation that never existed in its cited source
  # -- the corrected comparison, built from the source's own real project data,
  # shows the model curve at or below every real project. HOLD LIFTED. See SS4bu.
  #
  # V2f (2026-09-30, docs SS4bu-follow-on, "config hygiene"): p_max_bar below is
  # now a PHYSICALLY REAL value (hydrostatic column of the Reuter-West-matched
  # 45 m design height + margin), not a numeric trick to disable a formula.
  # This is safe only because geometric_storage.py's V_max_effective computation
  # is now STRUCTURALLY decoupled from p_max_bar for the atmospheric technology
  # (new `pressure_limits_size` flag, component_assembler.py passes
  # pressure_limits_size=False whenever tes_technology != 'pressurized') -- an
  # atmospheric, flat-bottomed EN 14015 / API 650 tank is not a pressure vessel;
  # its wall is sized via hoop stress for whatever hydrostatic load its height
  # produces, so there is no "design pressure" that should ever cap its volume.
  # Verified (build-only, no solve): V_max_effective, N_tanks, and CAPEX are
  # bit-for-bit IDENTICAL when p_max_bar is swept 3->100 bar for both tes_sb and
  # tes_main -- see the verification script referenced in SS4bu's V2f entry.
  # Size is governed EXCLUSIVELY by `unit_tank_m3` (= max_tank_m3, Reuter-West-
  # sourced, 50,000 m³, unchanged) and the discrete_energies_mwh ladder below.
  # The pressurized (Study-G) variant is UNTOUCHED: it keeps pressure_limits_size
  # =True and its own real pressure class (network-YAML per-asset p_max_bar,
  # not this file's atmospheric default).
  #
  # Ladders are in USABLE ENERGY [MWh]; volumes are derived at the scenario's ΔT
  # (V = MWh / (eta_strat·ρ·c_p·ΔT)). NOTE: the model's normal-charge store ΔT is
  # floored at T_return+~10 K (≈10 K, not 15 K), so realised volumes are ~1.5× the
  # 15 K back-of-envelope. See LADDER report for exact V/N/cost per rung.
  per_asset:
    tes_main:   # Memmingen — atmospheric steel tank (single vessel across the ladder)
      cost_model: "degressive"
      # V2f: physically real value -- 45 m design height (Reuter West precedent) + margin.
      # h_max(5.5 bar) = (5.5-P_ATM_BAR)*1e5/(RHO_WATER_HOT*G) ≈ 47.1 m using this project's own
      # constants (RHO=971.8 kg/m³ hot water, P_ATM=1.013 bar); exact 45 m needs 5.30 bar, so 5.5
      # bar carries a ~2 m / ~5% margin. STRUCTURALLY non-binding (pressure_limits_size=False for
      # atmospheric, see header) -- this value is now real/reportable, not a disabling trick.
      # An atmospheric, flat-bottomed EN 14015 / API 650 tank is not a pressure vessel: its wall
      # carries whatever hydrostatic load its height produces (hoop stress), so size follows
      # siting/reference-plant precedent (unit_tank_m3 below), never a design-pressure formula.
      p_max_bar: 5.5
      V_max_m3: 5000.0             # non-binding (top rung ~3200 m³ at ΔT≈10 K); MM stays N=1
      r_hd: 2.0
      # storage-hours [0,0.5,1,2,3,4,6,8,10,12,16,22,28] × mean load 1.084 MW
      discrete_energies_mwh: [0, 0.5, 1.1, 2.2, 3.3, 4.3, 6.5, 8.7, 10.8, 13.0, 17.4, 23.9, 30.4]
    tes_sb:     # Stadtbach — atmospheric steel TANK FARM (N=ceil(V/50000) vessels)
      cost_model: "degressive"
      # V2f: same physically real value/derivation as tes_main above (5.5 bar ≈ 47.1 m column,
      # ~45 m design height + margin); structurally non-binding for the atmospheric technology.
      p_max_bar: 5.5
      V_max_m3: 250000.0           # non-binding (top rung reaches ~2× the ~800 MWh knee)
      r_hd: 2.0
      # storage-hours [0,0.5,1,2,3,4,6,8,10,12,16,22,28] × mean load 73.06 MW
      discrete_energies_mwh: [0, 37, 73, 146, 219, 292, 438, 585, 731, 877, 1169, 1607, 2046]
