# ─────────────────────────────────────────────────────────────────────────────
# Paper 2 v3 — atmospheric thermal-storage geometry & cost parameters
# Every value carries its source. See docs/paper_2/submission_pack/00_statements/PHASE1_STORAGE_COST_PARAMS.md
# and WP0_BEFUND.md. These REPLACE the pressurized-vessel assumptions
# (p_max_bar=10 / V_max=5000 m³ / alpha=1200 €/m³) after the atmospheric decision.
# ─────────────────────────────────────────────────────────────────────────────

storage_geometry:
  # ── Model selectors ─────────────────────────────────────────────────────────
  # HYBRID BY SCALE (user decision 2026-09-02, corrects the earlier "atmospheric
  # for both"): storage technology follows network scale, set PER-NETWORK in
  # per_asset below. Global values here are defaults; per_asset overrides win.
  #   Memmingen (small ~2 MWh)  -> pressurized BUFFER: cost_model=linear (ASME
  #     α=1200 €/m³ + β=100k/tank, p_max=10 bar, 5000 m³/vessel cap). Realistic.
  #   Stadtbach (large ~500-800 MWh) -> atmospheric PIT: cost_model=degressive
  #     (one large store, real economies of scale — NOT a farm of pressurised
  #     vessels, which is unrealistic at that scale). This is why the degressive
  #     curve is KEPT for SB and dropped for MM (per-tank β was only right if SB
  #     were pressurised vessels; the pit is one degressive structure).
  loss_model: "surface"      # surface loss applies to BOTH (endorsed enhancement)
  cost_model: "degressive"   # default; MM per_asset overrides to "linear"

  # ── Geometry ────────────────────────────────────────────────────────────────
  # NOTE: the block's aspect-ratio param is `r_hd` (h/d). The per-network asset
  # configs currently set r_hd=3.0, which WINS over this global (setdefault). To
  # apply this value, remove r_hd from the asset config or set it there. (~5% surface effect.)
  r_hd: 2.0                  # h/d; real stratified stores AR=2..4. k(2)/k(1)≈1.05 (surface penalty of stratification is small)
  eta_strat: 0.85            # stratification efficiency (usable fraction of ρ·c_p·V·ΔT). Danish PTES/TTES monitoring; DEA Tech Data
  u_value_w_m2k: 0.20        # effective standing-loss coefficient; PTES lid worse than walls, 0.15–0.30 (IEA-DHC Annex XII); midpoint

  # ── Store temperature (atmospheric ceiling) ─────────────────────────────────
  t_store_max_c: 95.0        # atmospheric store ceiling (<100°C boiling); clips hot-charge, esp. Stadtbach's 122°C supply (WP0 Zusatzbefund A)
  t_amb_c: 10.0              # ground/ambient annual mean for standing-loss ΔT (buried pit / tank surround); refine per site if needed

  # ── Degressive CAPEX  C_inv(V) = c0 * (V/v0)^b ──────────────────────────────
  # Fit to realized Danish PTES: Marstal 10k m³=67 €/m³, Dronninglund 60k=38, Vojens 200k=24.
  # b=0.657 (ln(24/67)/ln(20)); c0 = 67 €/m³ × 10,000 m³ = 670,000 € at v0.
  # Spans tank↔pit scale: ~170 €/m³ @600 m³ (Memmingen) → ~40 €/m³ @47k m³ (Stadtbach).
  # NOTE: fit on 10k–200k m³ pit data; <10k m³ is an extrapolation (flag in T2; refine with a TTES anchor in Phase 2).
  c0_eur: 670000.0
  v0_m3: 10000.0
  exponent_b: 0.657

  # ── Per-network atmospheric envelope (OVERRIDES the frozen pressurized caps
  #    when CALION_ATMOSPHERIC_TES=1). Economics-determined, NON-BINDING caps
  #    (user decision 2026-09-02): V_max set well past the observed optima so
  #    degressive cost + value saturation pick the size, not the cap. Round
  #    defaults — adjust freely. Ladders extended to bracket the value-probe
  #    optima (MM ~10 MWh, SB ~500–800 MWh). p_max_bar raised so the pressurized
  #    height limit no longer binds; r_hd lowered for the large pit (SB). ──────
  # Height realism (user 2026-09-02): no giant single vessel — cap the single-
  # unit HEIGHT and realise larger volumes as N units (build 2). unit_tank_m3 =
  # π·h_max³/(4·r_hd²). Verified: across the WHOLE ladder heights stay physical —
  # MM tanks 15–22 m tall (≤ h_max 25 m → 1 tank throughout); SB pit 11–18 m deep,
  # 56–89 m wide (Vojens precedent: 200,000 m³ single pit) → 1 pit throughout.
  per_asset:
    # Ladders use IDENTICAL storage-hour anchors for both networks (consistent):
    # hours = [0, 0.5, 1, 1.5, 2, 3, 4, 6, 8, 12, 16, 22] × mean load, so both
    # resolve fine near their knee (MM ~2 h, SB ~8 h) on the same scheme.
    tes_main:   # Memmingen — PRESSURIZED BUFFER (small, realistic)
      cost_model: "linear"        # ASME α=1200 €/m³ + β=100k/tank (from base config); NOT degressive
      p_max_bar: 10.0             # ASME/PED pressurized vessel (kept, not raised)
      V_max_m3: 5000.0            # ASME per-vessel cap (non-binding: MM optimum ~2 MWh ≈ 140 m³)
      r_hd: 2.0                   # tall buffer tank
      discrete_energies_mwh: [0, 0.5, 1.1, 1.6, 2.2, 3.2, 4.3, 6.5, 8.6, 13.0, 17.3, 23.8]
    tes_sb:     # Stadtbach — ATMOSPHERIC PIT (large, degressive scale economy)
      cost_model: "degressive"    # one large pit, C0·(V/V0)^b (global c0/v0/b)
      p_max_bar: 100.0
      V_max_m3: 120000.0
      r_hd: 0.2                   # shallow, wide pit (depth ≤ ~18 m across the ladder)
      unit_tank_m3: 157080.0      # one pit at max depth 20 m, r_hd=0.2 (V_max<this -> single pit)
      discrete_energies_mwh: [0, 37, 73, 110, 146, 219, 292, 438, 584, 877, 1169, 1607]
