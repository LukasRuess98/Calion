# =============================================================================
# Memmingen — Pressure/Pump Study Config WITH real transfer-station counts
# =============================================================================
# Forked from configs/pressure/Memmingen_pressure.yaml (2026-07-29) to add
# `n_transfer_stations` per node: the real DXF-confirmed number of physical
# Uebergabestationen (Gebaeudeeinfuehrungen) each lumped model node actually
# represents. 

# --- How this is used in the pump/pressure study ----------------------------
# `configs/pressure/Memmingen_pump_pressure_study.ipynb` reads
# `n_transfer_stations` to report, alongside the aggregate
# `station_{node}_P_pump` term, an IMPLIED PER-STATION AVERAGE (aggregate
# flow / pump power at that node divided by n_transfer_stations) -- this does
# NOT change the solved physics or the trunk-level sufficiency conclusion:
# station_{node}_P_pump = delta_p_min_consumer_bar * total_flow_at_node is
# already mathematically independent of how many real parallel stations
# share that flow (equal-Δp parallel branches sum to Δp × total_flow
# regardless of branch count). What the per-station count DOES add is
# visibility into aggregation risk: `min_required_bar` is a claim about the
# worst real station behind a node, and the more real stations a node
# lumps together (up to 35 at j_12 here), the less that single flat number
# is actually verified for every one of them individually.
# =============================================================================

site:
  input_xlsx: "data/Import_Data_Memmingen_epronet_cleaned.xlsx"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  name: "Memmingen Pressure/Pump Study (with station counts)"
  description: "Central vs. decentral pump study, with real station counts"
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: "2025-01-01 00:00"
    end: "2025-12-31 23:00"
    # The notebook overrides this to a shorter test window (3 days / January)
    # for tractable interactive runs -- edit here for a different full-run default.

# --------------------------------------------------------------------------
# Network (15-node Memmingen — identical topology to Memmingen_pressure.yaml)
# --------------------------------------------------------------------------
network:
  milp_linearize: true
  primary_producer: "j_9"
  temperature_propagation: false
  delta_p_min_consumer_bar: 0.6
  lateral_diameter_mm: 32.0
  max_velocity_m_s: 3.0
  parameters:
    max_velocity_m_s: 3.0
  state_validation:
    flow_constraints:
      max_velocity_m_s: 3.0
  physics:
    heat_loss: true
    pressure_drop: true
    transport_delay: true
    tes_pressure_coupling: true
    tes_pressure_mode: same_circuit_buffer
    pressure_regularization: true
    pressure_regularization_epsilon: 0.0001

  supply_temp_c: 86.0
  return_temp_c: 63.6
  ground_temp_c: 10
  pump_efficiency: 0.75
  min_supply_delta_T_k: 15.0
  consumer_min_temp_c: 73.6

  heating_curve:
    enabled: true
    # HK0 stage baked in directly (was scenarios.yaml -> heat_curve_stages.
    # memmingen.HK0). k=1.0 = linear interpolation between T_supply_min_c/
    # max_c vs. outdoor temperature; k<1.0 would be a curved (retrofit)
    # heating curve -- see scenarios.yaml's HK1/HK2 for that pattern if
    # you want to add it here too.
    k: 1.0
    T_supply_max_c: 100.0
    T_supply_min_c: 74.0
    T_outdoor_low_c: -15.0
    T_outdoor_high_c: 30.0

  nodes:
    j_1:
      consumers:
        - column: "V_1_demand_MWth"
      n_transfer_stations: 31 
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 1201
    j_2:
      consumers:
        - column: "V_2_demand_MWth"
      n_transfer_stations: 43
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 1315
    j_3:
      consumers:
        - column: "V_3_demand_MWth"
      n_transfer_stations: 1
      # 2026-08-06: real winter-peak demand here (~760-920 kW through this
      # single station) is far too large for the 32mm code-default lateral
      # -- caused a genuine infeasibility (>17 bar friction vs. 6.38 bar
      # available) in the JAN/MAR windows. DN150 matches the scale of a
      # large single customer connection (comparable to the trunk pipes
      # feeding this node) and brings the friction loss down to ~0.01 bar.
      lateral_diameter_mm: 150
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 73
    j_4:
      consumers:
        - column: "V_4_demand_MWth"
        - column: "V_5_demand_MWth"
        - column: "V_6_demand_MWth"
        - column: "V_7_demand_MWth"
      n_transfer_stations: 7
      # 2026-08-06: flagged by the systematic lateral-loss audit (553 kW peak
      # / 7 stations -> ~3.9 bar friction with the 32mm default). See j_3's
      # comment for the full root cause.
      lateral_diameter_mm: 150
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 377
    j_5:
      consumers:
        - column: "V_8_demand_MWth"
        - column: "V_9_demand_MWth"
      n_transfer_stations: 3
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 319
    j_6:
      consumers:
        - column: "V_10_demand_MWth"
        - column: "V_11_demand_MWth"
        - column: "V_12_demand_MWth"
      n_transfer_stations: 3
      # 2026-08-06: flagged by the systematic lateral-loss audit (941 kW peak
      # / 3 stations -> ~17.6 bar friction with the 32mm default, guaranteed
      # infeasible near peak). See j_3's comment for the full root cause.
      lateral_diameter_mm: 150
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 107
    j_7:
      consumers:
        - column: "V_13_demand_MWth"
      n_transfer_stations: 5
      # 2026-08-06: flagged by the systematic lateral-loss audit (224 kW peak
      # / 5 stations -> ~3.6 bar friction with the 32mm default). See j_3's
      # comment for the full root cause.
      lateral_diameter_mm: 150
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 1075
    j_8:
      consumers:
        - column: "V_14_demand_MWth"
      n_transfer_stations: 3
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 60
    j_9:
      # Real "Energiezentrale" -- all 5 installed Wilo pumps map here (see
      # configs/pressure/Memmingen_componenets_spec/20260729_Netzkomponenten_
      # Spezifikationen.xlsx, sheet "Pumpen").
      assets: [chp_main, tes_main, biomass_main, gasboiler_main]
      consumers:
        - column: "V_15_demand_MWth"
        - column: "V_16_demand_MWth"
      n_transfer_stations: 8
      pressure:
        setpoint_bar: 6.38
        lateral_length_m: 333
    j_10:
      consumers:
        - column: "V_17_demand_MWth"
      n_transfer_stations: 3
      # 2026-08-06: flagged by the systematic lateral-loss audit (392 kW peak
      # / 3 stations -> ~3.3 bar friction with the 32mm default). See j_3's
      # comment for the full root cause.
      lateral_diameter_mm: 150
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 117
    j_11:
      consumers:
        - column: "V_18_demand_MWth"
      n_transfer_stations: 1
      # 2026-08-06: flagged by the systematic lateral-loss audit (450 kW peak
      # through a single station -> ~10.1 m/s, ~3.4 bar friction with the
      # 32mm default). See j_3's comment for the full root cause.
      lateral_diameter_mm: 150
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 10
    j_12:

      # Secondary'mixed' producer -- gets its own pump-boosted P_supply floor, not the
      # fixed setpoint.
      # setpoint_bar=6.38 (2026-08-03): matches primary producer j_9's own
      # setpoint, not an arbitrary pick -- pandapipes' independent nonlinear
      # cross-check (configs/pressure/Memmingen_pandapipes_crosscheck.ipynb,
      # Teil 1/2) found j_12's REAL operating pressure at ~6.36-6.38 bar
      # across a full 12-month/2016-hour sample, essentially identical to
      # j_9's setpoint (real trunk loss from j_9 to this branch is small).
      # Before this, setpoint_bar was never set here, so it fell back to the
      # generic 10.0 bar default -- harmless once the 2026-08-03
      # pressure_regularization topology-fix (network_manager.py) made j_12
      # settle AT its floor instead of an arbitrary head_max ceiling, but
      # that floor was still 3.6 bar higher than reality. This value closes
      # that gap using the pandapipes finding directly, not a guess.
      assets: [eboiler_main]
      consumers:
        - column: "V_19_demand_MWth"
        - column: "V_20_demand_MWth"
        - column: "V_21_demand_MWth"
      n_transfer_stations: 4
      # 2026-08-06: flagged by the systematic lateral-loss audit (1235 kW peak
      # / 4 stations -> ~70 bar friction with the 32mm default -- this is
      # what actually caused the real [JAN] infeasibility, since j_12 is a
      # producer with its own tight head band, not just an open floor).
      lateral_diameter_mm: 150
      pressure:
        setpoint_bar: 6.38
        lateral_length_m: 442
    j_13:
      consumers:
        - column: "V_22_demand_MWth"
        - column: "V_23_demand_MWth"
        - column: "V_24_demand_MWth"
      n_transfer_stations: 15
      # 2026-08-06: flagged by the systematic lateral-loss audit (1747 kW
      # peak / 15 stations -> ~15.5 bar friction with the 32mm default,
      # guaranteed infeasible near peak despite the higher station count).
      # See j_3's comment for the full root cause.
      lateral_diameter_mm: 150
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 686
    j_14:
      consumers:
        - column: "V_25_demand_MWth"
        - column: "V_26_demand_MWth"
      n_transfer_stations: 5
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 42
    j_15:
      consumers:
        - column: "V_27_demand_MWth"
      n_transfer_stations: 1
      # 2026-08-06: flagged by the systematic lateral-loss audit (302 kW peak
      # through a single station -> ~6.8 m/s, ~43.6 bar friction with the
      # 32mm default, guaranteed infeasible near peak). See j_3's comment
      # for the full root cause.
      lateral_diameter_mm: 150
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 287

  pipes:
    # Längen/Durchmesser aus DXF-Bestandsplan (siehe memory
    # project_memmingen_dxf_crosscheck) — identisch zu Memmingen_pressure.yaml.
    j2_to_j1:
      from: j_2
      to: j_1
      length_m: 1150
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j3_to_j2:
      from: j_3
      to: j_2
      length_m: 1200
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j9_to_j3:
      from: j_9
      to: j_3
      length_m: 185
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j12_to_j4:
      from: j_12
      to: j_4
      length_m: 470
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j4_to_j5:
      from: j_4
      to: j_5
      length_m: 560
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j5_to_j6:
      from: j_5
      to: j_6
      length_m: 161
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j5_to_j7:
      from: j_5
      to: j_7
      length_m: 280
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j7_to_j8:
      from: j_7
      to: j_8
      length_m: 450
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j9_to_j10:
      from: j_9
      to: j_10
      length_m: 175
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j10_to_j11:
      from: j_10
      to: j_11
      length_m: 256
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j11_to_j12:
      from: j_11
      to: j_12
      length_m: 108
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j11_to_j13:
      from: j_11
      to: j_13
      length_m: 420
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j13_to_j14:
      from: j_13
      to: j_14
      length_m: 660
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j13_to_j15:
      from: j_13
      to: j_15
      length_m: 914
      diameter_mm: 200
      u_value_supply_w_per_m_k: 1.31
      u_value_return_w_per_m_k: 1.40

# --------------------------------------------------------------------------
# Assets 
# --------------------------------------------------------------------------
assets:
  chp_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 0.20
    thermal_efficiency: 0.80
    el_eff: 0.40
    min_load: 0.3

  gasboiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 13.0
    thermal_efficiency: 0.90
    min_load: 0.1

  biomass_main:
    type: thermal_generator
    fuel: biomass
    capacity_mw: 3.3
    thermal_efficiency: 0.85
    min_load: 0.1

  eboiler_main:
    type: p2h
    capacity_mw: 5.0
    efficiency: 0.99
    min_load: 0.1
    investment:
      enabled: true
      capex_eur_per_mw: 150000.0
      activation_cost_eur: 20000.0
      lifetime_years: 25.0
      capacity_min_mw: 0.0
      capacity_max_mw: 20.0

  hp_main:
    type: heat_pump
    capacity_mw: 0.0
    min_load: 0.2
    wrg_source_column: "WRG_1 °C"
    wrg_capacity_column: "WRG1Q MW"
    cop_default: 3.0
    investment:
      enabled: true
      capex_eur_per_mw: 700000.0
      activation_cost_eur: 50000.0
      lifetime_years: 20.0
      capacity_min_mw: 0.0
      capacity_max_mw: 30.0

  tes_main:
    type: geometric_storage
    delta_T_scenario_k: 10.4
    r_hd: 3.0
    p_max_bar: 10.0
    # Disabled (baked in from MM-S0-HK0's tes_off_mm override) -- this config
    # is a pure pressure/pump study, not a TES investment question.
    V_min_m3: 0.0
    V_max_m3: 0.0
    option_b: false
    discrete_energies_mwh: [0, 1.4, 2.8, 5.6, 8.4, 11.2, 16.8, 22.4, 33.6, 50.4, 67.2]
    unit_tank_m3: 5000.0
    alpha_tes_eur_per_m3: 1200.0
    beta_tes_eur: 100000.0
    lifetime_years: 30.0
    eff_charge: 0.98
    eff_discharge: 0.98
    loss_hour: 0.9999
    soc0_fraction: 0.5
    power_to_energy_ratio: 0.25
    terminal_soc_fraction: 0.5
    e_min_fraction: 0.05
    cycling_cost_eur_per_mwh: 2.0

# --------------------------------------------------------------------------
# Heat Pump COP Model
# --------------------------------------------------------------------------
heat_pumps:
  cop:
    sink_defaults:
      Tsink_out_K: 353.15
      Tsink_in_K: 323.15
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 3.0
  types:
    standard:
      eta: 0.75
      FQ: 0.10

# --------------------------------------------------------------------------
# Investment Economics
# --------------------------------------------------------------------------
investment:
  discount_rate: 0.05

# --------------------------------------------------------------------------
# Grid, Fuels, Costs
# --------------------------------------------------------------------------
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  gridcost_eur_mwh: 25.0
  demand_charge_eur_per_mw_y: 127240.0

fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0
  biomass:
    price_eur_mwh: 40.0
    ef_kg_per_mwh_fuel: 20.0

costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 1000.0

emissions:
  ef_el_kg_per_mwh: 400.0
  ef_gas_kg_per_mwh: 200.0
  ef_biomass_kg_per_mwh: 20.0

# --------------------------------------------------------------------------
# Run Settings
# --------------------------------------------------------------------------
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    MIPGap: 0.005
    TimeLimit: 86400
    Cuts: 2
    MIPFocus: 2
    Heuristics: 0.1
    NumericFocus: 2
    OutputFlag: 1
    LogToConsole: 1

# --------------------------------------------------------------------------
# Output
# --------------------------------------------------------------------------
output:
  log_dir: "output/logs"
  export_dir: "output/pressure_runs"
  export_thermal_network: true
  export_solver_solution: true

# --------------------------------------------------------------------------
# Dispatch Series Map
# --------------------------------------------------------------------------
dispatch_series_map:
  CHP_MAIN_Q_th_MW:      Q_chp_MW
  BIOMASS_MAIN_Q_th_MW:  Q_biomass_MW
  GASBOILER_MAIN_Q_th_MW: Q_gasboiler_MW
  hp_main_Q_th_MW:       Q_hp_total_MW
  EBOILER_MAIN_Q_th_MW:  Q_ek_MW
  P2H_Q_th_MW:           Q_ek_MW
