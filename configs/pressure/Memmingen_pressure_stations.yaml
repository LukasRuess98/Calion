# =============================================================================
# Memmingen — Pressure/Pump Study Config WITH real transfer-station counts
# =============================================================================
# Forked from configs/pressure/Memmingen_pressure.yaml (2026-07-29) to add
# `n_transfer_stations` per node: the real DXF-confirmed number of physical
# Uebergabestationen (Gebaeudeeinfuehrungen) each lumped model node actually
# represents. Everything else (topology, physics, pipe/asset data) is
# UNCHANGED from Memmingen_pressure.yaml -- this file only adds new metadata
# fields the solver does not read; it does not alter the solved physics.
#
# --- Where the numbers come from -------------------------------------------
# `configs/memmingen/2026-07-06_MM-Nord_Bestand_FW.dxf`, layer
# "Fernwaerme.Gebaeudeeinfuehrungen in Betrieb" has two block types, each
# INSERT = one real physical building connection (= one Uebergabestation):
#   FEW_GEBEINF-WOHN on ".Wohngebaeude"     -> 120 residential connections
#   FEW_GEBEINF-WOHN on ".Industriebauten"  ->  54 industrial connections
#   TOTAL = 174 real stations (verified by direct DXF block count, 2026-07-29)
# -- vs. the model's 15 nodes / 27 lumped V_x demand columns: each node here
# already aggregates MANY real stations into one simulated demand series
# (this aggregation was done by the utility when the V_x metering zones were
# originally defined, not introduced by this file).
#
# Per-node counts below are a DEMAND-PROPORTIONAL ESTIMATE, not a verified
# real count per node (that would require a full DXF pipe-graph
# reconstruction matching each of the 174 building points to its branch --
# attempted this session and found only ~58% of the drawn trench forms one
# connected graph after anchor-merging, so a full reconstruction would carry
# real per-branch uncertainty, similar to the tiered-confidence diameter
# work in project_memmingen_dxf_crosscheck). Method used instead, per user
# decision (2026-07-29): each node's share of TOTAL ANNUAL DEMAND (2025,
# `data/Import_Data_Memmingen_epronet_cleaned.xlsx`, summed over that node's
# V_x column(s)) times 174, largest-remainder rounded to hit exactly 174.
# ACKNOWLEDGED LIMITATION: this does NOT correct for residential vs.
# industrial buildings likely having very different specific demand (a node
# whose demand is dominated by one large industrial user will have its count
# systematically OVERESTIMATED by this method; a residential-heavy node
# UNDERESTIMATED) -- no data ties individual buildings to specific V_x
# columns, so this correction isn't currently possible. Treat these numbers
# as order-of-magnitude, not validated per-node counts.
#
# --- How this is used in the pump/pressure study ----------------------------
# `configs/pressure/Memmingen_pump_pressure_study.ipynb` reads
# `n_transfer_stations` to report, alongside the aggregate
# `station_{node}_P_pump` term, an IMPLIED PER-STATION AVERAGE (aggregate
# flow / pump power at that node divided by n_transfer_stations) -- this does
# NOT change the solved physics or the trunk-level sufficiency conclusion:
# station_{node}_P_pump = delta_p_min_consumer_bar * total_flow_at_node is
# already mathematically independent of how many real parallel stations
# share that flow (equal-Δp parallel branches sum to Δp × total_flow
# regardless of branch count). What the per-station count DOES add is
# visibility into aggregation risk: `min_required_bar` is a claim about the
# worst real station behind a node, and the more real stations a node
# lumps together (up to 35 at j_12 here), the less that single flat number
# is actually verified for every one of them individually.
# =============================================================================

site:
  input_xlsx: "data/Import_Data_Memmingen_epronet_cleaned.xlsx"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  name: "Memmingen Pressure/Pump Study (with station counts)"
  description: "Central vs. decentral pump study, with real station counts"
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: "2025-01-01 00:00"
    end: "2025-12-31 23:00"
    # The notebook overrides this to a shorter test window (3 days / January)
    # for tractable interactive runs -- edit here for a different full-run default.

# --------------------------------------------------------------------------
# Network (15-node Memmingen — identical topology to Memmingen_pressure.yaml)
# --------------------------------------------------------------------------
network:
  milp_linearize: true
  # j_9 = primary producer (fixed P_supply setpoint, the network's pressure
  # reference) -- matches the real "Energiezentrale" where all 5 installed
  # Wilo pumps (configs/pressure/Memmingen_componenets_spec) actually sit.
  # j_1 is now a plain dead-end consumer leaf (j_9->j_3->j_2->j_1), not a
  # producer -- updated 2026-07-29 when generation moved from j_1 to j_9.
  # j_12 hosts HP/EK and is a secondary 'mixed' producer (free, pump-boosted
  # P_supply floor).
  primary_producer: "j_9"
  temperature_propagation: false
  # Real value from configs/pressure/Memmingen_componenets_spec/
  # 20260729_Netzkomponenten_Spezifikationen.xlsx, sheet "Uebergabestation"
  # ("min Differenzdruck Waermenetz" AND "Druckverluste" both list 0.6 bar).
  # Set explicitly here so it overrides BOTH of network_manager.py's two
  # independent .get(..., default) reads of this key (0.7 in one place, 0.6
  # in the other, before this session's fix aligned the two defaults to each
  # other without real data to say which was right -- now we have it).
  # NOTE (2026-07-29): this is the Delta-p ONE representative station sees.
  # Since station_{node}_P_pump = delta_p_min_consumer_bar * total_flow, the
  # AGGREGATE figure is invariant to how many real stations (n_transfer_
  # stations below) share that flow in parallel -- see header comment.
  delta_p_min_consumer_bar: 0.6
  # Representative real service-lateral pipe diameter (2026-07-29): DXF AGFW
  # labels at the 174 real building-lateral start points are dominated by
  # DN25-32 (110/146 labeled), so DN32 is used as the shared assumption for
  # every node's `pressure.lateral_length_m` term below (see thermal_node.py's
  # opt-in lateral-loss block + memory project_memmingen_pump_pressure_study).
  lateral_diameter_mm: 32.0
  max_velocity_m_s: 3.0
  parameters:
    max_velocity_m_s: 3.0
  state_validation:
    flow_constraints:
      max_velocity_m_s: 3.0
  physics:
    heat_loss: true
    pressure_drop: true
    transport_delay: true
    tes_pressure_coupling: true
    tes_pressure_mode: same_circuit_buffer
    # Opt-in tie-break (docs/paper_2/CALION_Paper2_Implementation_Statement.md
    # Part H.7): without it, a node's pressure away from any binding
    # constraint is solver-arbitrary within its feasible range. Enabled here
    # since this config's whole purpose is a pressure investigation --
    # verified cost-neutral on this exact network (-0.17% at the campaign's
    # real 0.5% MIP gap, well inside normal solver noise). Fully resolves
    # pressure downstream of the FIXED primary producer (j_1's branch);
    # downstream of the secondary producer j_12, values stay mutually
    # consistent but j_12's own absolute pressure remains an unconstrained
    # (floor-respecting) choice -- see Part H.7 for why that's a scope
    # decision, not a bug.
    pressure_regularization: true
    pressure_regularization_epsilon: 0.0001

  supply_temp_c: 86.0
  return_temp_c: 63.6
  ground_temp_c: 10
  pump_efficiency: 0.75
  min_supply_delta_T_k: 15.0
  consumer_min_temp_c: 73.6

  heating_curve:
    enabled: true
    # HK0 stage baked in directly (was scenarios.yaml -> heat_curve_stages.
    # memmingen.HK0). k=1.0 = linear interpolation between T_supply_min_c/
    # max_c vs. outdoor temperature; k<1.0 would be a curved (retrofit)
    # heating curve -- see scenarios.yaml's HK1/HK2 for that pattern if
    # you want to add it here too.
    k: 1.0
    T_supply_max_c: 100.0
    T_supply_min_c: 74.0
    T_outdoor_low_c: -15.0
    T_outdoor_high_c: 30.0

  nodes:
    j_1:
      #assets: [chp_main, tes_main, biomass_main, gasboiler_main]
      consumers:
        - column: "V_1_demand_MWth"
      # No longer the primary producer (moved to j_9, 2026-07-29) -- now a
      # plain dead-end consumer leaf, same min_required_bar floor as every
      # other consumer node.
      # n_transfer_stations: demand-proportional estimate (242.8 MWh/a ->
      # 2.55% of system total -> 4.44 raw share, rounded).
      n_transfer_stations: 4
      pressure:
        min_required_bar: 2.0
        # E[worst real lateral length | 4 stations], bootstrapped from the
        # 174-building DXF-traced lateral-length distribution (2026-07-29,
        # see memory project_memmingen_pump_pressure_study). DN32 assumed
        # (network.lateral_diameter_mm).
        lateral_length_m: 71.0
    j_2:
      #assets: [chp_main, tes_main, biomass_main, gasboiler_main]
      consumers:
        - column: "V_2_demand_MWth"
      # 134.2 MWh/a -> 1.41% -> 2.46 raw share.
      n_transfer_stations: 2
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 45.8
    j_3:
      consumers:
        - column: "V_3_demand_MWth"
      # 1689.6 MWh/a -> 17.77% -> 30.92 raw share. Largest single-column
      # aggregation in the network -- one V_x meter here stands in for an
      # estimated ~31 real buildings with no internal pipe structure modeled.
      n_transfer_stations: 31
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 206.2
    j_4:
      consumers:
        - column: "V_4_demand_MWth"
        - column: "V_5_demand_MWth"
        - column: "V_6_demand_MWth"
        - column: "V_7_demand_MWth"
      # 781.6 MWh/a -> 8.22% -> 14.30 raw share.
      n_transfer_stations: 14
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 142.4
    j_5:
      consumers:
        - column: "V_8_demand_MWth"
        - column: "V_9_demand_MWth"
      # 331.2 MWh/a -> 3.48% -> 6.06 raw share.
      n_transfer_stations: 6
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 89.2
    j_6:
      consumers:
        - column: "V_10_demand_MWth"
        - column: "V_11_demand_MWth"
        - column: "V_12_demand_MWth"
      # 1321.0 MWh/a -> 13.89% -> 24.18 raw share.
      n_transfer_stations: 24
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 184.5
    j_7:
      consumers:
        - column: "V_13_demand_MWth"
      # 350.3 MWh/a -> 3.68% -> 6.41 raw share.
      n_transfer_stations: 6
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 90.2
    j_8:
      consumers:
        - column: "V_14_demand_MWth"
      # 225.2 MWh/a -> 2.37% -> 4.12 raw share.
      n_transfer_stations: 4
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 70.8
    j_9:
      # Real "Energiezentrale" -- all 5 installed Wilo pumps map here (see
      # configs/pressure/Memmingen_componenets_spec/20260729_Netzkomponenten_
      # Spezifikationen.xlsx, sheet "Pumpen").
      assets: [chp_main, tes_main, biomass_main, gasboiler_main]
      consumers:
        - column: "V_15_demand_MWth"
        - column: "V_16_demand_MWth"
      # 247.9 MWh/a -> 2.61% -> 4.54 raw share. Plant-adjacent buildings.
      n_transfer_stations: 5
      # Now the primary producer's fixed reference pressure. Was 4.8 bar
      # (the 49m Delta-p-c curve level) -- RAISED to 6.38 bar (2026-07-30)
      # after a full-YEAR solve found a genuine infeasibility on 2025-12-15
      # ~12-14h: a previously-inactive meter (V_22, part of j_13's demand,
      # zero all year until Dec 11 -- see project_memmingen_dxf_crosscheck)
      # activates and ramps smoothly to ~1.8 MW with GOOD quality flags (a
      # real new connection or commissioning event, not a sensor artifact --
      # confirmed via Gurobi IIS + raw 15-min data, see memory
      # project_memmingen_pandapipes_crosscheck). At that flow, j_13's
      # quadratic lateral loss + trunk + station losses exceeded what 4.8 bar
      # could supply. 6.38 bar = 65m, the Wilo IL-E 65/11-64 BF's real MAX
      # Delta-p-c envelope (see the PDF in the spec folder) -- the highest
      # setpoint the real installed pump can actually provide, still a real,
      # grounded value, not an arbitrary increase. ASSUMPTION, please
      # confirm against real operating data: does the real pump controller
      # actually switch to this max level during demand spikes like this?
      pressure:
        setpoint_bar: 6.38
        lateral_length_m: 81.1
    j_10:
      consumers:
        - column: "V_17_demand_MWth"
      # 435.8 MWh/a -> 4.58% -> 7.98 raw share.
      n_transfer_stations: 8
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 105.2
    j_11:
      consumers:
        - column: "V_18_demand_MWth"
      # 355.4 MWh/a -> 3.74% -> 6.50 raw share.
      n_transfer_stations: 7
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 97.2
    j_12:
      # WP + EK at the waste-heat node (spec §3.3 / Paper 1 J12). Secondary
      # 'mixed' producer -- gets its own pump-boosted P_supply floor, not the
      # fixed setpoint.
      #
      # setpoint_bar=6.38 (2026-08-03): matches primary producer j_9's own
      # setpoint, not an arbitrary pick -- pandapipes' independent nonlinear
      # cross-check (configs/pressure/Memmingen_pandapipes_crosscheck.ipynb,
      # Teil 1/2) found j_12's REAL operating pressure at ~6.36-6.38 bar
      # across a full 12-month/2016-hour sample, essentially identical to
      # j_9's setpoint (real trunk loss from j_9 to this branch is small).
      # Before this, setpoint_bar was never set here, so it fell back to the
      # generic 10.0 bar default -- harmless once the 2026-08-03
      # pressure_regularization topology-fix (network_manager.py) made j_12
      # settle AT its floor instead of an arbitrary head_max ceiling, but
      # that floor was still 3.6 bar higher than reality. This value closes
      # that gap using the pandapipes finding directly, not a guess.
      assets: [hp_main, eboiler_main]
      consumers:
        - column: "V_19_demand_MWth"
        - column: "V_20_demand_MWth"
        - column: "V_21_demand_MWth"
      # 1905.4 MWh/a -> 20.04% -> 34.87 raw share. Largest aggregation in
      # the whole network -- an estimated ~35 real buildings behind 3 V_x
      # columns here; the min_required_bar=2.0 floor is least-verified for
      # any single one of them at this node.
      n_transfer_stations: 35
      # No min_required_bar (secondary producer, own pump-boosted floor) but
      # the lateral-loss term applies just the same -- highest of any node
      # (largest n_transfer_stations -> statistically most likely to include
      # one of the DXF's long-tail buildings).
      pressure:
        setpoint_bar: 6.38
        lateral_length_m: 217.5
    j_13:
      consumers:
        - column: "V_22_demand_MWth"
        - column: "V_23_demand_MWth"
        - column: "V_24_demand_MWth"
      # 324.7 MWh/a -> 3.42% -> 5.94 raw share.
      n_transfer_stations: 6
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 90.0
      # NOTE: the notebook's "Scenario B" adds a second pump station here by
      # attaching an asset to `assets:` in-memory (cfg_B branch) -- this base
      # YAML deliberately leaves j_13 as a pure consumer (Scenario A / the
      # true baseline). See the notebook's Cell 6 for how that's done.
    j_14:
      consumers:
        - column: "V_25_demand_MWth"
        - column: "V_26_demand_MWth"
      # 790.1 MWh/a -> 8.31% -> 14.46 raw share.
      n_transfer_stations: 15
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 147.3
    j_15:
      consumers:
        - column: "V_27_demand_MWth"
      # 372.6 MWh/a -> 3.92% -> 6.82 raw share.
      n_transfer_stations: 7
      pressure:
        min_required_bar: 2.0
        lateral_length_m: 98.7

  pipes:
    # Längen/Durchmesser aus DXF-Bestandsplan (siehe memory
    # project_memmingen_dxf_crosscheck) — identisch zu Memmingen_pressure.yaml.
    j2_to_j1:
      from: j_2
      to: j_1
      length_m: 1150
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j3_to_j2:
      from: j_3
      to: j_2
      length_m: 1200
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j9_to_j3:
      from: j_9
      to: j_3
      length_m: 185
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j12_to_j4:
      from: j_12
      to: j_4
      length_m: 470
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j4_to_j5:
      from: j_4
      to: j_5
      length_m: 560
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j5_to_j6:
      from: j_5
      to: j_6
      length_m: 161
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j5_to_j7:
      from: j_5
      to: j_7
      length_m: 280
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j7_to_j8:
      from: j_7
      to: j_8
      length_m: 450
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j9_to_j10:
      from: j_9
      to: j_10
      length_m: 175
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j10_to_j11:
      from: j_10
      to: j_11
      length_m: 256
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j11_to_j12:
      from: j_11
      to: j_12
      length_m: 108
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j11_to_j13:
      from: j_11
      to: j_13
      length_m: 420
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j13_to_j14:
      from: j_13
      to: j_14
      length_m: 660
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j13_to_j15:
      from: j_13
      to: j_15
      length_m: 914
      diameter_mm: 200
      u_value_supply_w_per_m_k: 1.31
      u_value_return_w_per_m_k: 1.40

# --------------------------------------------------------------------------
# Assets — same as Memmingen_pressure.yaml, TES investment disabled (baked in
# from the "MM-S0-HK0" scenario's tes_off_mm override — this config is about
# pressure/pumps, not TES sizing).
# --------------------------------------------------------------------------
assets:
  chp_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 0.20
    thermal_efficiency: 0.80
    el_eff: 0.40
    min_load: 0.3

  gasboiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 13.0
    thermal_efficiency: 0.90
    min_load: 0.1

  biomass_main:
    type: thermal_generator
    fuel: biomass
    capacity_mw: 3.3
    thermal_efficiency: 0.85
    min_load: 0.1

  eboiler_main:
    type: p2h
    capacity_mw: 5.0
    efficiency: 0.99
    min_load: 0.1
    investment:
      enabled: true
      capex_eur_per_mw: 150000.0
      activation_cost_eur: 20000.0
      lifetime_years: 25.0
      capacity_min_mw: 0.0
      capacity_max_mw: 20.0

  hp_main:
    type: heat_pump
    capacity_mw: 0.0
    min_load: 0.2
    wrg_source_column: "WRG_1 °C"
    wrg_capacity_column: "WRG1Q MW"
    cop_default: 3.0
    investment:
      enabled: true
      capex_eur_per_mw: 700000.0
      activation_cost_eur: 50000.0
      lifetime_years: 20.0
      capacity_min_mw: 0.0
      capacity_max_mw: 30.0

  tes_main:
    type: geometric_storage
    delta_T_scenario_k: 10.4
    r_hd: 3.0
    p_max_bar: 10.0
    # Disabled (baked in from MM-S0-HK0's tes_off_mm override) -- this config
    # is a pure pressure/pump study, not a TES investment question.
    V_min_m3: 0.0
    V_max_m3: 0.0
    option_b: false
    discrete_energies_mwh: [0, 1.4, 2.8, 5.6, 8.4, 11.2, 16.8, 22.4, 33.6, 50.4, 67.2]
    unit_tank_m3: 5000.0
    alpha_tes_eur_per_m3: 1200.0
    beta_tes_eur: 100000.0
    lifetime_years: 30.0
    eff_charge: 0.98
    eff_discharge: 0.98
    loss_hour: 0.9999
    soc0_fraction: 0.5
    power_to_energy_ratio: 0.25
    terminal_soc_fraction: 0.5
    e_min_fraction: 0.05
    cycling_cost_eur_per_mwh: 2.0

# --------------------------------------------------------------------------
# Heat Pump COP Model
# --------------------------------------------------------------------------
heat_pumps:
  cop:
    sink_defaults:
      Tsink_out_K: 353.15
      Tsink_in_K: 323.15
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 3.0
  types:
    standard:
      eta: 0.75
      FQ: 0.10

# --------------------------------------------------------------------------
# Investment Economics
# --------------------------------------------------------------------------
investment:
  discount_rate: 0.05

# --------------------------------------------------------------------------
# Grid, Fuels, Costs
# --------------------------------------------------------------------------
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  gridcost_eur_mwh: 25.0
  demand_charge_eur_per_mw_y: 127240.0

fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0
  biomass:
    price_eur_mwh: 40.0
    ef_kg_per_mwh_fuel: 20.0

costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 1000.0

emissions:
  ef_el_kg_per_mwh: 400.0
  ef_gas_kg_per_mwh: 200.0
  ef_biomass_kg_per_mwh: 20.0

# --------------------------------------------------------------------------
# Run Settings
# --------------------------------------------------------------------------
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    MIPGap: 0.005
    TimeLimit: 86400
    Cuts: 2
    MIPFocus: 2
    Heuristics: 0.1
    NumericFocus: 2
    OutputFlag: 1
    LogToConsole: 1

# --------------------------------------------------------------------------
# Output
# --------------------------------------------------------------------------
output:
  log_dir: "output/logs"
  export_dir: "output/pressure_runs"
  export_thermal_network: true
  export_solver_solution: true

# --------------------------------------------------------------------------
# Dispatch Series Map
# --------------------------------------------------------------------------
dispatch_series_map:
