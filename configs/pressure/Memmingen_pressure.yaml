# =============================================================================
# Memmingen — Standalone Pressure/Pump Study Config
# =============================================================================
# Self-sufficient copy of configs/paper_2/Memmingen_P2_base.yaml, forked
# 2026-07-24 for the central-vs-decentral pump station investigation
# (configs/pressure/Memmingen_pump_pressure_study.ipynb). Unlike the paper_2
# base config, this file does NOT rely on scripts/paper_2/scenario_runner.py's
# scenario-merge machinery (scenarios.yaml, hp_nodes/dsm_consumers lookups,
# heat_curve_stages) — every value that used to come from a scenario entry is
# baked in directly below, so this config can be loaded and solved standalone.
#
# Baked in from scripts/paper_2/scenarios.yaml's "MM-S0-HK0" entry (the
# baseline this was forked from): heat curve stage HK0 (k=1.0, linear,
# T_VL_min_c=74.0, T_VL_max_c=100.0), HP/EK at j_12 (already the network's
# default location, no relocation needed), TES investment disabled
# (tes_off_mm override: V_min_m3=V_max_m3=0.0), no DSM consumers.
#
# Pressure-study-specific additions (2026-07-24, see docs/paper_2/
# CALION_Paper2_Implementation_Statement.md Part H for the full physics
# reference): explicit j_1 pump setpoint, min_required_bar at every pure
# consumer node, and the opt-in pressure-regularization tie-break enabled
# (validated cost-neutral on this exact network, Part H.7).
#
# Network topology (nodes, pipes, assets) is otherwise IDENTICAL to
# Memmingen_P2_base.yaml — this is still the real 15-node/14-pipe Memmingen
# network, not a simplified stand-in.
# =============================================================================

site:
  input_xlsx: "data/Import_Data_Memmingen_epronet_cleaned.xlsx"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  name: "Memmingen Pressure/Pump Study"
  description: "Central-only vs. central+decentral pump station pressure investigation"
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: "2025-01-01 00:00"
    end: "2025-12-31 23:00"
    # The notebook overrides this to a shorter test window (3 days / January)
    # for tractable interactive runs -- edit here for a different full-run default.

# --------------------------------------------------------------------------
# Network (15-node Memmingen — identical topology to Paper 1 L3 / Paper 2)
# --------------------------------------------------------------------------
network:
  milp_linearize: true
  # j_9 = primary producer (fixed P_supply setpoint, the network's pressure
  # reference) -- matches the real "Energiezentrale" where all 5 installed
  # Wilo pumps (configs/pressure/Memmingen_componenets_spec) actually sit.
  # j_1 is now a plain dead-end consumer leaf (j_9->j_3->j_2->j_1), not a
  # producer -- updated 2026-07-29 when generation moved from j_1 to j_9.
  # j_12 hosts HP/EK and is a secondary 'mixed' producer (free, pump-boosted
  # P_supply floor).
  primary_producer: "j_9"
  temperature_propagation: false
  # Real value from configs/pressure/Memmingen_componenets_spec/
  # 20260729_Netzkomponenten_Spezifikationen.xlsx, sheet "Uebergabestation"
  # ("min Differenzdruck Waermenetz" AND "Druckverluste" both list 0.6 bar).
  # Set explicitly here so it overrides BOTH of network_manager.py's two
  # independent .get(..., default) reads of this key (0.7 in one place, 0.6
  # in the other, before this session's fix aligned the two defaults to each
  # other without real data to say which was right -- now we have it).
  delta_p_min_consumer_bar: 0.6
  max_velocity_m_s: 3.0
  parameters:
    max_velocity_m_s: 3.0
  state_validation:
    flow_constraints:
      max_velocity_m_s: 3.0
  physics:
    heat_loss: true
    pressure_drop: true
    transport_delay: true
    tes_pressure_coupling: true
    tes_pressure_mode: same_circuit_buffer
    # Opt-in tie-break (docs/paper_2/CALION_Paper2_Implementation_Statement.md
    # Part H.7): without it, a node's pressure away from any binding
    # constraint is solver-arbitrary within its feasible range. Enabled here
    # since this config's whole purpose is a pressure investigation --
    # verified cost-neutral on this exact network (-0.17% at the campaign's
    # real 0.5% MIP gap, well inside normal solver noise). Fully resolves
    # pressure downstream of the FIXED primary producer (j_1's branch);
    # downstream of the secondary producer j_12, values stay mutually
    # consistent but j_12's own absolute pressure remains an unconstrained
    # (floor-respecting) choice -- see Part H.7 for why that's a scope
    # decision, not a bug.
    pressure_regularization: true
    pressure_regularization_epsilon: 0.0001

  supply_temp_c: 86.0
  return_temp_c: 63.6
  ground_temp_c: 10
  pump_efficiency: 0.75
  min_supply_delta_T_k: 15.0
  consumer_min_temp_c: 73.6

  heating_curve:
    enabled: true
    # HK0 stage baked in directly (was scenarios.yaml -> heat_curve_stages.
    # memmingen.HK0). k=1.0 = linear interpolation between T_supply_min_c/
    # max_c vs. outdoor temperature; k<1.0 would be a curved (retrofit)
    # heating curve -- see scenarios.yaml's HK1/HK2 for that pattern if
    # you want to add it here too.
    k: 1.0
    T_supply_max_c: 100.0
    T_supply_min_c: 74.0
    T_outdoor_low_c: -15.0
    T_outdoor_high_c: 30.0

  nodes:
    j_1:
      #assets: [chp_main, tes_main, biomass_main, gasboiler_main]
      consumers:
        - column: "V_1_demand_MWth"
      # No longer the primary producer (moved to j_9, 2026-07-29) -- now a
      # plain dead-end consumer leaf, same min_required_bar floor as every
      # other consumer node.
      pressure:
        min_required_bar: 2.0
    j_2:
      #assets: [chp_main, tes_main, biomass_main, gasboiler_main]
      consumers:
        - column: "V_2_demand_MWth"
      pressure:
        min_required_bar: 2.0
    j_3:
      consumers:
        - column: "V_3_demand_MWth"
      pressure:
        min_required_bar: 2.0
    j_4:
      consumers:
        - column: "V_4_demand_MWth"
        - column: "V_5_demand_MWth"
        - column: "V_6_demand_MWth"
        - column: "V_7_demand_MWth"
      pressure:
        min_required_bar: 2.0
    j_5:
      consumers:
        - column: "V_8_demand_MWth"
        - column: "V_9_demand_MWth"
      pressure:
        min_required_bar: 2.0
    j_6:
      consumers:
        - column: "V_10_demand_MWth"
        - column: "V_11_demand_MWth"
        - column: "V_12_demand_MWth"
      pressure:
        min_required_bar: 2.0
    j_7:
      consumers:
        - column: "V_13_demand_MWth"
      pressure:
        min_required_bar: 2.0
    j_8:
      consumers:
        - column: "V_14_demand_MWth"
      pressure:
        min_required_bar: 2.0
    j_9:
      # Real "Energiezentrale" -- all 5 installed Wilo pumps map here (see
      # configs/pressure/Memmingen_componenets_spec/20260729_Netzkomponenten_
      # Spezifikationen.xlsx, sheet "Pumpen").
      assets: [chp_main, tes_main, biomass_main, gasboiler_main]
      consumers:
        - column: "V_15_demand_MWth"
        - column: "V_16_demand_MWth"
      # Now the primary producer's fixed reference pressure. ASSUMPTION,
      # please confirm against real operating data: the installed Dachser
      # pump (Wilo IL-E 65/11-64 BF) is Delta-p-c (constant differential
      # pressure) controlled with several selectable curve levels (11/22/28/
      # 36/43/49m up to a ~65m/100 m3/h max envelope, see the PDF in the same
      # spec folder) -- 49 m was picked here as a representative mid-upper
      # operating point (~4.8 bar) and verified to still clear the 2.0 bar
      # min_required_bar floor at the network's farthest node (j_8, via
      # j_9->j_10->j_11->j_12->j_4->j_5->j_7->j_8, ~2.3 km). Replace with the
      # actual configured curve level if you have it.
      pressure:
        setpoint_bar: 4.8
    j_10:
      consumers:
        - column: "V_17_demand_MWth"
      pressure:
        min_required_bar: 2.0
    j_11:
      consumers:
        - column: "V_18_demand_MWth"
      pressure:
        min_required_bar: 2.0
    j_12:
      # WP + EK at the waste-heat node (spec §3.3 / Paper 1 J12). Secondary
      # 'mixed' producer -- gets its own pump-boosted P_supply floor, not the
      # fixed setpoint. To add a real setpoint_bar for this station, set
      # pressure.setpoint_bar here (defaults to 10.0 bar if omitted).
      assets: [hp_main, eboiler_main]
      consumers:
        - column: "V_19_demand_MWth"
        - column: "V_20_demand_MWth"
        - column: "V_21_demand_MWth"
    j_13:
      consumers:
        - column: "V_22_demand_MWth"
        - column: "V_23_demand_MWth"
        - column: "V_24_demand_MWth"
      pressure:
        min_required_bar: 2.0
      # NOTE: the notebook's "Scenario B" adds a second pump station here by
      # attaching an asset to `assets:` in-memory (cfg_B branch) -- this base
      # YAML deliberately leaves j_13 as a pure consumer (Scenario A / the
      # true baseline). See the notebook's Cell 6 for how that's done.
    j_14:
      consumers:
        - column: "V_25_demand_MWth"
        - column: "V_26_demand_MWth"
      pressure:
        min_required_bar: 2.0
    j_15:
      consumers:
        - column: "V_27_demand_MWth"
      pressure:
        min_required_bar: 2.0

  pipes:
    # Längen/Durchmesser aus DXF-Bestandsplan (siehe memory
    # project_memmingen_dxf_crosscheck) — identisch zu Memmingen_P2_base.yaml.
    j2_to_j1:
      from: j_2
      to: j_1
      length_m: 1150
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j3_to_j2:
      from: j_3
      to: j_2
      length_m: 1200
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j9_to_j3:
      from: j_9
      to: j_3
      length_m: 185
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j12_to_j4:
      from: j_12
      to: j_4
      length_m: 470
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j4_to_j5:
      from: j_4
      to: j_5
      length_m: 560
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j5_to_j6:
      from: j_5
      to: j_6
      length_m: 161
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j5_to_j7:
      from: j_5
      to: j_7
      length_m: 280
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j7_to_j8:
      from: j_7
      to: j_8
      length_m: 450
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j9_to_j10:
      from: j_9
      to: j_10
      length_m: 175
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j10_to_j11:
      from: j_10
      to: j_11
      length_m: 256
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j11_to_j12:
      from: j_11
      to: j_12
      length_m: 108
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j11_to_j13:
      from: j_11
      to: j_13
      length_m: 420
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j13_to_j14:
      from: j_13
      to: j_14
      length_m: 660
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    j13_to_j15:
      from: j_13
      to: j_15
      length_m: 914
      diameter_mm: 200
      u_value_supply_w_per_m_k: 1.31
      u_value_return_w_per_m_k: 1.40

# --------------------------------------------------------------------------
# Assets — same as Memmingen_P2_base.yaml, TES investment disabled (baked in
# from the "MM-S0-HK0" scenario's tes_off_mm override — this config is about
# pressure/pumps, not TES sizing).
# --------------------------------------------------------------------------
assets:
  chp_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 0.20
    thermal_efficiency: 0.80
    el_eff: 0.40
    min_load: 0.3

  gasboiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 13.0
    thermal_efficiency: 0.90
    min_load: 0.1

  biomass_main:
    type: thermal_generator
    fuel: biomass
    capacity_mw: 3.3
    thermal_efficiency: 0.85
    min_load: 0.1

  eboiler_main:
    type: p2h
    capacity_mw: 5.0
    efficiency: 0.99
    min_load: 0.1
    investment:
      enabled: true
      capex_eur_per_mw: 150000.0
      activation_cost_eur: 20000.0
      lifetime_years: 25.0
      capacity_min_mw: 0.0
      capacity_max_mw: 20.0

  hp_main:
    type: heat_pump
    capacity_mw: 0.0
    min_load: 0.2
    wrg_source_column: "WRG_1 °C"
    wrg_capacity_column: "WRG1Q MW"
    cop_default: 3.0
    investment:
      enabled: true
      capex_eur_per_mw: 700000.0
      activation_cost_eur: 50000.0
      lifetime_years: 20.0
      capacity_min_mw: 0.0
      capacity_max_mw: 30.0

  tes_main:
    type: geometric_storage
    delta_T_scenario_k: 10.4
    r_hd: 3.0
    p_max_bar: 10.0
    # Disabled (baked in from MM-S0-HK0's tes_off_mm override) -- this config
    # is a pure pressure/pump study, not a TES investment question.
    V_min_m3: 0.0
    V_max_m3: 0.0
    option_b: false
    discrete_energies_mwh: [0, 1.4, 2.8, 5.6, 8.4, 11.2, 16.8, 22.4, 33.6, 50.4, 67.2]
    unit_tank_m3: 5000.0
    alpha_tes_eur_per_m3: 1200.0
    beta_tes_eur: 100000.0
    lifetime_years: 30.0
    eff_charge: 0.98
    eff_discharge: 0.98
    loss_hour: 0.9999
    soc0_fraction: 0.5
    power_to_energy_ratio: 0.25
    terminal_soc_fraction: 0.5
    e_min_fraction: 0.05
    cycling_cost_eur_per_mwh: 2.0

# --------------------------------------------------------------------------
# Heat Pump COP Model
# --------------------------------------------------------------------------
heat_pumps:
  cop:
    sink_defaults:
      Tsink_out_K: 353.15
      Tsink_in_K: 323.15
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 3.0
  types:
    standard:
      eta: 0.75
      FQ: 0.10

# --------------------------------------------------------------------------
# Investment Economics
# --------------------------------------------------------------------------
investment:
  discount_rate: 0.05

# --------------------------------------------------------------------------
# Grid, Fuels, Costs
# --------------------------------------------------------------------------
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  gridcost_eur_mwh: 25.0
  demand_charge_eur_per_mw_y: 127240.0

fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0
  biomass:
    price_eur_mwh: 40.0
    ef_kg_per_mwh_fuel: 20.0

costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 1000.0

emissions:
  ef_el_kg_per_mwh: 400.0
  ef_gas_kg_per_mwh: 200.0
  ef_biomass_kg_per_mwh: 20.0

# --------------------------------------------------------------------------
# Run Settings
# --------------------------------------------------------------------------
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    MIPGap: 0.005
    TimeLimit: 86400
    Cuts: 2
    MIPFocus: 2
    Heuristics: 0.1
    NumericFocus: 2
    OutputFlag: 1
    LogToConsole: 1

# --------------------------------------------------------------------------
# Output
# --------------------------------------------------------------------------
output:
  log_dir: "output/logs"
  export_dir: "output/pressure_runs"
  export_thermal_network: true
  export_solver_solution: true

# --------------------------------------------------------------------------
# Dispatch Series Map
# --------------------------------------------------------------------------
dispatch_series_map:
  CHP_MAIN_Q_th_MW:      Q_chp_MW
  BIOMASS_MAIN_Q_th_MW:  Q_biomass_MW
  GASBOILER_MAIN_Q_th_MW: Q_gasboiler_MW
  hp_main_Q_th_MW:       Q_hp_total_MW
  EBOILER_MAIN_Q_th_MW:  Q_ek_MW
  P2H_Q_th_MW:           Q_ek_MW
