    current_diameter_return_mm: 200
    u_value_supply_w_per_m_k: 0.28
    u_value_return_w_per_m_k: 0.30
    max_velocity_m_s: 2.5

  # South Network
  - id: main_ost_sued
    from_node: plant_ost
    to_node: zone_sued_zentral
    length_m: 2200
    existing: true
    current_diameter_supply_mm: 350
    current_diameter_return_mm: 350
    u_value_supply_w_per_m_k: 0.25
    u_value_return_w_per_m_k: 0.27
    max_velocity_m_s: 2.5

  - id: sued_zentral_west
