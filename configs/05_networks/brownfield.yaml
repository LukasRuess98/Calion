# =============================================================================
# STADTBACH DISTRICT HEATING NETWORK
# =============================================================================
# Consolidated network configuration for publication
# Supports both brownfield (fixed topology) and greenfield (investment) modes
# =============================================================================

metadata:
  name: Stadtbach District Heating Network
  description: District heating network for optimization framework
  operator: SWA Netze

# =============================================================================
# NETWORK PARAMETERS
# =============================================================================
parameters:
  # Temperature settings
  supply_temp_nominal_c: 120    # Design/fallback supply temperature [°C]
  supply_temp_summer_c: 90      # Summer supply temperature [°C]
  return_temp_nominal_c: 55     # Return temperature [°C]

  # =============================================================================
  # HEATING CURVE (Heizkurve) - Outdoor-dependent supply temperature
  # =============================================================================
  # Linear function: T_supply = f(T_outdoor)
  # At T_outdoor_high (e.g., 20°C): T_supply = T_supply_min (e.g., 80°C)
  # At T_outdoor_low (e.g., -10°C): T_supply = T_supply_max (e.g., 120°C)
  #
  # Formula: T_supply = 106.67 - 1.333 × T_outdoor
  #
  heating_curve:
    enabled: true               # Enable/disable heating curve
    T_supply_min_c: 80.0        # Minimum supply temp (at high outdoor temp) [°C]
    T_supply_max_c: 120.0       # Maximum supply temp (at low outdoor temp) [°C]
    T_outdoor_high_c: 20.0      # Outdoor temp threshold for min supply [°C]
    T_outdoor_low_c: -10.0      # Outdoor temp threshold for max supply [°C]

  # Environmental parameters
  ground_temp_default_c: 10
  soil_thermal_conductivity: 1.5  # W/(m·K)
  pipe_burial_depth_m: 1.2

  # Hydraulic limits
  design_pressure_bar: 16
  min_pressure_bar: 2.0
  max_pressure_bar: 25.0
  max_velocity_m_s: 2.5

# =============================================================================
# PRODUCTION PLANTS
# =============================================================================
production_plants:
  - node_id: plant_ost
    name: "Erzeugungsanlagen Ost"
    type: plant
    elevation_m: 466.0
    coordinates: {x: 3000, y: 0}
    supply_temp_c: 100
    supply_pressure_bar: 8.0

  - node_id: plant_west
    name: "Heizwerk West (HWW)"
    type: plant
    elevation_m: 471.9
    coordinates: {x: -2000, y: 1000}
    supply_temp_c: 100
    supply_pressure_bar: 6.0

  - node_id: plant_sued
    name: "Heizwerk Süd (HWS)"
    type: plant
    elevation_m: 490.5
    coordinates: {x: 1000, y: -3000}
    supply_temp_c: 100
    supply_pressure_bar: 6.0

# =============================================================================
# PUMP STATIONS
# =============================================================================
pump_stations:
  - node_id: pump_west
    name: "Pumpstation West"
    type: junction
    elevation_m: 471.35
    coordinates: {x: -1000, y: 500}

  - node_id: pump_sued
    name: "Pumpstation Süd"
    type: junction
    elevation_m: 485.0
    coordinates: {x: 500, y: -2000}

# =============================================================================
# CONSUMER ZONES
# =============================================================================
consumer_zones:
  # North Network (40% of total demand)
  - node_id: zone_nord_zentral
    name: "Nord - Zentral"
    demand_fraction: 0.20
    return_temp_c: 55.0

  - node_id: zone_nord_west
    name: "Nord - West"
    demand_fraction: 0.12
    return_temp_c: 55.0

  - node_id: zone_nord_ost
    name: "Nord - Ost"
    demand_fraction: 0.08
    return_temp_c: 55.0

  # South Network (60% of total demand)
  - node_id: zone_sued_zentral
    name: "Süd - Zentral"
    demand_fraction: 0.30
    return_temp_c: 55.0

  - node_id: zone_sued_west
    name: "Süd - West"
    demand_fraction: 0.18
    return_temp_c: 55.0

  - node_id: zone_sued_ost
    name: "Süd - Ost"
    demand_fraction: 0.12
    return_temp_c: 55.0

# =============================================================================
# PIPES (Brownfield - existing infrastructure)
# =============================================================================
pipes:
  # North Network
  - id: main_ost_nord
    from_node: plant_ost
    to_node: zone_nord_zentral
    length_m: 1800
    existing: true
    current_diameter_supply_mm: 300
    current_diameter_return_mm: 300
    u_value_supply_w_per_m_k: 0.26
    u_value_return_w_per_m_k: 0.28
    max_velocity_m_s: 2.5

  - id: nord_zentral_west
    from_node: zone_nord_zentral
    to_node: zone_nord_west
    length_m: 1200
    existing: true
    current_diameter_supply_mm: 200
    current_diameter_return_mm: 200
    u_value_supply_w_per_m_k: 0.28
    u_value_return_w_per_m_k: 0.30
    max_velocity_m_s: 2.5

  - id: nord_zentral_ost
