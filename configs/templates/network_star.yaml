# =============================================================================
# SCENARIO: Star Topology (1 central plant → 3 consumers, no junctions)
# =============================================================================
# Simple radial network — each consumer gets its own pipe from the plant.
# Useful baseline for comparison: highest total pipe length, no sharing.
# =============================================================================

site:
  input_xlsx: "Import_Data.xlsx"
  columns:
    datetime: "Datum"
    price: "Day_Ahead_Price €/MWh"
    heat_demand: "Wärmebedarf MW"
    co2_grid: "CO2_consumption_based kgCO2/MWh"
    wrg_sources:
      WRG1: {q_col: "WRG1Q MW", t_col: "WRG1_ T °C"}
      WRG2: {q_col: "WRG2Q MW", t_col: "WRG2_T °C"}

scenario:
  run_mode: PF_ONLY

network:
  physics:
    heat_loss: true
    pressure_drop: false
    transport_delay: false
  supply_temp_c: 90
  return_temp_c: 55
  ground_temp_c: 10

  nodes:
    plant:
      type: producer
      assets: [HP1, Boiler]

    consumer_north:
      type: consumer
      demand_fraction: 0.4

    consumer_south:
      type: consumer
      demand_fraction: 0.35

    consumer_east:
      type: consumer
      demand_fraction: 0.25

  pipes:
    plant_to_north:
      from: plant
      to: consumer_north
      length_m: 2000
      diameter_mm: 350

    plant_to_south:
      from: plant
      to: consumer_south
      length_m: 1500
      diameter_mm: 300

    plant_to_east:
      from: plant
      to: consumer_east
      length_m: 3000
      diameter_mm: 250

system:
  heat_pumps:
    - id: HP1
      enabled: true
      type: standard
      min_load: 0.2
      cop_default: 3.5
      min_th_mw: 0.0
      max_th_mw: 80.0
      wrg_sources: [WRG1, WRG2]
      investment:
        enabled: false

  storage:
    enabled: false

  generators:
    Boiler:
      enabled: true
      cap_th_mw: 150.0
      th_eff: 0.90
      fuel_bus: gas

grid:
  gridcost_eur_mwh: 20.0

fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0

costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 10.0

run:
  dt_h: 1.0
  solver: appsi_highs
