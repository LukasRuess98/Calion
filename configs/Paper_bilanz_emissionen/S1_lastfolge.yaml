# =============================================================================
# BILANZRAUM-EMISSIONEN — Szenario 1: HP Lastfolgebetrieb
# =============================================================================
# HP folgt dem Wärmebedarf direkt ohne Optimierung und ohne Speicher.
# Die WP-Strombezugslast ergibt sich zwingend aus: P_el(t) = Q(t) / COP(t)
# Dieses Profil dient als Referenz für die Bilanzraum-Emissionsanalyse.
#
# Systemgrenzen:
#   - Copperplate (Einknoten-Modell)
#   - 27 Abnehmer aggregiert, Gewerbe/Industriegebiet Memmingen
#   - Kein Speicher → HP muss Bedarf stündlich decken
#   - Kein Kessel → HP allein verantwortlich
#
# Emissionsanalyse (Post-Processing in run_bilanz_emissionen.py):
#   1. Jahresdurchschnitt   (1 Faktor)
#   2. Monatsdurchschnitt   (12 Faktoren)
#   3. Wochendurchschnitt   (52 Faktoren)
#   4. Stündliche Auflösung (8760 Faktoren)
# =============================================================================

site:
  input_xlsx: "data/memmingen_bilanz_emissionen_2025_1h.csv"
  columns:
    datetime:         "Datum"
    price:            "strompreis_EUR_MWh"
    co2_grid:         "grid_co2_kg_MWh"
    heat_candidates:  "total_demand_MWth"

scenario:
  name: "S1_Lastfolge"
  description: "HP Lastfolgebetrieb — kein Speicher, WP deckt Bedarf direkt"
  run_mode: PF_ONLY
  horizon:
    start: "2025-01-01"
    end:   "2025-12-31 23:00"

# ── Netzwerk (Einknoten, Copperplate) ────────────────────────────────────────
network:
  physics:
    heat_loss:        false
    pressure_drop:    false
    transport_delay:  false

  supply_temp_c: 80.0
  return_temp_c: 60.0
  ground_temp_c: 10.0

  nodes:
    E_1:
      assets: [hp_main]
      consumers:
        - column: "total_demand_MWth"

# ── Assets ───────────────────────────────────────────────────────────────────
assets:
  hp_main:
    type: heat_pump
    capacity_mw: 12.0        # > Peak-Bedarf 10.91 MWth
    min_load: 0.0
    cop_default: 3.5         # Fallback-COP; analytisches Modell wird verwendet

# ── Wärmepumpen-COP Konfiguration ────────────────────────────────────────────
heat_pumps:
  cop:
    deltaT_K:    5.0         # Pinch-Temperaturdifferenz Quelle
    deltaTpp_K:  3.0
    cop_fallback: 3.5
    sink_defaults:
      Tsink_out_K: 353.15    # 80 °C Vorlauf
      Tsink_in_K:  333.15    # 60 °C Rücklauf
  types:
    default:
      eta: 0.55              # relative Carnot-Effizienz (realistische Großwärmepumpe)
      FQ:  0.10

# ── Stromtarif & Grid ────────────────────────────────────────────────────────
grid:
  max_import_mw: 20.0
  max_export_mw: 0.0

# ── Kosten ───────────────────────────────────────────────────────────────────
costs:
  co2_price_eur_per_t:    0.0    # kein CO2-Preis in S1
  dump_cost_eur_per_mwh_th: 1000.0  # Harte Deckungspflicht

# ── Solver ───────────────────────────────────────────────────────────────────
run:
  dt_h:          1.0
  solver:        highs
  mip_gap:       0.001
  time_limit_s:  3600
  log_to_file:   true

output:
  export_dir: "outputs/bilanz_emissionen/S1_lastfolge"
