# Level 3: 30-node district heating network
# Star-of-stars topology: one main plant feeds 5 junction nodes serving 23 consumer zones.
# Uses synthetic weekly data (data/Import_Data.csv, 168 timesteps).
#
# Demand fractions sum to 1.0 across all 23 zones (distributed across 4 branches):
#   North (5 zones):  23%   South (6 zones): 26%
#   East  (6 zones):  25%   West  (6 zones): 26%

site:
  input_xlsx: "data/Import_Data.csv"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  run_mode: PF_ONLY

network:
  physics:
    heat_loss: true
    pressure_drop: true
    transport_delay: false
  supply_temp_c: 90
  return_temp_c: 55
  ground_temp_c: 10

  nodes:
    # --- Production ---
    plant_main:
      type: producer
      assets: [boiler_main, hp_main, tes_main]

    # --- Junctions ---
    j_central:
      type: junction
    j_north:
      type: junction
    j_south:
      type: junction
    j_east:
      type: junction
    j_west:
      type: junction

    # --- North branch consumers (demand_fraction sum: 0.23) ---
    zone_01:
      type: consumer
      demand_fraction: 0.06
      demand:
        column: "waermebedarf_MWth"
    zone_02:
      type: consumer
      demand_fraction: 0.05
      demand:
        column: "waermebedarf_MWth"
    zone_03:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_04:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_05:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"

    # --- South branch consumers (demand_fraction sum: 0.26) ---
    zone_06:
      type: consumer
      demand_fraction: 0.06
      demand:
        column: "waermebedarf_MWth"
    zone_07:
      type: consumer
      demand_fraction: 0.05
      demand:
        column: "waermebedarf_MWth"
    zone_08:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_09:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_10:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_11:
      type: consumer
      demand_fraction: 0.03
      demand:
        column: "waermebedarf_MWth"

    # --- East branch consumers (demand_fraction sum: 0.25) ---
    zone_12:
      type: consumer
      demand_fraction: 0.06
      demand:
        column: "waermebedarf_MWth"
    zone_13:
      type: consumer
      demand_fraction: 0.05
      demand:
        column: "waermebedarf_MWth"
    zone_14:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_15:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_16:
      type: consumer
      demand_fraction: 0.03
      demand:
        column: "waermebedarf_MWth"
    zone_17:
      type: consumer
      demand_fraction: 0.03
      demand:
        column: "waermebedarf_MWth"

    # --- West branch consumers (demand_fraction sum: 0.26) ---
    zone_18:
      type: consumer
      demand_fraction: 0.06
      demand:
        column: "waermebedarf_MWth"
    zone_19:
      type: consumer
      demand_fraction: 0.05
      demand:
        column: "waermebedarf_MWth"
    zone_20:
      type: consumer
      demand_fraction: 0.05
      demand:
        column: "waermebedarf_MWth"
    zone_21:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_22:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_23:
      type: consumer
      demand_fraction: 0.02
      demand:
        column: "waermebedarf_MWth"

  pipes:
    # Trunk lines — plant_to_central sized for full peak demand (75.95 MW)
    plant_to_central:
      from: plant_main
      to: j_central
      length_m: 500
      diameter_mm: 600    # max 91.6 MW — 20% margin over 75.95 MW peak
    central_to_north:
      from: j_central
      to: j_north
      length_m: 800
      diameter_mm: 400    # max 40.7 MW — north branch 23% = 17.5 MW
    central_to_south:
      from: j_central
      to: j_south
      length_m: 1000
      diameter_mm: 400    # max 40.7 MW — south branch 26% = 19.7 MW
    central_to_east:
      from: j_central
      to: j_east
      length_m: 600
      diameter_mm: 350    # max 31.1 MW — east branch 25% = 19.0 MW
    central_to_west:
      from: j_central
      to: j_west
      length_m: 700
      diameter_mm: 350    # max 31.1 MW — west branch 26% = 19.7 MW

    # North branch
    north_to_z01:
      from: j_north
      to: zone_01
      length_m: 300
      diameter_mm: 200
    north_to_z02:
      from: j_north
      to: zone_02
      length_m: 450
      diameter_mm: 200
    north_to_z03:
      from: j_north
      to: zone_03
      length_m: 600
      diameter_mm: 150
    north_to_z04:
      from: j_north
      to: zone_04
      length_m: 500
      diameter_mm: 150
    north_to_z05:
      from: j_north
      to: zone_05
      length_m: 700
      diameter_mm: 150

    # South branch
    south_to_z06:
      from: j_south
      to: zone_06
      length_m: 400
      diameter_mm: 200
    south_to_z07:
      from: j_south
      to: zone_07
      length_m: 350
      diameter_mm: 200
    south_to_z08:
      from: j_south
      to: zone_08
      length_m: 500
      diameter_mm: 150
    south_to_z09:
      from: j_south
      to: zone_09
      length_m: 600
      diameter_mm: 150
    south_to_z10:
      from: j_south
      to: zone_10
      length_m: 450
      diameter_mm: 150
    south_to_z11:
      from: j_south
      to: zone_11
      length_m: 550
      diameter_mm: 150

    # East branch
    east_to_z12:
      from: j_east
      to: zone_12
      length_m: 250
      diameter_mm: 200
    east_to_z13:
      from: j_east
      to: zone_13
      length_m: 400
      diameter_mm: 200
    east_to_z14:
      from: j_east
      to: zone_14
      length_m: 350
      diameter_mm: 150
    east_to_z15:
      from: j_east
      to: zone_15
      length_m: 500
      diameter_mm: 150
    east_to_z16:
      from: j_east
      to: zone_16
      length_m: 600
      diameter_mm: 150
    east_to_z17:
      from: j_east
      to: zone_17
      length_m: 450
      diameter_mm: 150

    # West branch
    west_to_z18:
      from: j_west
      to: zone_18
      length_m: 300
      diameter_mm: 200
    west_to_z19:
      from: j_west
      to: zone_19
      length_m: 400
      diameter_mm: 200
    west_to_z20:
      from: j_west
      to: zone_20
      length_m: 350
      diameter_mm: 150
    west_to_z21:
      from: j_west
      to: zone_21
      length_m: 500
      diameter_mm: 150
    west_to_z22:
      from: j_west
      to: zone_22
      length_m: 550
      diameter_mm: 150
    west_to_z23:
      from: j_west
      to: zone_23
      length_m: 600
      diameter_mm: 150

assets:
  boiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 200
    thermal_efficiency: 0.92

  hp_main:
    type: heat_pump
    capacity_mw: 100
    cop_default: 3.5

  tes_main:
    type: storage
    energy_mwh: 1000
    power_mw: 100

grid:
  gridcost_eur_mwh: 20.0

fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0

costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 10.0

run:
  dt_h: 1.0
  solver: appsi_highs
