# =============================================================================
# EXAMPLE 1: Global Costs Only (Simplest)
# =============================================================================
# All zones pay the same network fees.
# Use this for simple baseline scenarios.
#
# Costs are specified in 'costs' section only (no 'costs_config').
# Fallback: All zones use these global values.
# =============================================================================

site:
  input_xlsx: "data/Import_Data_yearly.csv"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  name: "L2_global_costs_only"
  run_mode: PF_ONLY
  description: "Simplified: all zones same fees"

network:
  physics:
    heat_loss: false
  supply_temp_c: 90.0
  return_temp_c: 55.0

  nodes:
    plant_main:
      type: producer
      assets: [boiler_main, chp_main, hp_main, tes_main]

    zone_01:
      type: consumer
      demand:
        column: "waermebedarf_MWth"

assets:
  boiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 200.0
    min_load: 0.1
    thermal_efficiency: 0.90

  chp_main:
    type: chp
    fuel: gas
    capacity_mw: 20.0
    thermal_output_mw: 20.0
    min_load: 0.3
    electrical_efficiency: 0.40
    thermal_efficiency_total: 0.80

  hp_main:
    type: heat_pump
    capacity_mw: 100.0
    cop_method: analytical_lmtd
    cop_default: 3.0

  tes_main:
    type: storage
    energy_mwh: 500.0
    power_mw: 50.0

# ════════════════════════════════════════════════════════════════════════════
# KOSTENKONFIGURATION — VARIANTE 1: NUR GLOBAL
# ════════════════════════════════════════════════════════════════════════════
# Bei Variante 1 gibt es KEINE 'costs_config' Sektion.
# Alle Kosten sind GLOBAL und werden von allen Zonen gleich angewendet.
# ════════════════════════════════════════════════════════════════════════════

grid:
  max_import_mw: 200.0
  max_export_mw: 200.0
  demand_charge_eur_per_mw_y: 50000.0  # ← Global Standard

fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0

costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 10.0
  include_demand_charge_in_rh: true

run:
  dt_h: 1.0
  solver: appsi_highs
  mip_gap: 0.01
  time_limit_s: 3600

# ════════════════════════════════════════════════════════════════════════════
# ERKLÄRUNG VARIANTE 1
# ════════════════════════════════════════════════════════════════════════════
#
# WANN NUTZEN: Testing, Baseline, alle Zonen identisch
#
# WAS PASSIERT:
#  - CostResolver wird NICHT verwendet
#  - Alle Zonen zahlen: €50,000/MW/Jahr (Netzentgelt)
#  - Einfache, schnelle Optimierung
#
# AUSGABE:
#  {
#    "grid": {
#      "demand_charge_eur_per_mw_y": 50000.0,
#      ...
