      demand:
        column: "waermebedarf_MWth"

  # ── Pipe Network (22 pipes, ~14,250 m total) ─────────────────────────────
  # Main trunk from plant
  pipes:
    # Main trunk: plant → central junction (3,200 m @ Ø500mm)
    plant_to_central:
      from: plant_main
      to: j_central
      length_m: 3200
      diameter_mm: 500

    # Branch spreaders: central → branch junctions (800–900 m each @ Ø350mm)
    central_to_north:
      from: j_central
      to: j_north
      length_m: 850
      diameter_mm: 350
    central_to_south:
      from: j_central
      to: j_south
      length_m: 820
      diameter_mm: 350
    central_to_east:
