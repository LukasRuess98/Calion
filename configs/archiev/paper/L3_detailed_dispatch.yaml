# =============================================================================
# PAPER STUDY — Level 3: Realistic 30-Node Network (Dispatch-Only)
# =============================================================================
# RESEARCH FOCUS: Network Topology Abstraction Impact on Operational Dispatch
#
# Level 3 represents the FULL physical network model with 30 nodes reflecting
# real network topology: plant + central junctions + 23 consumer zones.
# Uses identical physics-based loss model as L2 but with full spatial detail.
#
# TOPOLOGY:
#   Star-of-stars: plant → central junctions → 4 branches → 23 zones
#   Total nodes: 30 (1 plant, 4 junctions, 23 consumer zones)
#   Total pipes: 22 connections
#   Total pipe length: ~14,250 m
#   Demand split: North 23%, South 26%, East 25%, West 26%
#
# OPTIMIZATION MODE: Dispatch-only (no capacity decisions)
# - All asset capacities FIXED at existing values
# - Objective: Minimize annual operational cost
# - Time horizon: 8,760 hours (full year 2023)
#
# PHYSICS (IDENTICAL TO L2):
# - Heat loss: Physics-based PWL model
#   Q_loss[t,i] = U × L × (T_supply - T_ground) / 1000 [MW]
#   U = 0.15 W/(m·K), L = pipe length, ΔT = 80°C
# - Linearization: 10 piecewise-linear segments
# - COP method: Analytical LMTD (identical to L1 & L2)
#   COP[t] = η_rel × (T_sink / (T_sink - T_source[t]))
#
# SYSTEM SUMMARY (Fixed Assets):
#   Peak demand:   76 MW
#   Annual demand: 517 GWh
#   Boiler:        200 MW gas, η = 0.90, FIXED (at plant node)
#   CHP:           20 MW (elec), FIXED (at plant node)
#   Heat pump:     100 MW thermal, COP = f(T_source), FIXED (at plant node)
#   Storage:       500 MWh / 50 MW, FIXED (at plant node)
#   Pipes:         22 connections, ~14,250 m total
#   Heat losses:   ~26 GWh/year (~5% of demand) per physics model
#
# COMPARISON BASIS:
#   Same fixed assets and COP method as L1 & L2
#   Same pipe length and U-value as L2
#   Highest spatial resolution among the three levels
#   Expected solve time: ~14–20 minutes (6× slower than L1, 1.6× slower than L2)
# =============================================================================

site:
  input_xlsx: "data/Import_Data_yearly.csv"
  columns:
    datetime:  "Datum"
    price:     "strompreis_EUR_MWh"
    co2_grid:  "grid_co2_kg_MWh"
    wrg1_temp: "T_WRG1_C"
    wrg2_temp: "T_WRG2_C"

scenario:
  name: "L3_detailed_dispatch"
  run_mode: PF_ONLY
  description: "Realistic 30-node network: full spatial detail, dispatch-only"

# ── Network (30-node with physics-based losses) ────────────────────────────
network:
  physics:
    heat_loss: true
    pressure_drop: true
    transport_delay: false
  
  supply_temp_c: 90.0
  return_temp_c: 55.0
  ground_temp_c: 10.0

  nodes:
    # ── Production (plant with all assets) ────────────────────────────────
    plant_main:
      type: producer
      assets: [boiler_main, chp_main, hp_main, tes_main]

    # ── Central junctions (routing, no demand) ────────────────────────────
    j_central:
      type: junction
    j_north:
      type: junction
    j_south:
      type: junction
    j_east:
      type: junction
    j_west:
      type: junction

    # ── North branch: 5 consumer zones (23% of demand) ────────────────────
    zone_01:
      type: consumer
      demand_fraction: 0.06
      demand:
        column: "waermebedarf_MWth"
    zone_02:
      type: consumer
      demand_fraction: 0.05
      demand:
        column: "waermebedarf_MWth"
    zone_03:
