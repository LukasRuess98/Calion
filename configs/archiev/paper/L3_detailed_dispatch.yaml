      demand:
        column: "waermebedarf_MWth"
    zone_07:
      type: consumer
      demand_fraction: 0.05
      demand:
        column: "waermebedarf_MWth"
    zone_08:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_09:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_10:
      type: consumer
      demand_fraction: 0.04
      demand:
        column: "waermebedarf_MWth"
    zone_11:
