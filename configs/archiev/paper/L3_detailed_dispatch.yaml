# ── FIXED ASSETS (Dispatch-Only, all at plant node) ───────────────────────
assets:
  boiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 200.0
    min_load: 0.1
    thermal_efficiency: 0.90

  chp_main:
    type: chp
    fuel: gas
    capacity_mw: 20.0
    thermal_output_mw: 20.0
    min_load: 0.3
    electrical_efficiency: 0.40
    thermal_efficiency_total: 0.80

  hp_main:
    type: heat_pump
    capacity_mw: 100.0
    min_load: 0.2
    cop_method: analytical_lmtd
    sink_temp_c: 90.0
    source_columns: ["wrg1_temp", "wrg2_temp"]
    carnot_efficiency: 0.6
    cop_default: 3.0

  tes_main:
    type: storage
    energy_mwh: 500.0
    power_mw: 50.0
    min_soc: 0.05
    max_soc: 0.95
    loss_type: pwl
    loss_segments: 10
    storage_loss_mwh_per_hour: 0.5

# ── Electricity Grid ────────────────────────────────────────────────────────
grid:
  max_import_mw: 200.0
  max_export_mw: 200.0
  gridcost_eur_mwh: 35.0

# ── Fuels ───────────────────────────────────────────────────────────────────
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0

# ── Costs ───────────────────────────────────────────────────────────────────
costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 10.0

# ── Run Settings ────────────────────────────────────────────────────────────
run:
  dt_h: 1.0
  solver: appsi_highs
  mip_gap: 0.01
  time_limit_s: 3600

# ── Notes ───────────────────────────────────────────────────────────────────
# 1. REALISTIC TOPOLOGY: Full 30-node network represents actual Stadtbach
#    infrastructure with 23 distributed consumer zones and realistic pipe routing.
#
# 2. IDENTICAL PHYSICS: Uses same PWL loss model as L2:
#    - U-value: 0.15 W/(m·K) for all pipes
#    - Total length: ~14,250 m
#    - 10 PWL segments for loss linearization
#    Expected loss: ~26 GWh/year (5% of demand)
#
# 3. IDENTICAL COP: Same analytical LMTD as L1 & L2, ensuring topology is the
#    sole experimental variable. COP time series identical across all three.
#
# 4. DISPATCH-ONLY: All capacities fixed. Optimization minimizes operational
#    cost through hourly load dispatch, storage management, and grid trading.
#
# 5. EXPECTED SOLVE TIME: ~14–20 minutes for full year (HiGHS, 1% MIP gap).
#    Represents the most accurate topology level with highest computational cost.
#
# 6. SCALABILITY: Network can be extended to larger systems by adding more zones
#    and branch junctions, following the same star-of-stars structure.
