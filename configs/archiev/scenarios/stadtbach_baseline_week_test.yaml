# Quick test version: Stadtbach Baseline (1 week only)
# Uses same config structure but limited time horizon

scenario:
  name: "Stadtbach Baseline 1 Week Test"
  description: "Quick test of stadtbach scenario config with 1 week of data"

  time:
    data_file: "data/Import_Data.csv"
    start: "2023-01-01 00:00:00"
    end: "2023-01-07 23:00:00"
    resolution_h: 1.0

  assets:
    components: "configs/assets/stadtbach/components.yaml"
    grid: "configs/assets/stadtbach/grid.yaml"
    network: "configs/assets/stadtbach/network_topology.yaml"
    demand_fraction: 0.9                    # Use 90% of demand for test (fits capacity)

  thermal_network:
    enabled: true
    topology_file: "configs/assets/stadtbach/network_topology.yaml"
    use_simplified_network_model: false
    bilinear_mixing: false

  # Optimization settings
    mode: dispatch
    decision_variables:
      - component_dispatch
    objective: minimize_total_cost
    costs:
      include_fuel: true
      include_electricity_purchase: true
      include_electricity_sales: true
      include_co2: true
      include_demand_charge: false
      include_heat_dump_penalty: true
      include_capex: false
      include_opex_variable: true
      include_opex_fixed: false
    constraints:
      enforce_heat_balance: true
      enforce_power_balance: true
      respect_capacity_limits: true
      respect_min_load: true
      respect_ramp_rates: true
      enforce_network_losses: true
      use_simplified_network_model: true
      max_annual_co2_emissions_t: null
      n_minus_1_criterion: false

  initial_state:
    storage:
      TES1:
        soc_mwh: 250.0
        hot_zone_fraction: 0.5
    network:
      supply_temp_c: 100.0
      return_temp_c: 55.0
      pressure_bar: 10.0

  terminal_conditions:
    storage:
      state: cyclic
      policy: equal
      target_mwh: null
      salvage_price_eur_per_mwh: 50.0
      soft_penalty_eur_per_mwh: 100.0

  economics:
    fuel_prices:
      natural_gas_eur_per_mwh: 45.0
      biomass_eur_per_mwh: 28.0
      waste_heat_eur_per_mwh: 5.0
      heating_oil_eur_per_mwh: 90.0
    co2_price_eur_per_tonne: 100.0
    heat_dump_penalty_eur_per_mwh: 10.0
    discount_rate: 0.05

  solver:
    name: appsi_highs
    timelimit_s: 300
    mip_gap: 0.01
    threads: 4

  output:
    results_dir: "results/baseline_test"
    save_hourly_results: true
    save_summary_statistics: true
    create_plots: false
    export_formats: [csv, json]

  reporting:
    kpis:
      - total_cost_eur
      - fuel_cost_eur
      - co2_emissions_t
    aggregations: [hourly, daily]
    compare_to_baseline: false
