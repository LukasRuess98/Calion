# Phase 1 test with GLPK solver
# GLPK is simpler LP solver that should work better than HiGHS

site:
  input_xlsx: "data/Import_Data.csv"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  title: "Phase 1 Constraints Test with GLPK"
  tag: "phase1_glpk_test"
  run_mode: PF_ONLY

system:
  generators:
    boiler:
      enabled: true
      cap_th_mw: 100.0
      eta_th: 0.90
      fuel_type: gas

  storage:
    enabled: false

thermal_network:
  enabled: true
  
  nodes:
    - id: producer_node
      type: producer
      supply_temp_nominal_c: 90
      return_temp_c: 55
      pressure_nominal_supply_bar: 10.0
  
    - id: consumer_node
      type: consumer
      demand_fraction: 1.0
      supply_temp_nominal_c: 90
      return_temp_c: 50
      pressure_nominal_supply_bar: 10.0
  
  pipes:
    - id: pipe_main
      from_node: producer_node
      to_node: consumer_node
      length_m: 1000
      current_diameter_supply_mm: 200
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30

# Phase 1 constraints ENABLED
state_validation:
  temperature_constraints:
    enforce_supply_ge_return: true
    temperature_tolerance_c: 0.1
  
  pressure_constraints:
    min_pressure_bar: 0.5
  
  flow_constraints:
    min_velocity_m_s: 0.3
    max_velocity_m_s: 2.5

costs:
  co2_price_eur_per_t: 100.0
  heat_dump_penalty_eur_per_mwh: 10.0

run:
  dt_h: 1.0
  solver: glpk  # Use GLPK - simpler LP solver
