# =============================================================================
# SCENARIO: Stadtbach Capacity Expansion 2024-2030
# =============================================================================
# Investment optimization: Determine optimal asset expansions
# Optimizes both capacities AND dispatch
# =============================================================================

scenario:
  name: "Stadtbach Capacity Expansion 2024-2030"
  description: "Optimize investments in heat pumps, P2H, and storage for 2024-2030 planning horizon"
  version: "1.0"
  author: "CALION Planning Team"
  date: "2024-01-15"

  # ===========================================================================
  # TIME HORIZON
  # ===========================================================================
  time:
    # Use 2023 data as representative year
    data_file: "../../data/stadtbach_2023_full.xlsx"
    data_source_config: "../../assets/stadtbach/data_sources.yaml"

    # Full year or representative periods
    use_representative_periods: true        # Use typical weeks to reduce problem size
    representative_periods:
      method: kmeans_clustering             # Cluster similar days
      num_periods: 8                        # 8 typical weeks (winter, shoulder, summer)
      include_extreme_days: true            # Always include peak demand days

    # If not using representative periods:
    start: "2023-01-01 00:00:00"
    end: "2023-12-31 23:00:00"
    resolution_h: 1.0

  # ===========================================================================
  # ASSETS
  # ===========================================================================
  assets:
    components: "../assets/stadtbach/components.yaml"
    grid: "../assets/stadtbach/grid.yaml"
    network: "../assets/stadtbach/network_topology.yaml"

  # ===========================================================================
  # OPTIMIZATION SETTINGS
  # ===========================================================================
  optimization:
    mode: capacity_expansion                # Optimize capacities + dispatch

    # Decision variables
    decision_variables:
      - component_capacities                # Size of heat pumps, P2H, storage
      - component_dispatch                  # Hourly operation
      # NOT: pipe_diameters (keep existing network)

    # Objective function
    objective: minimize_total_cost          # NPV of all costs over planning horizon

    # Cost components
    costs:
      include_capex: true                   # CRITICAL for investment
      include_activation_costs: true        # Fixed installation costs
      include_opex_fixed: true              # Annual fixed O&M
      include_opex_variable: true           # Variable O&M
      include_fuel: true
      include_electricity_purchase: true
      include_electricity_sales: true
      include_co2: true
      include_demand_charge: true
      include_heat_dump_penalty: true

      # Economic parameters
      discount_rate: 0.05                   # 5% discount rate
      planning_horizon_yr: 15               # 2024-2039 (15 years)
      annualization_method: simplified      # CAPEX / lifetime * year_frac

    # Constraints
    constraints:
      # Energy balances
      enforce_heat_balance: true
      enforce_power_balance: true

      # Component limits
      respect_capacity_limits: true
      respect_min_load: true
      respect_ramp_rates: true

      # Network constraints
      enforce_network_losses: true
      use_simplified_network_model: true    # For now (detailed model future)

      # Emissions constraint (optional policy scenario)
      max_annual_co2_emissions_t: null      # No limit in base case
      # Alternative: 80000                  # 80k tonnes/year target

      # Reliability
      n_minus_1_criterion: false

      # Investment constraints
      max_total_investment_eur: null        # No budget constraint
      # Alternative: 50000000               # 50M EUR budget limit

  # ===========================================================================
  # INITIAL CONDITIONS (Dispatch starting point)
  # ===========================================================================
  initial_state:
    storage:
      TES1:
        soc_mwh: 250.0
        hot_zone_fraction: 0.5

    network:
      supply_temp_c: 100.0
      return_temp_c: 55.0
      pressure_bar: 10.0

  # ===========================================================================
  # TERMINAL CONDITIONS
  # ===========================================================================
  terminal_conditions:
    storage:
      state: cyclic
      policy: value                         # Use value function (economic incentive)

      # Value function parameters
      value_function_type: constant         # Options: constant, diminishing
      salvage_price_eur_per_mwh: 50.0       # Value of stored energy at horizon end

      # Diminishing returns (if value_function_type=diminishing)
      diminishing_decay: 0.3                # 30% decay above threshold

  # ===========================================================================
  # ECONOMICS
  # ===========================================================================
  economics:
    # Fuel prices (2024-2030 forecast)
    fuel_prices:
      natural_gas_eur_per_mwh: 50.0         # Higher than 2023 (forecast)
      biomass_eur_per_mwh: 30.0
      waste_heat_eur_per_mwh: 5.0
      heating_oil_eur_per_mwh: 95.0

    # Carbon pricing (EU ETS forecast)
    co2_price_eur_per_tonne: 120.0          # Expected increase to 2030

    # Other costs
    heat_dump_penalty_eur_per_mwh: 10.0

    # Investment incentives (optional)
    subsidies:
      heat_pump_subsidy_fraction: 0.30      # 30% CAPEX subsidy
      storage_subsidy_fraction: 0.20        # 20% CAPEX subsidy
      p2h_subsidy_fraction: 0.10            # 10% CAPEX subsidy

  # ===========================================================================
  # SENSITIVITY ANALYSIS (Optional)
  # ===========================================================================
  sensitivity:
    enabled: true
    parameters:
      - name: co2_price
        base: 120.0
        range: [80.0, 150.0, 200.0]         # Low, base, high

      - name: gas_price
        base: 50.0
        range: [40.0, 50.0, 65.0]

      - name: electricity_price_multiplier
        base: 1.0
        range: [0.8, 1.0, 1.2]

  # ===========================================================================
  # SOLVER SETTINGS
  # ===========================================================================
  solver:
    name: gurobi
    timelimit_s: 14400                      # 4 hours (investment is complex)
    mip_gap: 0.02                           # 2% gap (investment can be slightly suboptimal)
    threads: 16                             # More threads for MILP

    options:
      NumericFocus: 1
      Method: 2                             # Barrier
      MIPFocus: 1                           # Focus on finding good solutions
      Heuristics: 0.3                       # More heuristics time

  # ===========================================================================
  # OUTPUT SETTINGS
  # ===========================================================================
  output:
    results_dir: "../../results/capacity_expansion"

    save_hourly_results: true
    save_summary_statistics: true
    save_cost_breakdown: true
    save_emissions_breakdown: true
    save_investment_summary: true           # NEW: Investment decisions

    create_plots: true
    plot_formats: [png, pdf, svg]

    export_formats:
      - excel
      - csv
      - json

    export_dashboard_data: true

  # ===========================================================================
  # REPORTING
  # ===========================================================================
  reporting:
    kpis:
      # Economic
      - npv_total_eur                       # Net present value
      - total_investment_eur                # Total CAPEX
      - annual_opex_eur                     # Annual operating costs
      - levelized_cost_of_heat_eur_per_mwh  # LCOH

      # Operational
      - total_cost_eur
      - fuel_cost_eur
      - electricity_cost_eur

      # Environmental
      - co2_emissions_t
      - co2_cost_eur
      - renewable_fraction                  # Heat from renewables/waste heat

      # Technical
      - heat_pump_capacity_installed_mw     # Total HP capacity
      - storage_capacity_installed_mwh
      - p2h_capacity_installed_mw
      - cop_average
      - chp_electricity_production_mwh
      - storage_cycles

      # Investment
      - investment_heat_pump_eur
      - investment_storage_eur
      - investment_p2h_eur

    aggregations:
      - hourly
      - daily
      - monthly
      - annual

    # Investment summary
    investment_summary:
      include_capacity_table: true          # Table of all investments
      include_payback_periods: true
      include_sensitivity_results: true

    # Comparison
    compare_to_baseline: true
    baseline_scenario: "stadtbach_baseline_2023.yaml"
