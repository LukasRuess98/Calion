# =============================================================================
# BASE CONFIGURATION
# =============================================================================
# Minimal base configuration with sensible defaults.
# Override specific sections in scenario or site configs.
# =============================================================================

site:
  input_xlsx: ""
  columns:
    datetime: "Datum"
    price: "Day_Ahead_Price \u20ac/MWh"
    heat_demand: "W\u00e4rmebedarf MW"
    co2_grid: "CO2_consumption_based kgCO2/MWh"

system:
  heat_pumps: []
  storage:
    enabled: false
  generators: {}

grid:
  energy_fee_eur_mwh: 0.0
  gridcost_eur_mwh: 0.0
  sell_floor_eur_mwh: 0.0
  sell_haircut_fraction: 0.0
  sell_spread_eur_mwh: 0.0
  sell_fee_eur_mwh: 0.0
  sell_premium_eur_mwh: 0.0
  demand_charge_eur_per_mw_y: 0.0
  year_fraction: 1.0
  big_m_grid_mw: 10000.0

costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 1.0
  include_co2_cost_in_objective: true
  include_gridcost_in_energy: true
  include_demand_charge_in_rh: true

run:
  dt_h: 1.0
  solver: appsi_highs

fuels:
  gas:
    price_eur_mwh: 40.0
    ef_kg_per_mwh_fuel: 200.0

# =============================================================================
# PHASE 1: STATE CONSTRAINTS
# =============================================================================
# Physical validity constraints for network nodes and pipes.
# These enforce that optimized states remain physically realistic.

state_validation:
  # Temperature constraints
  temperature_constraints:
    # Enforce T_supply >= T_return at every node (supply/return reversal prevention)
    enforce_supply_ge_return: true
    
    # Link consumer return temp to heat demand (Phase 2 — advanced)
    enforce_demand_based_return_temp: false
    
    # Numerical tolerance for temperature constraints [°C]
    temperature_tolerance_c: 0.1

  # Pressure constraints
  pressure_constraints:
    # Minimum absolute pressure to prevent cavitation [bar]
    # Typical values: 0.5-1.0 bar (absolute); cavitation risk <0.3 bar
    min_pressure_bar: 0.5
    
    # Enforce Darcy-Weisbach pressure drop consistency (Phase 2 — advanced)
    enforce_darcy_consistency: false
    
    # Maximum allowable pressure drop in a pipe [bar]
    max_pressure_drop: 2.0

  # Flow constraints
  flow_constraints:
    # Minimum velocity to prevent stagnation [m/s]
    # Checked post-solve by NetworkValidator (not as hard constraint).
    # A hard constraint would conflict with zero-flow pipes (m_dot=0).
    min_velocity_m_s: 0.3

    # Maximum velocity for noise/wear control [m/s]
    # Enforced as hard Pyomo constraint (always feasible).
    max_velocity_m_s: 2.5

    # Enforce Reynolds number regime validation (Phase 2 — advanced)
    enforce_reynolds_regime: false
