# ============================================================================
# BASE CONFIGURATION
# ============================================================================
# Diese Datei enthält NUR technische Defaults und globale Parameter.
# Scenario-spezifische Einstellungen (run_mode, workflows, etc.) gehören in
# configs/scenarios/*.scenario.yaml
# ============================================================================

run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    # === PERFORMANCE OPTIMIZATION (Thermal Networks MIQP) ===
    # Parallelisierung
    Threads: 8              # Nutze 8 CPU-Kerne (0 = alle, aber 8 ist oft optimal)
    Threads: 0              # Nutze 8 CPU-Kerne (0 = alle, aber 8 ist oft optimal)
    ConcurrentMIP: 2        # 2 parallele MIP-Strategien

    # Termination
    MIPGap: 0.01           # 1% Gap (war 2%, jetzt schärfer aber noch schnell)
    TimeLimit: 3600         # 1 Stunde Zeitlimit

    # Strategie
    MIPFocus: 1             # 1 = fokussiere auf zulässige Lösungen finden
    Method: 2               # 2 = Barrier (schnellster für große LP)
    NodeMethod: 2           # 2 = Barrier für nodes

    # Preprocessing
    Presolve: 2             # 2 = aggressive Presolve
    PreCrush: 1             # Presolve crushing aktiviert

    # Cuts
    Cuts: 2                 # 2 = aggressive Cuts

    # Heuristics
    Heuristics: 0.1         # 10% Zeit für Heuristics (gute Lösungen schnell)
    RINS: 10                # RINS Heuristic alle 10 nodes

    # Numerik
    NumericFocus: 1         # Verbessere numerische Stabilität für MIQP
    ScaleFlag: 2            # Aggressive scaling

    # Output
    LogToConsole: 1         # Zeige Fortschritt

    # Erwarteter Speedup: 5-10× für thermische Netze!

costs:
  include_gridcost_in_energy: true
  include_demand_charge_in_rh: true
  include_co2_cost_in_objective: true
  dump_cost_eur_per_mwh_th: 1.0
  co2_price_eur_per_t: 100.0

grid:
  energy_fee_eur_mwh: 0.0
  demand_charge_eur_per_mw_y: 127240.0
  gridcost_eur_mwh: 61.6
  sell_floor_eur_mwh: 0.0 #sollte der Preis sein aus dem Day-Ahead
  sell_haircut_fraction: 0.05
  sell_spread_eur_mwh: 5.0
  sell_fee_eur_mwh: 5.0
  sell_premium_eur_mwh: 0.0
  year_fraction: 1.0
  big_m_grid_mw: 200.0  # OPTIMIERT: Reduziert von 10000 auf 200 MW (realistische Obergrenze)
  max_import_mw: 200.0  # Explizites Limit für Grid-Import
  max_export_mw: 100.0  # Explizites Limit für Grid-Export

