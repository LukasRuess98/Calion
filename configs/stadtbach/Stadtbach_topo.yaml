# =============================================================================
# STADTBACH DISTRICT HEATING NETWORK — swa-corrected Topology (Paper 2)
# =============================================================================
# 32 nodes, 31 pipes (tree topology)
# Corrections vs. previous ACRON-based topology (cross-checked against swa plans
# WV640 Bl.3, WV650 Netz-Mitte, WV660 Netz-West):
#
#  (1) EAST ARM introduced. GT-Ost, Biomass-CHP and the AVA waste-heat
#      take-over are physically in the NE (Hammerschmiede) and feed the
#      network via the eastern trunk (SL5/SL6) — NOT at the HKW busbar.
#  (2) AVA modelled as a 45 MW DIRECT waste-heat feed-in (ava_feed), with
#      an investable HP (hp_sb) co-located at j_ava for low-temperature lift.
#  (3) CONSUMER ZONES corrected to real geography (13 of 24 were misassigned):
#      Lise-Meitner/Klinikum/Josefinum -> WEST; Kurt-Schumacher/Lechhauser/
#      KUKA/Hans-Böckler -> EAST; Beethovenpark/Don Bosco -> SOUTH; etc.
#  (4) PIPE DN and LENGTHS aligned to swa valve tables + real trace distances.
#
# PRODUCERS (6 nodes): j_hkw, j_gtost, j_bmhkw, j_ava, j_hws, j_hww
# JUNCTIONS (4): j_ost, j_ne, j_pss, j_psw
# CONSUMERS (24): one per ACRON station (7 measured + 17 zone-estimated)
#
# FIXED ASSETS (existing infrastructure):
#   HKW:      75 MW gas CHP
#   GT-Ost:   35 MW gas — on EAST arm at j_gtost
#   BMHKW:    14.5 MW biomass — on EAST arm at j_bmhkw
#   AVA:      45 MW waste-heat feed-in (ava_feed) — on EAST arm at j_ava
#   HWS:      40 MW gas boiler — south zone at j_hws
#   HWW:      64 MW gas boiler — west zone at j_hww
#   P2H:      10 MW existing electrode boiler
#   TES:     500 MWh existing storage
#
# INVESTABLE ASSETS (optimizer sizes these):
#   hp_sb:    HP for AVA low-temp lift at j_ava (0–50 MW, capex 400 k€/MW)
#   ek_sb:    electrode boiler at j_hkw (0–50 MW, capex 150 k€/MW)
#   tes_sb:   TES at j_hkw (0–5000 MWh, capex 16.5 k€/MWh)
#
# DATA: data/Stadtbach/stadtbach_acron_combined.xlsx
#   Build with: python scripts/preprocess/merge_acron_sb.py
#
# TEMPERATURES (from PPS/PSW measurements 2025):
#   Supply: mean 99°C, max 122°C  |  Return: mean 60°C
# =============================================================================

site:
  input_xlsx: "data/Stadtbach/stadtbach_acron_combined.xlsx"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  name: "Stadtbach swa-corrected Topology (Paper 2)"
  description: "Real 32-node Stadtbach network, swa-corrected, with investable assets"
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: "2025-01-01 00:00"
    end: "2025-12-31 23:00"

# =============================================================================
# NETWORK
# =============================================================================
network:
  milp_linearize: true
  primary_producer: "j_hkw"   # explicit: j_bmhkw sorts before j_hkw alphabetically
  physics:
    heat_loss: true
    pressure_drop: false
    transport_delay: false

  supply_temp_c: 99.0
  return_temp_c: 60.0
  ground_temp_c: 10.0

  temperature_frame:
    default_return_band_c: 5.0
    seasons:
      winter:
        months: [1, 2, 12]
        supply_c: 115.0
        return_c: 62.0
      spring:
        months: [3, 4, 5]
        supply_c: 99.0
        return_c: 61.0
      summer:
        months: [6, 7, 8]
        supply_c: 84.0
        return_c: 62.0
      autumn:
        months: [9, 10, 11]
        supply_c: 96.0
        return_c: 60.0

  heating_curve:
    enabled: true
    T_supply_max_c: 122.0
    T_supply_min_c: 70.0
    T_outdoor_low_c: -15.0
    T_outdoor_high_c: 30.0

  linearization:
    method: "pwl"
    temperature_profile:
      load_fractions: [0.0, 0.3, 0.6, 1.0]
      T_supply_c: [70.0, 85.0, 100.0, 122.0]
      T_return_c: [55.0, 58.0,  62.0,  68.0]

  max_velocity_m_s: 100.0
  parameters:
    max_velocity_m_s: 100.0  # passed to pipe_pair enriched_config via self.parameters
  state_validation:
    flow_constraints:
      max_velocity_m_s: 100.0  # passed to state_constraints velocity Pyomo constraint
  pump_efficiency: 0.75
  pipe_roughness_mm: 0.5
  max_pressure_drop_bar: 2.0
  delta_p_min_consumer_bar: 0.7

  # ---------------------------------------------------------------------------
  # NODES
  # ---------------------------------------------------------------------------
  nodes:

    # ── PRODUCTION HUB (HKW busbar: gas CHP, P2H, TES, investable EK+TES) ───
    j_hkw:
      assets: [hkw, p2h_existing, tes_existing, ek_sb, tes_sb]

    # ── EAST TRUNK JUNCTION ──────────────────────────────────────────────────
    # j_ost acts as the east busbar: receives heat from j_hkw (bidirectional
    # trunk pipe) AND from all east-arm producers (reversed pipes), then
    # distributes to east consumers. j_ne is merged into j_ost to avoid the
    # need for a second bidirectional trunk segment.
    j_ost: {}   # Lechhausen / Hammerschmiede east busbar

    # ── PRODUCER STATIONS ────────────────────────────────────────────────────
    j_gtost:
      assets: [gtost]

    j_bmhkw:
      assets: [bmhkw]

    j_ava:
      # AVA direct waste-heat feed-in + investable HP for low-temp lift
      assets: [ava_feed, hp_sb]

    # HWS_BOILER placed at j_pss (not j_hws) so it enters the secondary heat
    # balance at the pump station level, allowing it to reduce j_hkw's
    # obligation via the j_pss nodal balance (gen + HKW_feed = PSS_demands).
    j_hws: {}   # pure junction — receives heat from j_pss via pss_to_hws pipe
    j_hww: {}   # pure junction — receives heat from j_psw via psw_to_hww pipe

    # ── PUMP STATIONS (secondary producers) ─────────────────────────────────
    j_pss:
      assets: [hws_boiler]   # Heizwerk Süd boiler: 40 MW secondary heat balance at j_pss
    j_psw:
      assets: [hww_boiler]   # Heizwerk West boiler: 64 MW secondary heat balance at j_psw

    # ── NETZ-MITTE CONSUMERS (connected directly to j_hkw) ──────────────────
    j_man:
      consumers:
        - column: "MAN_MW"
    j_hoher_weg:
      consumers:
        - column: "Hoher_Weg_MW"
    j_hunoldsgraben:
      consumers:
        - column: "Hunoldsgraben_MW"
    j_kreissparkasse:
      consumers:
        - column: "Kreissparkasse_MW"

    # ── NETZ-OST CONSUMERS (from j_ost / j_ne) ──────────────────────────────
    j_lechhauser_str:
      consumers:
        - column: "Lechhauser_Str_MW"
    j_kuka:
      consumers:
        - column: "KUKA_MW"
    j_kurt_schumacher_str:
      consumers:
        - column: "Kurt-Schumacher-Str_MW"
    j_hans_boeckler_str:
      consumers:
        - column: "Hans-Boeckler-Str_MW"
    j_am_mittleren_moos:
      consumers:
        - column: "Am_Mittleren_Moos_MW"

    # ── NETZ-SÜD CONSUMERS (from j_pss / j_hws) ─────────────────────────────
    j_theodor_heuss_platz:
      consumers:
        - column: "Theodor-Heuss-Platz_MW"
    j_fuggerstr:
      consumers:
        - column: "Fuggerstr_MW"
    j_sigma_technopark:
      consumers:
        - column: "SIGMA_Technopark_MW"
    j_uni:
      consumers:
        - column: "UNI_MW"
    j_fraunhofer:
      consumers:
        - column: "Fraunhofer_MW"
    j_beethovenpark:
      consumers:
        - column: "Beethovenpark_MW"
    j_don_bosco:
      consumers:
        - column: "Don_Bosco_MW"

    # ── NETZ-WEST CONSUMERS (from j_psw / j_hww) ─────────────────────────────
    j_schlettererstr:
      consumers:
        - column: "Schlettererstr_MW"
    j_josefinum:
      consumers:
        - column: "Josefinum_MW"
    j_klinikum:
      consumers:
        - column: "Klinikum_MW"
    j_lise_meitner_str:
      consumers:
        - column: "Lise-Meitner-Str_MW"
    j_august_wessels_str:
      consumers:
        - column: "August-Wessels-Str_MW"
    j_hooverstr:
      consumers:
        - column: "Hooverstr_MW"
    j_grasiger_weg:
      consumers:
        - column: "Grasiger_Weg_MW"
    j_siegfried_aufhaeuser_str:
      consumers:
        - column: "Siegfried-Aufhaeuser-Str_MW"

  # ---------------------------------------------------------------------------
  # PIPES (tree topology, 31 edges)
  # Lengths and diameters from swa plans WV640/WV650/WV660 + air-line x1.3
  # ---------------------------------------------------------------------------
  pipes:

    # ── TRUNKS ───────────────────────────────────────────────────────────────
    # East trunk: HKW ↔ j_ost (bidirectional — east-arm producers can feed
    # back toward j_hkw when east production > east consumer demand).
    # Physical length: 1470m (HKW→Lechhausen) + 4460m (SL5/SL6 to NE) = 5930m.
    hkw_to_ost:
      from: j_hkw
      to: j_ost
      length_m: 5930
      diameter_mm: 600
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
      bidirectional: true
    # South trunk: HKW → Pumpstation Süd
    hkw_to_pss:
      from: j_hkw
      to: j_pss
      length_m: 4470
      diameter_mm: 400
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    # West trunk: HKW → Pumpstation West
    hkw_to_psw:
      from: j_hkw
      to: j_psw
      length_m: 2630
      diameter_mm: 500
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # ── PRODUCER CONNECTIONS (heat flows FROM producer TO east busbar j_ost) ──
    # Pipes are defined FROM producer TO j_ost so that hot supply water flows
    # in the physically correct direction: producer → network.
    gtost_to_ost:
      from: j_gtost
      to: j_ost
      length_m: 60
      diameter_mm: 350
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    bmhkw_to_ost:
      from: j_bmhkw
      to: j_ost
      length_m: 60
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.30
      u_value_return_w_per_m_k: 0.32
    ava_to_ost:
      from: j_ava
      to: j_ost
      length_m: 870
      diameter_mm: 450        # AVA direct (45 MW) + investable HP = up to ~95 MW
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    # PSS pump rated 858 m3/h toward HWS → DN400 at v=1.9 m/s (WV640 Bl.3)
    pss_to_hws:
      from: j_pss
      to: j_hws
      length_m: 610
      diameter_mm: 400
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    # PSW pump rated 700 m3/h toward HWW → DN500 at v=1.0 m/s (WV640 Bl.3)
    psw_to_hww:
      from: j_psw
      to: j_hww
      length_m: 960
      diameter_mm: 500
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # ── NETZ-MITTE feeders (HKW direct) ──────────────────────────────────────
    hkw_to_man:
      from: j_hkw
      to: j_man
      length_m: 850
      diameter_mm: 400
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    hkw_to_hoher_weg:
      from: j_hkw
      to: j_hoher_weg
      length_m: 650
      diameter_mm: 350
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    hkw_to_hunoldsgraben:
      from: j_hkw
      to: j_hunoldsgraben
      length_m: 1170
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    hkw_to_kreissparkasse:
      from: j_hkw
      to: j_kreissparkasse
      length_m: 1740
      diameter_mm: 125
      u_value_supply_w_per_m_k: 0.24
      u_value_return_w_per_m_k: 0.26

    # ── NETZ-OST feeders ─────────────────────────────────────────────────────
    ost_to_lechhauser:
      from: j_ost
      to: j_lechhauser_str
      length_m: 680
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.30
      u_value_return_w_per_m_k: 0.32
    ost_to_kuka:
      from: j_ost
      to: j_kuka
      length_m: 1740
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.30
      u_value_return_w_per_m_k: 0.32
    ost_to_kurt_schumacher:
      from: j_ost
      to: j_kurt_schumacher_str
      length_m: 1370
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.30
      u_value_return_w_per_m_k: 0.32
    ost_to_hans_boeckler:
      from: j_ost
      to: j_hans_boeckler_str
      length_m: 1940
      diameter_mm: 400
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    ost_to_am_mittleren_moos:
      from: j_ost
      to: j_am_mittleren_moos
      length_m: 870
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30

    # ── NETZ-SÜD feeders ─────────────────────────────────────────────────────
    pss_to_theodor_heuss:
      from: j_pss
      to: j_theodor_heuss_platz
      length_m: 2350
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    pss_to_fuggerstr:
      from: j_pss
      to: j_fuggerstr
      length_m: 1200
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.26
      u_value_return_w_per_m_k: 0.28
    hws_to_sigma:
      from: j_hws
      to: j_sigma_technopark
      length_m: 450
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.26
      u_value_return_w_per_m_k: 0.28
    hws_to_uni:
      from: j_hws
      to: j_uni
      length_m: 910
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    hws_to_fraunhofer:
      from: j_hws
      to: j_fraunhofer
      length_m: 2050
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.26
      u_value_return_w_per_m_k: 0.28
    hws_to_beethovenpark:
      from: j_hws
      to: j_beethovenpark
      length_m: 2880
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.26
      u_value_return_w_per_m_k: 0.28
    hws_to_don_bosco:
      from: j_hws
      to: j_don_bosco
      length_m: 3490
      diameter_mm: 125
      u_value_supply_w_per_m_k: 0.24
      u_value_return_w_per_m_k: 0.26

    # ── NETZ-WEST feeders ─────────────────────────────────────────────────────
    psw_to_schlettererstr:
      from: j_psw
      to: j_schlettererstr
      length_m: 620
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.26
      u_value_return_w_per_m_k: 0.28
    psw_to_josefinum:
      from: j_psw
      to: j_josefinum
      length_m: 2070
      diameter_mm: 125
      u_value_supply_w_per_m_k: 0.24
      u_value_return_w_per_m_k: 0.26
    # UKA (Universitätsklinikum) — large hospital, DN250 confirmed (WV660)
    hww_to_klinikum:
      from: j_hww
      to: j_klinikum
      length_m: 3160
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.30
      u_value_return_w_per_m_k: 0.32
    hww_to_lise_meitner:
      from: j_hww
      to: j_lise_meitner_str
      length_m: 2270
      diameter_mm: 125
      u_value_supply_w_per_m_k: 0.24
      u_value_return_w_per_m_k: 0.26
    # August-Wessels-Str — DN125 confirmed (WV660 armature 850.3)
    hww_to_august_wessels:
      from: j_hww
      to: j_august_wessels_str
      length_m: 2150
      diameter_mm: 125
      u_value_supply_w_per_m_k: 0.24
      u_value_return_w_per_m_k: 0.26
    # Hooverstraße — DN250 confirmed (WV660 armature 620.1)
    hww_to_hooverstr:
      from: j_hww
      to: j_hooverstr
      length_m: 1000
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.30
      u_value_return_w_per_m_k: 0.32
    # Grasiger Weg — DN200 confirmed (WV660 armature 797.1)
    hww_to_grasiger_weg:
      from: j_hww
      to: j_grasiger_weg
      length_m: 1550
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    # Siegfried-Aufhäuser-Str — DN200 confirmed (WV660 armature 850.1)
    hww_to_siegfried_aufhaeuser:
      from: j_hww
      to: j_siegfried_aufhaeuser_str
      length_m: 1470
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.26
      u_value_return_w_per_m_k: 0.28


# =============================================================================
# ASSETS
# =============================================================================
assets:

  # ── Fixed production assets (existing infrastructure) ─────────────────────
  hkw:
    type: thermal_generator
    fuel: gas
    capacity_mw: 75.0
    thermal_efficiency: 0.90
    min_load: 0.1

  gtost:
    type: thermal_generator
    fuel: gas
    capacity_mw: 35.0          # WV640: 31 MW (125°C) ... 35 MW (102°C); EAST arm
    thermal_efficiency: 0.85
    min_load: 0.1

  # Biomasse-HKW: AT -14°C = 13 MW, Üzeiten = 14.5 MW (WV640 Bl.3)
  bmhkw:
    type: thermal_generator
    fuel: biomass
    capacity_mw: 14.5
    thermal_efficiency: 0.85
    min_load: 0.1

  # AVA waste-heat take-over: real DIRECT feed-in 40-45 MW (WV640), not a heat pump.
  ava_feed:
    type: thermal_generator
    fuel: waste_heat            # zero-emission, near-zero marginal cost source
    capacity_mw: 45.0
    thermal_efficiency: 1.0
    min_load: 0.0

  # Heizwerk Süd: AT -14°C = 40 MW / 550 t/h (WV640 Bl.3)
  hws_boiler:
    type: thermal_generator
    fuel: gas
    capacity_mw: 40.0
    thermal_efficiency: 0.90
    min_load: 0.1

  # Heizwerk West: 2 Kessel + 2 WÜ = 64 MW / 960 t/h at AT -14°C (WV640 Bl.3)
  hww_boiler:
    type: thermal_generator
    fuel: gas
    capacity_mw: 64.0
    thermal_efficiency: 0.90
    min_load: 0.1

  p2h_existing:
    type: p2h
    capacity_mw: 10.0
    efficiency: 0.98
    min_load: 0.1

  tes_existing:
    type: storage
    energy_mwh: 500.0
    power_mw: 50.0
    eff_charge: 0.98
    eff_discharge: 0.98
    loss_hour: 0.9999
    soc0_mwh: 250.0
    min_energy_mwh: 25.0
    cycling_cost_eur_per_mwh: 1.5
    terminal:
      state: cyclic
      policy: equal

  # ── Investable assets (optimizer sizes these) ──────────────────────────────
  # HP at AVA node for low-temperature waste heat lift (j_ava)
  hp_sb:
    type: heat_pump
    capacity_mw: 0.0
    min_load: 0.2
    wrg_source_column: "WRG_1_Celsius"
    wrg_capacity_column: "WRG1Q_MW"
    cop_default: 3.0
    investment:
      enabled: true
      capex_eur_per_mw: 400000.0
      activation_cost_eur: 50000.0
      lifetime_years: 20.0
      capacity_min_mw: 0.0
      capacity_max_mw: 50.0

  ek_sb:
    type: p2h
    capacity_mw: 0.0
    efficiency: 0.98
    min_load: 0.1
    investment:
      enabled: true
      capex_eur_per_mw: 150000.0
      activation_cost_eur: 20000.0
      lifetime_years: 25.0
      capacity_min_mw: 0.0
      capacity_max_mw: 50.0

  tes_sb:
    type: storage
    energy_mwh: 0.0
    power_mw: 0.0
    eff_charge: 0.98
    eff_discharge: 0.98
    loss_hour: 0.9999
    soc0_mwh: 0.0
    min_energy_mwh: 0.0
    cycling_cost_eur_per_mwh: 2.0
    investment:
      enabled: true
      energy_capex_eur_per_mwh: 16500.0
      power_capex_eur_per_mw: 5000.0
      activation_cost_eur: 30000.0
      lifetime_years: 30.0
      energy_capacity_min_mwh: 0.0
      energy_capacity_max_mwh: 5000.0
      power_capacity_min_mw: 0.0
      power_capacity_max_mw: 200.0
    terminal:
      state: cyclic
      policy: equal


# =============================================================================
# WASTE HEAT CONFIGURATION
# =============================================================================
waste_heat:
  Q_AW_max_column: "WRG1Q_MW"
  T_AW_column: "WRG_1_Celsius"
  T_amb_column: "outdoor_temp_C"


# =============================================================================
# HEAT PUMP COP MODEL
# =============================================================================
heat_pumps:
  cop:
    sink_defaults:
      Tsink_out_K: 372.15      # 99°C (Stadtbach mean supply)
      Tsink_in_K: 333.15       # 60°C (Stadtbach mean return)
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 3.0
  types:
    standard:
      eta: 0.6
      FQ: 0.10


# =============================================================================
# INVESTMENT ECONOMICS
# =============================================================================
investment:
  discount_rate: 0.05          # i = 5% (VDI 2067 / WACC)


# =============================================================================
# GRID, FUELS, COSTS
# =============================================================================
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  gridcost_eur_mwh: 10.0

fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0
  biomass:
    price_eur_mwh: 40.0
    ef_kg_per_mwh_fuel: 20.0
  waste_heat:
    price_eur_mwh: 5.0          # AVA take-over: low marginal cost, ~CO2-free
    ef_kg_per_mwh_fuel: 0.0

costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 1000.0

emissions:
  ef_el_kg_per_mwh: 400.0
  ef_gas_kg_per_mwh: 200.0
  ef_biomass_kg_per_mwh: 20.0


# =============================================================================
# RUN SETTINGS
# =============================================================================
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    MIPGap: 0.005
    TimeLimit: 86400
    MIPFocus: 1
    Heuristics: 0.5
    NumericFocus: 2
    OutputFlag: 1
    LogToConsole: 1


# =============================================================================
# OUTPUT
# =============================================================================
output:
  log_dir: "output/logs"
  export_dir: "output/paper2_runs"
  export_thermal_network: true
  export_solver_solution: true
