      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.26
      u_value_return_w_per_m_k: 0.28


# =============================================================================
# ASSETS
# =============================================================================
assets:

  # ── Fixed production assets (existing infrastructure) ─────────────────────
  # 2026-07-08: capacity_mw = real THERMAL OUTPUT at Übergangszeiten (99/60 °C
  # supply/return), user-provided and vouched-for. These are the OPERATING
  # capacities: the takeover/heat-exchanger stations deliver MORE power at the
  # milder Üzeiten condition (larger primary/secondary ΔT) than at the -14 °C
  # design point (125/60 °C), where deliverable power is LOWER (HX ΔT-limited).
  # Since the model runs a heating curve that mostly operates around Üzeiten
  # conditions, these are the representative caps.
  # thermal_efficiency / el_eff remain the notebook-guaranteed conversion ratios
  # (configs/paper_2/20250922_Stadtbach.ipynb); capacity_mw is thermal output, so
  # fuel = capacity_mw / th_eff and P_el = fuel * el_eff (CHP electricity).
  hkw:
    type: thermal_generator
    fuel: gas
    capacity_mw: 127.0          # real thermal output at Üzeiten 99/60 °C (user-provided)
    thermal_efficiency: 0.743   # notebook: model.HKW_th_eff
    el_eff: 0.177               # notebook: model.HKW_el_eff (CHP electricity)
    min_load: 0.1

  gtost:
    type: thermal_generator
    fuel: gas
    capacity_mw: 35.0           # real thermal output at Üzeiten 99/60 °C (user-provided)
    thermal_efficiency: 0.466   # notebook: model.GTOST_th_eff
    el_eff: 0.36                # notebook: model.GTOST_el_eff (CHP electricity)
    min_load: 0.1

  bmhkw:
    type: thermal_generator
    fuel: biomass
    capacity_mw: 14.5           # real thermal output at Üzeiten 99/60 °C (user-provided)
    thermal_efficiency: 0.485   # notebook: model.BMHKW_th_eff
    el_eff: 0.177               # notebook: model.BMHKW_el_eff (CHP electricity)
    min_load: 0.1

  # AVA waste-heat take-over: direct feed-in, th_eff=1.0.
  ava_feed:
    type: thermal_generator
    fuel: waste_heat            # zero-emission, near-zero marginal cost source
    capacity_mw: 45.0           # real thermal output at Üzeiten 99/60 °C (user-provided)
    thermal_efficiency: 1.0
    min_load: 0.0

  hws_boiler:
    type: thermal_generator
    fuel: gas
    capacity_mw: 32.0           # Heizwerk Süd, real thermal output at Üzeiten 99/60 °C (user-provided)
    thermal_efficiency: 0.936   # notebook: model.HWS_th_eff
    min_load: 0.1

  hww_boiler:
    type: thermal_generator
    fuel: gas
    capacity_mw: 104.0          # Heizwerk West, real thermal output at Üzeiten 99/60 °C (user-provided)
    thermal_efficiency: 0.924   # notebook: model.HWW_th_eff
    min_load: 0.1

  p2h_existing:
    type: p2h
    # 2026-07-08: aligned to notebook (P2H_Power bound=10 MW electric * P2H_eff 0.99)
    capacity_mw: 9.9
    efficiency: 0.99
    min_load: 0.1

  # tes_existing removed 2026-07-08 (see j_hkw assets comment above): no
  # documented WV640 basis, unlike every other asset in this file.

  # ── Investable assets (optimizer sizes these) ──────────────────────────────
  # HP at j_hkw (central hub) lifting MAN/UPM low-temp industrial waste heat (WRG from Netz-Mitte).
  # Physical WRG source is at j_man; the HP is co-located at the production hub as a modeling
  # simplification (DH transport of low-grade heat to HP is not modeled explicitly).
  hp_sb:
    type: heat_pump
    capacity_mw: 0.0
    min_load: 0.2
    wrg_source_column: "WRG_1_Celsius"
    wrg_capacity_column: "WRG1Q_MW"
    cop_default: 3.0
    investment:
      enabled: true
      capex_eur_per_mw: 400000.0
      activation_cost_eur: 50000.0
      lifetime_years: 20.0
      capacity_min_mw: 0.0
      capacity_max_mw: 50.0

  ek_sb:
    type: p2h
    capacity_mw: 0.0
    efficiency: 0.98
    min_load: 0.1
    investment:
      enabled: true
      capex_eur_per_mw: 150000.0
      activation_cost_eur: 20000.0
      lifetime_years: 25.0
      capacity_min_mw: 0.0
      capacity_max_mw: 50.0

  tes_sb:
    type: geometric_storage
    # Scenario ΔT = T_VL_min − T_return (worst-case corridor, not the mean);
    # overridden per HK stage by scenario_runner.py.
    delta_T_scenario_k: 36.0    # HK0 baseline: 70 − 60 = 10.0 K worst-case at runtime; static fallback only
    r_hd: 3.0                   # h/d aspect ratio
    p_max_bar: 10.0             # max vessel operating pressure
    V_min_m3: 10.0              # minimum tank volume if built [m³]
    V_max_m3: 50000.0           # max tank volume [m³]
    option_b: false             # Option A: V as single Var; h/d back-calculated post-solve
    alpha_tes_eur_per_m3: 400.0 # variable CAPEX [€/m³] (larger tank → lower unit cost)
    beta_tes_eur: 100000.0      # fixed CAPEX (engineering, permits, connections) [€]
    lifetime_years: 30.0
    eff_charge: 0.98
    eff_discharge: 0.98
    loss_hour: 0.9999
    soc0_fraction: 0.5
    power_to_energy_ratio: 0.25
    terminal_soc_fraction: 0.5
    # Dead-volume floor: stratified hot-water tanks can't fully discharge —
    # diffuser placement and pump NPSH require some minimum water level.
    # 5% is a generic literature range (typically 5-10%), not a measured
    # value for this specific tank; revisit if real commissioning data
    # becomes available.
    e_min_fraction: 0.05
    cycling_cost_eur_per_mwh: 2.0


# =============================================================================
# WASTE HEAT CONFIGURATION
# =============================================================================
waste_heat:
  Q_AW_max_column: "WRG1Q_MW"
  T_AW_column: "WRG_1_Celsius"
  T_amb_column: "outdoor_temp_C"


# =============================================================================
# HEAT PUMP COP MODEL
# =============================================================================
heat_pumps:
  cop:
    sink_defaults:
      Tsink_out_K: 372.15      # 99°C (Stadtbach mean supply)
      Tsink_in_K: 333.15       # 60°C (Stadtbach mean return)
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 3.0
  types:
    standard:
      # 2026-07-08: eta corrected 0.6 -> 0.75 to match the notebook's Lorenz-COP
      # calibration exactly (model.eta in 20250922_Stadtbach.ipynb) -- this
      # formula was ported from that same notebook, whose own default/code
      # default is also 0.75; 0.6 had no documented justification.
      eta: 0.75
      FQ: 0.10


# =============================================================================
# INVESTMENT ECONOMICS
# =============================================================================
investment:
  discount_rate: 0.05          # i = 5% (VDI 2067 / WACC)


# =============================================================================
# GRID, FUELS, COSTS
# =============================================================================
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  # Volumetric grid cost = MS Arbeitspreis (>=2500 h/a band ~0.5-2.0 ct/kWh) + 2026 levies:
  # KWKG 0.446 + Offshore 0.941 + BesAR/§19 0.05 (>1 GWh tranche) ct/kWh
  # + Konzessionsabgabe Sondervertrag 0.11 + Stromsteuer 0.05 (Prod. Gewerbe) => ~2.5 ct/kWh
  gridcost_eur_mwh: 25.0
  # Jahresleistungspreis on peak grid import (P_buy_peak), MS level >=2500 h/a band.
  # 2026 published sheets span 67-167 k€/MW·a (NEW Netz 118.3 / Schleswig 165.2 /
  # Fairnetz 167.0 / EWE 67.2). 127.24 k€/MW·a = real 2022/23 tariff from the SB
  # notebook — sits mid-range of 2026 values, kept for continuity.
  demand_charge_eur_per_mw_y: 127240.0

fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0
  biomass:
    price_eur_mwh: 40.0
    ef_kg_per_mwh_fuel: 20.0
  waste_heat:
    price_eur_mwh: 5.0          # AVA take-over: low marginal cost, ~CO2-free
    ef_kg_per_mwh_fuel: 0.0

costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 1000.0

emissions:
  ef_el_kg_per_mwh: 400.0
  ef_gas_kg_per_mwh: 200.0
  ef_biomass_kg_per_mwh: 20.0


# =============================================================================
# RUN SETTINGS
# =============================================================================
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    MIPGap: 0.005
    TimeLimit: 86400
    MIPFocus: 1
    Heuristics: 0.5
    NumericFocus: 2
    OutputFlag: 1
    LogToConsole: 1


# =============================================================================
# OUTPUT
# =============================================================================
output:
  log_dir: "output/logs"
  export_dir: "output/paper2_runs"
  export_thermal_network: true
  export_solver_solution: true


# =============================================================================
# DISPATCH SERIES MAP
# Explicit routing of result_collector series keys to dispatch_hourly.csv columns.
# Overrides the heuristic fallback in extract_artefacts.write_dispatch_hourly().
# Keys: series key as stored by result_collector ({ASSET_ID}_Q_th_MW or hp_{id}_Q_th_MW).
# Values: target column in dispatch_hourly.csv.
# Note: P2H_Q_th_MW is captured by the primary Q_ek sum and must NOT be listed here.
# =============================================================================
dispatch_series_map:
  HKW_Q_th_MW:       Q_chp_MW        # gas CHP (75 MW, j_hkw)
  GTOST_Q_th_MW:     Q_chp_MW        # gas turbine east (35 MW, j_gtost)
  BMHKW_Q_th_MW:     Q_biomass_MW    # biomass CHP (14.5 MW, j_bmhkw)
  AVA_FEED_Q_th_MW:  Q_biomass_MW    # AVA waste-heat feed-in (45 MW, j_ava) — zero CO2
  HWS_BOILER_Q_th_MW: Q_gasboiler_MW # Heizwerk Süd gas boiler (40 MW, j_pss)
  HWW_BOILER_Q_th_MW: Q_gasboiler_MW # Heizwerk West gas boiler (64 MW, j_psw)
  hp_sb_Q_th_MW:     Q_hp_total_MW   # investable heat pump at j_hkw (MAN/UPM waste heat)
