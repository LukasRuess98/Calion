      u_value_return_w_per_m_k: 0.26
    # August-Wessels-Str — DN125 confirmed (WV660 armature 850.3)
    hww_to_august_wessels:
      from: j_hww
      to: j_august_wessels_str
      length_m: 2150
      diameter_mm: 125
      u_value_supply_w_per_m_k: 0.24
      u_value_return_w_per_m_k: 0.26
    # Hooverstraße — DN250 confirmed (WV660 armature 620.1)
    hww_to_hooverstr:
      from: j_hww
      to: j_hooverstr
      length_m: 1000
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.30
      u_value_return_w_per_m_k: 0.32
    # Grasiger Weg — DN200 confirmed (WV660 armature 797.1)
    hww_to_grasiger_weg:
      from: j_hww
      to: j_grasiger_weg
