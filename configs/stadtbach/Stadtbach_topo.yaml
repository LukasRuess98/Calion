# =============================================================================
# STADTBACH DISTRICT HEATING NETWORK — swa-corrected Topology (Paper 2)
# =============================================================================
# 32 nodes, 31 pipes (tree topology)
# Corrections vs. previous ACRON-based topology (cross-checked against swa plans
# WV640 Bl.3, WV650 Netz-Mitte, WV660 Netz-West):
#
#  (1) EAST ARM introduced. GT-Ost, Biomass-CHP and the AVA waste-heat
#      take-over are physically in the NE (Hammerschmiede) and feed the
#      network via the eastern trunk (SL5/SL6) — NOT at the HKW busbar.
#  (2) AVA modelled as a 45 MW DIRECT waste-heat feed-in (ava_feed), with
#      an investable HP (hp_sb) co-located at j_ava for low-temperature lift.
#  (3) CONSUMER ZONES corrected to real geography (13 of 24 were misassigned):
#      Lise-Meitner/Klinikum/Josefinum -> WEST; Kurt-Schumacher/Lechhauser/
#      KUKA/Hans-Böckler -> EAST; Beethovenpark/Don Bosco -> SOUTH; etc.
#  (4) PIPE DN and LENGTHS aligned to swa valve tables + real trace distances.
#
# PRODUCERS (6 nodes): j_hkw, j_gtost, j_bmhkw, j_ava, j_hws, j_hww
# JUNCTIONS (4): j_ost, j_ne, j_pss, j_psw
# CONSUMERS (24): one per ACRON station (7 measured + 17 zone-estimated)
#
# FIXED ASSETS (existing infrastructure):
#   HKW:      75 MW gas CHP
#   GT-Ost:   35 MW gas — on EAST arm at j_gtost
#   BMHKW:    14.5 MW biomass — on EAST arm at j_bmhkw
#   AVA:      45 MW waste-heat feed-in (ava_feed) — on EAST arm at j_ava
#   HWS:      40 MW gas boiler — south zone at j_hws
#   HWW:      64 MW gas boiler — west zone at j_hww
#   P2H:      10 MW existing electrode boiler
#   TES:     500 MWh existing storage
#
# INVESTABLE ASSETS (optimizer sizes these):
#   hp_sb:    HP at j_hkw, lifting MAN/UPM industrial waste heat (WRG source: Netz-Mitte)
#   ek_sb:    electrode boiler at j_hkw (0–50 MW, capex 150 k€/MW)
#   tes_sb:   TES at j_hkw (0–5000 MWh, capex 16.5 k€/MWh)
#
# DATA: data/Stadtbach/stadtbach_acron_combined_cleaned.xlsx
#   Build with: python scripts/preprocess/merge_acron_sb.py
#   Then:       python scripts/preprocess/clean_stadtbach_west.py
#   (West-zone 9 estimated consumers reconstructed via energy balance; raw
#    merge corrupts them from PSW recirculation flow -- see clean script header)
#
# TEMPERATURES (from PPS/PSW measurements 2025):
#   Supply: mean 99°C, max 122°C  |  Return: mean 60°C
# =============================================================================

site:
  input_xlsx: "data/Stadtbach/stadtbach_acron_combined_cleaned.xlsx"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  name: "Stadtbach swa-corrected Topology (Paper 2)"
  description: "Real 32-node Stadtbach network, swa-corrected, with investable assets"
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: "2025-01-01 00:00"
    end: "2025-12-31 23:00"

# =============================================================================
# NETWORK
# =============================================================================
network:
  milp_linearize: true
  primary_producer: "j_hkw"   # explicit: j_bmhkw sorts before j_hkw alphabetically
  physics:
    heat_loss: true
    # 2026-07-09: pressure_drop ENABLED after fixing the mesh/booster pressure
    # formulation. IIS showed the real blocker was NOT mesh over-determination
    # but that pump-station nodes (j_pss/j_psw) had their supply pressure PINNED
    # by the incoming pipe (P = P_hkw - Δp), so their booster pump couldn't lift
    # it -> the j_josefinum consumer station starved of its 0.7 bar differential.
    # Fix (network_manager._link_pressure_propagation): secondary producers/pump
    # stations get a pump-boosted supply pressure (floor at setpoint, not pinned),
    # propagation into any producer is skipped, and node-to-node propagation is an
    # inequality (valve absorbs excess; pump-power min sets the minimum-pressure
    # profile) so multi-feed junctions like j_ost aren't over-determined.
    pressure_drop: true
    transport_delay: true

  supply_temp_c: 99.0
  return_temp_c: 60.0
  ground_temp_c: 10.0
  min_supply_delta_T_k: 10.0  # minimum T_supply − T_return for consumer substation operation (VDI 6002)
  consumer_min_temp_c: 70.0   # = T_return + 10 K; includes industrial consumers (Klinikum, KUKA, MAN)

  temperature_frame:
    default_return_band_c: 5.0
    seasons:
      winter:
        months: [1, 2, 12]
        supply_c: 115.0
        return_c: 62.0
      spring:
        months: [3, 4, 5]
        supply_c: 99.0
        return_c: 61.0
      summer:
        months: [6, 7, 8]
        supply_c: 84.0
        return_c: 62.0
      autumn:
        months: [9, 10, 11]
        supply_c: 96.0
        return_c: 60.0

  heating_curve:
    enabled: true
    T_supply_max_c: 122.0
    T_supply_min_c: 70.0
    T_outdoor_low_c: -15.0
    T_outdoor_high_c: 30.0

  linearization:
    method: "pwl"
    temperature_profile:
      load_fractions: [0.0, 0.3, 0.6, 1.0]
      T_supply_c: [70.0, 85.0, 100.0, 122.0]
      T_return_c: [55.0, 58.0,  62.0,  68.0]

  max_velocity_m_s: 2.5
  parameters:
    max_velocity_m_s: 2.5  # passed to pipe_pair enriched_config via self.parameters
  state_validation:
    flow_constraints:
      max_velocity_m_s: 2.5  # passed to state_constraints velocity Pyomo constraint
  pump_efficiency: 0.75
  pipe_roughness_mm: 0.5
  max_pressure_drop_bar: 2.0
  delta_p_min_consumer_bar: 0.7

  # ---------------------------------------------------------------------------
  # NODES
  # ---------------------------------------------------------------------------
  nodes:

    # ── PRODUCTION HUB (HKW busbar: gas CHP, P2H, TES, investable EK+TES) ───
    j_hkw:
      # tes_existing removed 2026-07-08: unlike every other WV640-cited asset in
      # this file, its 500 MWh figure had no documented source (config's own
      # comment admitted the derived volume was "a modeling estimate, not a
      # surveyed dimension", borrowed from tes_sb's ΔT rather than any real
      # spec) -- treated as fictional per the same standard applied to the
      # Memmingen header-comment/DN discrepancies found earlier this session.
      assets: [hkw, p2h_existing, ek_sb, hp_sb, tes_sb]
      # 2026-07-09: supply-pressure setpoint raised 10 -> 16 bar. Stadtbach is a
      # ~6 km network with long thin service lines (e.g. hkw_to_kreissparkasse
      # DN125 x 1740 m); at 10 bar the cumulative Darcy-Weisbach drop left distant
      # consumer stations below their 0.7 bar minimum differential (IIS-confirmed
      # head-budget limit, not a formulation bug). 16 bar is a realistic operating
      # pressure for a district-heating trunk of this length.
      pressure:
        setpoint_bar: 16.0

    # ── EAST TRUNK JUNCTION ──────────────────────────────────────────────────
    # j_ost acts as the east busbar: receives heat from j_hkw (bidirectional
    # trunk pipe) AND from all east-arm producers (reversed pipes), then
    # distributes to east consumers. j_ne is merged into j_ost to avoid the
    # need for a second bidirectional trunk segment.
    j_ost: {}   # Lechhausen / Hammerschmiede east busbar

    # ── PRODUCER STATIONS ────────────────────────────────────────────────────
    j_gtost:
      assets: [gtost]

    j_bmhkw:
      assets: [bmhkw]

    j_ava:
      # AVA direct high-temperature waste-heat feed-in only (no HP needed)
      assets: [ava_feed]

    j_hws: {}   # pure junction — receives heat from j_pss via pss_to_hws pipe
    j_hww: {}   # pure junction — receives heat from j_psw via psw_to_hww pipe

    # ── PUMP STATIONS (secondary producers) ──────────────────────────────────
    j_pss:
      assets: [hws_boiler]
    j_psw:
      assets: [hww_boiler]

    # ── NETZ-MITTE CONSUMERS (connected directly to j_hkw) ──────────────────
    j_man:
      consumers:
        - column: "MAN_MW"
    j_hoher_weg:
      consumers:
        - column: "Hoher_Weg_MW"
    j_hunoldsgraben:
      consumers:
        - column: "Hunoldsgraben_MW"
    j_kreissparkasse:
      consumers:
        - column: "Kreissparkasse_MW"

    # ── NETZ-OST CONSUMERS (from j_ost / j_ne) ──────────────────────────────
    j_lechhauser_str:
      consumers:
        - column: "Lechhauser_Str_MW"
    j_kuka:
      consumers:
        - column: "KUKA_MW"
    j_kurt_schumacher_str:
      consumers:
        - column: "Kurt-Schumacher-Str_MW"
    j_hans_boeckler_str:
      consumers:
        - column: "Hans-Boeckler-Str_MW"
    j_am_mittleren_moos:
      consumers:
        - column: "Am_Mittleren_Moos_MW"

    # ── NETZ-SÜD CONSUMERS (from j_pss / j_hws) ─────────────────────────────
    j_theodor_heuss_platz:
      consumers:
        - column: "Theodor-Heuss-Platz_MW"
    j_fuggerstr:
      consumers:
        - column: "Fuggerstr_MW"
    j_sigma_technopark:
      consumers:
        - column: "SIGMA_Technopark_MW"
    j_uni:
      consumers:
        - column: "UNI_MW"
    j_fraunhofer:
      consumers:
        - column: "Fraunhofer_MW"
    j_beethovenpark:
      consumers:
        - column: "Beethovenpark_MW"
    j_don_bosco:
      consumers:
        - column: "Don_Bosco_MW"

    # ── NETZ-WEST CONSUMERS (from j_psw / j_hww) ─────────────────────────────
    j_schlettererstr:
      consumers:
        - column: "Schlettererstr_MW"
    j_josefinum:
      consumers:
        - column: "Josefinum_MW"
    j_klinikum:
      consumers:
        - column: "Klinikum_MW"
    j_lise_meitner_str:
      consumers:
        - column: "Lise-Meitner-Str_MW"
    j_august_wessels_str:
      consumers:
        - column: "August-Wessels-Str_MW"
    j_hooverstr:
      consumers:
        - column: "Hooverstr_MW"
    j_grasiger_weg:
      consumers:
        - column: "Grasiger_Weg_MW"
    j_siegfried_aufhaeuser_str:
      consumers:
        - column: "Siegfried-Aufhaeuser-Str_MW"

  # ---------------------------------------------------------------------------
  # PIPES (tree topology, 31 edges)
  # Lengths and diameters from swa plans WV640/WV650/WV660 + air-line x1.3
  # ---------------------------------------------------------------------------
  pipes:

    # ── TRUNKS ───────────────────────────────────────────────────────────────
    # East trunk: HKW ↔ j_ost (bidirectional — east-arm producers can feed
    # back toward j_hkw when east production > east consumer demand).
    # Physical length: 1470m (HKW→Lechhausen) + 4460m (SL5/SL6 to NE) = 5930m.
    hkw_to_ost:
      from: j_hkw
      to: j_ost
      length_m: 5930
      diameter_mm: 600
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
      bidirectional: true
    # South trunk: HKW → Pumpstation Süd
    hkw_to_pss:
      from: j_hkw
      to: j_pss
      length_m: 4470
      diameter_mm: 400
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    # West trunk: HKW → Pumpstation West
    hkw_to_psw:
      from: j_hkw
      to: j_psw
      length_m: 2630
      diameter_mm: 500
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # ── PRODUCER CONNECTIONS (heat flows FROM producer TO east busbar j_ost) ──
    # Pipes are defined FROM producer TO j_ost so that hot supply water flows
    # in the physically correct direction: producer → network.
    gtost_to_ost:
      from: j_gtost
      to: j_ost
      length_m: 60
      diameter_mm: 350
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    bmhkw_to_ost:
      from: j_bmhkw
      to: j_ost
      length_m: 60
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.30
      u_value_return_w_per_m_k: 0.32
    ava_to_ost:
      from: j_ava
      to: j_ost
      length_m: 870
      diameter_mm: 450        # AVA direct (45 MW) + investable HP = up to ~95 MW
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    # PSS pump rated 858 m3/h toward HWS → DN400 at v=1.9 m/s (WV640 Bl.3)
    pss_to_hws:
      from: j_pss
      to: j_hws
      length_m: 610
      diameter_mm: 400
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    # PSW pump rated 700 m3/h toward HWW → DN500 at v=1.0 m/s (WV640 Bl.3)
    psw_to_hww:
      from: j_psw
      to: j_hww
      length_m: 960
      diameter_mm: 500
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # ── NETZ-MITTE feeders (HKW direct) ──────────────────────────────────────
    hkw_to_man:
      from: j_hkw
      to: j_man
      length_m: 850
      diameter_mm: 400
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    hkw_to_hoher_weg:
      from: j_hkw
      to: j_hoher_weg
      length_m: 650
      diameter_mm: 350
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    hkw_to_hunoldsgraben:
      from: j_hkw
      to: j_hunoldsgraben
      length_m: 1170
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    hkw_to_kreissparkasse:
      from: j_hkw
      to: j_kreissparkasse
      length_m: 1740
      diameter_mm: 125
      u_value_supply_w_per_m_k: 0.24
      u_value_return_w_per_m_k: 0.26

    # ── NETZ-OST feeders ─────────────────────────────────────────────────────
    ost_to_lechhauser:
      from: j_ost
      to: j_lechhauser_str
      length_m: 680
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.30
      u_value_return_w_per_m_k: 0.32
    ost_to_kuka:
      from: j_ost
      to: j_kuka
      length_m: 1740
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.30
      u_value_return_w_per_m_k: 0.32
    ost_to_kurt_schumacher:
      from: j_ost
      to: j_kurt_schumacher_str
      length_m: 1370
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.30
      u_value_return_w_per_m_k: 0.32
    ost_to_hans_boeckler:
      from: j_ost
      to: j_hans_boeckler_str
      length_m: 1940
      diameter_mm: 400
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    ost_to_am_mittleren_moos:
      from: j_ost
      to: j_am_mittleren_moos
      length_m: 870
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30

    # ── NETZ-SÜD feeders ─────────────────────────────────────────────────────
    pss_to_theodor_heuss:
      from: j_pss
      to: j_theodor_heuss_platz
      length_m: 2350
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
    pss_to_fuggerstr:
      from: j_pss
      to: j_fuggerstr
      length_m: 1200
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.26
      u_value_return_w_per_m_k: 0.28
    hws_to_sigma:
      from: j_hws
      to: j_sigma_technopark
      length_m: 450
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.26
      u_value_return_w_per_m_k: 0.28
    hws_to_uni:
      from: j_hws
      to: j_uni
      length_m: 910
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    hws_to_fraunhofer:
      from: j_hws
      to: j_fraunhofer
      length_m: 2050
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.26
      u_value_return_w_per_m_k: 0.28
    hws_to_beethovenpark:
      from: j_hws
      to: j_beethovenpark
      length_m: 2880
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.26
      u_value_return_w_per_m_k: 0.28
    hws_to_don_bosco:
      from: j_hws
      to: j_don_bosco
      length_m: 3490
      diameter_mm: 125
