      u_value_return_w_per_m_k: 0.26
    # UKA (Universitätsklinikum) — large hospital, DN250 confirmed (WV660)
    hww_to_klinikum:
      from: j_hww
      to: j_klinikum
      length_m: 3160
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.30
      u_value_return_w_per_m_k: 0.32
    hww_to_lise_meitner:
