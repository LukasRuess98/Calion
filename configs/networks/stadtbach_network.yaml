# =============================================================================
# NETWORK SUMMARY
# =============================================================================

network_summary:
  total_nodes: 12
  total_pipes: 11
  total_length_m: 13400  # Estimated

  networks:
    nord:
      demand_fraction: 0.40
      main_plants: [plant_ost, plant_west_hww]
      consumer_zones: 3
      network_designation: PN_25

    sued:
      demand_fraction: 0.60
      main_plants: [plant_ost, plant_sued_hws]
      consumer_zones: 3
      network_designation: PN_16

  estimated_data_note: |
    Pipe lengths, coordinates, and some technical parameters estimated from network diagram.
    Actual GIS data should replace estimates when available.
    Demand split: Nord 40%, Süd 60% as requested.
