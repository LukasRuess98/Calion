# =============================================================================
# SUMMARY
# =============================================================================
# Total network length: 12,400 m
# Number of pipes: 10
# Number of nodes: 11 (3 plants, 2 pumps, 6 consumers)
#
# Investment options:
# - Pipes: DISABLED (brownfield)
# - Heat pumps: ENABLED at all plant nodes
# - Storage: ENABLED at all plant nodes
#
# Hydraulic constraints:
# - Max velocity: 2.5 m/s per pipe
# - Max pressure: 16-25 bar depending on pipe
# - Flow limits calculated from pipe diameter
