# =============================================================================
# SCENARIO: Stadtbach Baseline 2023 - Dispatch Only
# =============================================================================
# Baseline scenario: dispatch optimization with fixed capacities
# Using network + assets structure (Level 1: Copperplate)

site:
  input_xlsx: "data/Import_Data_yearly.csv"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  run_mode: PF_ONLY
  metadata:
    name: "Stadtbach Baseline 2023"
    description: "Dispatch-only optimization for Stadtbach district heating"
    version: "2.0"
    author: "EnerGIS Planning Team"
    purpose: "Paper analysis - baseline scenario"
    created: "2026-03-27"

# ===========================================================================
# NETWORK: Copperplate model (single producer node)
# ===========================================================================
network:
  nodes:
    system:
      type: producer
      assets: [boiler_main, hp_stadtbach, storage_main]
      demand:
        column: "waermebedarf_MWth"

# ===========================================================================
# ASSETS: Heat supply technologies
# ===========================================================================
assets:
  boiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 150.0
    thermal_efficiency: 0.85
    min_load_fraction: 0.1

  hp_stadtbach:
    type: heat_pump
    capacity_mw: 100.0
    min_load: 0.2
    cop_default: 3.5

  storage_main:
    type: thermal_storage
    energy_capacity_mwh: 500.0
    power_capacity_mw: 100.0
    initial_soc_fraction: 0.5

# ===========================================================================
# GRID CONNECTION
# ===========================================================================
grid:
  gridcost_eur_mwh: 20.0

# ===========================================================================
# FUELS & PRICES
# ===========================================================================
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0

# ===========================================================================
# ECONOMICS & COSTS
# ===========================================================================
costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 10.0

# ===========================================================================
# SOLVER CONFIGURATION
# ===========================================================================
run:
  dt_h: 1.0
  solver: appsi_highs

