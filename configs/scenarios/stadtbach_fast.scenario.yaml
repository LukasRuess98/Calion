# Stadtbach Scenario - WITH Investment
# Uses stadtbach_fast.system.yaml with investment enabled
# Usage: python -m energis.run configs/base.yaml configs/tech_catalog.yaml configs/systems/stadtbach_fast.system.yaml configs/scenarios/stadtbach_fast.scenario.yaml

data_file: Import_Data.xlsx

scenario:
  run_mode: PF_ONLY
  workflow:
    - PF
  fix_design: true  # Allow capacity decisions
  title: "Stadtbach_Investment"
  tag: "stadtbach-investment"

  horizon:
    type: "date_range"
    start: "2023-01-01 00:00"
    end: "2023-01-30 00:00"
    enforce: false

# System with Investment enabled
system_file: configs/systems/stadtbach_fast.system.yaml

# Site config
site:
  input_file: Import_Data.xlsx
  year_target: 2023
  columns:
    price_candidates:
      - Day_Ahead_Price
      - strompreis
    heat_candidates:
      - Waermebedarf_MW
      - waermebedarf
    co2_candidates:
      - CO2_consumption_based
      - co2

# THERMAL NETWORK - Disabled
thermal_network:
  enabled: ture 
  topology_file: configs/networks/stadtbach_network.yaml
  brownfield_mode: true
  allow_pipe_investment: false
  # Post-processing validation parameters (used by validate_hydraulics_post_optimization)
  validation:
    max_velocity_m_s: 5
    max_pressure_drop_bar: 10.0

# Run parameters
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    Threads: 0
    MIPGap: 0.02
    TimeLimit: 30000
    MIPFocus: 1
    Method: 2
    Presolve: 2
    Heuristics: 0.2
    LogToConsole: 1

# Grid settings
grid:
  max_import_mw: 2000
  max_export_mw: 500
  big_m_grid_mw: 500

# Cost settings - ALL CAPEX ENABLED
costs:
  dump_cost_eur_per_mwh_th: 10.0
  co2_price_eur_per_t: 100.0
  include_co2_cost_in_objective: true
  include_capex_costs: false       # Include CAPEX in objective
  include_activation_costs: true   # Include activation costs
  include_tie_breaker_costs: true  # Include tie breaker for solver stability
