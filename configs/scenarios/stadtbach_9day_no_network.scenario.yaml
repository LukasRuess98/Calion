# Run-Parameter mit Timeout
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    Threads: 8
    MIPGap: 0.05
    TimeLimit: 30000           # 5 min Timeout
    MIPFocus: 1
    LogToConsole: 1

# Grid settings
grid:
  max_import_mw: 1500
  max_export_mw: 500
  big_m_grid_mw: 2000

# Cost settings
costs:
  dump_cost_eur_per_mwh_th: 10.0
  co2_price_eur_per_t: 100.0
  include_co2_cost_in_objective: true
  include_capex_costs: true
