# Stadtbach 9-Day Test WITHOUT Thermal Network
# Fast baseline test to validate solver performance
# Usage: python -m energis.run configs/base.yaml configs/tech_catalog.yaml configs/systems/stadtbach.system.yaml configs/scenarios/stadtbach_9day_no_network.scenario.yaml

data_file: stadtbach_synthetic_2023_1week.csv

scenario:
  run_mode: PF_ONLY
  workflow:
    - PF
  fix_design: false
  title: "Stadtbach_9_Day_NO_Network"
  tag: "stadtbach-9day-no-thermal-network"

  # 9 Tage wie vom Benutzer getestet
  horizon:
    type: "date_range"
    start: "2023-01-01 00:00"
    end: "2023-01-03 00:00"    # 9 Tage = 216h
    enforce: false

# System-Konfiguration (standard ohne Netzwerk)
system_file: configs/systems/stadtbach.system.yaml

# THERMAL NETWORK AKTIVIERT mit Brownfield-Mode für MILP-Kompatibilität
thermal_network:
  enabled: true
  topology_file: configs/networks/stadtbach_brownfield.yaml
