# Stadtbach Brownfield Optimization Scenario
# Fixed network, only heat pump and storage expansion
# Date: 2025-12-11

metadata:
  name: Stadtbach Brownfield Optimization
  description: Brownfield optimization - fixed network, only HP and storage expansion

# =============================================================================
# RUN SETTINGS
# =============================================================================

run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    TimeLimit: 3600
    MIPGap: 0.01
    Threads: 8

scenario:
  run_mode: PF_ONLY
  horizon_days: 7

# =============================================================================
# SITE - Data from Import_Data.xlsx
# =============================================================================

site:
  input_file: Import_Data.xlsx
  year_target: 2023
  columns:
    price_candidates:
      - Day_Ahead_Price
      - strompreis
    heat_candidates:
      - Waermebedarf_MW
      - waermebedarf
    co2_candidates:
      - CO2_consumption_based
      - co2

# =============================================================================
# THERMAL NETWORK - Brownfield Configuration
# =============================================================================

thermal_network:
  enabled: true
  topology_file: configs/networks/stadtbach_brownfield.yaml
  brownfield_mode: true
  allow_pipe_investment: false

# =============================================================================
# COMPONENTS - Individual investable/brownfield settings
# =============================================================================

# Heat Pumps - each can be individually set as investable or brownfield
heat_pumps:
  HP1:
    enabled: true
    investable: false
    capacity_init_mw: 10.0
    wrg_source: WRG1

  HP2:
    enabled: true
    investable: false
    capacity_init_mw: 8.0
    wrg_source: WRG2

  HP3:
    enabled: true
    investable: false
    capacity_init_mw: 6.0
    wrg_source: WRG3

  HP4:
    enabled: true
    investable: false
    capacity_init_mw: 5.0
    wrg_source: WRG4

  HP_new_ost:
    enabled: true
    investable: true
    capacity_min_mw: 5.0
    capacity_max_mw: 50.0
    capex_eur_per_mw: 400000
    activation_cost_eur: 250000
    node: plant_ost

# Thermal Generators - each individually configurable
generators:
  HKW:
    enabled: true
    investable: false
    capacity_th_mw: 75.0

  GTOST:
    enabled: true
    investable: false
    capacity_th_mw: 41.3

  BMHKW:
    enabled: true
    investable: false
    capacity_th_mw: 15.0

  HWS:
    enabled: true
    investable: false
    capacity_th_mw: 40.0

  HWW:
    enabled: true
    investable: false
    capacity_th_mw: 60.0

# Storage - investable
storage:
  TES_main:
    enabled: true
    investable: true
    e_cap_min_mwh: 100
    e_cap_max_mwh: 5000
    p_cap_min_mw: 10
    p_cap_max_mw: 100
    capex_eur_per_mwh: 5000
    activation_cost_eur: 50000
