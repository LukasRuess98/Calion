# Stadtbach Brownfield Optimization Scenario
# Fixed network, only heat pump and storage expansion
# Date: 2025-12-11

metadata:
  name: Stadtbach Brownfield Optimization
  description: |
    Brownfield optimization scenario for Stadtbach district heating network.
    The pipe network is considered fixed (no pipe investments).
    Only additional heat pumps and thermal storage can be added at existing plant nodes.

  objective: Minimize total system cost while respecting network hydraulic limits

# =============================================================================
# OPTIMIZATION SETTINGS
# =============================================================================

run_settings:
  dt_h: 1.0  # 1-hour timesteps
  solver: gurobi
  solver_options:
    TimeLimit: 3600
    MIPGap: 0.01
    Threads: 8
  perfect_forecast: true

# Duration for testing (change to full year for production)
horizon:
  days: 7  # 1 week for testing, use 365 for full year

# =============================================================================
# THERMAL NETWORK - Brownfield Configuration
# =============================================================================

thermal_network:
  enabled: true
  topology_file: configs/networks/stadtbach_brownfield.yaml

  # Ensure brownfield mode
  brownfield_mode: true
  allow_pipe_investment: false

# =============================================================================
# COMPONENT INVESTMENT OPTIONS
# =============================================================================

investment_options:
  # Heat Pumps - investable at plant nodes
  heat_pumps:
    enabled: true
    nodes: [plant_ost, plant_west_hww, plant_sued_hws]

    # Per-node limits
    plant_ost:
      capacity_min_mw: 5.0
      capacity_max_mw: 50.0
      capex_eur_per_mw: 400000
      activation_cost_eur: 250000

    plant_west_hww:
      capacity_min_mw: 5.0
      capacity_max_mw: 30.0
      capex_eur_per_mw: 400000
      activation_cost_eur: 250000

    plant_sued_hws:
      capacity_min_mw: 5.0
      capacity_max_mw: 20.0
      capex_eur_per_mw: 400000
      activation_cost_eur: 200000

  # Thermal Storage - investable at plant nodes
  storage:
    enabled: true
    nodes: [plant_ost, plant_west_hww, plant_sued_hws]

    # Per-node limits
    plant_ost:
      energy_min_mwh: 100.0
      energy_max_mwh: 5000.0
      power_min_mw: 10.0
      power_max_mw: 100.0
      capex_eur_per_mwh: 5000
      activation_cost_eur: 50000

    plant_west_hww:
      energy_min_mwh: 50.0
      energy_max_mwh: 2000.0
      power_min_mw: 5.0
      power_max_mw: 50.0
      capex_eur_per_mwh: 5000
      activation_cost_eur: 30000

    plant_sued_hws:
      energy_min_mwh: 50.0
      energy_max_mwh: 1000.0
      power_min_mw: 5.0
      power_max_mw: 25.0
      capex_eur_per_mwh: 5000
      activation_cost_eur: 25000

  # Pipes - DISABLED for brownfield
  pipes:
    enabled: false

# =============================================================================
# NETWORK CONSTRAINTS
# =============================================================================

network_constraints:
  # Hydraulic limits enforced per pipe
  enforce_max_flow: true
  enforce_max_pressure: true

  # Temperature limits
  supply_temp_min_c: 70
  supply_temp_max_c: 100
  return_temp_min_c: 30
  return_temp_max_c: 70

  # Pressure constraints
  max_pressure_drop_bar: 5.0  # Max pressure drop across network

# =============================================================================
# DATA INPUT
# =============================================================================

site:
  input_file: Import_Data.xlsx
  year_target: 2023

  columns:
    price_candidates: [Day_Ahead_Price, strompreis]
    heat_candidates: [Waermebedarf_MW, waermebedarf]
    co2_candidates: [CO2_consumption_based, co2]

# =============================================================================
# OUTPUT SETTINGS
# =============================================================================

output:
  save_results: true
  output_dir: notebooks/saved_workflows/stadtbach_brownfield
  export_csv: true
  export_plots: true

  # Dashboard integration
  dashboard_ready: true
  include_network_results: true
