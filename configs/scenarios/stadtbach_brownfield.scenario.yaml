# Stadtbach Brownfield Optimization Scenario
# Fixed network, only heat pump and storage expansion
# Date: 2025-12-12
#
# WICHTIG: Verwende stadtbach_brownfield.system.yaml, NICHT stadtbach.system.yaml!
#
# Usage:
#   python -m energis.run configs/base.yaml configs/tech_catalog.yaml configs/systems/stadtbach_brownfield.system.yaml configs/scenarios/stadtbach_brownfield.scenario.yaml

metadata:
  name: Stadtbach Brownfield Optimization
  description: Brownfield optimization - fixed network, only HP and storage expansion

scenario:
  run_mode: PF_ONLY
  workflow:
    - PF
  fix_design: false
  title: "Stadtbach_Brownfield_Optimization"
  tag: "stadtbach-brownfield"

  # 1 week for testing
  horizon:
    type: "date_range"
    start: "2023-01-01 00:00"
    end: "2023-01-09 00:00"
    enforce: false

# Reference system configuration
system_file: configs/systems/stadtbach_brownfield.system.yaml

# Site - Data from Import_Data.xlsx
site:
  input_file: Import_Data.xlsx
  year_target: 2023
  columns:
    price_candidates:
      - Day_Ahead_Price
      - strompreis
    heat_candidates:
      - Waermebedarf_MW
      - waermebedarf
    co2_candidates:
      - CO2_consumption_based
      - co2

# Thermal Network Configuration
# Strategy: Optimization runs WITHOUT network constraints (keeps LP/MILP tractable)
# Post-optimization: use NetworkManager.validate_hydraulics_post_optimization()
# to check pipe limits after solving
thermal_network:
  topology_file: configs/networks/stadtbach_brownfield.yaml
  allow_pipe_investment: false
  # Post-processing validation parameters (used by validate_hydraulics_post_optimization)
  validation:
    max_velocity_m_s: 5

# Run parameters - use Gurobi (commercial, supports MILP)
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    TimeLimit: 300  # 5 min timeout (Gurobi parameter)
    TimeLimit: 30000  # 5 min timeout (Gurobi parameter)

# Grid settings
grid:
  max_import_mw: 15000
  max_export_mw: 500
  big_m_grid_mw: 20000
  max_import_mw: 150000
  max_export_mw: 5000
  big_m_grid_mw: 200000

# Cost settings
costs:
  dump_cost_eur_per_mwh_th: 10.0
  co2_price_eur_per_t: 100.0
  include_co2_cost_in_objective: true
  include_capex_costs: true
