# Phase 1 State Constraints Disabled Test - Baseline Test
# Same as phase1_state_constraints_test.yaml but with Phase 1 constraints DISABLED
# This helps us verify if the degree error is from Phase 1 constraints or existing model

site:
  input_xlsx: "data/Import_Data.csv"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  title: "Phase 1 Disabled - Baseline Test"
  tag: "phase1_disabled_test"
  run_mode: PF_ONLY

system:
  heat_pumps:
    - id: hp_main
      enabled: true
      max_th_mw: 50.0
      cop_curve: "Carnot_0.7"
  
  generators:
    boiler:
      enabled: true
      cap_th_mw: 100.0
      eta_th: 0.90
      fuel_type: gas

  storage:
    TES:
      enabled: true
      energy_capacity_mwh: 200.0
      max_power_mw: 50.0
      initial_soc_fraction: 0.5
      loss_fraction_per_hour: 0.0005

# Thermal network configuration
thermal_network:
  enabled: true
  
  # Network topology: producer → consumer node via pipe
  nodes:
    - id: producer_node
      type: producer
      supply_temp_nominal_c: 90
      return_temp_c: 55
      pressure_nominal_supply_bar: 10.0
  
    - id: consumer_node
      type: consumer
      demand_fraction: 1.0
      supply_temp_nominal_c: 90
      return_temp_c: 50
      pressure_nominal_supply_bar: 10.0
  
  pipes:
    - id: pipe_main
      from_node: producer_node
      to_node: consumer_node
      length_m: 1000
      current_diameter_supply_mm: 200
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30

# Phase 1: State validation constraints (ALL DISABLED for baseline test)
state_validation:
  temperature_constraints:
    enforce_supply_ge_return: false
    enforce_demand_based_return_temp: false
    temperature_tolerance_c: 0.1
  
  pressure_constraints:
    min_pressure_bar: 0.0  # Disabled
    max_pressure_drop: 2.0
  
  flow_constraints:
    min_velocity_m_s: 0.0  # Disabled
    max_velocity_m_s: 999.0  # Disabled

costs:
  co2_price_eur_per_t: 100.0
  heat_dump_penalty_eur_per_mwh: 10.0

run:
  dt_h: 1.0
  solver: appsi_highs
