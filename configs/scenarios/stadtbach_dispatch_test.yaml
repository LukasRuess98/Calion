# Stadtbach Baseline - Simplified Test (1 week, copperplate)
# Tests multi-asset dispatch without network complexity

site:
  input_xlsx: "data/Import_Data.csv"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  run_mode: PF_ONLY

system:
  heat_pumps:
    hp_stadt:
      enabled: true
      max_th_mw: 100.0
      cop_curve: "Carnot_0.7"
  
  generators:
    boiler_main:
      enabled: true
      cap_th_mw: 150.0
      eta_th: 0.85
      fuel_type: gas
      min_load_fraction: 0.1

  storage:
    TES:
      enabled: true
      energy_capacity_mwh: 500.0
      max_power_mw: 100.0
      initial_soc_fraction: 0.5
      loss_fraction_per_hour: 0.0005

costs:
  co2_price_eur_per_t: 100.0
  heat_dump_penalty_eur_per_mwh: 10.0

run:
  dt_h: 1.0
  solver: appsi_highs
