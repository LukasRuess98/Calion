# Test-Szenario mit 1 Woche für schnelles Performance-Testing
# Verwendung: python -m energis.run configs/base.yaml configs/tech_catalog.yaml configs/systems/test_simple_with_network.system.yaml configs/scenarios/test_1week.scenario.yaml

scenario:
  run_mode: PF_ONLY
  workflow:
    - PF
  fix_design: false
  title: "Test_1_Week"
  tag: "test-1week-optimized"

  # Zeitraum auf 1 Woche beschränken (für schnelles Testing)
  horizon:
    type: "date_range"
    start: "2023-01-01 00:00"
    end: "2023-01-08 00:00"    # 1 Woche = 168h (7 Tage)
    enforce: false  # Nicht strikte Prüfung

  # Rolling Horizon Einstellungen (falls verwendet)
  rolling_horizon:
    heat_horizon_hours: 48.0   # 2 Tage Vorschau
    step_hours: 24.0           # 1 Tag Schrittweite
    terminal_policy: geq       # >= SOC_init am Ende

# Optimierte Run-Parameter
run:
  dt_h: 1.0  # 1 Stunde (168 Timesteps für 1 Woche)
  solver: gurobi
  solver_options:
    MIPGap: 0.02        # 2% MIP Gap für schnellere Lösung beim Testen
    TimeLimit: 1800     # 30 Minuten Zeitlimit
    Threads: 8          # 8 Kerne nutzen
    ConcurrentMIP: 2    # 2 parallele MIP-Strategien
    MIPFocus: 1         # Fokus auf zulässige Lösungen
    Presolve: 2         # Aggressive Presolve
    Cuts: 2             # Aggressive Cuts
    Heuristics: 0.1     # 10% Zeit für Heuristiken
    NodeMethod: 2       # 2 = Barrier für LP-Subprobleme
    NumericFocus: 1     # Numerische Stabilität
