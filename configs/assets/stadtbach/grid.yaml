# =============================================================================
# STADTBACH - GRID CONNECTION & ELECTRICITY MARKET
# =============================================================================
# Grid connection point, pricing model, and market constraints
# =============================================================================

grid_connection:
  description: "Stadtbach substation - 20kV grid connection"

  # Physical connection
  connection:
    voltage_level_kv: 20              # Medium voltage
    max_import_mw: 100.0              # Maximum import capacity
    max_export_mw: 50.0               # Maximum export capacity (from CHP)
    connection_point_id: "SBACH-SS1"  # Substation identifier

    # Grid connection characteristics
    short_circuit_power_mva: 500      # Grid strength
    x_r_ratio: 5.0                    # Reactance/resistance

  # Transformer
  transformer:
    rated_power_mva: 120
    primary_voltage_kv: 20
    secondary_voltage_kv: 0.4
    losses_percent: 1.2

# ===========================================================================
# ELECTRICITY PRICING
# ===========================================================================
pricing:
  description: "Time-varying electricity prices and grid fees"

  # Wholesale electricity price (from time series)
  wholesale:
    price_column: "strompreis_EUR_MWh"      # Day-ahead market prices
    market: epex_spot_de                    # EPEX SPOT Germany
    currency: EUR
    unit: EUR_per_MWh

  # Grid fees and charges (buying from grid)
  buy_fees:
    # Network usage tariffs
    energy_fee_eur_per_mwh: 5.0             # Network energy tariff
    grid_usage_eur_per_mwh: 10.0            # Grid usage fee

    # Additional charges
    renewable_surcharge_eur_per_mwh: 6.5    # EEG-Umlage (renewable energy surcharge)
    concession_fee_eur_per_mwh: 1.1         # Konzessionsabgabe

    # Total additional fees on top of wholesale
    total_buy_fees_eur_per_mwh: 22.6        # Sum of all above

  # Selling to grid (CHP electricity export)
  sell_model:
    # Feed-in tariff model
    base: wholesale                         # Start from wholesale price

    # Deductions
    haircut_fraction: 0.05                  # 5% discount from wholesale
    spread_eur_per_mwh: 2.0                 # Fixed spread
    transaction_fee_eur_per_mwh: 1.0        # Transaction costs

    # Minimum price floor
    floor_price_eur_per_mwh: 0.0            # Never sell below this

    # Bonus/premium
    premium_eur_per_mwh: 0.0                # No green premium (gas CHP)

    # Effective selling price formula:
    # P_sell = max(P_wholesale * (1 - haircut) - spread - fee + premium, floor)

# ===========================================================================
# DEMAND CHARGES (Capacity-based pricing)
# ===========================================================================
demand_charges:
  enabled: true
  description: "Peak demand-based capacity charges"

  # Annual demand charge
  model: peak_demand                        # Based on annual peak import
  annual_charge_eur_per_mw: 50000           # 50k EUR per MW of peak demand

  # Billing
  billing_period: year                      # Annual settlement
  peak_tracking: rolling_12_months          # Rolling 12-month peak

# ===========================================================================
# EMISSIONS INTENSITY
# ===========================================================================
emissions:
  description: "Grid electricity CO2 intensity (time-varying)"

  # CO2 intensity time series
  co2_intensity:
    intensity_column: "grid_co2_kg_MWh"     # Time-varying grid mix
    source: "DE_grid_mix_2023"              # Data source identifier

    # Statistics (for reference)
    annual_average_kg_per_mwh: 420          # 2023 German average
    min_kg_per_mwh: 50                      # High renewable periods
    max_kg_per_mwh: 800                     # Coal-dominated periods

# ===========================================================================
# GRID CONSTRAINTS
# ===========================================================================
constraints:
  description: "Operational constraints and grid code requirements"

  # Power factor requirements
  power_factor:
    min: 0.95                               # Minimum power factor (lagging/leading)
    reactive_power_compensation: true       # Reactive compensation available

  # Voltage regulation
  voltage:
    min_pu: 0.95                            # 95% of nominal
    max_pu: 1.05                            # 105% of nominal

  # Frequency
  frequency:
    nominal_hz: 50
    tolerance_hz: 0.2                       # ±0.2 Hz

  # Harmonic limits (IEEE 519)
  harmonics:
    total_harmonic_distortion_max: 0.05     # 5% THD

  # Grid services (optional revenue)
  ancillary_services:
    provide_frequency_regulation: false     # Not participating
    provide_voltage_support: false
    provide_black_start: false
