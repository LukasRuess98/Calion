# Level 3: 30-node detailed network (TEMPLATE)
# Same schema as Level 2, just more nodes/pipes/assets.
#
# This is a TEMPLATE showing the structure — it is NOT directly runnable
# because the required 23-zone demand columns do not exist in Import_Data.xlsx.
# Real 30-node configs would be generated from GIS data or network planning tools.

site:
  input_xlsx: "Import_Data.xlsx"
  columns:
    datetime: "Datum"
    price: "Day_Ahead_Price EUR/MWh"
    co2_grid: "CO2_consumption_based kgCO2/MWh"

scenario:
  run_mode: PF_ONLY

network:
  physics:
    heat_loss: true
    pressure_drop: true
    transport_delay: false
  supply_temp_c: 90
  return_temp_c: 55
  ground_temp_c: 10

  nodes:
    # --- Production ---
    plant_main:
      type: producer
      assets: [boiler_main, hp_main, tes_main]
    plant_east:
      type: producer
      assets: [boiler_east]

    # --- Junctions ---
    j_central:
      type: junction
    j_north:
      type: junction
    j_south:
      type: junction
    j_east:
      type: junction
    j_west:
      type: junction

    # --- Consumers (23 zones) ---
    zone_01:
      type: consumer
      demand: {column: "demand_zone_01_MW"}
    zone_02:
      type: consumer
      demand: {column: "demand_zone_02_MW"}
    zone_03:
      type: consumer
      demand: {column: "demand_zone_03_MW"}
    zone_04:
      type: consumer
      demand: {column: "demand_zone_04_MW"}
    zone_05:
      type: consumer
      demand: {column: "demand_zone_05_MW"}
    zone_06:
      type: consumer
      demand: {column: "demand_zone_06_MW"}
    zone_07:
      type: consumer
      demand: {column: "demand_zone_07_MW"}
    zone_08:
      type: consumer
      demand: {column: "demand_zone_08_MW"}
    zone_09:
      type: consumer
      demand: {column: "demand_zone_09_MW"}
    zone_10:
      type: consumer
      demand: {column: "demand_zone_10_MW"}
    zone_11:
      type: consumer
      demand: {column: "demand_zone_11_MW"}
    zone_12:
      type: consumer
      demand: {column: "demand_zone_12_MW"}
    zone_13:
      type: consumer
      demand: {column: "demand_zone_13_MW"}
    zone_14:
      type: consumer
      demand: {column: "demand_zone_14_MW"}
    zone_15:
      type: consumer
      demand: {column: "demand_zone_15_MW"}
    zone_16:
      type: consumer
      demand: {column: "demand_zone_16_MW"}
    zone_17:
      type: consumer
      demand: {column: "demand_zone_17_MW"}
    zone_18:
      type: consumer
      demand: {column: "demand_zone_18_MW"}
    zone_19:
      type: consumer
      demand: {column: "demand_zone_19_MW"}
    zone_20:
      type: consumer
      demand: {column: "demand_zone_20_MW"}
    zone_21:
      type: consumer
      demand: {column: "demand_zone_21_MW"}
    zone_22:
      type: consumer
      demand: {column: "demand_zone_22_MW"}
    zone_23:
      type: consumer
      demand: {column: "demand_zone_23_MW"}

  pipes:
    # Trunk lines
    plant_to_central:   {from: plant_main, to: j_central,   length_m: 500,  diameter_mm: 500}
    central_to_north:   {from: j_central,  to: j_north,     length_m: 800,  diameter_mm: 400}
    central_to_south:   {from: j_central,  to: j_south,     length_m: 1000, diameter_mm: 400}
    central_to_east:    {from: j_central,  to: j_east,      length_m: 600,  diameter_mm: 350}
    central_to_west:    {from: j_central,  to: j_west,      length_m: 700,  diameter_mm: 350}
    east_plant_to_east: {from: plant_east, to: j_east,      length_m: 300,  diameter_mm: 300}

    # North branch
    north_to_z01: {from: j_north, to: zone_01, length_m: 300, diameter_mm: 200}
    north_to_z02: {from: j_north, to: zone_02, length_m: 450, diameter_mm: 200}
    north_to_z03: {from: j_north, to: zone_03, length_m: 600, diameter_mm: 150}
    north_to_z04: {from: j_north, to: zone_04, length_m: 500, diameter_mm: 150}
    north_to_z05: {from: j_north, to: zone_05, length_m: 700, diameter_mm: 150}

    # South branch
    south_to_z06: {from: j_south, to: zone_06, length_m: 400, diameter_mm: 200}
    south_to_z07: {from: j_south, to: zone_07, length_m: 350, diameter_mm: 200}
    south_to_z08: {from: j_south, to: zone_08, length_m: 500, diameter_mm: 150}
    south_to_z09: {from: j_south, to: zone_09, length_m: 600, diameter_mm: 150}
    south_to_z10: {from: j_south, to: zone_10, length_m: 450, diameter_mm: 150}
    south_to_z11: {from: j_south, to: zone_11, length_m: 550, diameter_mm: 150}

    # East branch
    east_to_z12: {from: j_east, to: zone_12, length_m: 250, diameter_mm: 200}
    east_to_z13: {from: j_east, to: zone_13, length_m: 400, diameter_mm: 200}
    east_to_z14: {from: j_east, to: zone_14, length_m: 350, diameter_mm: 150}
    east_to_z15: {from: j_east, to: zone_15, length_m: 500, diameter_mm: 150}
    east_to_z16: {from: j_east, to: zone_16, length_m: 600, diameter_mm: 150}
    east_to_z17: {from: j_east, to: zone_17, length_m: 450, diameter_mm: 150}

    # West branch
    west_to_z18: {from: j_west, to: zone_18, length_m: 300, diameter_mm: 200}
    west_to_z19: {from: j_west, to: zone_19, length_m: 400, diameter_mm: 200}
    west_to_z20: {from: j_west, to: zone_20, length_m: 350, diameter_mm: 150}
    west_to_z21: {from: j_west, to: zone_21, length_m: 500, diameter_mm: 150}
    west_to_z22: {from: j_west, to: zone_22, length_m: 550, diameter_mm: 150}
    west_to_z23: {from: j_west, to: zone_23, length_m: 600, diameter_mm: 150}

assets:
  boiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 200
    thermal_efficiency: 0.92

  boiler_east:
    type: thermal_generator
    fuel: gas
    capacity_mw: 50
    thermal_efficiency: 0.90

  hp_main:
    type: heat_pump
    capacity_mw: 100
    cop_default: 3.5

  tes_main:
    type: storage
    energy_mwh: 1000
    power_mw: 100

grid:
  gridcost_eur_mwh: 20.0

fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0

costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 10.0

run:
  dt_h: 1.0
  solver: appsi_highs
