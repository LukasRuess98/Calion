# ============================================================================
# Publication Export Configuration
# ============================================================================
#
# This configuration enables publication-ready exports for scientific papers,
# particularly for journals like Applied Energies, Energy Conversion and
# Management, or similar energy systems journals.
#
# Usage:
#   python examples/standalone_heat_planning_example.py \
#     --config configs/publication_export_config.yaml

# Export settings
export:
  # Enable publication-quality exports
  enable_publication_exports: true

  # DPI for raster images (300 for print, 600 for high-quality)
  # Journals typically require 300-600 DPI for figures
  publication_dpi: 300

  # Export formats
  # - png: Raster format (for Word, PowerPoint)
  # - pdf: Vector format (preferred for LaTeX)
  # - eps: Vector format (required by some publishers)
  # - svg: Vector format (for web/presentations)
  publication_formats:
    - png
    - pdf

  # LaTeX table style
  # - booktabs: Professional tables with \toprule, \midrule, \bottomrule
  # - simple: Basic tables with \hline
  # - ieee: IEEE conference/journal style
  latex_table_style: "booktabs"

  # Which plots to generate (omit to generate all available plots)
  # Available plot types:
  #   - heat_balance: Heat supply and demand balance
  #   - electric_balance: Electric power balance
  #   - storage: Thermal storage operation
  #   - cost_breakdown: Total system cost breakdown
  #   - cop_analysis: Heat pump COP analysis
  #   - emissions: CO2 emissions analysis
  #   - load_duration: Heat load duration curve
  #   - monthly_aggregate: Monthly heat demand aggregation
  #   - technology_comparison: Heat production by technology
  #   - capex_opex: CAPEX vs OPEX comparison
  publication_plot_types:
    - heat_balance
    - electric_balance
    - storage
    - cost_breakdown
    - cop_analysis
    - emissions
    - load_duration
    - monthly_aggregate
    - technology_comparison
    - capex_opex

# Optional: Additional settings for specific analyses

# Scenario metadata (appears in LaTeX tables and metadata files)
scenario:
  title: "Heat System Optimization for Municipal District Heating"
  author: "Your Name"
  institution: "Your Institution"
  date: "2024"
  description: |
    Multi-objective optimization of a district heating system with heat pumps,
    thermal storage, and backup generators. Planning Framework determines
    optimal capacities, Rolling Horizon optimizes operational schedules.

  # Keywords for publications
  keywords:
    - district heating
    - heat pumps
    - thermal storage
    - energy system optimization
    - decarbonization

  # Case study location (optional, for context)
  location:
    name: "Example City"
    country: "Germany"
    climate_zone: "Central European"

# Analysis parameters (for reproducibility in publications)
analysis:
  # Year of analysis
  year: 2023

  # Time resolution
  timestep_hours: 1.0

  # Economic parameters
  economic:
    discount_rate: 0.05
    analysis_period_years: 20
    co2_price_eur_per_t: 100.0

  # Technology parameters (for reporting in methods section)
  technologies:
    heat_pumps:
      cop_range: [2.5, 4.5]
      capacity_range_mw: [0, 50]
      lifetime_years: 20

    thermal_storage:
      efficiency: 0.95
      self_discharge_rate: 0.002
      lifetime_years: 25

# Output organization
output:
  # Create separate directories for different output types
  organize_by_type: true

  # Subdirectories
  directories:
    plots: "publication_plots"
    tables: "publication_latex"
    data: "data"
    supplementary: "supplementary_material"

# Figure styling (advanced users)
figures:
  # Figure dimensions (in inches)
  # Standard two-column width: 7.0 inches (178mm)
  # Standard single-column width: 3.5 inches (89mm)
  default_width: 7.0
  default_height: 4.5

  # Font settings
  font_family: "sans-serif"
  font_size: 10

  # Color schemes
  # Options: "colorblind", "vibrant", "muted", "custom"
  color_scheme: "colorblind"

  # Include grid in plots
  show_grid: true
  grid_alpha: 0.3

  # Legend settings
  legend_position: "best"
  legend_columns: 2

# Data exports for supplementary material
supplementary_exports:
  # Export detailed time series
  export_full_timeseries: true

  # Export statistical summaries
  export_statistics: true

  # Export sensitivity analysis results (if available)
  export_sensitivity: false

# Publication checklist (for reference)
# This is not processed by the code, but serves as a reminder
publication_checklist:
  - "✓ All figures exported at 300+ DPI"
  - "✓ Vector formats (PDF/EPS) generated"
  - "✓ LaTeX tables use booktabs package"
  - "✓ KPI summary includes all relevant metrics"
  - "✓ Cost breakdown shows CAPEX and OPEX separately"
  - "✓ Technology comparison shows all heat sources"
  - "✓ COP analysis validates heat pump performance"
  - "✓ Emissions analysis quantifies decarbonization"
  - "✓ Load duration curve shows system sizing rationale"
  - "✓ All units are clearly labeled"
  - "✓ Figure captions are descriptive"
  - "✓ Methods section documents all assumptions"
  - "✓ Supplementary material includes raw data"
