# =============================================================================
# SOLVER CONFIGURATION
# =============================================================================
# Gurobi solver settings for optimization
# =============================================================================

run:
  dt_h: 1.0
  solver: gurobi

  solver_options:
    MIPGap: 0.02        # 2% MIP Gap (faster convergence)
    TimeLimit: 3600     # 1 hour maximum
    Threads: 0          # Use all available CPU cores
    MIPFocus: 1         # Focus on finding feasible solutions
    Presolve: 2         # Aggressive presolve
    Cuts: 2             # Aggressive cuts
    LogToConsole: 0     # Suppress console output (0=off, 1=on)
