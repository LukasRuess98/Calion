# =============================================================================
# GRID PARAMETERS
# =============================================================================
# Electrical grid connection limits and tariffs
# =============================================================================

grid:
  # Grid tariffs
  energy_fee_eur_mwh: 0.0                     # Grid energy fee
  demand_charge_eur_per_mw_y: 127240.0        # Annual demand charge (€/MW/year)
  gridcost_eur_mwh: 61.6                      # Grid electricity cost (€/MWh)

  # Feed-in (electricity sales to grid)
  sell_floor_eur_mwh: 0.0                     # Minimum sell price
  sell_haircut_fraction: 0.05                 # Reduction factor (5%)
  sell_spread_eur_mwh: 5.0                    # Spread between buy/sell
  sell_fee_eur_mwh: 5.0                       # Transaction fee
  sell_premium_eur_mwh: 0.0                   # Feed-in premium

  # Technical limits
  max_import_mw: 200.0                        # Maximum grid import (MW)
  max_export_mw: 100.0                        # Maximum grid export (MW)
  big_m_grid_mw: 200.0                        # Big-M for disjunctive constraints
  year_fraction: 1.0                          # Fraction of year modeled
