# District Heating System with Stratified Storage
# ================================================
#
# This configuration demonstrates a district heating system with:
# - Heat pumps for heat generation
# - Stratified thermal energy storage for flexibility
# - Grid connection for electricity
#
# Use this as a template for large-scale thermal storage applications

system:
  # ========================================
  # STRATIFIED STORAGE (NEW!)
  # ========================================
  stratified_storage:
    - id: seasonal_tes
      component_type: stratified_storage
      enabled: true

      # ----------------
      # Thermal Parameters
      # ----------------
      T_hot_C: 90.0          # Hot zone temperature [°C]
      T_cold_C: 40.0         # Cold zone temperature [°C]
      T_ambient_C: 15.0      # Ambient temperature [°C]
      T_ground_C: 10.0       # Ground temperature [°C]

      # ----------------
      # Geometry
      # ----------------
      # volume_total_m3: null  # Auto-calculated from e_cap_max
      aspect_ratio: 1.5      # Height/Diameter ratio
                             # 1.5-2.0 for above-ground tanks
                             # 0.3-0.5 for pit storage (PTES)
      geometry_type: tank    # "tank" or "pit"

      # ----------------
      # Heat Transfer Coefficients [W/(m²·K)]
      # ----------------
      U_top: 0.3        # Top surface (good insulation)
      U_side: 0.2       # Side walls
      U_bottom: 0.15    # Bottom

      # For pit storage (PTES), use:
      # U_top: 0.1-0.2   # Insulated cover
      # U_side: 0.02-0.05  # Earth thermal resistance
      # U_bottom: 0.01-0.02  # Deep ground

      # ----------------
      # Efficiency
      # ----------------
      eff_c: 0.95       # Charging efficiency
      eff_d: 0.95       # Discharging efficiency

      # ----------------
      # Time Parameters
      # ----------------
      dt_h: 1.0         # Time step in hours

      # ----------------
      # Initial State
      # ----------------
      soc0: 100.0              # Initial energy content [MWh]
      V_hot_init_fraction: 0.5  # Initial hot volume fraction (0-1)

      # ----------------
      # Investment Optimization
      # ----------------
      investment:
        enabled: true
        # Energy capacity bounds
        energy_capacity_min_mwh: 100.0
        energy_capacity_max_mwh: 1000.0
        initial_energy_capacity_mwh: 500.0

        # Power capacity bounds
        power_capacity_min_mw: 20.0
        power_capacity_max_mw: 150.0
        initial_power_capacity_mw: 50.0

        # Costs (for CAPEX calculation)
        energy_capex_eur_per_mwh: 50.0  # EUR/MWh
        power_capex_eur_per_mw: 200.0   # EUR/MW
        lifetime_years: 30

      # ----------------
      # Optional Advanced Settings
      # ----------------
      # power_energy_coupling: 0.2  # P/E ratio constraint (optional)
      piecewise_n_points: 5         # Breakpoints for loss linearization
      # terminal_target: 100.0      # Target SOC at end (optional)

  # ========================================
  # HEAT PUMPS
  # ========================================
  heat_pumps:
    - id: HP1
      enabled: true
      max_th_mw: 50.0
      min_load_fraction: 0.3

      # Waste heat recovery
      wrg:
        enabled: true
        source_id: WRG1
        max_capacity_series: WRG1_Q_cap  # Column in time series
        temp_series: WRG1_T_K            # Column in time series

      # Investment
      investment:
        enabled: true
        capacity_min_mw: 0.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0
        capex_eur_per_mw: 800.0
        lifetime_years: 20

    - id: HP2
      enabled: true
      max_th_mw: 30.0
      min_load_fraction: 0.3

      investment:
        enabled: true
        capacity_min_mw: 0.0
        capacity_max_mw: 60.0
        initial_capacity_mw: 30.0
        capex_eur_per_mw: 800.0
        lifetime_years: 20

  # ========================================
  # TRADITIONAL STORAGE (for comparison)
  # ========================================
  storage:
    id: buffer_tes
    enabled: false  # Disabled when using stratified storage

    max_energy_mwh: 200.0
    max_power_mw: 50.0
    min_energy_mwh: 0.0
    min_power_mw: 0.0

    eff_charge: 0.95
    eff_discharge: 0.95
    hourly_loss_factor: 0.9995  # 0.05% per hour

    investment:
      enabled: false
      energy_capacity_min_mwh: 50.0
      energy_capacity_max_mwh: 500.0
      power_capacity_min_mw: 10.0
      power_capacity_max_mw: 100.0

  # ========================================
  # GENERATORS (Optional Backup)
  # ========================================
  generators:
    gas_boiler:
      enabled: true
      cap_th_mw: 30.0
      eff_th: 0.90
      fuel_type: natural_gas
      fuel_price_eur_per_mwh_th: 60.0
      co2_factor_kg_per_mwh_th: 202.0

# ========================================
# COST PARAMETERS
# ========================================
costs:
  electricity:
    # Grid connection costs
    demand_charge_eur_per_mw: 127240.0    # Annual demand charge
    network_fee_eur_per_mwh: 61.6         # Network fees

    # Feed-in
    feedin_enabled: false
    feedin_tariff_eur_per_mwh: 0.0

  co2:
    enabled: true
    price_eur_per_ton: 100.0

# ========================================
# SOLVER CONFIGURATION
# ========================================
solver:
  name: gurobi  # or 'cbc', 'glpk', 'cplex'

  # Gurobi options
  options:
    MIPGap: 0.01          # 1% optimality gap
    TimeLimit: 600        # 10 minutes max
    Threads: 0            # Use all available threads
    LogToConsole: 1       # Show solver output
    NumericFocus: 0       # Default numerical stability
    # Presolve: 2         # Aggressive presolve
    # Method: 2           # Barrier method

  # CBC options (fallback)
  cbc_options:
    sec: 600              # Time limit
    ratio: 0.01           # MIP gap
    threads: 4

# ========================================
# EXPORT CONFIGURATION
# ========================================
export:
  directory: exports/stratified_example
  formats:
    - excel
    - csv
    - json

  plots:
    enabled: true
    dpi: 300
    formats:
      - png
      - pdf

  model_structure:
    enabled: true  # Export Pyomo model structure

# ========================================
# SIMULATION PARAMETERS
# ========================================
simulation:
  year: 2023
  dt_hours: 1.0

  # Rolling horizon (if enabled)
  rolling_horizon:
    enabled: false
    horizon_hours: 168    # 1 week
    step_hours: 24        # 1 day
    terminal_policy: geq  # 'equal', 'geq', or 'free'

# ========================================
# INPUT DATA
# ========================================
inputs:
  # Excel file with time series
  file: Import_Data.xlsx
  sheet: null  # First sheet if null

  # Required columns:
  # - Datum: Timestamp
  # - Wärmebedarf MW: Heat demand [MW]
  # - Day_Ahead_Price €/MWh: Electricity price
  # - CO2_consumption_based kgCO2/MWh: CO2 intensity
  # - WRG1_Q MW: Waste heat capacity
  # - WRG1_T °C: Waste heat temperature

# ========================================
# NOTES
# ========================================
#
# Stratified Storage Tuning Guide:
# --------------------------------
#
# 1. U-Values (Heat Transfer Coefficients):
#    - Well-insulated above-ground tank:
#      U_top = 0.2-0.3, U_side = 0.15-0.25, U_bottom = 0.1-0.2
#
#    - Standard tank:
#      U_top = 0.3-0.5, U_side = 0.2-0.35, U_bottom = 0.15-0.25
#
#    - Pit storage (PTES):
#      U_top = 0.05-0.2 (insulated cover)
#      U_side = 0.01-0.05 (earth resistance)
#      U_bottom = 0.005-0.02 (deep ground)
#
# 2. Geometry:
#    - Above-ground tank: aspect_ratio = 1.5-2.0, geometry_type = tank
#    - Pit storage: aspect_ratio = 0.3-0.5, geometry_type = pit
#
# 3. Capacity Sizing:
#    - Daily storage: E_cap ~ peak_demand × 8-12 hours
#    - Weekly storage: E_cap ~ peak_demand × 50-100 hours
#    - Seasonal storage: E_cap ~ annual_demand × 0.2-0.5
#
# 4. Power Sizing:
#    - P_cap ≥ max(peak_demand × 0.5, E_cap / 8)  # At least 8h discharge
#
# 5. Initial State:
#    - For seasonal optimization: soc0 ~ E_cap × 0.3-0.5
#    - V_hot_init_fraction: 0.5 (balanced start)
