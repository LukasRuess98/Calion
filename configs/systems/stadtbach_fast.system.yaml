# Stadtbach FAST System Configuration - MIT Investment
# Investment enabled for CAPEX calculation
# Date: 2025-12-18

system:
  # Heat pump defaults - Investment ENABLED
  heat_pump_defaults:
    enabled: true
    type: standard
    max_th_mw: 50.0
    min_th_mw: 5.0
    investment:
      enabled: true  # Investment enabled for CAPEX calculation

  # Heat Pumps - Investment enabled
  heat_pumps:
    - id: HP1
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG1_T_K
      wrg_capacity_column: WRG1_Q_cap
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

    - id: HP2
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG2_T_K
      wrg_capacity_column: WRG2_Q_cap
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

    - id: HP3
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG3_T_K
      wrg_capacity_column: WRG3_Q_cap
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

    - id: HP4
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG4_T_K
      wrg_capacity_column: WRG4_Q_cap
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

  # Storage - Investment enabled
  storage:
    enabled: true
    min_energy_mwh: 0.0  # Allow empty storage (important for first timestep with soc0=0)
    max_energy_mwh: 5000.0
    max_power_mw: 200.0
    soc0_mwh: 0.0  # Start empty
    investment:
      enabled: true
      energy_capacity_min_mwh: 100.0
      energy_capacity_max_mwh: 5000.0
      power_capacity_min_mw: 30.0
      power_capacity_max_mw: 200.0
      initial_energy_capacity_mwh: 500.0
      initial_power_capacity_mw: 50.0

  # Generators - all fixed (brownfield)
  generators:
    hkw:
      enabled: true
      cap_th_mw: 75.0
    gtost:
      enabled: true
      cap_th_mw: 41.3
    p2h:
      enabled: true
      cap_th_mw: 10.0
    bmhkw:
      enabled: true
      cap_th_mw: 15.0
    hws:
      enabled: true
      cap_th_mw: 45.0
    hww:
      enabled: true
      cap_th_mw: 45.0
    ava:
      enabled: true
      cap_th_mw: 45.0
