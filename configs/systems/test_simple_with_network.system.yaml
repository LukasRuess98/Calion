# Simple Test System with Thermal Network
# Minimal configuration for testing network integration

system:
  heat_pump_defaults:
    enabled: true
    type: standard
    max_th_mw: 50.0
    min_th_mw: 1.0
    investment:
      enabled: true
      capacity_min_mw: 1.0
      capacity_max_mw: 100.0

  heat_pumps:
    - id: HP1
      location_node: plant_test
      cop: 3.5  # Fixed COP for simplicity

  storage:
    enabled: false

  generators: {}

# Enable thermal network
thermal_network:
  enabled: true
  topology_file: networks/test_simple_network.yaml
  use_outdoor_temperature: false

# Grid settings (minimal)
grid:
  max_import_mw: 50
  max_export_mw: 0
  big_m_grid_mw: 100

# Cost settings
costs:
  dump_cost_eur_per_mwh_th: 10.0
  co2_price_eur_per_t: 100.0
  include_co2_cost_in_objective: true
  include_capex_costs: true
