# Stadtbach Brownfield System Configuration
# Fixed heat pumps and generators with optional new HP investment
# Date: 2025-12-12

system:
  # Heat pump defaults for investment mode
  heat_pump_defaults:
    enabled: true
    type: standard
    max_th_mw: 50.0
    min_th_mw: 5.0
    investment:
      enabled: false  # Default: no investment

  # Heat Pumps - existing (brownfield) + one new investable
  heat_pumps:
    - id: HP1
      enabled: true
      max_th_mw: 10.0
      wrg_source_column: WRG1_T_K
      wrg_capacity_column: WRG1_Q_cap
      investment:
        enabled: false

    - id: HP2
      enabled: true
      max_th_mw: 8.0
      wrg_source_column: WRG2_T_K
      wrg_capacity_column: WRG2_Q_cap
      investment:
        enabled: false

    - id: HP3
      enabled: true
      max_th_mw: 6.0
      wrg_source_column: WRG3_T_K
      wrg_capacity_column: WRG3_Q_cap
      investment:
        enabled: false

    - id: HP4
      enabled: true
      max_th_mw: 5.0
      wrg_source_column: WRG4_T_K
      wrg_capacity_column: WRG4_Q_cap
      investment:
        enabled: false

    - id: HP_new_ost
      enabled: false  # Disabled for testing without investment
      max_th_mw: 50.0
      min_th_mw: 5.0
      wrg_source_column: WRG1_T_K  # Use same source as HP1
      wrg_capacity_column: WRG1_Q_cap
      investment:
        enabled: false
        capacity_min_mw: 5.0
        capacity_max_mw: 50.0

  # Thermal Storage - fixed for now (no investment with GLPK)
  storage:
    enabled: true
    min_energy_mwh: 500.0
    max_energy_mwh: 500.0
    max_power_mw: 50.0
    soc0_mwh: 0.0
    investment:
      enabled: false
      energy_capacity_min_mwh: 100.0
      energy_capacity_max_mwh: 5000.0
      power_capacity_min_mw: 10.0
      power_capacity_max_mw: 100.0

  # Generators - all brownfield (fixed capacities)
  generators:
    hkw:
      enabled: true
      cap_th_mw: 75.0
    gtost:
      enabled: true
      cap_th_mw: 41.3
    bmhkw:
      enabled: true
      cap_th_mw: 15.0
    hws:
      enabled: true
      cap_th_mw: 40.0
    hww:
      enabled: true
      cap_th_mw: 60.0
