system:
  heat_pump_defaults:
    enabled: true
    type: standard
    max_th_mw: 40.0
    min_th_mw: 5.0
    investment:
      enabled: true
      capacity_min_mw: 1.0
      capacity_max_mw: 100.0
  heat_pumps:
    - id: HP1
      wrg_source_column: WRG1_T_K
      wrg_capacity_column: WRG1_Q_cap
    - id: HP2
      wrg_source_column: WRG2_T_K
      wrg_capacity_column: WRG2_Q_cap
    - id: HP3
      wrg_source_column: WRG3_T_K
      wrg_capacity_column: WRG3_Q_cap
    - id: HP4
      wrg_source_column: WRG4_T_K
      wrg_capacity_column: WRG4_Q_cap

  storage:
    enabled: true
    min_energy_mwh: 0.0
    max_energy_mwh: 100.0
    max_power_mw: 30.0
    soc0_mwh: 0.0
    investment:
      enabled: false
      energy_capacity_min_mwh: 100.0
      energy_capacity_max_mwh: 100.0
      power_capacity_min_mw: 30.0
      power_capacity_max_mw: 30.0

  generators:
    hkw:
      enabled: true
      cap_th_mw: 75.0
    gtost:
      enabled: true
      cap_th_mw: 41.3
    p2h:
      enabled: true
      cap_th_mw: 10.0
    bmhkw:
      enabled: true
      cap_th_mw: 15.0
    hws:
      enabled: true
      cap_th_mw: 45.0
    hww:
      enabled: true
      cap_th_mw: 45.0
    ava:
      enabled: true
      cap_th_mw: 45.0