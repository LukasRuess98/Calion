# ============================================================================
# STADTBACH SYSTEM - EXTENDED VERSION
# ============================================================================
# Erweiterte Konfiguration mit stratified storage und mehr Optionen
# ============================================================================

system:
  # -------------------------------------------------------------------------
  # WÄRMEPUMPEN (4 Stück mit WRG-Anbindung)
  # -------------------------------------------------------------------------
  heat_pump_defaults:
    enabled: true
    type: standard
    max_th_mw: 40.0
    min_th_mw: 5.0
    investment:
      enabled: true
      capacity_min_mw: 5.0
      capacity_max_mw: 100.0

  heat_pumps:
    - id: HP1
      wrg_source_column: WRG1_T_K
      wrg_capacity_column: WRG1_Q_cap
      # Optional: max_th_mw: 50.0  # Überschreibt Default

    - id: HP2
      wrg_source_column: WRG2_T_K
      wrg_capacity_column: WRG2_Q_cap

    - id: HP3
      wrg_source_column: WRG3_T_K
      wrg_capacity_column: WRG3_Q_cap

    - id: HP4
      wrg_source_column: WRG4_T_K
      wrg_capacity_column: WRG4_Q_cap

  # -------------------------------------------------------------------------
  # THERMISCHER SPEICHER
  # -------------------------------------------------------------------------
  storage:
    enabled: true

    # Speicher-Typ: 'simple' oder 'stratified'
    type: simple  # Ändere zu 'stratified' für 2-Zonen-Modell

    # Kapazitäts-Bounds
    min_energy_mwh: 100.0
    max_energy_mwh: 10000.0
    max_power_mw: 200.0
    soc0_mwh: 0.0

    # Wirkungsgrade
    eff_charge: 0.98
    eff_discharge: 0.98
    loss_hour: 0.9999  # Nur für 'simple' type

    # Investment-Parameter
    investment:
      enabled: true
      energy_capacity_min_mwh: 100.0
      energy_capacity_max_mwh: 10000.0
      power_capacity_min_mw: 30.0
      power_capacity_max_mw: 5000.0

    # Stratified Storage Parameter (nur wenn type='stratified')
    # T_hot_C: 90.0
    # T_cold_C: 40.0
    # T_ambient_C: 15.0
    # T_ground_C: 10.0
    # aspect_ratio: 1.5
    # geometry_type: tank  # 'tank' oder 'pit'
    # U_top: 0.3
    # U_side: 0.2
    # U_bottom: 0.15
    # V_hot_init_fraction: 0.5

  # -------------------------------------------------------------------------
  # KESSEL / GENERATOREN (7 Stück)
  # -------------------------------------------------------------------------
  generators:
    # HKW - Hauptkessel Werk
    hkw:
      enabled: true
      cap_th_mw: 75.0
      fuel: gas  # Standard-Brennstoff

    # GTOST - Gas-Turbinen-Ostwerk
    gtost:
      enabled: true
      cap_th_mw: 41.3
      fuel: gas

    # P2H - Power-to-Heat (Elektroheizer)
    p2h:
      enabled: true
      cap_th_mw: 10.0
      fuel: electricity

    # BMHKW - Biomasse-Heizkraftwerk
    bmhkw:
      enabled: true
      cap_th_mw: 15.0
      fuel: biomass

    # HWS - Heizwerk Süd
    hws:
      enabled: true
      cap_th_mw: 45.0
      fuel: gas

    # HWW - Heizwerk West
    hww:
      enabled: true
      cap_th_mw: 45.0
      fuel: gas

    # AVA - Abfallverwertungsanlage
    ava:
      enabled: true
      cap_th_mw: 45.0
      fuel: waste

  # -------------------------------------------------------------------------
  # OPTIONAL: THERMAL NETWORK (Phase 4 - noch nicht implementiert)
