# System configuration with stratified thermal energy storage
#
# This example demonstrates how to use the advanced 2-zone stratified
# storage model instead of the simple single-zone model.
#
# The stratified model accounts for:
# - Temperature-dependent thermal losses
# - Thermocline dynamics (hot/cold zone separation)
# - Realistic geometry (tank dimensions, surface areas)
# - Heat transfer through tank walls, top, and bottom

system:
  # Heat pumps (same as baseline)
  heat_pumps:
    - id: HP1
      enabled: true
      max_th_mw: 40.0
      min_th_mw: 0.0
      wrg_source_column: WRG1_T
      wrg_capacity_column: WRG1_Q_cap
      type: standard
      investment:
        enabled: true
        capacity_min_mw: 1.0
        capacity_max_mw: 100.0

    - id: HP2
      enabled: true
      max_th_mw: 40.0
      min_th_mw: 0.0
      wrg_source_column: WRG2_T
      wrg_capacity_column: WRG2_Q_cap
      type: standard
      investment:
        enabled: true
        capacity_min_mw: 1.0
        capacity_max_mw: 100.0

  # STRATIFIED STORAGE CONFIGURATION
  storage:
    enabled: true
    type: stratified  # ← KEY: Use "stratified" instead of "simple"

    # Capacity (same as simple storage)
    min_energy_mwh: 0.0
    max_energy_mwh: 200.0
    max_power_mw: 50.0

    # Investment settings
    investment:
      enabled: true
      energy_capacity_min_mwh: 50.0
      energy_capacity_max_mwh: 500.0
      power_capacity_min_mw: 10.0
      power_capacity_max_mw: 100.0
      initial_energy_capacity_mwh: 100.0
      initial_power_capacity_mw: 30.0

    # Thermal parameters (stratified-specific)
    T_hot_C: 90.0        # Hot zone temperature [°C]
    T_cold_C: 40.0       # Cold zone temperature [°C]
    T_ambient_C: 15.0    # Ambient air temperature [°C]
    T_ground_C: 10.0     # Ground temperature [°C]

    # Geometry (stratified-specific)
    aspect_ratio: 1.5    # Height/Diameter ratio
    geometry_type: tank  # "tank" or "pit"

    # Heat transfer coefficients [W/(m²·K)] (stratified-specific)
    U_top: 0.3          # Top surface (highest losses)
    U_side: 0.2         # Side walls (medium losses)
    U_bottom: 0.15      # Bottom surface (lowest losses, ground contact)

    # Efficiency (applies to both types)
    eff_charge: 0.95     # Charging efficiency
    eff_discharge: 0.95  # Discharging efficiency

    # Initial state
    soc0_mwh: 50.0              # Initial energy content [MWh]
    V_hot_init_fraction: 0.5    # Initial hot zone fraction (0.0 = fully cold, 1.0 = fully hot)

    # Terminal conditions
    terminal:
      state: cyclic    # "cyclic", "free", or "target"
      policy: equal    # "equal" or "geq"

  # Generators (same as baseline)
  generators:
    hkw:
      enabled: true
      cap_th_mw: 75.0
    gtost:
      enabled: true
      cap_th_mw: 41.3
    bmhkw:
      enabled: true
      cap_th_mw: 15.0
    hws:
      enabled: true
      cap_th_mw: 45.0
    hww:
      enabled: true
      cap_th_mw: 45.0
    ava:
      enabled: true
      cap_th_mw: 45.0
    p2h:
      enabled: true
      cap_th_mw: 10.0

# Notes on parameter selection:
#
# Temperature levels:
# - T_hot_C: Should match district heating supply temperature
# - T_cold_C: Should match district heating return temperature
# - T_ambient_C: Average ambient air temperature for the simulation period
# - T_ground_C: Typical ground temperature at storage depth
#
# Geometry:
# - aspect_ratio: 1.5 is typical for above-ground tanks
#                 0.5-1.0 is typical for underground pit storage
# - geometry_type: "tank" for cylindrical tanks, "pit" for pit storage
#
# Heat transfer coefficients:
# - U_top: 0.2-0.4 W/(m²·K) for insulated tanks
# - U_side: 0.15-0.3 W/(m²·K) for insulated tanks
# - U_bottom: 0.1-0.2 W/(m²·K) for ground-coupled storage
#
# For pit storage, use lower U-values (better insulation from earth):
# - U_top: 0.2-0.3 W/(m²·K)
# - U_side: 0.05-0.15 W/(m²·K)
# - U_bottom: 0.05-0.1 W/(m²·K)
#
# Initial state:
# - V_hot_init_fraction: 0.5 means starting with half hot, half cold
#   Adjust based on expected operating conditions
