# =============================================================================
# SYSTEM CONFIGURATION
# =============================================================================
# Consolidated system configuration for district heating optimization
# Defines all generation assets, heat pumps, and storage
# =============================================================================

system:
  # =========================================================================
  # HEAT PUMP CONFIGURATION
  # =========================================================================
  heat_pump_defaults:
    enabled: true
    type: standard
    max_th_mw: 50.0
    min_th_mw: 0.0
    investment:
      enabled: true
      capacity_min_mw: 5.0
      capacity_max_mw: 100.0
      capex_eur_per_mw: 400000.0
      lifetime_years: 15.0

  heat_pumps:
    - id: HP1
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG1_T_K
      wrg_capacity_column: WRG1_Q_cap
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

    - id: HP2
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG2_T_K
      wrg_capacity_column: WRG2_Q_cap
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

    - id: HP3
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG3_T_K
      wrg_capacity_column: WRG3_Q_cap
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

    - id: HP4
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG4_T_K
      wrg_capacity_column: WRG4_Q_cap
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

  # =========================================================================
  # THERMAL STORAGE
  # =========================================================================
  storage:
    enabled: true
    min_energy_mwh: 0.0
    max_energy_mwh: 5000.0
    max_power_mw: 200.0
    soc0_mwh: 500.0
    investment:
      enabled: true
      energy_capacity_min_mwh: 100.0
      energy_capacity_max_mwh: 5000.0
      power_capacity_min_mw: 0.0
      power_capacity_max_mw: 200.0
      initial_energy_capacity_mwh: 500.0

  # =========================================================================
  # THERMAL GENERATORS (Brownfield - Fixed Capacities)
  # =========================================================================
  generators:
    # Combined Heat and Power (CHP)
    hkw:
      enabled: true
      cap_th_mw: 75.0
      description: "Heizkraftwerk - Gas CHP"

    # Gas Turbine
    gtost:
      enabled: true
      cap_th_mw: 41.3
      description: "Gasturbine Ost"

    # Power-to-Heat
    p2h:
      enabled: true
      cap_th_mw: 10.0
      description: "Elektrodenkessel"

    # Biomass CHP
    bmhkw:
      enabled: true
      cap_th_mw: 15.0
      description: "Biomasse-Heizkraftwerk"

    # Gas Boilers
    hws:
      enabled: true
      cap_th_mw: 45.0
      description: "Heizwerk Süd - Gaskessel"

    hww:
      enabled: true
      cap_th_mw: 45.0
      description: "Heizwerk West - Gaskessel"

    # Waste Heat
    ava:
      enabled: true
      cap_th_mw: 45.0
      description: "Abwärmenutzung AVA"
