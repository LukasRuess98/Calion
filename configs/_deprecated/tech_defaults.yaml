# =============================================================================
# TECHNICAL DEFAULTS
# =============================================================================
# Konsolidiert: base.yaml + tech_catalog.yaml
# Enthält: Solver settings, Grid defaults, Technology parameters
# Diese Datei ändert sich SELTEN (nur bei neuen Technologien oder Marktpreisen)
# =============================================================================

# =============================================================================
# SOLVER CONFIGURATION
# =============================================================================
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    MIPGap: 0.02      # 2% MIP Gap (schneller als 0.01%)
    TimeLimit: 3600   # 1 Stunde max
    Threads: 0        # Nutze alle CPU-Kerne
    MIPFocus: 1       # Fokus auf zulässige Lösungen
    Presolve: 2       # Aggressive Presolve
    Cuts: 2           # Aggressive Cuts

# =============================================================================
# GRID PARAMETERS
# =============================================================================
grid:
  energy_fee_eur_mwh: 0.0
  demand_charge_eur_per_mw_y: 127240.0
  gridcost_eur_mwh: 61.6
  sell_floor_eur_mwh: 0.0
  sell_haircut_fraction: 0.05
  sell_spread_eur_mwh: 5.0
  sell_fee_eur_mwh: 5.0
  sell_premium_eur_mwh: 0.0
  year_fraction: 1.0
  big_m_grid_mw: 200.0      # Realistische Obergrenze (war 10000)
  max_import_mw: 200.0      # Grid-Import Limit
  max_export_mw: 100.0      # Grid-Export Limit

# =============================================================================
# COST PARAMETERS
# =============================================================================
costs:
  include_gridcost_in_energy: true
  include_demand_charge_in_rh: true
  include_co2_cost_in_objective: true
  dump_cost_eur_per_mwh_th: 1.0
  co2_price_eur_per_t: 100.0

# =============================================================================
# FUEL PRICES & EMISSIONS
# =============================================================================
fuels:
  gas:
    price_eur_mwh: 58.6
    ef_kg_per_mwh_fuel: 201.6   # Emissionsfaktor kg CO2 / MWh_fuel

  biomass:
    price_eur_mwh: 20.0
    ef_kg_per_mwh_fuel: 0.0     # CO2-neutral

  waste:
    price_eur_mwh: 10.0
    ef_kg_per_mwh_fuel: 0.0     # Negativer Preis möglich (Entsorgungsgebühr)

# =============================================================================
# GENERATOR EFFICIENCIES
# =============================================================================
generators:
  # KWK-Anlagen (CHP)
  hkw:
    th_eff: 0.743
    el_eff: 0.177
    fuel_bus: gas

  gtost:
    th_eff: 0.466
    el_eff: 0.36
    fuel_bus: gas

  bmhkw:
    th_eff: 0.485
    el_eff: 0.177
    fuel_bus: biomass

  # Kessel (Boilers)
  hws:
    th_eff: 0.936
    el_eff: null
    fuel_bus: gas

  hww:
    th_eff: 0.924
    el_eff: null
    fuel_bus: gas

  ava:
    th_eff: 1.0
    el_eff: null
    fuel_bus: waste

  # Power-to-Heat
  p2h:
    el_to_th_eff: 0.99
    min_load: 0.0

# =============================================================================
# HEAT PUMP DEFAULTS
# =============================================================================
heat_pumps:
  # COP Berechnung
  cop:
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    sink_defaults:
      Tsink_out_K: 363.15   # 90°C Vorlauf
      Tsink_in_K: 343.15    # 70°C Rücklauf

  # Investment Defaults
  investment_defaults:
    enabled: true
    capacity_min_mw: 5.0           # Min 5 MW wenn gebaut
    capacity_max_mw: 100.0
    capex_eur_per_mw: 400000.0     # 400k € pro MW
    activation_cost_eur: 250000.0  # Einmalige Kosten (Planung, Installation)
    lifetime_years: 15.0
    tie_breaker_eur_per_mw: 0.00005

  # Technische Parameter
  types:
    standard:
      eta: 0.75         # Carnot-Effizienz
      FQ: 0.10          # Wärmeverlust-Faktor
      min_load: 0.30    # 30% Mindestlast

# =============================================================================
# STORAGE DEFAULTS
# =============================================================================
storage:
  investment_defaults:
    enabled: true
    energy_capacity_min_mwh: 10.0
    energy_capacity_max_mwh: 10000.0
    power_capacity_min_mw: 1.0
    power_capacity_max_mw: 1000.0
    energy_capex_eur_per_mwh: 5000.0      # 5k € pro MWh Kapazität
    power_capex_eur_per_mw: 1.0           # 1 € pro MW Leistung (vernachlässigbar)
    activation_cost_eur: 20000.0          # Einmalige Kosten
    lifetime_years: 20.0
    tie_breaker_eur_per_mwh: 0.000000005
