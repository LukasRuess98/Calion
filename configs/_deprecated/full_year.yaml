# =============================================================================
# SCENARIO CONFIGURATION
# =============================================================================
# Main scenario file for district heating optimization
# Usage: python -m energis.run configs/base.yaml configs/tech_catalog.yaml \
#        configs/system.yaml configs/scenario.yaml
# =============================================================================

scenario:
  title: "District Heating Optimization"
  tag: "main"

  # Workflow: [PF], [RH], [PF, RH], [PF, MPC]
  workflow: [PF]

  # Time horizon
  horizon:
    type: "date_range"
    start: "2023-01-01 00:00"
    end: "2023-12-31 23:00"
    enforce: false

# =============================================================================
# DATA SOURCE
# =============================================================================
site:
  input_file: Import_Data.xlsx
  year_target: 2023
  tz: Europe/Berlin

  columns:
    price_candidates:
      - Day_Ahead_Price
      - "Day_Ahead_Price €/MWh"
      - strompreis
    heat_candidates:
      - Waermebedarf_MW
      - "Wärmebedarf MW"
      - waermebedarf
    co2_candidates:
      - CO2_consumption_based
      - "CO2_consumption_based kgCO2/MWh"
      - co2
    # Heat recovery sources
    wrg1_q_candidates: ["WRG1Q MW", "WRG1_Q MW"]
    wrg1_t_candidates: ["WRG1_T °C", "WRG1 T °C"]
    wrg2_q_candidates: ["WRG2Q MW", "WRG2_Q MW"]
    wrg2_t_candidates: ["WRG2_T °C", "WRG2 T °C"]
    wrg3_q_candidates: ["WRG3Q MW", "WRG3_Q MW"]
    wrg3_t_candidates: ["WRG3_T °C", "WRG3 T °C"]
    wrg4_q_candidates: ["WRG4Q MW", "WRG4_Q MW"]
    wrg4_t_candidates: ["WRG4_T °C", "WRG4 T °C"]

# =============================================================================
# THERMAL NETWORK
# =============================================================================
thermal_network:
  enabled: true
  topology_file: configs/networks/brownfield.yaml

# =============================================================================
# SOLVER SETTINGS
# =============================================================================
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    Threads: 0
    MIPGap: 0.01
    TimeLimit: 3600
    MIPFocus: 1
    Method: 2
    Presolve: 2
    LogToConsole: 1

# =============================================================================
# GRID SETTINGS
# =============================================================================
grid:
  max_import_mw: 200
  max_export_mw: 100
  big_m_grid_mw: 200

# =============================================================================
# COST SETTINGS
# =============================================================================
costs:
  dump_cost_eur_per_mwh_th: 1.0
  co2_price_eur_per_t: 100.0
  include_co2_cost_in_objective: true
  include_capex_costs: true
  include_activation_costs: true
