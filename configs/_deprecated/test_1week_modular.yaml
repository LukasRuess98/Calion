# =============================================================================
# SCENARIO: Quick Test (1 Week)
# =============================================================================
# Minimal scenario for development and testing
#
# Use with: python -m energis.run \
#             configs/tech_defaults.yaml \
#             configs/site_stadtbach.yaml \
#             configs/scenarios/test_1week_modular.yaml
# =============================================================================

scenario:
  title: "Quick Test - 1 Week"
  tag: "test-1week"
  workflow: [PF]          # Perfect Foresight (faster than RH)

  horizon:
    type: "date_range"
    start: "2023-01-01 00:00"
    end: "2023-01-07 23:00"
    enforce: false        # No terminal constraints for PF

# =============================================================================
# SOLVER OVERRIDES (faster for testing)
# =============================================================================
run:
  solver_options:
    TimeLimit: 600      # 10 min instead of 1 hour
    LogToConsole: 1     # Show solver output

# =============================================================================
# SYSTEM CONFIGURATION
# =============================================================================
# Minimal system: Only existing generators (no HP, no storage)

system:
  # Disable heat pumps for quick test
  heat_pumps: []

  # Disable storage for quick test
  storage:
    enabled: false

# =============================================================================
# THERMAL NETWORK
# =============================================================================
thermal_network:
  enabled: false    # Disable network for faster solving
