# =============================================================================
# SCENARIO: Rolling Horizon Q1 2023
# =============================================================================
# Use with: python -m energis.run \
#             configs/tech_defaults.yaml \
#             configs/site_stadtbach.yaml \
#             configs/scenarios/rh_2023_q1.yaml
# =============================================================================

scenario:
  title: "Rolling Horizon - Q1 2023"
  tag: "rh-q1-2023"
  workflow: [RH]

  # Rolling Horizon Settings
  fix_design: true        # Fix investment after first window

  horizon:
    type: "date_range"
    start: "2023-01-01 00:00"
    end: "2023-04-17 23:00"
    enforce: true         # ⚠️ CRITICAL for storage cycling in RH!

# =============================================================================
# THERMAL NETWORK
# =============================================================================
thermal_network:
  enabled: false          # Temporarily disabled for testing
  topology_file: configs/networks/brownfield.yaml

# =============================================================================
# SYSTEM CONFIGURATION
# =============================================================================
# Define which technologies to include in THIS scenario

system:
  # Heat Pumps with WRG sources
  heat_pumps:
    - id: HP1
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG1_T_K
      wrg_capacity_column: WRG1_Q_MW  # ✅ Corrected column name
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

    - id: HP2
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG2_T_K
      wrg_capacity_column: WRG2_Q_MW
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

    - id: HP3
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG3_T_K
      wrg_capacity_column: WRG3_Q_MW
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

    - id: HP4
      enabled: true
      max_th_mw: 100.0
      wrg_source_column: WRG4_T_K
      wrg_capacity_column: WRG4_Q_MW
      investment:
        enabled: true
        capacity_min_mw: 5.0
        capacity_max_mw: 100.0
        initial_capacity_mw: 50.0

  # Thermal Storage
  storage:
    enabled: true
    energy_mwh: 500.0
    power_mw: 50.0
    soc0_mwh: 500.0
    investment:
      enabled: true
      min_energy_mwh: 100.0
      max_energy_mwh: 5000.0
      min_power_mw: 10.0
      max_power_mw: 200.0
      energy_capex_eur_per_mwh: 5000.0
      power_capex_eur_per_mw: 50000.0
      activation_cost_eur: 50000.0
      lifetime_years: 20
