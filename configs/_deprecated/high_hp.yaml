# =============================================================================
# SYSTEM CONFIGURATION - HIGH HEAT PUMP CAPACITY
# =============================================================================
# Variant with increased heat pump capacity for decarbonization scenarios
# =============================================================================

system:
  # =========================================================================
  # HEAT PUMP CONFIGURATION - INCREASED CAPACITY
  # =========================================================================
  heat_pump_defaults:
    enabled: true
    type: standard
    max_th_mw: 100.0
    min_th_mw: 0.0
    investment:
      enabled: true
      capacity_min_mw: 10.0
      capacity_max_mw: 150.0
      capex_eur_per_mw: 400000.0
      lifetime_years: 15.0

  heat_pumps:
    - id: HP1
      enabled: true
      max_th_mw: 150.0
      wrg_source_column: WRG1_T_K
      wrg_capacity_column: WRG1_Q_cap
      investment:
        enabled: true
        capacity_min_mw: 10.0
        capacity_max_mw: 150.0
        initial_capacity_mw: 80.0

    - id: HP2
      enabled: true
      max_th_mw: 150.0
      wrg_source_column: WRG2_T_K
      wrg_capacity_column: WRG2_Q_cap
      investment:
        enabled: true
        capacity_min_mw: 10.0
        capacity_max_mw: 150.0
        initial_capacity_mw: 80.0

    - id: HP3
      enabled: true
      max_th_mw: 150.0
      wrg_source_column: WRG3_T_K
      wrg_capacity_column: WRG3_Q_cap
      investment:
        enabled: true
        capacity_min_mw: 10.0
        capacity_max_mw: 150.0
        initial_capacity_mw: 80.0

    - id: HP4
      enabled: true
      max_th_mw: 150.0
      wrg_source_column: WRG4_T_K
      wrg_capacity_column: WRG4_Q_cap
      investment:
        enabled: true
        capacity_min_mw: 10.0
        capacity_max_mw: 150.0
        initial_capacity_mw: 80.0

  # =========================================================================
  # THERMAL STORAGE - LARGER CAPACITY
  # =========================================================================
  storage:
    enabled: true
    min_energy_mwh: 0.0
    max_energy_mwh: 10000.0
    max_power_mw: 300.0
    soc0_mwh: 1000.0
    investment:
      enabled: true
      energy_capacity_min_mwh: 500.0
      energy_capacity_max_mwh: 10000.0
      power_capacity_min_mw: 0.0
      power_capacity_max_mw: 300.0
      initial_energy_capacity_mwh: 1000.0

  # =========================================================================
  # THERMAL GENERATORS - REDUCED FOSSIL (Brownfield)
  # =========================================================================
  generators:
    hkw:
      enabled: true
      cap_th_mw: 50.0  # Reduced from 75
      description: "Heizkraftwerk - Gas CHP (reduced)"

    gtost:
      enabled: true
      cap_th_mw: 30.0  # Reduced from 41.3
      description: "Gasturbine Ost (reduced)"

    p2h:
      enabled: true
      cap_th_mw: 20.0  # Increased from 10
      description: "Elektrodenkessel (increased)"

    bmhkw:
      enabled: true
      cap_th_mw: 20.0  # Increased from 15
      description: "Biomasse-Heizkraftwerk (increased)"

    hws:
      enabled: true
      cap_th_mw: 30.0  # Reduced from 45
      description: "Heizwerk Süd - Gaskessel (reduced)"

    hww:
      enabled: true
      cap_th_mw: 30.0  # Reduced from 45
      description: "Heizwerk West - Gaskessel (reduced)"

    ava:
      enabled: true
      cap_th_mw: 50.0  # Increased from 45
      description: "Abwärmenutzung AVA (increased)"
