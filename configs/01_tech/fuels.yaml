# =============================================================================
# FUEL PRICES & EMISSIONS
# =============================================================================
# Fuel cost and emission factors for generators
# =============================================================================

fuels:
  # Natural gas
  gas:
    price_eur_mwh: 58.6                       # €/MWh fuel
    ef_kg_per_mwh_fuel: 201.6                 # kg CO2 / MWh fuel

  # Biomass (CO2-neutral)
  biomass:
    price_eur_mwh: 20.0
    ef_kg_per_mwh_fuel: 0.0                   # Carbon neutral

  # Waste (negative cost possible due to gate fees)
  waste:
    price_eur_mwh: 10.0
    ef_kg_per_mwh_fuel: 0.0
