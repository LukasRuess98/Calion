# =============================================================================
# THERMAL STORAGE - TECHNOLOGIE-PARAMETER
# =============================================================================
# Diese Datei definiert NUR technologische Eigenschaften des Speichers.
# Konkrete Größen (energy_mwh, power_mw) gehören in 03_systems/*.yaml
#
# HIER DEFINIERT:
#   - Effizienz (Laden/Entladen)
#   - Verlustrate
#   - CAPEX-Raten für Investitionsrechnung
#   - Technische Grenzen (für Optimierung)
#
# NICHT HIER:
#   - Konkrete Kapazitäten → 03_systems/
#   - Anfangszustand (soc0) → 03_systems/
#   - Terminal-Policy → 04_scenarios/
# =============================================================================

storage:
  # ═══════════════════════════════════════════════════════════════════════════
  # PHYSIKALISCHE EIGENSCHAFTEN
  # ═══════════════════════════════════════════════════════════════════════════
  efficiency:
    charge: 0.95                    # Lade-Effizienz (95%)
    discharge: 0.95                 # Entlade-Effizienz (95%)

  losses:
    hourly_rate: 0.001              # Wärmeverlust pro Stunde (0.1%/h)
    # Bei 1000 MWh: ~1 MWh Verlust pro Stunde

  # ═══════════════════════════════════════════════════════════════════════════
  # INVESTITIONS-PARAMETER (für Kapazitätsoptimierung)
  # ═══════════════════════════════════════════════════════════════════════════
  investment:
    # CAPEX-Raten (werden nur verwendet wenn build optimiert wird)
    capex_energy_eur_per_mwh: 5000.0    # 5.000 €/MWh Speicherkapazität
    capex_power_eur_per_mw: 50000.0     # 50.000 €/MW Lade-/Entladeleistung
    activation_cost_eur: 20000.0         # Fixkosten für Installation
    lifetime_years: 20.0                 # Wirtschaftliche Lebensdauer

  # ═══════════════════════════════════════════════════════════════════════════
  # TECHNISCHE GRENZEN (für Investitionsoptimierung)
  # ═══════════════════════════════════════════════════════════════════════════
  # Diese Grenzen gelten nur wenn capacity optimiert wird (nicht fix vorgegeben)
  bounds:
    energy_min_mwh: 10.0            # Mindestgröße wenn gebaut
    energy_max_mwh: 10000.0         # Maximale Größe (10 GWh)
    power_min_mw: 1.0               # Mindestleistung
    power_max_mw: 1000.0            # Maximale Leistung (1 GW)

  # ═══════════════════════════════════════════════════════════════════════════
  # TERMINAL-WERT PARAMETER (für Rolling Horizon)
  # ═══════════════════════════════════════════════════════════════════════════
  terminal_value:
    # Salvage-Preis: Wert der gespeicherten Energie am Horizont-Ende
    salvage_price_eur_mwh: null     # null = durchschnittlicher Strompreis

    # Wertfunktion für Endzustand
    value_function: diminishing     # "constant" oder "diminishing"
    diminishing_decay: 0.3          # Bei 100% SOC: 70% des Basiswerts
