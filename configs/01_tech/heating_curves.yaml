# =============================================================================
# HEATING CURVES (Heizkurven) FOR DISTRICT HEATING NETWORKS
# =============================================================================
# Named profiles for outdoor-dependent supply temperature control
#
# Formula: T_supply = intercept + slope * T_outdoor
#          with clamping to [T_supply_min, T_supply_max]
#
# Reference from network config:
#   heating_curve:
#     enabled: true
#     profile: standard_dh
# =============================================================================

heating_curves:
  # ---------------------------------------------------------------------------
  # Standard District Heating (3rd Generation) - 80-120°C
  # ---------------------------------------------------------------------------
  standard_dh:
    description: "Klassische Fernwärme 3. Generation (80-120°C)"
    T_supply_min_c: 80.0      # Summer: at T_outdoor >= 20°C
    T_supply_max_c: 120.0     # Winter: at T_outdoor <= -10°C
    T_outdoor_high_c: 20.0    # Threshold for minimum supply
    T_outdoor_low_c: -10.0    # Threshold for maximum supply
    # Derived: slope = -1.333, intercept = 106.67
    # Formula: T_supply = 106.67 - 1.333 * T_outdoor

  # ---------------------------------------------------------------------------
  # 4th Generation District Heating (4GDH) - 50-70°C
  # ---------------------------------------------------------------------------
  4gdh_low_temp:
    description: "4. Generation Fernwärme (50-70°C)"
    T_supply_min_c: 50.0      # Summer: at T_outdoor >= 15°C
    T_supply_max_c: 70.0      # Winter: at T_outdoor <= -5°C
    T_outdoor_high_c: 15.0
    T_outdoor_low_c: -5.0
    # Derived: slope = -1.0, intercept = 65.0
    # Formula: T_supply = 65 - 1.0 * T_outdoor

  # ---------------------------------------------------------------------------
  # Moderate Temperature Network - 70-100°C
  # ---------------------------------------------------------------------------
  moderate_temp:
    description: "Moderate Temperaturen (70-100°C)"
    T_supply_min_c: 70.0      # Summer: at T_outdoor >= 18°C
    T_supply_max_c: 100.0     # Winter: at T_outdoor <= -8°C
    T_outdoor_high_c: 18.0
    T_outdoor_low_c: -8.0
    # Derived: slope = -1.154, intercept = 90.77
    # Formula: T_supply = 90.77 - 1.154 * T_outdoor

  # ---------------------------------------------------------------------------
  # High Temperature Network - 90-130°C
  # ---------------------------------------------------------------------------
  high_temp:
    description: "Hochtemperatur-Netz (90-130°C)"
    T_supply_min_c: 90.0      # Summer: at T_outdoor >= 20°C
    T_supply_max_c: 130.0     # Winter: at T_outdoor <= -12°C
    T_outdoor_high_c: 20.0
    T_outdoor_low_c: -12.0
    # Derived: slope = -1.25, intercept = 115.0
    # Formula: T_supply = 115 - 1.25 * T_outdoor

  # ---------------------------------------------------------------------------
  # Constant Temperature (no heating curve)
  # ---------------------------------------------------------------------------
  constant_90:
    description: "Konstante Vorlauftemperatur 90°C"
    T_supply_min_c: 90.0
    T_supply_max_c: 90.0
    T_outdoor_high_c: 20.0
    T_outdoor_low_c: -10.0
    # No slope: always 90°C

  constant_100:
    description: "Konstante Vorlauftemperatur 100°C"
    T_supply_min_c: 100.0
    T_supply_max_c: 100.0
    T_outdoor_high_c: 20.0
    T_outdoor_low_c: -10.0
    # No slope: always 100°C

  constant_120:
    description: "Konstante Vorlauftemperatur 120°C"
    T_supply_min_c: 120.0
    T_supply_max_c: 120.0
    T_outdoor_high_c: 20.0
    T_outdoor_low_c: -10.0
    # No slope: always 120°C

# =============================================================================
# USAGE EXAMPLES
# =============================================================================
#
# 1. In network config (configs/05_networks/brownfield.yaml):
#    parameters:
#      heating_curve:
#        enabled: true
#        profile: standard_dh
#
# 2. In scenario config (configs/04_scenarios/full_year.yaml):
#    heating_curve:
#      enabled: true
#      profile: 4gdh_low_temp
#
# 3. Override with inline values (ignores profile):
#    heating_curve:
#      enabled: true
#      T_supply_min_c: 85.0
#      T_supply_max_c: 115.0
#      T_outdoor_high_c: 18.0
#      T_outdoor_low_c: -8.0
#
# =============================================================================
