# =============================================================================
# HEAT PUMP TECHNOLOGY DEFAULTS
# =============================================================================
# COP calculation, investment parameters, and technical constraints
# =============================================================================

heat_pumps:
  # COP (Coefficient of Performance) calculation parameters
  cop:
    deltaT_K: 20.0                            # Temperature lift (K)
    deltaTpp_K: 5.0                           # Pinch point temperature difference
    cop_fallback: 3.0                         # Fallback COP (must be >= 1.01)

    # Heat sink (district heating network)
    sink_defaults:
      Tsink_out_K: 363.15                     # 90°C supply temperature
      Tsink_in_K: 343.15                      # 70°C return temperature

  # Investment optimization defaults
  investment_defaults:
    enabled: true
    capacity_min_mw: 5.0                      # Minimum 5 MW if built
    capacity_max_mw: 100.0                    # Maximum 100 MW
    capex_eur_per_mw: 400000.0                # 400k € per MW capacity
    activation_cost_eur: 250000.0             # Fixed cost for installation
    lifetime_years: 15.0                      # Economic lifetime
    tie_breaker_eur_per_mw: 0.00005           # Small cost to break ties

  # Technical performance types
  types:
    standard:
      eta: 0.75                               # Carnot efficiency (75%)
      FQ: 0.10                                # Heat loss factor
      min_load: 0.30                          # 30% minimum load
