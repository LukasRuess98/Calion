# =============================================================================
# PRESET: Rolling Horizon with Thermal Network
# =============================================================================
# Production optimization with thermal network enabled
# - Rolling Horizon Q1 2023
# - Heat pumps + Storage
# - Thermal Network (Brownfield mode)
#
# Usage: python -m energis.run configs/presets/rh_with_network.yaml --dashboard
# =============================================================================

_extends:
  - ../00_base/solver.yaml
  - ../00_base/costs.yaml
  - ../00_base/grid.yaml
  - ../01_tech/fuels.yaml
  - ../01_tech/generators.yaml
  - ../01_tech/heat_pumps.yaml
  - ../01_tech/storage.yaml
  - ../02_site/stadtbach/data_source.yaml
  - ../02_site/stadtbach/assets.yaml
  - ../03_systems/full.yaml
  - ../04_scenarios/rh_q1_2023.yaml

# Enable thermal network (overrides rh_q1_2023.yaml default)
thermal_network:
  enabled: true
  brownfield_mode: true
  topology_file: configs/05_networks/brownfield.yaml
  use_outdoor_temperature: false
