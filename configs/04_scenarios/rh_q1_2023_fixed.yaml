# =============================================================================
# SCENARIO: Rolling Horizon Q1 2023 with Fixed Design
# =============================================================================
# Rolling horizon optimization using a pre-defined design from JSON file
# Use this when you want to run simulations with known/optimal design
# =============================================================================

scenario:
  title: "Rolling Horizon - Q1 2023 (Fixed Design)"
  tag: "rh-q1-2023-fixed"
  workflow: [RH]                              # Rolling Horizon

  # ═══════════════════════════════════════════════════════════════════════════
  # DESIGN CONFIGURATION - Using pre-defined design file
  # ═══════════════════════════════════════════════════════════════════════════
  design:
    mode: file                                # Load design from JSON file
    file: ../06_designs/stadtbach_optimal.json  # Path relative to this config

  # ═══════════════════════════════════════════════════════════════════════════
  # ROLLING HORIZON PARAMETERS
  # ═══════════════════════════════════════════════════════════════════════════
  rolling_horizon:
    heat_horizon_hours: 168.0                 # 1 week window
    step_hours: 24.0                          # Advance 1 day per window
    terminal_policy: value                    # Diminishing returns value function

  # ═══════════════════════════════════════════════════════════════════════════
  # TIME HORIZON
  # ═══════════════════════════════════════════════════════════════════════════
  horizon:
    type: "date_range"
    start: "2023-01-01 00:00"
    end: "2023-04-17 23:00"
    enforce: true

# Thermal network
thermal_network:
  enabled: false
