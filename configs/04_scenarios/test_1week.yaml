# =============================================================================
# SCENARIO: Quick Test (1 Week)
# =============================================================================
# Fast test scenario for development and debugging
# Perfect Foresight, 1 week, fast solver settings
# =============================================================================

scenario:
  title: "Quick Test - 1 Week"
  tag: "test-1week"
  workflow: [PF]

  # ═══════════════════════════════════════════════════════════════════════════
  # OPTIMIZATION STRATEGY
  # ═══════════════════════════════════════════════════════════════════════════
  optimization:
    # For PF: Optimize everything in single solve
    variables:
      heat_pumps:
        capacity: true
        build: true
      storage:
        capacity: true
        power: true
        build: true
    # No fix_after_window needed for PF (single solve)

  # ═══════════════════════════════════════════════════════════════════════════
  # TIME HORIZON
  # ═══════════════════════════════════════════════════════════════════════════
  horizon:
    type: "date_range"
    start: "2023-01-01 00:00"
    end: "2023-01-07 23:00"
    enforce: false

# Override solver settings for faster solving
run:
  solver_options:
    TimeLimit: 600
    LogToConsole: 1

# Disable thermal network for faster solving
thermal_network:
  enabled: false
