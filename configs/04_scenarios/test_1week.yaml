# =============================================================================
# SCENARIO: Quick Test (1 Week)
# =============================================================================
# Fast test scenario for development and debugging
# Perfect Foresight, 1 week, fast solver settings
# =============================================================================

scenario:
  title: "Quick Test - 1 Week"
  tag: "test-1week"
  workflow: [PF]                              # Perfect Foresight (faster)

  horizon:
    type: "date_range"
    start: "2023-01-01 00:00"
    end: "2023-01-07 23:00"
    enforce: false                            # No terminal constraints for PF

# Override solver settings for faster solving
run:
  solver_options:
    TimeLimit: 600                            # 10 minutes (vs 1 hour default)
    LogToConsole: 1                           # Show solver output

# Disable thermal network for faster solving
thermal_network:
  enabled: false
