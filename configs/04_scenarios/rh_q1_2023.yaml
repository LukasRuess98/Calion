# =============================================================================
# SCENARIO: Rolling Horizon Q1 2023
# =============================================================================
# Rolling horizon optimization for Q1 2023 (Jan-Apr)
# Production scenario with storage cycling
# =============================================================================

scenario:
  title: "Rolling Horizon - Q1 2023"
  tag: "rh-q1-2023"
  workflow: [RH]                              # Rolling Horizon

  # Investment strategy
  fix_design: true                            # Fix design after first window

  # Rolling Horizon parameters
  rolling_horizon:
    heat_horizon_hours: 168.0                 # 1 week window
    step_hours: 24.0                          # Advance 1 day per window
    # Terminal policy options:
    # - "equal": Hard constraint SOC_end == SOC_init (can cause infeasibility)
    # - "geq": Hard constraint SOC_end >= SOC_init
    # - "soft": Soft constraint with penalty (always feasible)
    # - "value": Terminal value function with diminishing returns (recommended)
    # - "free": No terminal constraint
    terminal_policy: value                    # Diminishing returns value function

  # Time horizon
  horizon:
    type: "date_range"
    start: "2023-01-01 00:00"
    end: "2023-04-17 23:00"                   # ~3.5 months
    enforce: true                             # Ensure full horizon is covered

# Thermal network (currently disabled for testing)
thermal_network:
  enabled: false
  topology_file: configs/05_networks/brownfield.yaml
