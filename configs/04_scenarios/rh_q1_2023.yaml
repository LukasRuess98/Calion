# =============================================================================
# SCENARIO: Rolling Horizon Q1 2023
# =============================================================================
# Rolling horizon optimization for Q1 2023 (Jan-Apr)
# Production scenario with investment optimization in Window 0
# =============================================================================

scenario:
  title: "Rolling Horizon - Q1 2023"
  tag: "rh-q1-2023"
  workflow: [RH]

  # ═══════════════════════════════════════════════════════════════════════════
  # OPTIMIZATION STRATEGY
  # ═══════════════════════════════════════════════════════════════════════════
  # Defines which values are VARIABLES (optimized) vs PARAMETERS (fixed)
  # ═══════════════════════════════════════════════════════════════════════════
  optimization:
    # What should be optimized? (true = variable, false = parameter)
    variables:
      heat_pumps:
        capacity: true              # Optimize HP capacities
        build: true                 # Optimize build decisions
      storage:
        capacity: true              # Optimize storage energy capacity
        power: true                 # Optimize storage power capacity
        build: true                 # Optimize build decision

    # For RH: When to fix investment decisions?
    fix_after_window: 0             # After Window 0: variables become parameters

    # Optional: Save optimized values for reuse
    # save_result_to: 03_systems/variants/optimized_q1.yaml

  # ═══════════════════════════════════════════════════════════════════════════
  # ROLLING HORIZON PARAMETERS
  # ═══════════════════════════════════════════════════════════════════════════
  rolling_horizon:
    heat_horizon_hours: 168.0       # 1 week window
    step_hours: 24.0                # Advance 1 day per window
    terminal_policy: value          # Diminishing returns value function

  # ═══════════════════════════════════════════════════════════════════════════
  # TIME HORIZON
  # ═══════════════════════════════════════════════════════════════════════════
  horizon:
    type: "date_range"
    start: "2023-01-01 00:00"
    end: "2023-04-17 23:00"
    enforce: true

# Thermal network
thermal_network:
  enabled: false
