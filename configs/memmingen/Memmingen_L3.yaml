# =============================================================================
# PAPER STUDY — Level 3: Independent Zone Demands (Dispatch-Only)
# =============================================================================
# RESEARCH FOCUS: Impact of Independent Zone Demand Profiles vs. Fractioned Demand
#
# Level 3 with per-zone independent demands instead of demand fractions.
# Each zone has its own complete 8760-hour timeseries with unique temporal patterns,
# enabling heterogeneous demand profiles across the network.
#
# DIFFERENCES FROM L3_detailed_dispatch.yaml:
# - REMOVED: demand_fraction from all consumer nodes
# - UPDATED: Each zone reads unique demand column (zone_XX_demand_MWth)
# - DATA:    Uses Import_Data_yearly_zones.csv (generated by scripts/generate_zone_demands.py)
# - RESULT:  Per-zone demands are independent (not just scaled copies of total)
#
# TOPOLOGY:                                                          # ← GEÄNDERT
#   Star-of-stars: plant → 14 junction-to-junction pipes
#   Total nodes: 15 (1 plant-junction, 14 distribution junctions)
#   Total pipes: 14 connections (junction-to-junction only)
#   Total pipe length: ~3,255 m
#   Demand distribution: V_1–V_27 demand columns merged into junctions
#
# REFACTORING NOTE:                                                  # ← GEÄNDERT
#   ALL consumer demands are now attached directly to junction nodes via the
#   `consumers:` list. No separate consumer nodes remain in the network.
#   V_1 → j_1, V_18 → j_11, V_19–V_21 → j_12, V_22–V_24 → j_13.
#   This eliminates 8 stub pipes and 8 consumer nodes.
#
# PHYSICS:
# - Heat loss: Physics-based PWL model (identical to L3_detailed_dispatch)
# - COP method: Analytical LMTD
#
# SYSTEM SUMMARY (Fixed Assets — identical to L3):
#   Peak demand:   76 MW (may shift due to independent profiles)
#   Annual demand: 517 GWh (approx., depends on generated profiles)
#   Boiler:        500 MW gas, η = 0.90
#   Storage:       1000 MWh / 50 MW
#   Heat losses:   ~26 GWh/year
#
# SETUP:
# 1. Generate zone demands: python scripts/generate_zone_demands.py
# 2. Run this config:        python scripts/paper/run_all_levels.py
# 3. Compare vs. L3_detailed_dispatch for dispatch pattern differences
# =============================================================================

site:
  input_xlsx: "data/2025_04_14_Import_Data_Memmingen.xlsx"
  columns:
    datetime:  "Datum"
    price:     "strompreis_EUR_MWh"
    co2_grid:  "grid_co2_kg_MWh"
    # heat_candidates: "Wärmebedarf MW"   # [DEFAULT: auto-detect] Spaltenname für globalen Wärmebedarf — bei L3 nicht nötig (per-node demands)
    # outdoor_temp_candidates: ~          # [DEFAULT: auto-detect] Außentemperatur für Heizkurve (optional)
  # sheet_name: ~                         # [DEFAULT: erstes Sheet] Excel-Sheet-Name
  # year_target: ~                        # [DEFAULT: alle Jahre] Nur Daten dieses Jahres laden (z.B. 2025)

scenario:
  name: "Memmingen L3 - Independent Zone Demands (Dispatch-Only)"
  description: "15-node junction network, all consumers merged into junctions"  # ← GEÄNDERT
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: "2025-01-01"
    end: "2025-01-31 23:00"
  # fix_design: false               # [DEFAULT: false bei PF_ONLY] Kapazitäten nach PF-Lauf fixieren und in RH nicht mehr optimieren
  # rolling_horizon:                # Nur relevant bei run_mode: RH_ONLY oder PF_THEN_RH
  #   heat_horizon_hours: 168       # [DEFAULT: konstante aus constants.py] Planungshorizont je RH-Fenster (Stunden)
  #   step_hours: 24                # [DEFAULT: = horizon] Commit-Länge je Schritt (Stunden)
  #   overlap_hours: 0.0            # [DEFAULT: 0] Überlappung zwischen Fenstern (Stunden)
  #   terminal_policy: "equal"      # [DEFAULT: ""] Endwert-Bedingung Speicher: free | equal | geq | soft

# ── Network (15-node junction network) ──────────────────────────────────── # ← GEÄNDERT
network:
  milp_linearize: true
  physics:
    heat_loss: true
    pressure_drop: true    # ← GEÄNDERT (war true mit falschem Kommentar — Pumpen erzeugten Strom-Constraint ohne Quelle!)
    transport_delay: true  # Transportverzögerung deaktiviert

  supply_temp_c: 100
  return_temp_c: 40
  ground_temp_c: 10
  # use_outdoor_temperature: false   # [DEFAULT: false] Bodentemp. durch zeitvariable Außentemp. aus Excel ersetzen (braucht outdoor_temp_C-Spalte)

  # ── Temperatur-Linearisierung (aktiv wegen milp_linearize: true) ─────────
  # Methode steuert wie T_supply/T_return als MILP-Parameter berechnet werden:
  linearization:
    method: "pwl"               # [DEFAULT: "fixed"] fixed = konstante Nenntemperaturen
  #                                 #   "global"  = lineare Funktion der Gesamtlast (T_supply_min..max)
  #                                 #   "pwl"     = Stückweise linear über Lastpunkte (flexibelste Methode)
  #   # -- Für method: "global" --
  #   global_profile:
  #     T_supply_min_c: 70.0        # [DEFAULT: 70] Vorlauftemp. bei Mindestlast (°C)
  #     T_supply_max_c: 95.0        # [DEFAULT: 95] Vorlauftemp. bei Volllast (°C)
  #     T_return_max_c: 55.0        # [DEFAULT: 55] Rücklauftemp. bei Mindestlast (°C)
  #     T_return_min_c: 45.0        # [DEFAULT: 45] Rücklauftemp. bei Volllast (°C)
    # -- Für method: "pwl" --
    temperature_profile:
      load_fractions: [0.0, 0.3, 0.6, 1.0]          # Lastpunkte (strikt aufsteigend, 0..1)
      T_supply_c:     [70.0, 80.0, 90.0, 100.0]     # Vorlauftemp. je Lastpunkt (°C)
      T_return_c:     [55.0, 50.0, 45.0, 40.0]      # Rücklauftemp. je Lastpunkt (°C)

  # ── Netzparameter ─────────────────────────────────────────────────────────
  # demand_slack_penalty_eur_per_mwh: 1000000.0   # [DEFAULT: 1e6] Strafterm für unerfüllte Netznachfrage (Knoten mit mehreren Zuleitungen)
  # heating_curve:                                 # Nur wirksam wenn use_outdoor_temperature: true
  #   enabled: false                               # [DEFAULT: false] Heizkurve aktivieren
  #   T_supply_min_c: 80.0                         # [DEFAULT: 80]  Vorlauf bei T_außen_high (°C)
  #   T_supply_max_c: 120.0                        # [DEFAULT: 120] Vorlauf bei T_außen_low (°C)
  #   T_outdoor_high_c: 20.0                       # [DEFAULT: 20]  Außentemp. Heizkurve oben (°C)
  #   T_outdoor_low_c: -10.0                       # [DEFAULT: -10] Außentemp. Heizkurve unten (°C)

  # ══════════════════════════════════════════════════════════════════════════
  # NODES — 15 Junctions, alle 27 Verbraucher direkt eingebettet
  # ══════════════════════════════════════════════════════════════════════════
  nodes:
    # ── Root: producer-junction (Heizwerk E1 + V_1) ─────────────────────── # ← GEÄNDERT: V_1 hier eingebettet
    j_1:
      assets: [chp_main, tes_main, hp_main]  # ← GEÄNDERT: HP hier eingebettet, da er Wärme direkt am Erzeuger bereitstellt
      consumers:
        - column: "V_1_demand_MWth"

    # ── Trunk junction j_2: serves V_2 ──────────────────────────────────
    j_2:
      consumers:
        - column: "V_2_demand_MWth"

    # ── Trunk junction j_3: splits to j_4 and j_9, serves V_3 ───────────
    j_3:
      consumers:
        - column: "V_3_demand_MWth"

    # ── Branch j_4: serves V_4–V_7 ──────────────────────────────────────
    j_4:
      consumers:
        - column: "V_4_demand_MWth"
        - column: "V_5_demand_MWth"
        - column: "V_6_demand_MWth"
        - column: "V_7_demand_MWth"

    # ── Branch j_5: serves V_8–V_9, splits to j_6 and j_7 ──────────────
    j_5:
      consumers:
        - column: "V_8_demand_MWth"
        - column: "V_9_demand_MWth"

    # ── Terminal branch j_6: serves V_10–V_12 ────────────────────────────
    j_6:
      consumers:
        - column: "V_10_demand_MWth"
        - column: "V_11_demand_MWth"
        - column: "V_12_demand_MWth"

    # ── Branch j_7: serves V_13 ─────────────────────────────────────────
    j_7:
      consumers:
        - column: "V_13_demand_MWth"

    # ── Terminal branch j_8: serves V_14 ─────────────────────────────────
    j_8:
      consumers:
        - column: "V_14_demand_MWth"

    # ── Branch j_9: serves V_15–V_16 ────────────────────────────────────
    j_9:
      consumers:
        - column: "V_15_demand_MWth"
        - column: "V_16_demand_MWth"

    # ── Branch j_10: serves V_17 ────────────────────────────────────────
    j_10:
      consumers:
        - column: "V_17_demand_MWth"

    # ── Junction j_11: serves V_18 ──────────────────────────────────────  # ← GEÄNDERT: war leer, V_18 eingebettet
    j_11:
      consumers:
        - column: "V_18_demand_MWth"

    # ── Junction j_12: serves V_19–V_21 ─────────────────────────────────  # ← GEÄNDERT: war leer, V_19–V_21 eingebettet
    j_12:
      consumers:
        - column: "V_19_demand_MWth"
        - column: "V_20_demand_MWth"
        - column: "V_21_demand_MWth"

    # ── Junction j_13: serves V_22–V_24 ─────────────────────────────────  # ← GEÄNDERT: war leer, V_22–V_24 eingebettet
    j_13:
      consumers:
        - column: "V_22_demand_MWth"
        - column: "V_23_demand_MWth"
        - column: "V_24_demand_MWth"

    # ── Terminal branch j_14: serves V_25–V_26 ───────────────────────────
    j_14:
      consumers:
        - column: "V_25_demand_MWth"
        - column: "V_26_demand_MWth"

    # ── Terminal branch j_15: serves V_27 ────────────────────────────────
    j_15:
      consumers:
        - column: "V_27_demand_MWth"

    # ← GEÄNDERT: V_1, V_18, V_19, V_20, V_21, V_22, V_23, V_24 als
    #   separate Knoten ENTFERNT — Demands jetzt in Junctions eingebettet

  # ══════════════════════════════════════════════════════════════════════════
  # PIPES — 14 Stück, nur Junction-zu-Junction
  # ══════════════════════════════════════════════════════════════════════════
  # ENTFERNT: j1_to_V_1, j11_to_V18, j12_to_V19, j12_to_V20,
  #           j12_to_V21, j13_to_V22, j13_to_V23, j13_to_V24
  #
  # Pipe-Parameter (globale Defaults, können pro Rohr überschrieben werden):
  #   u_value_supply_w_per_m_k: 0.28   # [DEFAULT: 0.28] Wärmeverlustkoeffizient Vorlaufrohr (W/(m·K))
  #   u_value_return_w_per_m_k: 0.30   # [DEFAULT: 0.30] Wärmeverlustkoeffizient Rücklaufrohr (W/(m·K))
  #   max_velocity_m_s: 2.5            # [DEFAULT: 2.5]  Max. Strömungsgeschwindigkeit (nur bei pressure_drop: true)
  #   pipe_roughness_mm: 0.05          # [DEFAULT: 0.05] Rauigkeit Rohrinnenwand (nur bei pressure_drop: true)
  #   pump_efficiency: 0.70            # [DEFAULT: 0.70] Pumpenwirkungsgrad (nur bei pressure_drop: true)
  #   lifetime_years: 40               # [DEFAULT: 40]   Lebensdauer für CAPEX-Annualisierung (nur bei Rohrsanierung)
  pipes:
    # ── Hauptstrang (J1 → J2 → J3) ──────────────────────────────────────
    j1_to_j2:
      from: j_1
      to: j_2
      length_m: 350
      diameter_mm: 1000

    j2_to_j3:
      from: j_2
      to: j_3
      length_m: 300
      diameter_mm: 1000

    # ── J3 verzweigt: Süd → J4, Ost → J9 ────────────────────────────────
    j3_to_j4:
      from: j_3
      to: j_4
      length_m: 260
      diameter_mm: 1000

    j3_to_j9:
      from: j_3
      to: j_9
      length_m: 450
      diameter_mm: 1000

    # ── Süd-Ast (J4 → J5 → J6/J7 → J8) ─────────────────────────────────
    j4_to_j5:
      from: j_4
      to: j_5
      length_m: 240
      diameter_mm: 1000

    j5_to_j6:
      from: j_5
      to: j_6
      length_m: 150
      diameter_mm: 1000

    j5_to_j7:
      from: j_5
      to: j_7
      length_m: 220
      diameter_mm: 1000

    j7_to_j8:
      from: j_7
      to: j_8
      length_m: 80
      diameter_mm: 1000

    # ── Ost-Ast (J9 → J10 → J11 → J12 → J13 → J14/J15) ────────────────
    j9_to_j10:
      from: j_9
      to: j_10
      length_m: 200
      diameter_mm: 1000

    j10_to_j11:
      from: j_10
      to: j_11
      length_m: 230
      diameter_mm: 1000

    j11_to_j12:
      from: j_11
      to: j_12
      length_m: 250
      diameter_mm: 1000

    j12_to_j13:
      from: j_12
      to: j_13
      length_m: 220
      diameter_mm: 1000

    j13_to_j14:
      from: j_13
      to: j_14
      length_m: 180
      diameter_mm: 1000

    j13_to_j15:
      from: j_13
      to: j_15
      length_m: 125
      diameter_mm: 1000

# ── FIXED ASSETS (Dispatch-Only, IDENTICAL TO L3) ──────────────────────────
assets:
  chp_main:
    type: chp
    fuel: gas
    capacity_mw: 20.0
    thermal_output_mw: 20.0
    min_load: 0.3
    electrical_efficiency: 0.40
    thermal_efficiency_total: 0.80
  hp_main:
    type: heat_pump
    capacity_mw: 100.0
    min_load: 0.2
    cop_method: analytical_lmtd
    sink_temp_c: 90.0
    source_columns: ["wrg1_temp", "wrg2_temp"]
    carnot_efficiency: 0.6
    cop_default: 3.0
  tes_main:
    type: storage
    energy_capacity_mwh: 1000.0
    power_capacity_mw: 50.0
    charge_efficiency: 0.95
    discharge_efficiency: 0.95
    min_load_mw: 0.0
    round_trip_efficiency: 0.90
    soc_min: 0.0
    soc_max: 1.0
    soc0_mwh: 500.0
    terminal:
      state: cyclic
      policy: equal

# ── GRID SETTINGS (Identical to L3)
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  gridcost_eur_mwh: 35.0           # Netzentgelt Leistungskomponente (€/MWh) — wird nur addiert wenn include_gridcost_in_energy: true
  # demand_charge_eur_per_mw_y: 0.0  # [DEFAULT: 0] Leistungspreis (€/MW/Jahr) — 0 = Leistungspreis deaktiviert
  # energy_fee_eur_mwh: 0.0          # [DEFAULT: 0] Netzentgelt Energiepreis (€/MWh), wird auf Kaufpreis aufgeschlagen wenn include_gridcost_in_energy: true
  # sell_floor_eur_mwh: 0.0          # [DEFAULT: 0] Mindestpreis für Stromverkauf (€/MWh)
  # sell_haircut_fraction: 0.0       # [DEFAULT: 0] Prozentualer Abschlag auf Verkaufspreis (z.B. 0.05 = 5%)
  # sell_spread_eur_mwh: 0.0         # [DEFAULT: 0] Bid-Ask-Spread (€/MWh), wird vor haircut vom Preis abgezogen
  # sell_fee_eur_mwh: 0.0            # [DEFAULT: 0] Fixgebühr pro verkaufter MWh (z.B. Broker-Fee)
  # sell_premium_eur_mwh: 0.0        # [DEFAULT: 0] Einspeisevergütung (€/MWh), wird auf Verkaufspreis addiert
  # big_m_grid_mw: 10000.0           # [DEFAULT: 10000] Big-M-Wert für MILP Grid-Constraints (kaufen/verkaufen nicht gleichzeitig)
  # year_fraction: ~                 # [DEFAULT: auto = T*dt_h/8760] Jahresanteil des Horizonts — hier Jan: 744/8760 ≈ 0.085; relevant für Leistungspreis-Hochrechnung

# ── FUELS ───────────────────────────────────────────────────────────────────
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 500.0

# ── COSTS ───────────────────────────────────────────────────────────────────
costs:
  co2_price_eur_per_t: 1000.0
  dump_cost_eur_per_mwh_th: 10.0
  # ── Flags: welche Kostenterme in die Zielfunktion eingehen ──────────────
  # include_gridcost_in_energy: false       # [DEFAULT: false] gridcost_eur_mwh + energy_fee auf Kaufpreis addieren
  # include_demand_charge_in_rh: true       # [DEFAULT: true]  Leistungspreis in RH-Fenstern aktiv (wirkt nur wenn demand_charge_eur_per_mw_y > 0)
  # include_co2_cost_in_objective: true     # [DEFAULT: true]  CO2-Kosten in Zielfunktion
  # include_capex_costs: true               # [DEFAULT: true]  Investitionskosten (CAPEX) in Zielfunktion — hier 0 da keine capex_eur_per_mw gesetzt
  # include_activation_costs: true          # [DEFAULT: true]  Aktivierungskosten für Komponenten (Binärvariable-Kosten)
  # include_tie_breaker_costs: true         # [DEFAULT: true]  Tie-Breaker-Terme für eindeutige MILP-Lösung
  # include_storage_installation_costs: true # [DEFAULT: true] Speicher-Installationskosten

# ── RUN SETTINGS ────────────────────────────────────────────────────────────
run:
  dt_h: 1.0
  solver: highs # gurobi oder highs
  mip_gap: 0.01
  time_limit_s: 3600
  load_solutions: false      # Prevents RuntimeError on infeasibility

  # ── Logging & Diagnose ──
  log_to_file: true          # Log-Datei erstellen (solver_*.log)
  verbose_logging: true      # ← ÄNDERN: Diagnose auch auf Konsole ausgeben

  # ── Gurobi-spezifische Optionen ──
  solver_options:
    OutputFlag: 1            # Gurobi Konsolenausgabe (0=aus, 1=an)
    LogToConsole: 1          # Solver-Fortschritt anzeigen
    # MIPFocus: 1            # Optional: 1=feasibility, 2=optimality, 3=bound
    # Presolve: 2            # Optional: Aggressives Presolve
    # NumericFocus: 1        # Optional: Bei numerischen Problemen

# ── OUTPUT SETTINGS ─────────────────────────────────────────────────────────
output:
  log_dir: "output/logs"              # Diagnose-Logs & IIS-Dateien
  export_dir: "output/results"        # Ergebnis-Export
  export_thermal_network: true
  export_solver_solution: true

# ── NOTES ───────────────────────────────────────────────────────────────────
# 1. INDEPENDENT ZONE DEMANDS: Each zone has its own demand timeseries column
#    (zone_XX_demand_MWth), enabling heterogeneous demand profiles.
#
# 2. IDENTICAL PHYSICS & ASSETS: Same PWL loss model, COP method, and fixed
#    capacities as L3_detailed_dispatch, enabling direct comparison of impact
#    of independent vs. fractioned demands on operational dispatch patterns.
#
# 3. DISPATCH-ONLY: All capacities fixed. Optimization minimizes operational
#    cost through hourly load dispatch, storage management, and grid trading.
#
# 4. EXPECTED SOLVE TIME: ~14–20 minutes for full year (HiGHS, 1% MIP gap).
#    Similar to L3_detailed_dispatch since network topology is identical.
#
# 5. DATA GENERATION: Before running, generate zone demands:
#    python scripts/generate_zone_demands.py
#
# 6. NETWORK SIMPLIFICATION: All 27 consumers merged into 15 junctions.     # ← NEU
#    No separate consumer nodes — eliminates 8 stub pipes and potential       # ← NEU
#    sink-counting issues at producer node j_1.                               # ← NEU