# =============================================================================
# PAPER STUDY — Level 3: Independent Zone Demands (Dispatch-Only)
# =============================================================================
# RESEARCH FOCUS: Impact of Independent Zone Demand Profiles vs. Fractioned Demand
#
# Level 3 with per-zone independent demands instead of demand fractions.
# Each zone has its own complete 8760-hour timeseries with unique temporal patterns,
# enabling heterogeneous demand profiles across the network.
#
# DIFFERENCES FROM L3_detailed_dispatch.yaml:
# - REMOVED: demand_fraction from all consumer nodes
# - UPDATED: Each zone reads unique demand column (zone_XX_demand_MWth)
# - DATA:    Uses Import_Data_yearly_zones.csv (generated by scripts/generate_zone_demands.py)
# - RESULT:  Per-zone demands are independent (not just scaled copies of total)
#
# TOPOLOGY:
#   Star-of-stars: plant → central junctions → 4 branches → 23 zones
#   Total nodes: 30 (1 plant, 4 junctions, 23 consumer zones)
#   Total pipes: 22 connections
#   Total pipe length: ~14,250 m
#   Demand distribution: zones 01-23 with independent timeseries
#
# PHYSICS:
# - Heat loss: Physics-based PWL model (identical to L3_detailed_dispatch)
# - COP method: Analytical LMTD
#
# SYSTEM SUMMARY (Fixed Assets — identical to L3):
#   Peak demand:   76 MW (may shift due to independent profiles)
#   Annual demand: 517 GWh (approx., depends on generated profiles)
#   Boiler:        200 MW gas, η = 0.90
#   CHP:           20 MW (elec)
#   Heat pump:     100 MW thermal
#   Storage:       500 MWh / 50 MW
#   Heat losses:   ~26 GWh/year
#
# SETUP:
# 1. Generate zone demands: python scripts/generate_zone_demands.py
# 2. Run this config:        python scripts/paper/run_all_levels.py
# 3. Compare vs. L3_detailed_dispatch for dispatch pattern differences
# =============================================================================

site:
  input_xlsx: "data/2025_04_14_Import_Data_Memmingen.xlsx"
  columns:
    datetime:  "Datum"
    price:     "strompreis_EUR_MWh"
    co2_grid:  "grid_co2_kg_MWh"

scenario:
  name: "Memmingen L3 - Independent Zone Demands (Dispatch-Only)"
  run_mode: PF_ONLY
  description: "27-node network with independent per-zone demand profiles"

