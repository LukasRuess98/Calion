# =============================================================================
# PAPER STUDY — Level 1: Copperplate (Dispatch-Only)
# =============================================================================
# Single bus, no spatial structure, no pipe losses.
# All assets co-located. Total aggregated demand.
# Provides cost lower-bound for the controlled comparison.
#
# TOPOLOGY: Single node (no pipes, no losses, no delays)
# ASSETS:   Identical to L3 (all at single node)
# DEMAND:   Sum of all V_1–V_27 (= "waermebedarf_MWth")
# =============================================================================

site:
  input_xlsx: "data/Import_Data_Memmingen_epronet.xlsx"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  name: "Memmingen L1 - Copperplate (Dispatch-Only)"
  description: "Single-node, no network physics, aggregated demand"
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: "2025-01-01 00:00"
    end: "2025-12-31 23:00"

network:
  milp_linearize: true
  physics:
    heat_loss: false          # L1 definition: no losses
    pressure_drop: false
    transport_delay: false

  supply_temp_c: 100
  return_temp_c: 40
  ground_temp_c: 10

  linearization:
    method: "pwl"
    temperature_profile:
      load_fractions: [0.0, 0.3, 0.6, 1.0]
      T_supply_c: [70.0, 80.0, 90.0, 100.0]
      T_return_c: [55.0, 50.0, 45.0, 40.0]

  nodes:
    j_1:
      assets: [chp_main, tes_main, biomass_main, gasboiler_main, hp_main, eboiler_main]
      consumers:
        - column: "waermebedarf_MWth"

  pipes: {}

# --- Assets: IDENTICAL to L3 (copy-paste) ---
assets:
  chp_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 0.20
    thermal_efficiency: 0.80
    el_eff: 0.40
    min_load: 0.3

  gasboiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 13.0
    thermal_efficiency: 0.90
    min_load: 0.1

  biomass_main:
    type: thermal_generator
    fuel: biomass
    capacity_mw: 3.3
    thermal_efficiency: 0.85
    min_load: 0.1

  eboiler_main:
    type: p2h
    capacity_mw: 5.0
    efficiency: 0.95
    min_load: 0.1

  hp_main:
    type: heat_pump
    capacity_mw: 5.0
    min_load: 0.2
    wrg_sources: [WRG1]
    cop_default: 3.0

  tes_main:
    type: storage
    energy_mwh: 500.0
    power_mw: 30.0
    eff_charge: 0.98
    eff_discharge: 0.98
    loss_hour: 0.9999
    soc0_mwh: 500.0
    terminal:
      state: cyclic
      policy: equal

# --- Heat Pump COP Model: IDENTICAL to L3 ---
heat_pumps:
  cop:
    sink_defaults:
      Tsink_out_K: 373.15
      Tsink_in_K: 313.15
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 3.0
  types:
    standard:
      eta: 0.6
      FQ: 0.10

# --- Grid: IDENTICAL to L3 ---
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  gridcost_eur_mwh: 35.0

# --- Fuels: IDENTICAL to L3 ---
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0
  biomass:
    price_eur_mwh: 30.0
    ef_kg_per_mwh_fuel: 20.0

# --- Costs: IDENTICAL to L3 ---
costs:
  co2_price_eur_per_t: 1000.0
  dump_cost_eur_per_mwh_th: 1000.0

# --- Run Settings: IDENTICAL to L3 ---
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    MIPGap: 0.01
    TimeLimit: 3600
    OutputFlag: 1
    LogToConsole: 1
    LogFile: "gurobi_L1.log"

output:
  log_dir: "output/logs"
  export_dir: "output/results"
  export_thermal_network: true
  export_solver_solution: true