# =============================================================================
# PAPER STUDY — Level 1: Aggregated Demand (Dispatch-Only)
# =============================================================================
# RESEARCH FOCUS: Baseline simplified model with single aggregated demand
#
# Level 1 is the most simplified configuration: a single producer-junction node
# with all 27 consumers aggregated into a single demand column. No intermediate
# junctions, no pipes. This is the minimal viable network for dispatch planning.
#
# TOPOLOGY:                                          
#   Single node: plant-junction j_1
#   Total nodes: 1
#   Total pipes: 0 (no distribution network)
#   Demand distribution: All V_1–V_27 demands summed → single column
#
# PHYSICS:
# - Heat loss: Physics-based PWL model (identical to L3)
# - COP method: Analytical LMTD
# - Pressure drop: Disabled (no pipes)
# - Transport delay: Disabled (no pipes)
#
# SYSTEM SUMMARY (Fixed Assets — identical to L3):
#   Peak demand:   76 MW (aggregated from all zones)
#   Annual demand: 517 GWh (approx.)
#   Boiler:        500 MW gas, η = 0.90
#   Storage:       1000 MWh / 50 MW
#   Heat losses:   ~0 GWh/year (no pipes)
#
# COMPARISON BASIS:
# L1 vs L3: Shows impact of network topology on operational dispatch.
# L1 has no transport delay or network losses, so all demand is met
# instantaneously at full capacity. Provides optimal lower-bound on costs.
# =============================================================================

site:
  input_xlsx: "data/Import_Data_Memmingen_epornet.xlsx"
  columns:
    datetime:  "Datum"
    price:     "strompreis_EUR_MWh"
    co2_grid:  "grid_co2_kg_MWh"

scenario:
  name: "Memmingen L1 - Aggregated Demand (Dispatch-Only)"
  description: "Single-node network: aggregated demand, no pipes"
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: "2025-01-01 00:00"
    end: "2025-12-31 23:00"

# ── Network (single node) ────────────────────────────────────────────────────
network:
  milp_linearize: true
  physics:
    heat_loss: true            # No effect (no pipes, no ambient exposure)
    pressure_drop: false       # No pipes
    transport_delay: false     # No pipes

  supply_temp_c: 100
  return_temp_c: 40
  ground_temp_c: 10

  linearization:
    method: "pwl"
    temperature_profile:
      load_fractions: [0.0, 0.3, 0.6, 1.0]
      T_supply_c:     [70.0, 80.0, 90.0, 100.0]
      T_return_c:     [55.0, 50.0, 45.0, 40.0]

  # ══════════════════════════════════════════════════════════════════════════
  # NODES — 1 Producer-Junction with all demands
  # ══════════════════════════════════════════════════════════════════════════
  nodes:
    j_1:
      assets: [chp_main, tes_main, hp_main]
      consumers:
        - column: "waermebedarf_MWth"   # Pre-aggregated in Excel (sum of all V_*)

  # ══════════════════════════════════════════════════════════════════════════
  # PIPES — None (single node, no distribution)
  # ══════════════════════════════════════════════════════════════════════════
  pipes: {}

# ── FIXED ASSETS (Dispatch-Only, IDENTICAL TO L3)
assets:
  chp_main:
    type: chp
    fuel: gas
    capacity_mw: 0.20
    thermal_output_mw: 0.20
    min_load: 0.3
    electrical_efficiency: 0.40
    thermal_efficiency_total: 0.80
  gasboiler_main:
    type: boiler
    fuel: gas
    thermal_output_mw: 13
    min_load: 0.1
    thermal_efficiency_total: 0.90
  Biomass_main:
    type: boiler
    fuel: biomass
    thermal_output_mw: 3.3
    min_load: 0.1
    thermal_efficiency_total: 0.85
  eboiler_main:
    type: boiler
    fuel: electricity
    thermal_output_mw: 5
    min_load: 0.1
    thermal_efficiency_total: 0.95
    electrical_efficiency: 0.40
    thermal_efficiency_total: 0.80
  hp_main:
    type: heat_pump
    capacity_mw: 5.0
    min_load: 0.2
    wrg_sources: [WRG1]    # needs WRG1_T °C + WRG1_Q MW columns in Excel
    cop_default: 3.0
  tes_main:
    type: storage
    energy_capacity_mwh: 500.0
    power_capacity_mw: 30.0
    charge_efficiency: 0.98
    discharge_efficiency: 0.98
    min_load_mw: 0.0
    round_trip_efficiency: 0.90
    soc_min: 0.0
    soc_max: 1.0
    soc0_mwh: 500.0
    terminal:
      state: cyclic
      policy: equal

# ── HEAT PUMP COP MODEL
heat_pumps:
  cop:
    sink_defaults:
      Tsink_out_K: 373.15    # 100°C supply temperature (= network supply_temp_c)
      Tsink_in_K: 313.15     # 40°C return temperature (= network return_temp_c)
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 3.0
  types:
    standard:
      eta: 0.6               # Lorenz-Gütegrad (= carnot_efficiency)
      FQ: 0.10

# ── GRID SETTINGS
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  gridcost_eur_mwh: 35.0

# ── FUELS
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0

# ── COSTS
costs:
  co2_price_eur_per_t: 1000.0
  dump_cost_eur_per_mwh_th: 1000.0

# ── RUN SETTINGS
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    MIPGap: 0.01
    TimeLimit: 3600
    OutputFlag: 1
    LogToConsole: 1
    LogFile: "gurobi_L1.log"

# ── OUTPUT SETTINGS
output:
  log_dir: "output/logs"
  export_dir: "output/results"
  export_thermal_network: true
  export_solver_solution: true

# ── NOTES
# L1 BASELINE MODEL:
# - Single aggregated demand column (no per-zone breakdown)
# - No network topology (no pipes, no transport delays, no network losses)
# - Represents optimal dispatch cost lower-bound
# - Expected solve time: ~1–2 minutes (simple MILP, no bilinear terms)
# - Use as baseline: compare L1 vs L2 vs L3 operational costs
