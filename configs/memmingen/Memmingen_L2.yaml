# =============================================================================
# MEMMINGEN — Level 2: Simplified 5-Zone Network (Dispatch-Only)
# =============================================================================
# RESEARCH FOCUS: Network Topology Abstraction Impact on Operational Dispatch
#
# Level 2 = simplified multi-zone network. Aggregates 27 zones (L3) into 5
# demand clusters following the branch topology of the real network.
# Same physics-based PWL loss model as L3, but coarser spatial resolution.
#
# TOPOLOGY:
#   E_1 (plant) → 5 aggregated demand zones (star topology)
#   Total nodes: 6 (1 plant + 5 zones)
#   Total pipes: 5
#
# ZONE GROUPING (from L3 junction tree):
#   zone_A  — V_1, V_2          (direct from E_1)               7.4% demand
#   zone_B  — V_3–V_7           (j_1 → V_3, j_1 → j_2)        18.5% demand
#   zone_C  — V_8–V_14          (j_2 → j_3 → j_4 subtree)     25.9% demand
#   zone_D  — V_15–V_21         (j_1 → j_5 → j_6 subtree)     25.9% demand
#   zone_E  — V_22–V_27         (j_6 → j_7 subtree)            22.2% demand
#
# PIPE LENGTHS (demand-weighted avg path E_1 → zone centroid, from L3 topology):
#   zone_A:  700 m   (V_1: 800m, V_2: 600m)
#   zone_B: 2000 m   (V_3: 1850m … V_7: 2070m)
#   zone_C: 2500 m   (V_8: 2340m … V_14: 2710m)
#   zone_D: 2250 m   (V_15: 1990m … V_21: 2550m)
#   zone_E: 2750 m   (V_22: 2715m … V_27: 2735m)
#   Total:  ~10,200 m (vs 9,290 m in L3 — slight overestimate due to star simplification)
#
# PHYSICS (IDENTICAL TO L3):
#   Heat loss:   Physics-based PWL model
#   COP method:  N/A (no heat pump in Memmingen assets)
#   Linearization: PWL temperature profile (same breakpoints as L3)
#
# SYSTEM SUMMARY (Fixed Assets — identical to L1 & L3):
#   Peak demand:   2700 MWth
#   Boiler:        uncapped gas boiler
#   Storage:       1000 MWh / 50 MW
#   Heat losses:   ~proportional to L3 (same U-value, similar total length)
#
# DATA:
#   Source: data/2025_04_14_Import_Data_Memmingen_aggregated.csv
#   Demand: zone_A_demand_MWth … zone_E_demand_MWth
#   Generate with: python scripts/preprocess_memmingen_aggregated.py
# =============================================================================

site:
  input_xlsx: "data/2025_04_14_Import_Data_Memmingen_aggregated.csv"
  columns:
    datetime:  "Date"
    price:     "strompreis_EUR_MWh"
    co2_grid:  "grid_co2_kg_MWh"

scenario:
  name: "Memmingen L2 - Simplified 5-Zone Network (Dispatch-Only)"
  description: "5-zone aggregated network — same PWL physics as L3, coarser spatial resolution"
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: "2025-01-01"
    end: "2025-01-31 23:00"

# ── Network (5-zone star, physics-based losses) ───────────────────────────────
network:
  milp_linearize: true
  physics:
    heat_loss: true
    pressure_drop: false
    transport_delay: false

  supply_temp_c: 100
  return_temp_c: 40
  ground_temp_c: 10

  linearization:
    method: "pwl"
    temperature_profile:
      load_fractions: [0.0, 0.3, 0.6, 1.0]
      T_supply_c:     [70.0, 80.0, 90.0, 100.0]
      T_return_c:     [55.0, 50.0, 45.0, 40.0]

  nodes:
    # ── Production ───────────────────────────────────────────────────────────
    E_1:
      assets: [boiler_main, tes_main]

    # ── Aggregated demand zones ───────────────────────────────────────────────
    zone_A:
      consumers:
        - column: "zone_A_demand_MWth"   # V_1, V_2 — direct from E_1

    zone_B:
      consumers:
        - column: "zone_B_demand_MWth"   # V_3–V_7 — via j_1, j_2

    zone_C:
      consumers:
        - column: "zone_C_demand_MWth"   # V_8–V_14 — via j_2, j_3, j_4

    zone_D:
      consumers:
        - column: "zone_D_demand_MWth"   # V_15–V_21 — via j_1, j_5, j_6

    zone_E:
      consumers:
        - column: "zone_E_demand_MWth"   # V_22–V_27 — via j_6, j_7

  # ── Pipe Network ─────────────────────────────────────────────────────────────
  # Lengths = demand-weighted avg path E_1 → zone centroid (from L3 topology).
  # Diameters = 1000 mm (consistent with L3 trunk pipes).
  pipes:
    E1_to_zone_A:
      from: E_1
      to: zone_A
      length_m: 700
      diameter_mm: 1000

    E1_to_zone_B:
      from: E_1
      to: zone_B
      length_m: 2000
      diameter_mm: 1000

    E1_to_zone_C:
      from: E_1
      to: zone_C
      length_m: 2500
      diameter_mm: 1000

    E1_to_zone_D:
      from: E_1
      to: zone_D
      length_m: 2250
      diameter_mm: 1000

    E1_to_zone_E:
      from: E_1
      to: zone_E
      length_m: 2750
      diameter_mm: 1000

# ── FIXED ASSETS (Dispatch-Only, identical to L1 & L3) ───────────────────────
assets:
  boiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 2000000000000.0
    min_load: 0
    thermal_efficiency: 0.90
  tes_main:
    type: storage
    energy_capacity_mwh: 1000.0
    power_capacity_mw: 50.0
    charge_efficiency: 0.95
    discharge_efficiency: 0.95
    min_load_mw: 0.0
    round_trip_efficiency: 0.90
    soc_min: 0.0
    soc_max: 1.0
    soc0_mwh: 500.0
    terminal:
      state: cyclic
      policy: equal

# ── GRID SETTINGS ─────────────────────────────────────────────────────────────
grid:
  max_import_mw: 2000.0
  max_export_mw: 2000.0
  gridcost_eur_mwh: 35.0

# ── FUELS ─────────────────────────────────────────────────────────────────────
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0

# ── COSTS ─────────────────────────────────────────────────────────────────────
costs:
  co2_price_eur_per_t: 1000.0
  dump_cost_eur_per_mwh_th: 10.0

# ── RUN SETTINGS ──────────────────────────────────────────────────────────────
run:
  dt_h: 1.0
  solver: highs
  mip_gap: 0.01
  time_limit_s: 3600
  load_solutions: false
  log_to_file: true
  verbose_logging: true
  solver_options:
    OutputFlag: 1
    LogToConsole: 1

# ── OUTPUT SETTINGS ───────────────────────────────────────────────────────────
output:
  log_dir: "output/logs"
  export_dir: "output/results"
  export_thermal_network: true
  export_solver_solution: true

# ── NOTES ─────────────────────────────────────────────────────────────────────
# 1. AGGREGATION: 27 L3 zones → 5 L2 zones by branch topology. Demand summed
#    per group; pipe lengths are demand-weighted average path distances.
#
# 2. STAR SIMPLIFICATION: L2 uses a star topology (all zones directly from E_1)
#    instead of the tree topology in L3. Equivalent total pipe length captured
#    by using representative path distances per zone.
#
# 3. IDENTICAL PHYSICS: Same PWL heat loss model (u_value 0.28/0.30 W/(m·K)),
#    same temperature profile breakpoints as L3. Expected loss ~90-110% of L3.
#
# 4. COMPARISON: L1 < L2 ≈ L3 in total cost. Delta L1→L2 = cost of losses.
#    Delta L2→L3 = cost of spatial resolution (dispatch pattern differences).
#
# 5. HORIZON: Jan 2025 (744 h). Extend start/end for full-year runs.
