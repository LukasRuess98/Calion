site:
  input_xlsx: "data/Import_Data_Memmingen_epronet_cleaned.xlsx"  # 2026-07-07: quality-flag cleaned, see memory project_memmingen_dxf_crosscheck
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  name: "Memmingen L3 - NLP Fix-and-Relax (from L3plus)"
  description: "15-node, bilinear physics, binaries fixed from L3plus MILP"
  run_mode: PF_ONLY
  milp_linearize: false
  horizon:
    start: "2025-01-01 00:00"
    end: "2025-12-31 23:00"

network:
  milp_linearize: false
  physics:
    heat_loss: true
    pressure_drop: true
    transport_delay: true

  supply_temp_c: 86.0
  return_temp_c: 63.6
  ground_temp_c: 10

  temperature_frame:
    default_return_band_c: 4.0
    seasons:
      winter:
        months: [1, 2, 12]
        supply_c: 88.6
        return_c: 61.0
        return_band_c: 3.0
      spring:
        months: [3, 4, 5]
        supply_c: 87.6
        return_c: 64.1
        return_band_c: 3.0
      summer:
        months: [6, 7, 8]
        supply_c: 83.4
        return_c: 68.6
        return_band_c: 2.5
      autumn:
        months: [9, 10, 11]
        supply_c: 84.2
        return_c: 61.1
        return_band_c: 3.0

  # Variable delivery temperature via outdoor-temperature Heizkurve.
  # In MILP-linearized mode this initialises T_supply_in Params per timestep.
  heating_curve:
    enabled: true
    T_supply_max_c: 90.0    # supply temp at coldest design day (ca. -15Â°C)
    T_supply_min_c: 65.0    # supply temp at heating cutoff (ca. +15Â°C)
    T_outdoor_low_c: -15.0
    T_outdoor_high_c: 15.0

  max_velocity_m_s: 2.5
  pump_efficiency: 0.75
  pipe_roughness_mm: 0.5
  max_pressure_drop_bar: 2.0
  delta_p_min_consumer_bar: 0.7

  nodes:
    j_1:
      return_temp_range: [50.0, 70.0]
      return_temp_load_factor: 0.20
      return_temp_band_c: 3.0
      assets: [chp_main, tes_main, biomass_main, gasboiler_main, hp_main, eboiler_main]
      consumers:
        - column: "V_1_demand_MWth"
    j_2:
      return_temp_range: [50.0, 70.0]
      return_temp_load_factor: 0.20
      return_temp_band_c: 3.0
      consumers:
        - column: "V_2_demand_MWth"
    j_3:
      return_temp_range: [50.0, 70.0]
      return_temp_load_factor: 0.20
      return_temp_band_c: 3.0
      consumers:
        - column: "V_3_demand_MWth"
    j_4:
      return_temp_range: [50.0, 70.0]
      return_temp_load_factor: 0.20
      return_temp_band_c: 3.0
      consumers:
        - column: "V_4_demand_MWth"
        - column: "V_5_demand_MWth"
        - column: "V_6_demand_MWth"
        - column: "V_7_demand_MWth"
    j_5:
      return_temp_range: [50.0, 70.0]
      return_temp_load_factor: 0.20
      return_temp_band_c: 3.0
      consumers:
        - column: "V_8_demand_MWth"
        - column: "V_9_demand_MWth"
    j_6:
      return_temp_range: [50.0, 70.0]
      return_temp_load_factor: 0.20
      return_temp_band_c: 3.0
      consumers:
        - column: "V_10_demand_MWth"
        - column: "V_11_demand_MWth"
        - column: "V_12_demand_MWth"
    j_7:
      return_temp_range: [50.0, 70.0]
      return_temp_load_factor: 0.20
      return_temp_band_c: 3.0
      consumers:
        - column: "V_13_demand_MWth"
    j_8:
      return_temp_range: [50.0, 70.0]
      return_temp_load_factor: 0.20
      return_temp_band_c: 3.0
      consumers:
        - column: "V_14_demand_MWth"
    j_9:
      return_temp_range: [50.0, 70.0]
      return_temp_load_factor: 0.20
      return_temp_band_c: 3.0
      consumers:
        - column: "V_15_demand_MWth"
        - column: "V_16_demand_MWth"
    j_10:
      return_temp_range: [50.0, 70.0]
      return_temp_load_factor: 0.20
      return_temp_band_c: 3.0
      consumers:
        - column: "V_17_demand_MWth"
    j_11:
      return_temp_range: [50.0, 70.0]
      return_temp_load_factor: 0.20
      return_temp_band_c: 3.0
      consumers:
        - column: "V_18_demand_MWth"
    j_12:
      return_temp_range: [50.0, 70.0]
      return_temp_load_factor: 0.20
      return_temp_band_c: 3.0
      #assets: [hp_main, eboiler_main]
      consumers:
        - column: "V_19_demand_MWth"
        - column: "V_20_demand_MWth"
        - column: "V_21_demand_MWth"
    j_13:
      return_temp_range: [50.0, 70.0]
      return_temp_load_factor: 0.20
      return_temp_band_c: 3.0
      consumers:
        - column: "V_22_demand_MWth"
        - column: "V_23_demand_MWth"
        - column: "V_24_demand_MWth"
    j_14:
      return_temp_range: [50.0, 70.0]
      return_temp_load_factor: 0.20
      return_temp_band_c: 3.0
      consumers:
        - column: "V_25_demand_MWth"
        - column: "V_26_demand_MWth"
    j_15:
      return_temp_range: [50.0, 70.0]
      return_temp_load_factor: 0.20
      return_temp_band_c: 3.0
      consumers:
        - column: "V_27_demand_MWth"

  # Längen/Durchmesser 2026-07-07 aus DXF-Bestandsplan rekalibriert (siehe L3_MILP.yaml Kommentar).
  # KAPAZITAETS-CHECK (2026-07-07, pressure_drop:true + max_velocity_m_s:2.5 sind hier aktiv):
  # stündliche Prüfung aller 14 Rohre über das komplette Jahr gegen die neuen Durchmesser
  # (v=2.5m/s, saisonales dT_min aus temperature_frame) zeigte mit den Rohdaten vereinzelte
  # Kapazitätsüberschreitungen (j1_to_j2: 6h, j2_to_j3: 14h, j3_to_j9: 2h, j5_to_j6: 1h,
  # j13_to_j14: 6h von 43.288h) -- diese fallen aber exakt auf die Stunden der bekannten
  # Lastgang-Ausreisser V_6/V_8/V_12/V_26 (Peak/Mittel-Verhältnis 85-211x, siehe Memory
  # project_memmingen_dxf_crosscheck). Mit diesen 4 Spalten auf 3x ihren p99 gekappt: 0 von
  # 43.288 Stunden Kapazitätsüberschreitung auf ALLEN 14 Rohren. D.h. die Kapazität ist mit
  # den neuen Durchmessern ausreichend; ein evtl. Infeasibility-Fall beim Testlauf mit den
  # Rohdaten würde auf die Datenqualität dieser 4 Spalten zurückgehen, nicht auf diameter_mm.
  pipes:
    j1_to_j2:
      from: j_1
      to: j_2
      length_m: 1180
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j2_to_j3:
      from: j_2
      to: j_3
      length_m: 513
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j3_to_j4:
      from: j_3
      to: j_4
      length_m: 116
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j3_to_j9:
      from: j_3
      to: j_9
      length_m: 83
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j4_to_j5:
      from: j_4
      to: j_5
      length_m: 728
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j5_to_j6:
      from: j_5
      to: j_6
      length_m: 159
      diameter_mm: 200
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.3
    j5_to_j7:
      from: j_5
      to: j_7
      length_m: 50
      diameter_mm: 65
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.3
    j7_to_j8:
      from: j_7
      to: j_8
      length_m: 120
      diameter_mm: 65
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.3
    j9_to_j10:
      from: j_9
      to: j_10
      length_m: 464
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j10_to_j11:
      from: j_10
      to: j_11
      length_m: 230
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j11_to_j12:
      from: j_11
      to: j_12
      length_m: 250
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j12_to_j13:
      from: j_12
      to: j_13
      length_m: 220
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j13_to_j14:
      from: j_13
      to: j_14
      length_m: 180
      diameter_mm: 125
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.3
    # u-values calibrated from V_27 measurements (validation: 4.68x nominal)
    j13_to_j15:
      from: j_13
      to: j_15
      length_m: 125
      diameter_mm: 100
      u_value_supply_w_per_m_k: 1.31
      u_value_return_w_per_m_k: 1.4

assets:
  chp_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 0.20
    thermal_efficiency: 0.80
    el_eff: 0.40
    min_load: 0.3

  gasboiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 13.0
    thermal_efficiency: 0.90
    min_load: 0.0

  biomass_main:
    type: thermal_generator
    fuel: biomass
    capacity_mw: 3.3
    thermal_efficiency: 0.85
    min_load: 0.1

  eboiler_main:
    type: p2h
    capacity_mw: 5.0
    efficiency: 0.95
    min_load: 0.1

  hp_main:
    type: heat_pump
    capacity_mw: 5.0
    min_load: 0.2
    wrg_source_column: "WRG_1 Â°C"
    wrg_capacity_column: "WRG1Q MW"
    cop_default: 3.0

  tes_main:
    type: storage
    energy_mwh: 500.0
    power_mw: 30.0
    eff_charge: 0.98
    eff_discharge: 0.98
    loss_hour: 0.9999
    soc0_mwh: 250.0           # 50% start â€” realistic mid-year level
    min_energy_mwh: 25.0      # 5% SOC floor
    cycling_cost_eur_per_mwh: 2.0
    terminal:
      state: cyclic
      policy: equal

heat_pumps:
  cop:
    sink_defaults:
      Tsink_out_K: 358.15
      Tsink_in_K: 328.15
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 3.0
  types:
    standard:
      eta: 0.6
      FQ: 0.10

grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  gridcost_eur_mwh: 25.0

fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0
  biomass:
    price_eur_mwh: 40.0
    ef_kg_per_mwh_fuel: 20.0

costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 1000.0

