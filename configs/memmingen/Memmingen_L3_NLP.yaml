# RUN SETTINGS: Fix-and-Relax
# â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
run:
  dt_h: 1.0
  solver: gurobi
  warmstart_from: "output/paper_runs/L3plus"
  solver_options:
    NonConvex: 2
    MIPGap: 0.005
    TimeLimit: 28800
    MIPFocus: 1
    Heuristics: 0.8
    NumericFocus: 2
    OutputFlag: 1
    LogToConsole: 1
    LogFile: "gurobi_L3_NLP.log"

output:
  log_dir: "output/logs"
  export_dir: "output/results"
  export_thermal_network: true
  export_solver_solution: true


