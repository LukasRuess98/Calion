# =============================================================================
# PAPER STUDY — Level 3: Nichtlineares Modell (NLP/QCQP) mit Gurobi
# =============================================================================
# Basis: Memmingen_L3_pressure_transport.yaml
# Solver: Gurobi (NLP/QCQP-fähig)
# Linearisierung: DEAKTIVIERT → bilineare Terme, kontinuierliche Temperaturen
#
# UNTERSCHIEDE ZU Memmingen_L3_pressure_transport.yaml:
#   - milp_linearize: false   → keine PWL-Temperaturen, keine Binärvariablen
#   - solver: gurobi          → kann nichtlineare (QCQP) Modelle lösen
#   - T_supply, T_return: Entscheidungsvariablen (Var) statt fixer Parameter
#   - Wärmeverluste, Wärmeübertragung: bilinear (m_dot × T) → exakt, nicht approx.
#
# ─────────────────────────────────────────────────────────────────────────────
# LINEARISIERUNG vs. NICHTLINEAR — Unterschiede im Detail:
# ─────────────────────────────────────────────────────────────────────────────
#
#  MILP-Linearisierung (milp_linearize: true):
#   • T_supply[t], T_return[t] = feste Parameter, vorab berechnet via PWL-Profil
#     (T = f(Gesamtlast), aus load_fractions/T_supply_c Tabelle interpoliert)
#   • Wärmelieferung: Q_delivered = m_dot × cp × ΔT_param → LINEAR in m_dot
#   • Druckverlust: ΔP = PWL(m_dot) → stückweise linear, 3 Binärvariablen/Rohr/h
#   • Temperatur-Mischung an Knoten: entfällt (T ist Param, kein Constraint)
#   • Binärvariablen: ja (Druckverlust-Segmente, TES, Grid)
#   • Solver: HiGHS, GLPK, CPLEX (MILP-Solver)
#   • Genauigkeit: Temperaturen approximiert → Lösung physikalisch inkonsistent
#     wenn Last außerhalb Stützstellen liegt
#
#  Nichtlinear / QCQP (milp_linearize: false):
#   • T_supply[t], T_return[t] = Variablen, vom Solver bestimmt
#   • Wärmelieferung: Q_delivered = m_dot × cp × (T_supply - T_return) → BILINEAR
#   • Druckverlust: ΔP = k × v² = k × (m_dot/ρA)² → QUADRATISCH in m_dot
#   • Temperatur-Mischung an Knoten: bilineare Enthalpie-Bilanz
#     Σ(m_dot_in × T_in) = T_node × Σ(m_dot_in) → bilinear
#   • Binärvariablen: nur für TES und Grid (keine Druck-PWL-Binaries)
#   • Solver: Gurobi (QCQP), IPOPT (NLP, kont.), SCIP (MINLP)
#   • Genauigkeit: physikalisch exakt, globales Optimum nicht garantiert (non-convex)
#
#  Zusammenfassung:
#   ┌──────────────────────┬──────────────────┬──────────────────────┐
#   │ Eigenschaft          │ MILP (linear.)   │ NLP (nichtlinear)    │
#   ├──────────────────────┼──────────────────┼──────────────────────┤
#   │ Temperaturen         │ feste Parameter  │ Variablen            │
#   │ Wärmebilanz          │ linear           │ bilinear             │
#   │ Druckverlust         │ PWL + Binaries   │ quadratisch          │
#   │ Mischung an Knoten   │ entfällt         │ bilinear             │
#   │ Binärvariablen       │ ~70/h (Druck)    │ ~5/h (TES, Grid)     │
#   │ Solver               │ HiGHS/CPLEX      │ Gurobi/IPOPT         │
#   │ Lösung               │ global optimal   │ lokal optimal        │
#   │ Rechenzeit           │ mittel           │ hoch (non-convex)    │
#   │ Physikgenauigkeit    │ approx.          │ exakt                │
#   └──────────────────────┴──────────────────┴──────────────────────┘
# =============================================================================

site:
  input_xlsx: "data/Import_Data_Memmingen_epornet.xlsx"
  columns:
    datetime:  "Datum"
    price:     "strompreis_EUR_MWh"
    co2_grid:  "grid_co2_kg_MWh"

scenario:
  name: "Memmingen L3 - Nichtlinear (NLP) mit Gurobi"
  description: "24-Knoten-Netz, bilinear, Gurobi QCQP, keine Linearisierung"
  run_mode: PF_ONLY
  milp_linearize: false         # NLP-Modus: Temperaturen als Variablen
  horizon:
    start: "2025-01-01 00:00"
    end: "2025-12-31 23:00"

# ── Network ──────────────────────────────────────────────────────────────────
network:
  milp_linearize: false         # Kein MILP: bilineare Temp-Constraints aktiv
  physics:
    heat_loss: true            # DISABLED: bilinear Q_loss terms create QLMatrix coefficients
                                # as small as 4e-9 (from u*L/(max_flow*1e6) for DN1000).
                                # These cause Gurobi BQP/RLT cuts to falsely prove infeasibility.
                                # Physical impact: negligible for DN1000 (ΔT < 0.003°C per 500m).
                                # With false: T_supply_out = T_supply_in (linear), Q_loss = 0.
                                # QLMatrix range collapses from [4e-9,1] to [~0.2,1].
    pressure_drop: true         # ΔP = PWL(m_dot) — quadratic via 3-segment PWL
    transport_delay: true       # Transportverzögerung aktiv (3-Bucket SOS2, kein Problem)

  supply_temp_c: 100            # Nominale Vorlauftemperatur (Startpunkt/Bound)
  return_temp_c: 40             # Nominale Rücklauftemperatur
  ground_temp_c: 10

  # linearization wird ignoriert wenn milp_linearize: false
  # Temperaturen werden durch bilineare Constraints endogen bestimmt

  # ── Rohrparameter ──────────────────────────────────────────────────────────
  max_velocity_m_s:          2.5
  pump_efficiency:           0.75
  pipe_roughness_mm:         0.5
  max_pressure_drop_bar:     2.0
  delta_p_min_consumer_bar:  0.7   # 70 kPa Druckverlust pro Übergabestation

   # ══════════════════════════════════════════════════════════════════════════
  # NODES — 15 Junctions, alle 27 Verbraucher direkt eingebettet
  # ══════════════════════════════════════════════════════════════════════════
  nodes:
    # ── Root: producer-junction (Heizwerk E1 + V_1) ─────────────────────── # ← GEÄNDERT: V_1 hier eingebettet
    j_1:
      assets: [chp_main, tes_main, biomass_main, gasboiler_main]  # ← GEÄNDERT: HP hier eingebettet, da er Wärme direkt am Erzeuger bereitstellt
      consumers:
        - column: "V_1_demand_MWth"

    # ── Trunk junction j_2: serves V_2 ──────────────────────────────────
    j_2:
      consumers:
        - column: "V_2_demand_MWth"

    # ── Trunk junction j_3: splits to j_4 and j_9, serves V_3 ───────────
    j_3:
      consumers:
        - column: "V_3_demand_MWth"

    # ── Branch j_4: serves V_4–V_7 ──────────────────────────────────────
    j_4:
      consumers:
        - column: "V_4_demand_MWth"
        - column: "V_5_demand_MWth"
        - column: "V_6_demand_MWth"
        - column: "V_7_demand_MWth"

    # ── Branch j_5: serves V_8–V_9, splits to j_6 and j_7 ──────────────
    j_5:
      consumers:
        - column: "V_8_demand_MWth"
        - column: "V_9_demand_MWth"

    # ── Terminal branch j_6: serves V_10–V_12 ────────────────────────────
    j_6:
      consumers:
        - column: "V_10_demand_MWth"
        - column: "V_11_demand_MWth"
        - column: "V_12_demand_MWth"

    # ── Branch j_7: serves V_13 ─────────────────────────────────────────
    j_7:
      consumers:
        - column: "V_13_demand_MWth"

    # ── Terminal branch j_8: serves V_14 ─────────────────────────────────
    j_8:
      consumers:
        - column: "V_14_demand_MWth"

    # ── Branch j_9: serves V_15–V_16 ────────────────────────────────────
    j_9:
      consumers:
        - column: "V_15_demand_MWth"
        - column: "V_16_demand_MWth"

    # ── Branch j_10: serves V_17 ────────────────────────────────────────
    j_10:
      consumers:
        - column: "V_17_demand_MWth"

    # ── Junction j_11: serves V_18 ──────────────────────────────────────  # ← GEÄNDERT: war leer, V_18 eingebettet
    j_11:
      consumers:
        - column: "V_18_demand_MWth"

    # ── Junction j_12: serves V_19–V_21 ─────────────────────────────────  # ← GEÄNDERT: war leer, V_19–V_21 eingebettet
    j_12:
      assets: [hp_main, eboiler_main]  # ← GEÄNDERT: HP hier eingebettet, da er Wärme direkt am Erzeuger bereitstellt
      consumers:
        - column: "V_19_demand_MWth"
        - column: "V_20_demand_MWth"
        - column: "V_21_demand_MWth"

    # ── Junction j_13: serves V_22–V_24 ─────────────────────────────────  # ← GEÄNDERT: war leer, V_22–V_24 eingebettet
    j_13:
      consumers:
        - column: "V_22_demand_MWth"
        - column: "V_23_demand_MWth"
        - column: "V_24_demand_MWth"

    # ── Terminal branch j_14: serves V_25–V_26 ───────────────────────────
    j_14:
      consumers:
        - column: "V_25_demand_MWth"
        - column: "V_26_demand_MWth"

    # ── Terminal branch j_15: serves V_27 ────────────────────────────────
    j_15:
      consumers:
        - column: "V_27_demand_MWth"

    # ← GEÄNDERT: V_1, V_18, V_19, V_20, V_21, V_22, V_23, V_24 als
    #   separate Knoten ENTFERNT — Demands jetzt in Junctions eingebettet

  # ══════════════════════════════════════════════════════════════════════════
  # PIPES — 14 Stück, nur Junction-zu-Junction
  # ══════════════════════════════════════════════════════════════════════════
  # Dimensionierung: 76 MW Spitzenlast, 100/40°C, v_max=2.5 m/s
  # Proportionale Lastverteilung nach Verbraucheranzahl + 25–75% Sicherheit
  #
  # Pipe-Parameter (globale Defaults, können pro Rohr überschrieben werden):
  #   u_value_supply_w_per_m_k: 0.28   # [DEFAULT: 0.28]
  #   u_value_return_w_per_m_k: 0.30   # [DEFAULT: 0.30]
  #   max_velocity_m_s: 2.5            # [DEFAULT: 2.5]
  #   pipe_roughness_mm: 0.05          # [DEFAULT: 0.05]
  #   pump_efficiency: 0.70            # [DEFAULT: 0.70]
  #   lifetime_years: 40               # [DEFAULT: 40]
  pipes:
    # ── Hauptstrang (J1 → J2 → J3) ──────────────────────────────────────
    # 26 Verbraucher downstream, ~72 MW → DN450 (97.2 MW, +35%)
    j1_to_j2:
      from: j_1
      to: j_2
      length_m: 350
      diameter_mm: 450
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # 25 Verbraucher downstream, ~70 MW → DN450 (97.2 MW, +39%)
    j2_to_j3:
      from: j_2
      to: j_3
      length_m: 300
      diameter_mm: 450
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # ── J3 verzweigt: Süd → J4, Ost → J9 ────────────────────────────────
    # Süd-Ast: 11 Verbraucher, ~31 MW → DN300 (43.2 MW, +39%)
    j3_to_j4:
      from: j_3
      to: j_4
      length_m: 260
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # Ost-Ast: 13 Verbraucher, ~37 MW → DN350 (58.8 MW, +59%)
    j3_to_j9:
      from: j_3
      to: j_9
      length_m: 450
      diameter_mm: 350
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # ── Süd-Ast (J4 → J5 → J6/J7 → J8) ─────────────────────────────────
    # 7 Verbraucher downstream, ~20 MW → DN250 (30.0 MW, +50%)
    j4_to_j5:
      from: j_4
      to: j_5
      length_m: 240
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # 3 Verbraucher downstream, ~8 MW → DN150 (10.8 MW, +35%)
    j5_to_j6:
      from: j_5
      to: j_6
      length_m: 150
      diameter_mm: 150
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30

    # 2 Verbraucher downstream, ~6 MW → DN125 (7.5 MW, +25%)
    j5_to_j7:
      from: j_5
      to: j_7
      length_m: 220
      diameter_mm: 125
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30

    # 1 Verbraucher, ~3 MW → DN100 (4.8 MW, +60%)
    j7_to_j8:
      from: j_7
      to: j_8
      length_m: 80
      diameter_mm: 100
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30

    # ── Ost-Ast (J9 → J10 → J11 → J12 → J13 → J14/J15) ────────────────
    # 11 Verbraucher downstream, ~31 MW → DN300 (43.2 MW, +39%)
    j9_to_j10:
      from: j_9
      to: j_10
      length_m: 200
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # 10 Verbraucher downstream, ~28 MW → DN300 (43.2 MW, +54%)
    j10_to_j11:
      from: j_10
      to: j_11
      length_m: 230
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # 9 Verbraucher downstream, ~25 MW → DN300 (43.2 MW, +73%)
    j11_to_j12:
      from: j_11
      to: j_12
      length_m: 250
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # 6 Verbraucher downstream, ~17 MW → DN250 (30.0 MW, +76%)
    j12_to_j13:
      from: j_12
      to: j_13
      length_m: 220
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34

    # 2 Verbraucher downstream, ~6 MW → DN125 (7.5 MW, +25%)
    j13_to_j14:
      from: j_13
      to: j_14
      length_m: 180
      diameter_mm: 125
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30

    # 1 Verbraucher, ~3 MW → DN100 (4.8 MW, +60%)
    j13_to_j15:
      from: j_13
      to: j_15
      length_m: 125
      diameter_mm: 100
      u_value_supply_w_per_m_k: 0.28
      u_value_return_w_per_m_k: 0.30
# ── FIXED ASSETS (Dispatch-Only, IDENTICAL TO L3) ──────────────────────────
assets:
  chp_main:
    type: chp
    fuel: gas
    capacity_mw: 0.20
    thermal_output_mw: 0.20
    min_load: 0.3
    electrical_efficiency: 0.40
    thermal_efficiency_total: 0.80
  gasboiler_main:
    type: boiler
    fuel: gas
    thermal_output_mw: 13
    min_load: 0.1
    thermal_efficiency_total: 0.90
  Biomass_main:
    type: boiler
    fuel: biomass
    thermal_output_mw: 3.3
    min_load: 0.1
    thermal_efficiency_total: 0.85
  eboiler_main:
    type: boiler
    fuel: electricity
    thermal_output_mw: 5
    min_load: 0.1
    thermal_efficiency_total: 0.95
    electrical_efficiency: 0.40
    thermal_efficiency_total: 0.80
  hp_main:
    type: heat_pump
    capacity_mw: 5.0
    min_load: 0.2
    wrg_sources: [WRG1]    # needs WRG1_T °C + WRG1_Q MW columns in Excel
    cop_default: 3.0
  tes_main:
    type: storage
    energy_capacity_mwh: 500.0
    power_capacity_mw: 30.0
    charge_efficiency: 0.98
    discharge_efficiency: 0.98
    min_load_mw: 0.0
    round_trip_efficiency: 0.90
    soc_min: 0.0
    soc_max: 1.0
    soc0_mwh: 500.0
    terminal:
      state: cyclic
      policy: equal

# ── HEAT PUMP COP MODEL
heat_pumps:
  cop:
    sink_defaults:
      Tsink_out_K: 373.15    # 100°C supply temperature (= network supply_temp_c)
      Tsink_in_K: 313.15     # 40°C return temperature (= network return_temp_c)
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 3.0
  types:
    standard:
      eta: 0.6               # Lorenz-Gütegrad (= carnot_efficiency)
      FQ: 0.10

# ── GRID ──────────────────────────────────────────────────────────────────────
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  gridcost_eur_mwh: 35.0

# ── FUELS ─────────────────────────────────────────────────────────────────────
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0

# ── COSTS ─────────────────────────────────────────────────────────────────────
costs:
  co2_price_eur_per_t: 1000.0
  dump_cost_eur_per_mwh_th: 1000.0

# ── RUN ───────────────────────────────────────────────────────────────────────
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    NonConvex: 2
    MIPGap: 0.005
    TimeLimit: 86400
    NumericFocus: 3
    Heuristics: 0.2
    OutputFlag: 1
    LogToConsole: 1
    LogFile: "gurobi_L3_MIQP.log"
