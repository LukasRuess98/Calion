# =============================================================================
# PAPER STUDY — Level 3: Independent Zone Demands + Druckverlustmodell
# =============================================================================
# Identisch zu Memmingen_L3.yaml, aber mit aktiviertem Druckverlust (PWL MILP).
#
# UNTERSCHIEDE ZU Memmingen_L3.yaml:
#   - pressure_drop: true   → Darcy-Weisbach PWL-Druckverlust je Rohr
#   - Rohrparameter angepasst: max_velocity, pump_efficiency, pipe_roughness
#   - Hinweis: ~69 Binärvariablen/Zeitschritt zusätzlich (3 je Rohr × 23 Rohre)
#             → Lösung dauert länger als L3 ohne Druck
#
# PHYSIKALISCHES MODELL (Druckverlust):
#   ΔP = f × (L/D) × (ρ/2) × v²   [Darcy-Weisbach]
#   Linearisiert als PWL mit 3 Segmenten in m_dot (MILP-kompatibel)
#   Pumpenergie je Rohr: P_pump = ΔP_total × m_dot / (ρ × η)
#
# DRUCKPARAMETER (Defaults, können je Rohr überschrieben werden):
#   max_velocity_m_s:   2.5    — max. Strömungsgeschwindigkeit im Rohr
#   pump_efficiency:    0.70   — hydraulischer Wirkungsgrad der Pumpe
#   pipe_roughness_mm:  0.05   — Rauigkeit Rohrinnenwand (Stahl)
#   max_pressure_drop_bar: 2.0 — obere Schranke ΔP je Rohr (Var-Bound)
# =============================================================================

site:
  input_xlsx: "data/2025_04_14_Import_Data_Memmingen.xlsx"
  columns:
    datetime:  "Datum"
    price:     "strompreis_EUR_MWh"
    co2_grid:  "grid_co2_kg_MWh"

scenario:
  name: "Memmingen L3 - Independent Zone Demands + Druckverlust"
  description: "24-Knoten-Netz mit Druckverlustmodell (PWL MILP)"
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: "2025-01-01"
    end: "2025-01-31 23:00"

# ── Network ──────────────────────────────────────────────────────────────────
network:
  milp_linearize: true
  physics:
    heat_loss: true
    pressure_drop: true          # Druckverlust aktiviert — PWL Darcy-Weisbach
    transport_delay: true

  supply_temp_c: 100
  return_temp_c: 40
  ground_temp_c: 10

  # ── Temperatur-Linearisierung ──────────────────────────────────────────────
  linearization:
    method: "pwl"
    temperature_profile:
      load_fractions: [0.0, 0.3, 0.6, 1.0]
      T_supply_c:     [70.0, 80.0, 90.0, 100.0]
      T_return_c:     [55.0, 50.0, 45.0, 40.0]

  # ── Globale Rohrparameter (gelten für alle Rohre, sofern nicht überschrieben)
  max_velocity_m_s:      2.5     # Max. Strömungsgeschwindigkeit (m/s)
  pump_efficiency:       0.70    # Pumpenwirkungsgrad (-)
  pipe_roughness_mm:     0.05    # Rauigkeit (mm) für Reibungszahl
  max_pressure_drop_bar: 2.0     # Obere Schranke ΔP je Rohr (bar)

  nodes:
    # ── Root: producer node (assets merged into j_1, no incoming pipe) ───────
    j_1:
      assets: [boiler_main, tes_main]

    # ── V_1: kept as separate node — j_1 has no incoming pipe ────────────
    V_1:
      consumers:
        - column: "V_1_demand_MWth"

    # ── Trunk junction j_2: routes to j_3 + serves V_2 ──────────────────
    j_2:
      consumers:
        - column: "V_2_demand_MWth"

    # ── Trunk junction j_3: splits to j_4 and j_9, serves V_3 ───────────
    j_3:
      consumers:
        - column: "V_3_demand_MWth"

    # ── Branch j_4: serves V_4–V_7, routes to j_5 ───────────────────────
    j_4:
      consumers:
        - column: "V_4_demand_MWth"
        - column: "V_5_demand_MWth"
        - column: "V_6_demand_MWth"
        - column: "V_7_demand_MWth"

    # ── Branch j_5: serves V_8–V_9, splits to j_6 and j_7 ──────────────
    j_5:
      consumers:
        - column: "V_8_demand_MWth"
        - column: "V_9_demand_MWth"

    # ── Terminal branch j_6: serves V_10–V_12 ────────────────────────────
    j_6:
      consumers:
        - column: "V_10_demand_MWth"
        - column: "V_11_demand_MWth"
        - column: "V_12_demand_MWth"

    # ── Branch j_7: serves V_13, routes to j_8 ───────────────────────────
    j_7:
      consumers:
        - column: "V_13_demand_MWth"

    # ── Terminal branch j_8: serves V_14 ─────────────────────────────────
    j_8:
      consumers:
        - column: "V_14_demand_MWth"

    # ── Branch j_9: serves V_15–V_16, routes to j_10 ─────────────────────
    j_9:
      consumers:
        - column: "V_15_demand_MWth"
        - column: "V_16_demand_MWth"

    # ── Branch j_10: serves V_17, routes to j_11 ─────────────────────────
    j_10:
      consumers:
        - column: "V_17_demand_MWth"

    # ── Routing junctions (keine direkten Verbraucher) ────────────────────
    j_11: {}
    j_12: {}
    j_13: {}

    # ── Terminal branch j_14: serves V_25–V_26 ───────────────────────────
    j_14:
      consumers:
        - column: "V_25_demand_MWth"
        - column: "V_26_demand_MWth"

    # ── Terminal branch j_15: serves V_27 ────────────────────────────────
    j_15:
      consumers:
        - column: "V_27_demand_MWth"

    # ── Terminal consumers mit eigenen Rohren ─────────────────────────────
    V_18:
      consumers:
        - column: "V_18_demand_MWth"
    V_19:
      consumers:
        - column: "V_19_demand_MWth"
    V_20:
      consumers:
        - column: "V_20_demand_MWth"
    V_21:
      consumers:
        - column: "V_21_demand_MWth"
    V_22:
      consumers:
        - column: "V_22_demand_MWth"
    V_23:
      consumers:
        - column: "V_23_demand_MWth"
    V_24:
      consumers:
        - column: "V_24_demand_MWth"

  # ── Pipe Network ──────────────────────────────────────────────────────────
  # Rohrparameter können global überschrieben werden (s.o.) oder je Rohr:
  #   pump_efficiency: 0.75      # Rohr-spezifischer Pumpenwirkungsgrad
  #   max_velocity_m_s: 3.0      # Rohr-spezifische Maximalgeschwindigkeit
  pipes:
    j1_to_V_1:
      from: j_1
      to: V_1
      length_m: 5
      diameter_mm: 1000

    j1_to_j2:
      from: j_1
      to: j_2
      length_m: 500
      diameter_mm: 1000

    j2_to_j3:
      from: j_2
      to: j_3
      length_m: 1000
      diameter_mm: 1000

    j3_to_j4:
      from: j_3
      to: j_4
      length_m: 500
      diameter_mm: 1000

    j3_to_j9:
      from: j_3
      to: j_9
      length_m: 50
      diameter_mm: 1000

    j4_to_j5:
      from: j_4
      to: j_5
      length_m: 400
      diameter_mm: 1000

    j5_to_j6:
      from: j_5
      to: j_6
      length_m: 160
      diameter_mm: 1000

    j5_to_j7:
      from: j_5
      to: j_7
      length_m: 300
      diameter_mm: 1000

    j7_to_j8:
      from: j_7
      to: j_8
      length_m: 30
      diameter_mm: 1000

    j9_to_j10:
      from: j_9
      to: j_10
      length_m: 50
      diameter_mm: 1000

    j10_to_j11:
      from: j_10
      to: j_11
      length_m: 50
      diameter_mm: 1000

    j11_to_V18:
      from: j_11
      to: V_18
      length_m: 180
      diameter_mm: 1000

    j11_to_j12:
      from: j_11
      to: j_12
      length_m: 200
      diameter_mm: 1000

    j12_to_V19:
      from: j_12
      to: V_19
      length_m: 180
      diameter_mm: 1000

    j12_to_V20:
      from: j_12
      to: V_20
      length_m: 130
      diameter_mm: 1000

    j12_to_V21:
      from: j_12
      to: V_21
      length_m: 140
      diameter_mm: 1000

    j12_to_j13:
      from: j_12
      to: j_13
      length_m: 200
      diameter_mm: 1000

    j13_to_V22:
      from: j_13
      to: V_22
      length_m: 145
      diameter_mm: 1000

    j13_to_V23:
      from: j_13
      to: V_23
      length_m: 170
      diameter_mm: 1000

    j13_to_V24:
      from: j_13
      to: V_24
      length_m: 150
      diameter_mm: 1000

    j13_to_j14:
      from: j_13
      to: j_14
      length_m: 190
      diameter_mm: 1000

    j13_to_j15:
      from: j_13
      to: j_15
      length_m: 140
      diameter_mm: 1000

# ── FIXED ASSETS ──────────────────────────────────────────────────────────────
assets:
  boiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 200.0
    min_load: 0
    thermal_efficiency: 0.90
  tes_main:
    type: storage
    energy_capacity_mwh: 1000.0
    power_capacity_mw: 50.0
    charge_efficiency: 0.95
    discharge_efficiency: 0.95
    min_load_mw: 0.0
    round_trip_efficiency: 0.90
    soc_min: 0.0
    soc_max: 1.0
    soc0_mwh: 500.0
    terminal:
      state: cyclic
      policy: equal

# ── GRID ──────────────────────────────────────────────────────────────────────
grid:
  max_import_mw: 2000.0
  max_export_mw: 2000.0
  gridcost_eur_mwh: 35.0

# ── FUELS ─────────────────────────────────────────────────────────────────────
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0

# ── COSTS ─────────────────────────────────────────────────────────────────────
costs:
  co2_price_eur_per_t: 1000.0
  dump_cost_eur_per_mwh_th: 10.0

# ── RUN ───────────────────────────────────────────────────────────────────────
run:
  dt_h: 1.0
  solver: highs
