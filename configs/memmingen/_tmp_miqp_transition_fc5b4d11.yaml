assets:
  chp_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 0.2
    thermal_efficiency: 0.8
    el_eff: 0.4
    min_load: 0.3
  gasboiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 13.0
    thermal_efficiency: 0.9
    min_load: 0.0
  biomass_main:
    type: thermal_generator
    fuel: biomass
    capacity_mw: 3.3
    thermal_efficiency: 0.85
    min_load: 0.1
  eboiler_main:
    type: p2h
    capacity_mw: 5.0
    efficiency: 0.95
    min_load: 0.1
  hp_main:
    type: heat_pump
    capacity_mw: 5.0
    min_load: 0.2
    wrg_source_column: WRG_1 Â°C
    wrg_capacity_column: WRG1Q MW
    cop_default: 3.0
  tes_main:
    type: storage
    energy_mwh: 500.0
    power_mw: 30.0
    eff_charge: 0.98
    eff_discharge: 0.98
    loss_hour: 0.9999
    soc0_mwh: 250.0
    min_energy_mwh: 25.0
    cycling_cost_eur_per_mwh: 2.0
    terminal:
      state: cyclic
      policy: equal
heat_pumps:
