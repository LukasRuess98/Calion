    sink_defaults:
      Tsink_out_K: 358.15
      Tsink_in_K: 328.15
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 3.0
  types:
    standard:
      eta: 0.6
      FQ: 0.1
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  gridcost_eur_mwh: 25.0
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0
  biomass:
    price_eur_mwh: 40.0
    ef_kg_per_mwh_fuel: 20.0
costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 1000.0
run:
  dt_h: 1.0
  solver: gurobi
  warmstart_from: null
  solver_options:
    NonConvex: 2
    MIPGap: 0.02
    TimeLimit: 600
    MIPFocus: 1
    Heuristics: 0.8
    NumericFocus: 2
    StartNodeLimit: -1
    OutputFlag: 0
    LogToConsole: 0
  fix_binaries_from_warmstart: false
output:
  log_dir: output/logs
  export_dir: output/results
  export_thermal_network: true
  export_solver_solution: false
