# CHECK V1 validation variant — 168h horizon, HiGHS solver
# Inherits all settings from Memmingen_L1.yaml, overrides horizon and solver only.
# DO NOT use for paper runs — use Memmingen_L1.yaml (8760h, Gurobi).

site:
  input_xlsx: "data/Import_Data_Memmingen_epornet.xlsx"
  columns:
    datetime:  "Datum"
    price:     "strompreis_EUR_MWh"
    co2_grid:  "grid_co2_kg_MWh"

scenario:
  name: "Memmingen L1 - CHECK V1 (168h, HiGHS)"
  description: "Single-node network, 168h validation horizon"
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: "2025-01-01 00:00"
    end: "2025-01-07 23:00"

network:
  milp_linearize: true
  physics:
    heat_loss: true
    pressure_drop: false
    transport_delay: false

  supply_temp_c: 100
  return_temp_c: 40
  ground_temp_c: 10

  linearization:
    method: "pwl"
    temperature_profile:
      load_fractions: [0.0, 0.3, 0.6, 1.0]
      T_supply_c:     [70.0, 80.0, 90.0, 100.0]
      T_return_c:     [55.0, 50.0, 45.0, 40.0]

  nodes:
    j_1:
      assets: [chp_main, tes_main, gasboiler_main, Biomass_main, hp_main, eboiler_main]
      consumers:
        - column: "waermebedarf_MWth"

  pipes: {}

assets:
  chp_main:
    type: chp
    fuel: gas
    capacity_mw: 0.20
    thermal_output_mw: 0.20
    min_load: 0.3
    electrical_efficiency: 0.40
    thermal_efficiency_total: 0.80
  gasboiler_main:
    type: boiler
    fuel: gas
    thermal_output_mw: 13
    min_load: 0.1
    thermal_efficiency_total: 0.90
  Biomass_main:
    type: boiler
    fuel: biomass
    thermal_output_mw: 3.3
    min_load: 0.1
    thermal_efficiency_total: 0.85
  eboiler_main:
    type: boiler
    fuel: electricity
    thermal_output_mw: 5
    min_load: 0.1
    thermal_efficiency_total: 0.95
    electrical_efficiency: 0.40
    thermal_efficiency_total: 0.80
  hp_main:
    type: heat_pump
    capacity_mw: 5.0
    min_load: 0.2
    wrg_sources: [WRG1]    # needs WRG1_T °C + WRG1_Q MW columns in Excel
    cop_default: 3.0
  tes_main:
    type: storage
    energy_capacity_mwh: 500.0
    power_capacity_mw: 30.0
    charge_efficiency: 0.98
    discharge_efficiency: 0.98
    min_load_mw: 0.0
    round_trip_efficiency: 0.90
    soc_min: 0.0
    soc_max: 1.0
    soc0_mwh: 500.0
    terminal:
      state: cyclic
      policy: equal

# ── HEAT PUMP COP MODEL
heat_pumps:
  cop:
    sink_defaults:
      Tsink_out_K: 373.15    # 100°C supply temperature (= network supply_temp_c)
      Tsink_in_K: 313.15     # 40°C return temperature (= network return_temp_c)
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 3.0
  types:
    standard:
      eta: 0.6               # Lorenz-Gütegrad (= carnot_efficiency)
      FQ: 0.10

grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  gridcost_eur_mwh: 35.0

fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0

costs:
  co2_price_eur_per_t: 1000.0
  dump_cost_eur_per_mwh_th: 1000.0

run:
  dt_h: 1.0
  solver: highs
  solver_options:
    mip_gap: 0.01
    time_limit: 600
