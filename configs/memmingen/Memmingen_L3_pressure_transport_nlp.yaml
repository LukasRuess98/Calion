# ── FIXED ASSETS ──────────────────────────────────────────────────────────────
assets:
  boiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 200.0
    min_load: 0
    thermal_efficiency: 0.90
  tes_main:
    type: storage
    energy_capacity_mwh: 1000.0
    power_capacity_mw: 50.0
    charge_efficiency: 0.95
    discharge_efficiency: 0.95
    min_load_mw: 0.0
    round_trip_efficiency: 0.90
    soc_min: 0.0
    soc_max: 1.0
    soc0_mwh: 500.0
    terminal:
      state: cyclic
      policy: equal

# ── GRID ──────────────────────────────────────────────────────────────────────
grid:
  max_import_mw: 2000.0
  max_export_mw: 2000.0
  gridcost_eur_mwh: 35.0

# ── FUELS ─────────────────────────────────────────────────────────────────────
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0

# ── COSTS ─────────────────────────────────────────────────────────────────────
costs:
  co2_price_eur_per_t: 1000.0
  dump_cost_eur_per_mwh_th: 10.0

# ── RUN ───────────────────────────────────────────────────────────────────────
run:
  dt_h: 1.0
  solver: gurobi              # Gurobi erforderlich für QCQP (bilinear + quadratisch)
  solver_options:
    NonConvex: 2              # Gurobi: nicht-konvexe bilineare Terme erlauben
    MIPGap: 0.01              # 1% Optimality Gap (Kompromiss Qualität/Rechenzeit)
    TimeLimit: 3600           # Max. 1h Lösungszeit
