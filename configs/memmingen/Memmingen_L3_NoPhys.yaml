# =============================================================================
# PAPER STUDY - Level 3: Independent Zone Demands (Dispatch-Only)
# =============================================================================
# RESEARCH FOCUS: Impact of Independent Zone Demand Profiles vs. Fractioned Demand
#
# Level 3 with per-zone independent demands instead of demand fractions.
# Each zone has its own complete 8760-hour timeseries with unique temporal patterns,
# enabling heterogeneous demand profiles across the network.
#
# TOPOLOGY:
#   Star-of-stars: plant -> 14 junction-to-junction pipes
#   Total nodes: 15 (1 plant-junction, 14 distribution junctions)
#   Total pipes: 14 connections (junction-to-junction only)
#   Total pipe length: ~3,255 m
#   Demand distribution: V_1-V_27 demand columns merged into junctions
#
# SYSTEM SUMMARY (Fixed Assets):
#   Peak demand:     ~76 MW
#   CHP:             0.2 MW_th / 0.1 MW_el
#   Gas boiler:      80 MW_th, eta = 0.90 (Spitzenlast-Backup)
#   Biomass boiler:  3.3 MW_th, eta = 0.85
#   Heat pump:       5 MW_th, COP ~3.0
#   E-Boiler (P2H):  5 MW_th, eta = 0.95
#   Storage:         500 MWh / 30 MW
# =============================================================================

site:
  input_xlsx: "data/Import_Data_Memmingen_epronet.xlsx"
  columns:
    datetime: "Datum"
    price: "strompreis_EUR_MWh"
    co2_grid: "grid_co2_kg_MWh"

scenario:
  name: "Memmingen L3 - Independent Zone Demands (Dispatch-Only)"
  description: "15-node junction network, all consumers merged into junctions"
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: "2025-01-01"
    end: "2025-01-31 23:00"

# --- Network (15-node junction network) ---
network:
  milp_linearize: true
  physics:
    heat_loss: false
    pressure_drop: false
    transport_delay: false

  supply_temp_c: 86.0
  return_temp_c: 56.9
  ground_temp_c: 10

  temperature_frame:
    default_return_band_c: 4.0
    seasons:
      winter:
        months: [1, 2, 12]
        supply_c: 88.6
        return_c: 52.3
        return_band_c: 3.0
      spring:
        months: [3, 4, 5]
        supply_c: 87.6
        return_c: 53.2
        return_band_c: 3.0
      summer:
        months: [6, 7, 8]
        supply_c: 83.4
        return_c: 68.6
        return_band_c: 2.5
      autumn:
        months: [9, 10, 11]
        supply_c: 84.2
        return_c: 53.6
        return_band_c: 3.0

  linearization:
    method: "pwl"
    temperature_profile:
      load_fractions: [0.0, 0.3, 0.6, 1.0]
      T_supply_c: [70.0, 80.0, 90.0, 100.0]
      T_return_c: [55.0, 50.0, 45.0, 40.0]

  max_velocity_m_s: 2.5
  pump_efficiency: 0.70
  pipe_roughness_mm: 0.05
  max_pressure_drop_bar: 2.0

  # --- NODES: 15 Junctions ---
  nodes:
    j_1:
      assets: [chp_main, tes_main, biomass_main, gasboiler_main]
      consumers:
        - column: "V_1_demand_MWth"

    j_2:
      consumers:
        - column: "V_2_demand_MWth"

    j_3:
      consumers:
        - column: "V_3_demand_MWth"

    j_4:
      consumers:
        - column: "V_4_demand_MWth"
        - column: "V_5_demand_MWth"
        - column: "V_6_demand_MWth"
        - column: "V_7_demand_MWth"

    j_5:
      consumers:
        - column: "V_8_demand_MWth"
        - column: "V_9_demand_MWth"

    j_6:
      consumers:
        - column: "V_10_demand_MWth"
        - column: "V_11_demand_MWth"
        - column: "V_12_demand_MWth"

    j_7:
      consumers:
        - column: "V_13_demand_MWth"

    j_8:
      consumers:
        - column: "V_14_demand_MWth"

    j_9:
      consumers:
        - column: "V_15_demand_MWth"
        - column: "V_16_demand_MWth"

    j_10:
      consumers:
        - column: "V_17_demand_MWth"

    j_11:
      consumers:
        - column: "V_18_demand_MWth"

    j_12:
      assets: [hp_main, eboiler_main]
      consumers:
        - column: "V_19_demand_MWth"
        - column: "V_20_demand_MWth"
        - column: "V_21_demand_MWth"

    j_13:
      consumers:
        - column: "V_22_demand_MWth"
        - column: "V_23_demand_MWth"
        - column: "V_24_demand_MWth"

    j_14:
      consumers:
        - column: "V_25_demand_MWth"
        - column: "V_26_demand_MWth"

    j_15:
      consumers:
        - column: "V_27_demand_MWth"

  # --- PIPES: 14 Junction-to-Junction ---
  pipes:
    j1_to_j2:
      from: j_1
      to: j_2
      length_m: 350
      diameter_mm: 450

    j2_to_j3:
      from: j_2
      to: j_3
      length_m: 300
      diameter_mm: 450

    j3_to_j4:
      from: j_3
      to: j_4
      length_m: 260
      diameter_mm: 300

    j3_to_j9:
      from: j_3
      to: j_9
      length_m: 450
      diameter_mm: 350

    j4_to_j5:
      from: j_4
      to: j_5
      length_m: 240
      diameter_mm: 250

    j5_to_j6:
      from: j_5
      to: j_6
      length_m: 150
      diameter_mm: 150

    j5_to_j7:
      from: j_5
      to: j_7
      length_m: 220
      diameter_mm: 125

    j7_to_j8:
      from: j_7
      to: j_8
      length_m: 80
      diameter_mm: 100

    j9_to_j10:
      from: j_9
      to: j_10
      length_m: 200
      diameter_mm: 300

    j10_to_j11:
      from: j_10
      to: j_11
      length_m: 230
      diameter_mm: 300

    j11_to_j12:
      from: j_11
      to: j_12
      length_m: 250
      diameter_mm: 300

    j12_to_j13:
      from: j_12
      to: j_13
      length_m: 220
      diameter_mm: 250

    j13_to_j14:
      from: j_13
      to: j_14
      length_m: 180
      diameter_mm: 125

    j13_to_j15:
      from: j_13
      to: j_15
      length_m: 125
      diameter_mm: 100

# --- Assets (Dispatch-Only, Fixed Capacities) ---
# --- Assets: IDENTICAL to L3 (copy-paste) ---
assets:
  chp_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 0.20
    thermal_efficiency: 0.80
    el_eff: 0.40
    min_load: 0.3

  gasboiler_main:
    type: thermal_generator
    fuel: gas
    capacity_mw: 13.0
    thermal_efficiency: 0.90
    min_load: 0.1

  biomass_main:
    type: thermal_generator
    fuel: biomass
    capacity_mw: 3.3
    thermal_efficiency: 0.85
    min_load: 0.1

  eboiler_main:
    type: p2h
    capacity_mw: 5.0
    efficiency: 0.95
    min_load: 0.1

  hp_main:
    type: heat_pump
    capacity_mw: 5.0
    min_load: 0.2
    wrg_sources: [WRG1]
    cop_default: 3.0

  tes_main:
    type: storage
    energy_mwh: 500.0
    power_mw: 30.0
    eff_charge: 0.98
    eff_discharge: 0.98
    loss_hour: 0.9999
    soc0_mwh: 500.0
    terminal:
      state: cyclic
      policy: equal

# --- Heat Pump COP Model: IDENTICAL to L3 ---
heat_pumps:
  cop:
    sink_defaults:
      Tsink_out_K: 373.15
      Tsink_in_K: 313.15
    deltaT_K: 20.0
    deltaTpp_K: 5.0
    cop_fallback: 3.0
  types:
    standard:
      eta: 0.6
      FQ: 0.10

# --- Grid: IDENTICAL to L3 ---
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  gridcost_eur_mwh: 20.0

# --- Fuels: IDENTICAL to L3 ---
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0
  biomass:
    price_eur_mwh: 40.0
    ef_kg_per_mwh_fuel: 20.0

# --- Costs: IDENTICAL to L3 ---
costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 1000.0

# --- Run Settings ---
run:
  dt_h: 1.0
  solver: gurobi
  log_to_file: true
  verbose_logging: true
  solver_options:
    NonConvex: 2
    MIPGap: 0.005          # lockerer (war 0.005)
    TimeLimit: 86400      # 4h statt 24h
    MIPFocus: 1           # Fokus auf feasible solution
    Heuristics: 0.8       # war 0.2 — viel zu niedrig!
    NumericFocus: 2       # von 3 auf 2 (3 ist zu konservativ)
    OutputFlag: 1
    LogToConsole: 1

# --- Output ---
output:
  log_dir: "output/logs"
  export_dir: "output/results"
  export_thermal_network: true
  export_solver_solution: true
