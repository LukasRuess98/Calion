site:
  input_xlsx: data/2025_04_14_Import_Data_Memmingen.xlsx
  columns:
    datetime: Datum
    price: strompreis_EUR_MWh
    co2_grid: grid_co2_kg_MWh
scenario:
  name: Synth n5_L30.0km_hi0.4_s6h (L1-copperplate)
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: 2025-01-01 00:00
    end: 2025-12-31 23:00
network:
  milp_linearize: true
  physics:
    heat_loss: false
    pressure_drop: false
    transport_delay: false
  supply_temp_c: 100
  return_temp_c: 40
  ground_temp_c: 10
  max_velocity_m_s: 2.5
  pump_efficiency: 0.75
  pipe_roughness_mm: 0.5
  max_pressure_drop_bar: 2.0
  linearization:
    method: pwl
    temperature_profile:
      load_fractions:
        - 0.0
        - 0.3
        - 0.6
        - 1.0
      T_supply_c:
        - 70.0
        - 80.0
        - 90.0
        - 100.0
      T_return_c:
        - 55.0
        - 50.0
        - 45.0
        - 40.0
  nodes:
    j_1:
      consumers:
        - column: waermebedarf_MWth
          demand_fraction: 1.0
      assets:
        - hp_main
        - tes_main
assets:
  hp_main:
    type: heat_pump
    capacity_mw: 76.0
    min_load: 0.1
    cop_method: analytical_lmtd
    sink_temp_c: 90.0
    source_columns:
      - wrg1_temp
      - wrg2_temp
    carnot_efficiency: 0.6
    cop_default: 3.0
  tes_main:
    type: storage
    energy_capacity_mwh: 456.0
    power_capacity_mw: 38.0
    charge_efficiency: 0.95
    discharge_efficiency: 0.95
    min_load_mw: 0.0
    round_trip_efficiency: 0.9
    soc_min: 0.0
    soc_max: 1.0
    soc0_mwh: 228.0
    terminal:
      state: cyclic
      policy: equal
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  gridcost_eur_mwh: 35.0
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0
costs:
  co2_price_eur_per_t: 1000.0
  dump_cost_eur_per_mwh_th: 1000.0
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    MIPGap: 0.01
    TimeLimit: 7200
    OutputFlag: 0
    LogToConsole: 0
