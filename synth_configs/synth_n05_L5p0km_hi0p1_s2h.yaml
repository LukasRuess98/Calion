site:
  input_xlsx: data/Import_Data_Memmingen_epronet.xlsx
  columns:
    datetime: Datum
    price: strompreis_EUR_MWh
    co2_grid: grid_co2_kg_MWh
scenario:
  name: Synth n5_L5.0km_hi0.1_s2h
  run_mode: PF_ONLY
  milp_linearize: true
  horizon:
    start: 2025-01-01 00:00
    end: 2025-12-31 23:00
network:
  milp_linearize: true
  physics:
    heat_loss: true
    pressure_drop: true
    transport_delay: true
  supply_temp_c: 100
  return_temp_c: 40
  ground_temp_c: 10
  max_velocity_m_s: 2.5
  pump_efficiency: 0.75
  pipe_roughness_mm: 0.5
  max_pressure_drop_bar: 2.0
  linearization:
    method: pwl
    temperature_profile:
      load_fractions:
      - 0.0
      - 0.3
      - 0.6
      - 1.0
      T_supply_c:
      - 70.0
      - 80.0
      - 90.0
      - 100.0
      T_return_c:
      - 55.0
      - 50.0
      - 45.0
      - 40.0
  nodes:
    j_1:
      consumers:
      - column: waermebedarf_MWth
        demand_fraction: 0.2003
      assets:
      - hp_main
      - tes_main
    j_2:
      consumers:
      - column: waermebedarf_MWth
        demand_fraction: 0.2229
    j_3:
      consumers:
      - column: waermebedarf_MWth
        demand_fraction: 0.1855
    j_4:
      consumers:
      - column: waermebedarf_MWth
        demand_fraction: 0.2065
    j_5:
      consumers:
      - column: waermebedarf_MWth
        demand_fraction: 0.1848
  pipes:
    j1_to_j2:
      from: j_1
      to: j_2
      length_m: 1250
      diameter_mm: 400
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j1_to_j3:
      from: j_1
      to: j_3
      length_m: 1250
      diameter_mm: 350
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j2_to_j4:
      from: j_2
      to: j_4
      length_m: 1250
      diameter_mm: 300
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
    j2_to_j5:
      from: j_2
      to: j_5
      length_m: 1250
      diameter_mm: 250
      u_value_supply_w_per_m_k: 0.32
      u_value_return_w_per_m_k: 0.34
assets:
  hp_main:
    type: heat_pump
    capacity_mw: 76.0
    min_load: 0.1
    cop_default: 3.0
    wrg_source_column: WRG_1 °C
    wrg_capacity_column: WRG1Q MW
  tes_main:
    type: storage
    soc0_mwh: 76.0
    terminal:
      state: cyclic
      policy: equal
    energy_mwh: 152.0
    power_mw: 38.0
    eff_charge: 0.95
    eff_discharge: 0.95
    loss_hour: 0.9999
    cycling_cost_eur_per_mwh: 2.0
    min_energy_mwh: 0.0
grid:
  max_import_mw: 5000.0
  max_export_mw: 5000.0
  gridcost_eur_mwh: 35.0
fuels:
  gas:
    price_eur_mwh: 45.0
    ef_kg_per_mwh_fuel: 200.0
costs:
  co2_price_eur_per_t: 100.0
  dump_cost_eur_per_mwh_th: 1000.0
run:
  dt_h: 1.0
  solver: gurobi
  solver_options:
    MIPGap: 0.01
    TimeLimit: 7200
    OutputFlag: 0
    LogToConsole: 0
